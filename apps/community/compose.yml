services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${COMMUNITY_POSTGRES_PASSWORD:?Set COMMUNITY_POSTGRES_PASSWORD}
    volumes:
      - community-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U community -d community']
      interval: 5s
      timeout: 3s
      retries: 10
  community:
    build:
      context: ../..
      dockerfile: apps/community/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - '6481:6481'
    environment:
      COMMUNITY_DATABASE_URL: postgres://community:${COMMUNITY_POSTGRES_PASSWORD}@database:5432/community
      COMMUNITY_PUBLIC_URL: ${COMMUNITY_PUBLIC_URL:?Set COMMUNITY_PUBLIC_URL}
      COMMUNITY_AUTH_SECRET: ${COMMUNITY_AUTH_SECRET:?Set COMMUNITY_AUTH_SECRET}
      COMMUNITY_INVITE_SECRET: ${COMMUNITY_INVITE_SECRET:?Set COMMUNITY_INVITE_SECRET}
      COMMUNITY_INVITE_KEY_ID: ${COMMUNITY_INVITE_KEY_ID:-v1}
      COMMUNITY_INVITE_PREVIOUS_KEY_ID: ${COMMUNITY_INVITE_PREVIOUS_KEY_ID:-}
      COMMUNITY_INVITE_PREVIOUS_SECRET: ${COMMUNITY_INVITE_PREVIOUS_SECRET:-}
      COMMUNITY_BOOTSTRAP_SECRET: ${COMMUNITY_BOOTSTRAP_SECRET:?Set COMMUNITY_BOOTSTRAP_SECRET}
      COMMUNITY_INVITE_PREVIEW_ATTEMPTS_PER_MINUTE: ${COMMUNITY_INVITE_PREVIEW_ATTEMPTS_PER_MINUTE:-20}
      COMMUNITY_PAIRING_ATTEMPTS_PER_MINUTE: ${COMMUNITY_PAIRING_ATTEMPTS_PER_MINUTE:-5}
      COMMUNITY_AGENTS_PER_OWNER: ${COMMUNITY_AGENTS_PER_OWNER:-20}
      COMMUNITY_POSTS_PER_TEN_MINUTES: ${COMMUNITY_POSTS_PER_TEN_MINUTES:-120}
      COMMUNITY_OIDC_ISSUER_URL: ${COMMUNITY_OIDC_ISSUER_URL:-}
      COMMUNITY_OIDC_CLIENT_ID: ${COMMUNITY_OIDC_CLIENT_ID:-}
      COMMUNITY_OIDC_CLIENT_SECRET: ${COMMUNITY_OIDC_CLIENT_SECRET:-}
      COMMUNITY_OIDC_LABEL: ${COMMUNITY_OIDC_LABEL:-}
      COMMUNITY_OIDC_SCOPES: ${COMMUNITY_OIDC_SCOPES:-}
      COMMUNITY_TERMS_URL: ${COMMUNITY_TERMS_URL:-}
      COMMUNITY_PRIVACY_URL: ${COMMUNITY_PRIVACY_URL:-}
      COMMUNITY_REPORT_ABUSE_URL: ${COMMUNITY_REPORT_ABUSE_URL:-}
      COMMUNITY_STORAGE_PATH: /data/blobs
    volumes:
      - community-blobs:/data/blobs
volumes:
  community-postgres:
  community-blobs:
