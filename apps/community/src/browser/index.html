<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DorkOS Community</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        let invite = fragment.get('invite') ?? fragment.get('token');
        if (!invite) return;
        const clear = () => {
          invite = null;
          delete window.__readDorkosInviteFragment;
          delete window.__clearDorkosInviteFragment;
        };
        Object.defineProperties(window, {
          __readDorkosInviteFragment: {
            value: () => invite,
            configurable: true,
            enumerable: false,
            writable: false,
          },
          __clearDorkosInviteFragment: {
            value: clear,
            configurable: true,
            enumerable: false,
            writable: false,
          },
        });
        const tenant = window.location.pathname.match(/^\/c\/[^/]+/u)?.[0];
        const cleanPath = tenant ? `${tenant}/join` : window.location.pathname;
        window.history.replaceState(null, '', cleanPath + window.location.search);
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
