<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DorkOS Community</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        // Runs before any module or network work: read a secret from the link fragment into
        // page memory only, then erase it from the address bar and the current history entry.
        const path = window.location.pathname;
        const claimPage = path === '/claim';
        // The owner's keep-ownership link and the new owner's claim link carry the bare token.
        const replacementPage = path === '/keep-ownership' || path === '/owner-replacement';
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        let secret = replacementPage
          ? window.location.hash.slice(1) || null
          : claimPage
            ? fragment.get('claim')
            : (fragment.get('invite') ?? fragment.get('token'));
        if ((claimPage || replacementPage) && window.location.hash)
          window.history.replaceState(null, '', path + window.location.search);
        if (!secret) return;
        const [read, clear] = replacementPage
          ? ['__readDorkosOwnerReplacementFragment', '__clearDorkosOwnerReplacementFragment']
          : claimPage
            ? ['__readDorkosOwnerClaimFragment', '__clearDorkosOwnerClaimFragment']
            : ['__readDorkosInviteFragment', '__clearDorkosInviteFragment'];
        Object.defineProperties(window, {
          [read]: { value: () => secret, configurable: true, enumerable: false, writable: false },
          [clear]: {
            value: () => {
              secret = null;
              delete window[read];
              delete window[clear];
            },
            configurable: true,
            enumerable: false,
            writable: false,
          },
        });
        if (claimPage || replacementPage) return;
        const tenant = window.location.pathname.match(/^\/c\/[^/]+/u)?.[0];
        const cleanPath = tenant ? `${tenant}/join` : window.location.pathname;
        window.history.replaceState(null, '', cleanPath + window.location.search);
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
