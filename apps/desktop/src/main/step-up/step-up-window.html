<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No script runs in this page: its preload fills it in (src/preload/step-up.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"
    />
    <title>Confirm it’s you</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        font-size: 14px;
        line-height: 1.45;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: 600;
      }
      #reason {
        margin: 0 0 6px;
        font-weight: 550;
      }
      .muted {
        margin: 0 0 6px;
        opacity: 0.7;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 500;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 7px 9px;
        font: inherit;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      #status {
        min-height: 20px;
        margin: 10px 0 0;
      }
      #status.error {
        color: #d92d20;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        padding: 7px 14px;
        font: inherit;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        background: transparent;
        color: inherit;
      }
      button.primary {
        flex: 1;
        border-color: transparent;
        background: #18181b;
        color: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        button.primary {
          background: #fafafa;
          color: #18181b;
        }
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Confirm it’s you</h1>
    <p id="reason">Checking what this will do…</p>
    <div id="notes"></div>
    <form id="form" hidden>
      <p id="too-short" class="muted" hidden></p>
      <label id="password-label" for="password">DorkOS password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <div id="new-password-row" hidden>
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" />
      </div>
      <p id="status" role="status"></p>
      <div class="buttons">
        <button id="cancel" type="button">Cancel</button>
        <button id="confirm" class="primary" type="submit">Confirm</button>
      </div>
    </form>
    <div id="ended" hidden>
      <p id="ended-message" role="status"></p>
      <div class="buttons">
        <button id="close" class="primary" type="button">Close</button>
      </div>
    </div>
  </body>
</html>
