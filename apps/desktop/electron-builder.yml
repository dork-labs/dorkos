appId: com.dorkos.desktop
productName: DorkOS
copyright: © 2026 DorkOS
directories:
  output: release
  buildResources: build

mac:
  category: public.app-category.developer-tools
  # zip must accompany dmg: electron-updater (Squirrel.Mac) can only install
  # updates from the zip artifact; the dmg is the human-facing installer.
  #
  # mac is arm64-only. THREE separate binaries ship as per-arch optional
  # dependencies (see apps/desktop/package.json's optionalDependencies):
  # Claude Code (`@anthropic-ai/claude-agent-sdk-<platform>-<arch>`), the Codex
  # CLI (`@openai/codex-<platform>-<arch>`) and esbuild
  # (`@esbuild/<platform>-<arch>`, which the extension host compiles with).
  # Every packaged platform/arch needs BOTH its matching package there AND an
  # asarUnpack glob for it below — otherwise the packaged app for that target
  # silently ships without that tool. The Claude half is the bug this config
  # originally fixed; the Codex and esbuild halves are DOR-1335, where the
  # shipped 0.61.0 Mac app had no Codex runtime at all and failed to compile
  # its own bundled marketplace extension on every boot.
  # Wired so far: darwin-arm64 (this block) and win32-x64 (the `win` block
  # below). Adding another target (mac x64, win32-arm64, linux) means repeating
  # all six additions for it.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  notarize: true
  # dorkos:// deep links (Chunk D). `protocols` is also valid at the
  # top level of this file (Configuration extends the same
  # PlatformSpecificBuildOptions mac does), but we're mac-only today, so
  # scoping it here keeps the mac-specific config together.
  protocols:
    name: DorkOS
    schemes:
      - dorkos
  # Electron's bundled Info.plist ships default usage-description strings
  # for capabilities this app never requests (camera, microphone,
  # Bluetooth, audio capture). electron-builder's extendInfo is
  # Object.assign'd onto the packaged Info.plist, and any resulting null
  # value is then deleted (app-builder-lib's macPackager.applyCommonInfo) —
  # so setting these to `null` cleanly strips them rather than shipping
  # unused privacy strings.
  extendInfo:
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
    NSAudioCaptureUsageDescription: null

dmg:
  sign: true
  artifactName: DorkOS-${version}-${arch}.dmg
  # Without a background and an explicit layout, electron-builder falls back to
  # its own generic gray template art — which is the first thing a Mac user
  # ever sees of this product. The artwork is generated and committed by
  # apps/desktop/scripts/generate-dmg-background.ts; edit that, not the TIFF.
  #
  # There is deliberately no `window:` key here. dmg-builder ignores it whenever
  # a background image is set and derives the window size from the image itself
  # (`sips -g pixelWidth` on the background, in its `customizeDmg`), so the
  # 540x380 window comes from the TIFF's 1x representation. Declaring a size
  # here would look authoritative while doing nothing.
  #
  # x/y are icon CENTRES in that same 540x380 space. They must stay in step with
  # DMG_LAYOUT in the generator, or the arrow drawn on the background points at
  # empty space — scripts/__tests__/generate-dmg-background.test.ts fails if
  # these numbers and that constant ever disagree.
  background: build/dmg-background.tiff
  iconSize: 100
  contents:
    - x: 140
      y: 205
      type: file
    - x: 400
      y: 205
      type: link
      path: /Applications

win:
  # x64 only for now (win32-arm64 is a tracked follow-up). Unsigned for the
  # alpha — no `certificateFile`/`azureSignOptions` here yet; adopting Azure
  # Artifact Signing is the business-gated follow-up (see
  # specs/desktop-windows-support). `dorkos://` deep links are registered at
  # runtime via app.setAsDefaultProtocolClient (cross-platform, see
  # src/main/index.ts), so no `protocols` block is needed here.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Per-user install (perMachine: false) so first run needs no admin/UAC
  # elevation — the right default for a developer tool a user installs for
  # themselves. oneClick: false shows the install wizard rather than a silent
  # one-click install, and lets the user pick the install directory.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: DorkOS-${version}-${arch}.exe

publish:
  provider: github
  owner: dork-labs
  repo: dorkos

# Explicit allowlist of what goes into app.asar. Without it, electron-builder's
# default packs essentially the whole package directory — which shipped `src/`
# (the entire main-process TypeScript source AND its 8 `__tests__/` files, incl.
# the electron mocks), both build `scripts/`, `.turbo/turbo-build.log`,
# `electron.vite.config.ts`, `tsconfig.json`, `eslint.config.js` and
# `vitest.config.ts` to every user. None of it is read at runtime: the app runs
# the COMPILED output under `dist/`.
#
# Everything the packaged runtime actually reads, and nothing else:
#   package.json        Electron reads `main` (dist/main/index.js) + version.
#   dist/main, preload  The compiled shell (electron-vite output), including the
#                       tray images the main build emits beside it from build/
#                       — buildResources is NOT packaged, so that emit (see
#                       electron.vite.config.ts) is what ships them.
#   dist/renderer       The SPA, served by the bundled server (asarUnpack'd below).
#   dist/server         The esbuild server bundle the main process forks.
#   dist/drizzle        Migrations, resolved as `__dirname/../drizzle` from the
#                       server bundle — see scripts/build-server.ts's layout note.
#   core-extensions     Bundled extension source, staged into DORK_HOME on boot
#                       (asarUnpack'd below).
#
# node_modules is deliberately absent: electron-builder derives it from the
# production dependency tree through its own copier and only ever reads NEGATIVE
# patterns from this list, so a positive entry here would do nothing. Adding a
# runtime read of any new top-level path means adding it here too — a missing
# entry produces an app that packages green and fails only once installed.
files:
  - 'package.json'
  - 'dist/**'
  - 'core-extensions/**'

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  # node-pty backs the embedded terminal (services/terminal/); like
  # better-sqlite3 its .node binary must be a real file for dlopen.
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk/**'
  # The SDK ships the actual `claude` executable as a per-platform optional
  # dependency (@anthropic-ai/claude-agent-sdk-darwin-arm64). It must be a real
  # file on disk — a Mach-O binary cannot execute from inside app.asar — so
  # unpack it. server-spawn.ts hands the bundled server this unpacked path
  # via DORKOS_CLAUDE_CLI_PATH, because the server's own require.resolve can't
  # reach it (pnpm links the sibling only inside the SDK's store node_modules).
  # Keep this package version-locked to @anthropic-ai/claude-agent-sdk in
  # package.json (both 0.3.224) — a lone SDK bump would silently ship a skewed
  # or missing binary here.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**'
  # Windows counterpart of the darwin-arm64 binary above: the SDK ships the
  # `claude.exe` executable as the win32-x64 optional dependency. A packaged
  # Windows app can't execute it from inside app.asar either, so unpack it —
  # server-spawn.ts resolves the per-platform path (…-win32-x64/claude.exe)
  # and hands it to the bundled server via DORKOS_CLAUDE_CLI_PATH.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**'
  # The Codex CLI, the same story one runtime over: @openai/codex-sdk locates
  # the real executable through @openai/codex's per-platform optional
  # dependency, at vendor/<target-triple>/bin/codex. It is a nested optional
  # dependency, which electron-builder's production-tree copier does NOT reach
  # on its own — 0.61.0 shipped with @openai/codex present and this package
  # absent, so the SDK threw "Unable to locate Codex CLI binaries" at boot and
  # the Codex runtime never registered at all. Declaring it directly in
  # package.json is what puts it in the tree; unpacking it is what makes the
  # binary runnable. Keep it version-locked to @openai/codex there.
  - '**/node_modules/@openai/codex-darwin-arm64/**'
  # Windows counterpart of the Codex vendor package above.
  - '**/node_modules/@openai/codex-win32-x64/**'
  # esbuild's compiler binary. The server compiles every extension's source
  # with esbuild on boot, and esbuild shells out to this native executable —
  # so without it the bundled marketplace extension failed to compile on every
  # launch of 0.61.0 ("The package \"@esbuild/darwin-arm64\" could not be
  # found"), for the same nested-optional-dependency reason as Codex above.
  # Unpacked because it is spawned: esbuild finds it with require.resolve,
  # which inside a packaged app answers with an app.asar path, and Electron's
  # asar shim covers execFile but NOT spawn. server-spawn.ts therefore hands
  # the server the unpacked path via ESBUILD_BINARY_PATH. esbuild refuses to
  # run a binary whose version differs from its own, so keep this pinned to
  # exactly the esbuild version the lockfile resolves — scripts/build-server.ts
  # fails the build if they ever drift.
  - '**/node_modules/@esbuild/darwin-arm64/**'
  # Windows counterpart of the esbuild binary above (esbuild.exe at the
  # package root there, not under bin/).
  - '**/node_modules/@esbuild/win32-x64/**'
  # express.static (app.ts's production SPA serving) cannot reliably read
  # range-requested static assets from inside app.asar — the packaged
  # window now loads the renderer via the bundled server's own
  # http://localhost:<port> (see window-manager.ts) rather than file://, so
  # these files must be real files on disk, not virtual asar entries.
  - 'dist/renderer/**'
  # ensureCoreExtensions's fs.cp() (staging bundled extensions into
  # DORK_HOME) can't read this source tree from inside app.asar either —
  # same class of read limitation as dist/renderer above.
  - 'core-extensions/**'

# NO extraResources. There used to be a second copy of better-sqlite3 here
# (`node_modules/better-sqlite3` -> `resources/node_modules/better-sqlite3`),
# dating from the first desktop commit, before the asarUnpack strategy above
# existed. It was unreachable: the server bundle at
# `resources/app.asar/dist/server/server-entry.mjs` resolves `better-sqlite3` by
# walking up its own directory, and hits `app.asar/node_modules/better-sqlite3`
# — which the asarUnpack glob above already makes a real file on disk — one
# level before it would ever reach `resources/node_modules`. Verified against
# the packed asar; nothing in the codebase references `resources/node_modules`
# either. So it was ~12 MB of dead weight that could only ever cause harm: the
# two copies are rebuilt independently, and the day they carry different ABIs,
# someone debugs a NODE_MODULE_VERSION error against a binary they don't know
# exists. If a future runtime genuinely needs a file outside the asar, unpack it
# — don't duplicate it.

# electron-builder's own automated native-module rebuild (the historical
# default for npmRebuild: true) was observed producing a better-sqlite3
# binary that reported a plausible size/hash yet still failed to `dlopen` at
# runtime with a misleading "wrong NODE_MODULE_VERSION" error — even with
# `buildDependenciesFromSource: true` forcing a from-source compile. A
# direct call to the same underlying `@electron/rebuild` CLI (not routed
# through electron-builder's wrapper) reliably produces a working binary —
# see scripts/rebuild-natives.ts, which the `pack`/`dist` scripts and the
# desktop-release workflow run immediately before electron-builder (NOT
# `pnpm build`, which must stay ABI-neutral for the rest of the monorepo).
# Disabled here so electron-builder packages that already-correct binary
# as-is instead of redoing (and re-breaking) the work.
npmRebuild: false
