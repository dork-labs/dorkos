pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,css,md,mdx,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    db-migrations:
      glob: 'packages/db/src/schema/*.ts'
      run: |
        cd packages/db && npx drizzle-kit generate && cd ../..
        git add packages/db/drizzle/
      fail_text: 'DB schema changed — migrations generated and staged. Review and re-commit.'
    dir-size:
      run: bash scripts/check-dir-size.sh
      fail_text: 'Directory has too many files — split into subdirectories.'
    lint:
      # AFFECTED-ONLY, on purpose (DOR-833). This command and the typecheck
      # below were a bare `pnpm lint` / `pnpm typecheck`, walking every package
      # in the workspace on every commit — including commits that touch only
      # docs, a spec, a changelog fragment or this file. That cost 23 minutes
      # (lint 481s + typecheck 898s) on 2026-07-27 with five agent sessions
      # sharing the box; agents stalled mid-commit and burned turns polling a
      # gate that could not finish.
      #
      # `--affected` is the mode `pnpm verify` and the pre-push gate below both
      # already use: turbo diffs against a base ref and runs the changed
      # packages AND everything that imports them, so a one-line edit in
      # packages/relay still pulls in server, client, mesh and the rest.
      # Only the flag is precedent, though — neither of those two pins a base,
      # so both inherit the staleness described below and scope far less than
      # they read as scoping.
      #
      # Measured 2026-09-02, cold turbo cache, both variants interleaved so the
      # machine's load hit them equally, best of the repeats:
      #   * commit touching only root files (this one, or any docs/spec commit)
      #     — 369s before, 1s after, at load ~210.
      #   * one-line commit in packages/cli — 115s before (lint 58 + typecheck
      #     57), 103s after (62 + 41), at load 26-128. Scoping does little for
      #     a package whose dependency closure is most of the repo; the win is
      #     concentrated in commits that touch few packages or none.
      # On a fully warm cache both variants replay in about a second, so this
      # changes nothing for the second commit in a row.
      #
      # TURBO_SCM_BASE is set because turbo's default base is the LOCAL `main`
      # branch, and here that ref only moves when a human pulls while every
      # worktree branch is cut straight from `origin/main` — so it sits dozens
      # of commits behind and the diff against it sweeps in everybody else's
      # merges. Measured the same day with one staged line in packages/relay:
      # against local `main` turbo called all 24 packages affected, i.e. no
      # scoping at all; against `origin/main` it called 11. The `main` fallback
      # covers a clone with no `origin` remote.
      #
      # Uncommitted files count as changed, so the staged edit this hook exists
      # to gate is always in scope. A file you changed but did not stage is in
      # scope too — over-inclusive, which is the safe direction for a gate.
      #
      # No `dotenv --` wrapper (the old `pnpm typecheck` had one): neither task
      # declares any `env` in turbo.json, so nothing about them depends on
      # .env, and `pnpm verify` already runs both without it.
      #
      # The whole tree is still checked before anything lands: `lint` and
      # `typecheck` are required merge-queue checks and run unscoped there, so
      # a break that only appears once two branches combine is caught by the
      # queue rather than by this hook.
      run: TURBO_SCM_BASE="$(git rev-parse --verify --quiet origin/main || echo main)" pnpm exec turbo lint --affected
      fail_text: 'Lint failed — see the errors above, or turbo could not resolve the diff base / is not installed.'
    typecheck:
      # Affected-only against origin/main — see the lint command above for why.
      run: TURBO_SCM_BASE="$(git rev-parse --verify --quiet origin/main || echo main)" pnpm exec turbo typecheck --affected
      fail_text: 'Typecheck failed — see the errors above, or turbo could not resolve the diff base / is not installed.'

pre-push:
  # STREAM THE GATE'S OUTPUT AS IT ARRIVES (DOR-473). Without this, lefthook
  # buffers a command's output and prints it only once the command has
  # finished. Measured against lefthook 2.1.10: a command that echoes at t+0 and
  # exits at t+8 has its echo appear at t+8, not before. So for the whole of a
  # healthy four-minute run the terminal showed the lefthook banner and nothing
  # else — and a run that had wedged looked exactly the same, forever. That is
  # the "two minutes with an empty log" in DOR-473: there was no way to tell
  # "compiling" from "stuck" by looking, so the only move available was to kill
  # it and re-push with --no-verify, which is what everyone learned to do.
  #
  # `follow` only decides whether lefthook relays what it receives; the gate
  # below still has to PRODUCE output incrementally for there to be anything to
  # relay, which is the other half of scripts/pre-push-watchdog.sh's job.
  follow: true
  commands:
    tests:
      # DOR-116 — delete-only pushes (e.g. `git push origin --delete <branch>`)
      # have nothing to test. lefthook does not forward git's pre-push stdin
      # (one "<local ref> <local sha> <remote ref> <remote sha>" line per
      # updated ref, see githooks(5)) to the run command unless use_stdin is
      # set, so that's required below. A local sha of all zeros means that
      # ref update is a deletion; skip the gate only when EVERY line is a
      # deletion and at least one line was actually seen — empty/missing
      # stdin falls through to running tests (safe default).
      #
      # AFFECTED-ONLY, on purpose (DOR-617). This gate used to run all 18
      # package suites on every push. On a machine already running other
      # agents that takes minutes and fails with rotating timeouts on a tree
      # the push never touched — so it got bypassed, six times on 2026-07-27
      # by three different actors, correctly each time. A gate that cannot
      # pass while the machine is busy is not a gate, it is a toll.
      #
      # `--affected` is the same mode `pnpm verify` uses (see the root
      # package.json): turbo diffs against the base branch and runs the
      # changed packages AND their dependents, so touching packages/relay
      # still pulls in server, client, mesh and the rest that import it.
      # A push that touches only docs, specs or a workflow runs nothing at
      # all, in about a second.
      #
      # That last sentence only holds because the base is pinned below
      # (DOR-1717) — it was not, and the sentence was false, until then.
      # Turbo's default base is the local `main` branch, which on a worktree
      # machine only moves when a human pulls while every branch is cut
      # straight from origin/main, so it trails by dozens of commits and the
      # diff sweeps in everybody else's merges.
      #
      # Measured 2026-09-02 (`turbo test --affected --dry=json`), local ref
      # standing ten commits behind. Read the counts carefully: turbo's task
      # total includes the `build` and `generate:api-docs` tasks a suite
      # depends on, so the number of actual SUITES is the smaller one.
      #   * root files only  — stale: 24 packages / 57 tasks / 23 suites.
      #     That is byte-for-byte what `turbo test` with no --affected at all
      #     resolves to, i.e. the entire monorepo. Pinned: 1 package (`//`),
      #     0 tasks, 0 suites.
      #   * one file in packages/icons — stale: the same 24 / 57 / 23.
      #     Pinned: 7 packages / 40 tasks / 6 suites.
      # The stale run returns an identical set for both diffs, which is the
      # tell: the staleness, not the change, was picking the packages. The
      # `main` fallback covers a clone with no `origin` remote.
      #
      # WHAT THIS GATE STILL DOES NOT CATCH, covered by the full-monorepo
      # `test` workflow (.github/workflows/test.yml) as a required merge-queue
      # check — the split is the point: local gate fast and survivable, CI
      # gate complete.
      #   * A break that only exists once two independently-affected PRs
      #     combine; neither PR's own diff can see it. The merge queue builds
      #     the combined tree and is the only thing that can see this.
      #   * A commit that touches only repo-root files — AGENTS.md, README.md,
      #     this file. `--affected` maps changed files onto packages and root
      #     files belong to none, so the run resolves to the `//` package and
      #     executes zero suites ("Tasks: 0 successful, 0 total", ~150ms).
      #
      # TWO ROOT FILES ARE NOT IN THAT LAST BULLET, both global inputs:
      #   * turbo.json — changing it marks every package affected.
      #   * pnpm-lock.yaml — turbo re-derives each package's external
      #     dependencies from the lockfile, so a real dependency bump marks
      #     every package that depends on the moved package. Measured by
      #     rewriting one resolved version: 24 packages / 57 tasks /
      #     23 suites, the whole repo. (A whitespace-only lockfile edit
      #     changes no dependency and does resolve to `//` alone — it is the
      #     derived graph that counts, not the file's bytes. Do not read that
      #     as "lockfile changes are cheap".)
      #
      # A push made while HEAD is ahead of origin/main runs the real closure,
      # pinned: measured 20 packages / 53 tasks / 19 suites with HEAD three
      # commits ahead. Before the pin this was a hole — base and HEAD were
      # the same local ref, so pushing `main` resolved to zero packages and
      # ran nothing at all.
      #
      # CACHE-KEY CONSTRAINT — do not re-fork the turbo invocation below.
      # Turbo hashes the passthrough args (everything after `--`) into the
      # task cache key, but NOT runner flags like --concurrency or
      # --affected. The passthrough here must stay exactly `-- --run` so this
      # gate shares its cache with the dev loop's `pnpm test -- --run` and
      # with CI: a green dev run makes the push instant (all cache hits).
      # Adding any passthrough flag (e.g. --retry) forks the key and forces a
      # full re-run on every push. (Verified: `@dorkos/relay#test` hashes to
      # the same value with and without --affected, and to the same value
      # again with TURBO_SCM_BASE unset, pinned to origin/main, and set to
      # junk — the base picks which tasks run, never what they hash to, so
      # the pin below shares its cache with CI and the dev loop.)
      #
      #   --concurrency=1  (DOR-121, not hashed) Turbo otherwise fans out ~10
      #     package suites in parallel and each `vitest run` spawns its own
      #     ~CPU-count worker pool, oversubscribing the CPU (~9x on a 14-core
      #     box). Suites run one-at-a-time; each keeps its internal parallelism.
      #
      #   VITEST_RETRY=2 absorbs timing flake in integration tests at the gate
      #     only (wired into vitest configs). It rides globalPassThroughEnv, so
      #     it is NOT hashed and does not fork the cache key. CI does not set
      #     this variable; its merge-queue leg passes `--retry=1` on the command
      #     line and names every test that only passed because of it (DOR-1701,
      #     .github/workflows/test.yml). This gate cannot do the same — the
      #     reporter would be a passthrough flag, and the constraint above is
      #     exactly why it is not one — so a retried pass is still silent here.
      #     A commit can therefore pass here and be named as a flake there; when
      #     that happens the test is flaky and the CI verdict is the honest one.
      #
      # THE WATCHDOG WRAPPER (DOR-473). Everything above makes the gate run the
      # RIGHT suites; none of it bounds how long they may take. Under
      # `--concurrency=1` one vitest that never exits — an unclosed handle, a
      # worker starved on a box already running several agents — stops the whole
      # gate forever, because nothing in git → lefthook → turbo → vitest has a
      # timeout anywhere in it. Paired with lefthook's output buffering (see
      # `follow` on the hook above) that produced the reported symptom exactly:
      # a push that sat for minutes with an empty terminal and no way to tell
      # what it was doing, until it was killed and re-run with --no-verify.
      #
      # scripts/pre-push-watchdog.sh wraps the run without altering it: same
      # command, same output, same exit code, so the cache-key constraint above
      # is untouched — the turbo invocation and its `-- --run` passthrough are
      # byte-for-byte what they were, merely passed as arguments rather than
      # executed directly. What it adds is a heartbeat while the run is quiet,
      # and a bound after which it stops the run and prints what it was running
      # (the last output, which turbo prefixes with the package and task, plus
      # the live process tree). A timeout FAILS the push — exit 124, distinct
      # from a test failure's exit 1 — because "the gate did not answer" is not
      # "the gate said yes"; the header of that script argues the case at
      # length, and `git push --no-verify` remains the deliberate way out.
      #
      # It reads its bounds from DORKOS_PREPUSH_* and defaults them, so nothing
      # is configured here. Its own fixture suite is scripts/test-pre-push-
      # watchdog.sh, named in `test:scripts` and in scripts-test.yml.
      use_stdin: true
      run: |
        saw_ref=0
        all_deletes=1
        while read -r local_ref local_sha remote_ref remote_sha; do
          saw_ref=1
          [ "$local_sha" = "0000000000000000000000000000000000000000" ] || all_deletes=0
        done
        if [ "$saw_ref" = "1" ] && [ "$all_deletes" = "1" ]; then
          echo "Delete-only push — skipping the test gate (nothing to test)."
          exit 0
        fi
        export TURBO_SCM_BASE="$(git rev-parse --verify --quiet origin/main || echo main)"
        VITEST_RETRY=2 bash scripts/pre-push-watchdog.sh \
          pnpm exec dotenv -- turbo test --affected --concurrency=1 -- --run
      fail_text: 'Tests failed — fix them before pushing, or turbo could not resolve the diff base. A "pre-push gate stopped" block above instead means the run stalled and was cut short, not that a test went red.'
