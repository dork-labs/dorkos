# EVERY COMMAND'S FIRST LINE IS THE CI STEWARD TIME-WRAP (plans/ci-steward-plan.md
# §4.5). `[ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap <hook>
# <command>` appends a START line to the clone's local-timings.jsonl and sets an
# EXIT trap that appends the END line, so local hook times are measured instead
# of re-measured by hand at every incident. It is sourced, not a wrapper process:
# the command below it runs in the same shell exactly as before, with the same
# stdin (the pre-push ref list), exit status and signals, and a broken timings
# file can never fail a hook (the script swallows its own errors). The content
# ratchet `lefthook-time-wrap` (ci/ratchets.yaml) and a test in
# packages/ci-steward keep the line on every command. CI_STEWARD_TIMINGS=0
# switches it off for one run.
#
# WHAT THESE HOOKS ARE FOR, STATED ONCE (DOR-2160)
#
# They are a fast smell test, not a guarantee. The guarantee is the merge queue:
# it builds your branch on top of `main` plus everything ahead of it, runs the
# FULL monorepo suites plus lint, typecheck and the browser shards against that
# combined tree, and merges only if they pass. Nothing you can do locally can
# reproduce that, because the tree it tests does not exist on your machine.
#
# So the job of a local gate is not to repeat the queue. It is to catch, in
# seconds, the handful of mistakes the queue is slow or unhelpful at telling you
# about, and then to get out of the way. After DOR-2160 that is exactly three
# things and they are all this file does:
#
#   at commit  prettier on staged files, Drizzle migrations, a directory-size
#              check, and lint + typecheck of the affected packages
#   at push    a formatting check on the changed files
#
# Nothing at push claims to have tested anything. That is not an omission; it is
# the decision, and the `pre-push:` block below carries the measurement behind
# it.
#
# WHY IT NEEDED DECIDING. Measured on this machine from the time-wrap's own
# records, 2026-09-19 to 2026-09-20, 49 pre-push runs: p90 26.6 minutes, one run
# at 43 minutes, and two test commands killed outright; another agent's push ran
# the hook for 22 minutes and died on a tree its change never touched. The cause
# is not any one suite. Several agents plus the operator's dev server share 14
# cores and 48 GiB, each gate ran `turbo test` with a full worker pool, and the
# load average sat around 500 with 15.9 GB of a 17.4 GB swap file in use while
# the kernel killed background processes for memory. A gate that cannot finish
# while the machine is busy is not a gate, it is a toll — and the toll is paid
# in `--no-verify`, which loses the cheap checks along with the expensive one.
#
# Two answers, and they are separate. The expensive gate left the push path
# entirely (see `pre-push:`). The gates that remain expensive are the two at
# commit time, so each holds one of a small number of machine-wide slots
# (`scripts/heavy-run-lock.sh`), which stops several agents running a full
# affected sweep at the same moment. Both the slot waits and every hook's load,
# memory and swap are recorded in the local timings, so what this machine is
# doing to these numbers is a figure in the daily report and not a feeling.
pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,css,md,mdx,yml,yaml}'
      run: |
        [ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap pre-commit format
        pnpm exec prettier --write {staged_files}
      stage_fixed: true
    db-migrations:
      glob: 'packages/db/src/schema/*.ts'
      run: |
        [ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap pre-commit db-migrations
        cd packages/db && npx drizzle-kit generate && cd ../..
        git add packages/db/drizzle/
      fail_text: 'DB schema changed — migrations generated and staged. Review and re-commit.'
    dir-size:
      run: |
        [ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap pre-commit dir-size
        bash scripts/check-dir-size.sh
      fail_text: 'Directory has too many files — split into subdirectories.'
    lint:
      # AFFECTED-ONLY, on purpose (DOR-833). This command and the typecheck
      # below were a bare `pnpm lint` / `pnpm typecheck`, walking every package
      # in the workspace on every commit — including commits that touch only
      # docs, a spec, a changelog fragment or this file. That cost 23 minutes
      # (lint 481s + typecheck 898s) on 2026-07-27 with five agent sessions
      # sharing the box; agents stalled mid-commit and burned turns polling a
      # gate that could not finish.
      #
      # `--affected` is the mode `pnpm verify` and the pre-push gate below both
      # already use: turbo diffs against a base ref and runs the changed
      # packages AND everything that imports them, so a one-line edit in
      # packages/relay still pulls in server, client, mesh and the rest.
      # Only the flag is precedent, though — neither of those two pins a base,
      # so both inherit the staleness described below and scope far less than
      # they read as scoping.
      #
      # Measured 2026-09-02, cold turbo cache, both variants interleaved so the
      # machine's load hit them equally, best of the repeats:
      #   * commit touching only root files (this one, or any docs/spec commit)
      #     — 369s before, 1s after, at load ~210.
      #   * one-line commit in packages/cli — 115s before (lint 58 + typecheck
      #     57), 103s after (62 + 41), at load 26-128. Scoping does little for
      #     a package whose dependency closure is most of the repo; the win is
      #     concentrated in commits that touch few packages or none.
      # On a fully warm cache both variants replay in about a second, so this
      # changes nothing for the second commit in a row.
      #
      # TURBO_SCM_BASE is set because turbo's default base is the LOCAL `main`
      # branch, and here that ref only moves when a human pulls while every
      # worktree branch is cut straight from `origin/main` — so it sits dozens
      # of commits behind and the diff against it sweeps in everybody else's
      # merges. Measured the same day with one staged line in packages/relay:
      # against local `main` turbo called all 24 packages affected, i.e. no
      # scoping at all; against `origin/main` it called 11. The `main` fallback
      # covers a clone with no `origin` remote.
      #
      # Uncommitted files count as changed, so the staged edit this hook exists
      # to gate is always in scope. A file you changed but did not stage is in
      # scope too — over-inclusive, which is the safe direction for a gate.
      #
      # No `dotenv --` wrapper (the old `pnpm typecheck` had one): neither task
      # declares any `env` in turbo.json, so nothing about them depends on
      # .env, and `pnpm verify` already runs both without it.
      #
      # The whole tree is still checked before anything lands: `lint` and
      # `typecheck` are required merge-queue checks and run unscoped there, so
      # a break that only appears once two branches combine is caught by the
      # queue rather than by this hook.
      #
      # UNDER THE MACHINE-WIDE SLOT CAP (DOR-2160). With the test gate gone from
      # `pre-push`, this and the typecheck below are the two heavy local
      # commands left: affected-only made them cheap for a docs commit and left
      # them expensive for a code one, measured p90 186 s and worst 409 s here,
      # p90 160 s and worst 473 s for typecheck. Those are the runs that collide
      # with three other agents' suites, and the cap is what stops four of them
      # being in flight at once. It never refuses: waiting is bounded, and a
      # wait that runs out runs the command anyway, loudly
      # (scripts/heavy-run-lock.sh). Nothing here is time-bounded — a commit is
      # cheap to retry, and nothing downstream repeats lint for you until the PR
      # — so the cap is the whole of the change.
      run: |
        [ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap pre-commit lint
        TURBO_SCM_BASE="$(git rev-parse --verify --quiet origin/main || echo main)" bash scripts/heavy-run-lock.sh pnpm exec turbo lint --affected
      fail_text: 'Lint failed — see the errors above, or turbo could not resolve the diff base / is not installed.'
    typecheck:
      # Affected-only against origin/main, and under the same machine-wide slot
      # cap — see the lint command above for both arguments and both sets of
      # numbers.
      run: |
        [ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap pre-commit typecheck
        TURBO_SCM_BASE="$(git rev-parse --verify --quiet origin/main || echo main)" bash scripts/heavy-run-lock.sh pnpm exec turbo typecheck --affected
      fail_text: 'Typecheck failed — see the errors above, or turbo could not resolve the diff base / is not installed.'

pre-push:
  # WHAT HAPPENS AT PUSH NOW: one formatting check, and nothing else (DOR-2160).
  #
  # THE TEST GATE IS GONE. It ran `turbo test --affected` here for months, and
  # the measurement that ended it is a cliff, not a slope. 49 pre-push runs on
  # the operator machine over 2026-09-19/20:
  #
  #   58 commands finished in under 50 seconds — pushes whose affected set was
  #      empty or trivial, where the gate ran nothing and proved nothing.
  #   10 commands took over 579 seconds, the worst 2604, with 2 killed outright.
  #   NOTHING IN BETWEEN. Not one run landed between 50 s and 579 s.
  #
  # Read that cliff against any budget you might put on it. A two-minute bound —
  # which is what this file carried for one commit — lands squarely in the empty
  # middle: it returns no verdict on a single push that had real work to do,
  # while charging two minutes to every one of them. The gate would have been
  # theatre with a bill attached, and `tracked.gate-cut-short` would have read
  # about 15% while being dominated by pushes that had nothing to test anyway,
  # so even the question "is the budget costing us anything" would have had no
  # answer. Making the bound bigger only moves it back toward the 26.6-minute
  # p90 that made agents type `--no-verify` in the first place.
  #
  # So the honest move is to stop pretending. The merge queue runs the full
  # suites on the real merged tree and is the gate that decides every merge; the
  # PR's affected-only `test` leg reports a break in about 14 minutes without
  # anybody waiting at a terminal. Neither of those got worse today. What went
  # away is a local step that, on this machine, either tested nothing or could
  # not finish.
  #
  # WHAT STAYS, AND WHY IT IS DIFFERENT. The formatting check below is fast
  # (p90 10 s, worst 29 s), deterministic, and it preempts a REQUIRED CI gate:
  # `prettier --check .` inside the `lint` job. Seven PRs across five sessions
  # went red on exactly that in one week, every one a single `prettier --write`
  # from green. It is the one local check whose verdict is both certain and
  # cheaper than finding out from CI.
  #
  # Nothing at push claims to have tested anything. `contributing/ci.md` says so
  # in the same words, and scripts/__tests__/local-gate-shape.test.ts fails if a
  # test command comes back here without a ledger entry to explain it.
  #
  # `follow: true` stays: lefthook otherwise buffers a command's output until it
  # exits, and the one thing this hook prints is a failure a person has to read.
  # `piped` and the `priority` keys are GONE with the second command — they
  # ordered two commands against each other and there is now one, so they would
  # assert a fact about a file that no longer holds.
  follow: true
  commands:
    formatting:
      # The script's header carries the full argument: what it diffs against
      # (origin/main, pinned — the local `main` on a worktree machine trails by
      # dozens of commits), why it checks rather than writes, and why a checkout
      # with no node_modules fails here loudly instead of cryptically later.
      #
      # NO `use_stdin`, and nothing in this hook takes it any more. git offers
      # the pre-push ref list to whichever command asks; the departed `tests`
      # command asked, so it could skip a delete-only push (DOR-116). This check
      # wants nothing from stdin and is cheap enough that the carve-out was never
      # worth having here: `git push origin --delete <branch>` pays 26 ms when
      # the branch matches origin/main and a few hundred milliseconds otherwise.
      run: |
        [ -r packages/ci-steward/bin/time-wrap.sh ] && . packages/ci-steward/bin/time-wrap.sh && ci_steward_time_wrap pre-push formatting
        bash scripts/pre-push-format-check.sh
      fail_text: 'Formatting check failed — run the `prettier --write` command printed above, commit, and push again.'
