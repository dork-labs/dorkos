pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,css,md,mdx,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    db-migrations:
      glob: 'packages/db/src/schema/*.ts'
      run: |
        cd packages/db && npx drizzle-kit generate && cd ../..
        git add packages/db/drizzle/
      fail_text: 'DB schema changed — migrations generated and staged. Review and re-commit.'
    dir-size:
      run: bash scripts/check-dir-size.sh
      fail_text: 'Directory has too many files — split into subdirectories.'
    lint:
      run: pnpm lint
      fail_text: 'Lint errors found — fix them before committing.'
    typecheck:
      run: pnpm typecheck
      fail_text: 'Type errors found — fix them before committing.'

pre-push:
  commands:
    tests:
      # DOR-116 — delete-only pushes (e.g. `git push origin --delete <branch>`)
      # have nothing to test. lefthook does not forward git's pre-push stdin
      # (one "<local ref> <local sha> <remote ref> <remote sha>" line per
      # updated ref, see githooks(5)) to the run command unless use_stdin is
      # set, so that's required below. A local sha of all zeros means that
      # ref update is a deletion; skip the gate only when EVERY line is a
      # deletion and at least one line was actually seen — empty/missing
      # stdin falls through to running tests (safe default).
      #
      # AFFECTED-ONLY, on purpose (DOR-617). This gate used to run all 18
      # package suites on every push. On a machine already running other
      # agents that takes minutes and fails with rotating timeouts on a tree
      # the push never touched — so it got bypassed, six times on 2026-07-27
      # by three different actors, correctly each time. A gate that cannot
      # pass while the machine is busy is not a gate, it is a toll.
      #
      # `--affected` is the same mode `pnpm verify` uses (see the root
      # package.json): turbo diffs against the base branch and runs the
      # changed packages AND their dependents, so touching packages/relay
      # still pulls in server, client, mesh and the rest that import it.
      # A push that touches only docs, specs or a workflow runs nothing at
      # all, in about a second.
      #
      # THREE THINGS THIS GATE NO LONGER CATCHES, all covered by the
      # full-monorepo `test` workflow (.github/workflows/test.yml) — the split
      # is the point: local gate fast and survivable, CI gate complete.
      #   * A break that only exists once two independently-affected PRs
      #     combine; neither PR's own diff can see it.
      #   * A push made while HEAD *is* main. `--affected` diffs against the
      #     base branch, so on main it resolves to zero packages and runs
      #     nothing. `test` runs on push to main, so the commit is still
      #     checked — just after it lands rather than before.
      #   * A commit that touches only repo-root files: AGENTS.md, README.md,
      #     this file, the root package.json, even pnpm-lock.yaml on a
      #     dependency bump. `--affected` maps changed files onto packages and
      #     root files belong to none, so the run resolves to the `//` package
      #     and executes zero suites ("Tasks: 0 successful, 0 total", ~150ms).
      #     turbo.json is the one exception, being a global input: changing it
      #     marks every package affected and runs all 18. `test` has no path
      #     filter and runs on every PR, so the rest are still caught there.
      #
      # CACHE-KEY CONSTRAINT — do not re-fork the turbo invocation below.
      # Turbo hashes the passthrough args (everything after `--`) into the
      # task cache key, but NOT runner flags like --concurrency or
      # --affected. The passthrough here must stay exactly `-- --run` so this
      # gate shares its cache with the dev loop's `pnpm test -- --run` and
      # with CI: a green dev run makes the push instant (all cache hits).
      # Adding any passthrough flag (e.g. --retry) forks the key and forces a
      # full re-run on every push. (Verified: `@dorkos/relay#test` hashes to
      # the same value with and without --affected.)
      #
      #   --concurrency=1  (DOR-121, not hashed) Turbo otherwise fans out ~10
      #     package suites in parallel and each `vitest run` spawns its own
      #     ~CPU-count worker pool, oversubscribing the CPU (~9x on a 14-core
      #     box). Suites run one-at-a-time; each keeps its internal parallelism.
      #
      #   VITEST_RETRY=2 absorbs timing flake in integration tests at the gate
      #     only (wired into vitest configs). It rides globalPassThroughEnv, so
      #     it is NOT hashed and does not fork the cache key. CI deliberately
      #     does NOT set it, so the same commit can pass here and fail there;
      #     when that happens the test is flaky and the CI verdict is the
      #     honest one.
      #
      # HARD TIMEOUT (DOR-473). This gate used to be able to hang forever with
      # an empty log: no output, no failure, nothing to explain why, on a
      # machine already running other worktrees' agents. `timeout`/`gtimeout`
      # is not guaranteed on a contributor's machine (no coreutils by
      # default on macOS), so the wait loop below is a portable substitute.
      # 600s is generous — this is already --affected-scoped and contended
      # machines are the expected condition here, not the edge case — but it
      # turns "stuck forever" into a bounded, legible failure that names what
      # it was running, instead of a silent stall someone has to Ctrl-C.
      #
      # `set -m` before backgrounding, then killing the NEGATIVE pid, is
      # deliberate, not decoration: `pnpm exec dotenv -- turbo ... vitest` is a
      # multi-hop chain (pnpm -> dotenv -> turbo -> a vitest per package), and
      # a plain `kill "$pid"` only reaches the first hop — verified by
      # reproducing exactly that leak (a 3-hop chain left its grandchild
      # orphaned and running under a plain `kill $pid`). `set -m` puts the
      # whole background job in its own process group, so `kill -TERM -"$pid"`
      # (note the leading `-`) reaches every descendant in one signal instead
      # of leaving turbo/vitest workers running loose on an already-contended
      # machine, which would make this bug worse, not better.
      use_stdin: true
      run: |
        saw_ref=0
        all_deletes=1
        while read -r local_ref local_sha remote_ref remote_sha; do
          saw_ref=1
          [ "$local_sha" = "0000000000000000000000000000000000000000" ] || all_deletes=0
        done
        if [ "$saw_ref" = "1" ] && [ "$all_deletes" = "1" ]; then
          echo "Delete-only push — skipping the test gate (nothing to test)."
          exit 0
        fi
        set -m
        VITEST_RETRY=2 pnpm exec dotenv -- turbo test --affected --concurrency=1 -- --run &
        pid=$!
        limit=600
        elapsed=0
        while kill -0 "$pid" 2>/dev/null; do
          if [ "$elapsed" -ge "$limit" ]; then
            echo "" >&2
            echo "pre-push tests (turbo test --affected) did not finish within ${limit}s — killing it." >&2
            echo "This is usually contention from other worktrees/agents on this machine, not a real failure." >&2
            echo "Verify the packages you touched by hand, then push once you have (or --no-verify if you already did)." >&2
            kill -TERM -"$pid" 2>/dev/null
            wait "$pid" 2>/dev/null
            exit 1
          fi
          sleep 5
          elapsed=$((elapsed + 5))
        done
        wait "$pid"
      fail_text: 'Tests failed — fix them before pushing.'
