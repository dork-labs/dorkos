# Ratchets: quality counts that must never silently drop (plan §4.6, §4.7).
#
# Declared in phase 0; enforced from phase 2, when `ratchet-assert` runs inside
# the queue's `test` and `browser-test` fan-in jobs against the high-water
# marks the collector keeps in hwm.json on the ci-steward-data branch. Marks
# are per workspace package (or per spec file), so a deletion in one package
# cannot be masked by additions in another, even inside one 5-PR batch.
#
# A drop passes only with a valid `ratchet-release` in a ledger entry (that
# ratchet, that package, that value, id at most 14 days old, unconsumed).
# Schema: RatchetsSchema in packages/ci-steward/src/schemas.ts.
#
# QUARANTINE AND THE COUNTS (plan §4.9 L1). A quarantined test still runs and is
# still reported, so it is still counted — but it is counted SEPARATELY, in
# `quarantine-size`, and excluded from the pass-count ratchets on BOTH sides of
# every comparison. That is the interlock: without it, quarantining a test would
# move a high-water mark down by one with no release and no record, which is
# exactly the silent lowering these ratchets exist to prevent. With it, the only
# thing quarantine can move is its own ceiling, and that ceiling is small.
ratchets:
  - id: vitest-passed
    kind: floor
    scope: per-package
    description: Vitest tests passed in the full queue sweep may not fall below the package's high-water mark. Quarantined tests are excluded from both the mark and the reading, so quarantining one can never lower it.
    measured_from: the queue test shards' vitest JSON reports, unioned in the test fan-in
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
  - id: vitest-skipped
    kind: ceiling
    scope: per-package
    description: Vitest tests skipped may not rise above the package's mark; the mark only ever moves down.
    measured_from: the queue test shards' vitest JSON reports, unioned in the test fan-in
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
  - id: playwright-passed
    kind: floor
    scope: per-spec-file
    description: Playwright tests passed per spec file may not fall below that file's mark. Quarantined tests are excluded from both the mark and the reading, so quarantining one can never lower it.
    measured_from: the browser shards' Playwright JSON reports, unioned in the browser-test fan-in
    enforced_by: ratchet-assert in wf.browser-test.browser-test on merge_group
    enforced_from_phase: 2
  - id: required-contexts
    kind: set
    scope: repo
    description: The set of required contexts may only grow; removing one needs a ledger release first and the ruleset edit second.
    measured_from: ci/required-checks.json on the merge-group tree, reconciled against the live ruleset by the collector
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
  - id: required-contexts-on-merge-group
    kind: floor
    scope: repo
    description: The number of required contexts whose workflow reports on merge_group may not fall.
    measured_from: the census's generated atlas of workflow triggers
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
  # Content ratchets fence typecheck.yml and lefthook.yml by content, not by
  # path, because seeded experiments must edit both files (plan §4.7). The
  # census cannot guard its own removal, so a different runner checks these.
  - id: typecheck-runs-steward
    kind: content
    scope: repo
    description: typecheck.yml keeps its CI Steward census and ledger-check steps.
    measured_from: fixed-string match on the merge-group tree's .github/workflows/typecheck.yml
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
    file: .github/workflows/typecheck.yml
    must_contain:
      - node packages/ci-steward/src/cli.ts census
      - node packages/ci-steward/src/cli.ts ledger-check
  - id: lefthook-time-wrap
    kind: content
    scope: repo
    description: Every lefthook command runs through the time-wrap, so local hook timings stay measured.
    measured_from: fixed-string match on every command's run in the merge-group tree's lefthook.yml
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
    file: lefthook.yml
    must_contain:
      - time-wrap
  # --- the quarantine lane (plan §4.9 L1) ---
  #
  # The lane's own ceilings. Quarantine buys time; these are what stop it
  # becoming the way this repo stores broken tests. Both read the list on the
  # data branch, which is also where the readers enforce the same numbers at
  # read time (`ci/config.yaml`, `quarantine:`) — the ratchet is the record that
  # a change to them is a deliberate, released act rather than a config edit.
  - id: quarantine-size
    kind: ceiling
    scope: repo
    description: Tests in the quarantine lane may not exceed quarantine.max_entries in ci/config.yaml (10). A list over the cap is ignored entirely by every reader, so this ratchet fails the build rather than letting the lane silently close.
    measured_from: quarantine.json on the ci-steward-data branch, read by ci-steward quarantine-list in each queue leg
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
  - id: quarantine-days
    kind: ceiling
    scope: repo
    description: No entry may be honoured past its expiry (default 7 days), and re-quarantining the same test after an expiry needs a ledger entry with a ratchet-release. Expiry is already enforced at read time; this is what makes a renewal visible.
    measured_from: each entry's expires_at on the ci-steward-data branch
    enforced_by: ratchet-assert in wf.test.test on merge_group
    enforced_from_phase: 2
