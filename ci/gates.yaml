# Every gate in the pipeline: what it is, where it lives, what it is for.
#
# Hand-owned and deliberately thin: {id, source, purpose} only. Everything
# else about a gate (triggers, events it reports on, required, timeout,
# retries, shards, invoked scripts) is generated from the real YAML, never
# copied here, so it cannot drift. `ci-steward census` fails when a gate runs
# but has no entry here, or an entry names a gate that no longer runs.
#
# Id scheme:
#   wf.<workflow-file-stem>.<job-id>     every job in .github/workflows/*.yml
#   lefthook.<hook>.<command-name>       every lefthook command
#   claude.<HookEvent>.<script-basename> every Claude Code hook script
#   ruleset.<rule-name>                  settings of the "main: merge queue" ruleset
#
# A purpose is one plain sentence saying what the gate catches or does.
gates:
  - id: wf.security-approve-tests.acl
    source: .github/workflows/security-approve-tests.yml
    purpose: Tests hardened helper policy and disposable Keychain ACL isolation on a CI macOS user.
  - id: wf.security-review-initialize.initialize
    source: .github/workflows/security-review-initialize.yml
    purpose: Writes the security-review verdict and audit comments on each PR head from main's copy of the gate, including for fork contributions.
  - id: wf.security-review-initialize.merge-group
    source: .github/workflows/security-review-initialize.yml
    purpose: Writes the security-review verdict on each merge group's own SHA from main's copy of the gate.
  - id: wf.community-two-desktop.journey
    source: .github/workflows/community-two-desktop.yml
    purpose: On demand, runs the two-desktop Community member journey at a release tag on a macOS runner and keeps its receipt.
  - id: wf.security-gate.security-gate
    source: .github/workflows/security-gate.yml
    purpose: Requires Security approval on each exact PR head before security-sensitive changes can merge.

  # --- browser-native-release-artifact.yml ---
  - id: wf.browser-native-release-artifact.build-darwin
    source: .github/workflows/browser-native-release-artifact.yml
    purpose: Builds and attests the exact Mac browser observer and workers for the release source commit.
  - id: wf.browser-native-release-artifact.verify-linux-handoff
    source: .github/workflows/browser-native-release-artifact.yml
    purpose: Checks that the Linux CLI build accepts the exact attested Mac browser assets from the same source commit.

  # --- codex-binary-macos.yml ---
  - id: wf.codex-binary-macos.scope
    source: .github/workflows/codex-binary-macos.yml
    purpose: Decides from scripts/codex-macos-scope.sh, read from the base commit, whether a PR, queue entry or merge to main can reach the Codex binary suites, so only those pay for a macOS runner; any doubt runs them.
  - id: wf.codex-binary-macos.attest
    source: .github/workflows/codex-binary-macos.yml
    purpose: In a merge group with a Codex change only, checks whether codex-sandbox-macos already succeeded on the entry PR's current head, so the queue can skip the macOS run (DOR-5130); any doubt runs it.
  - id: wf.codex-binary-macos.codex-binary-macos
    source: .github/workflows/codex-binary-macos.yml
    purpose: Runs the real Codex binary suites and protected-file probes on macOS with no secrets, for every change that can reach them, every merge to main that does, and on request.
  - id: wf.codex-binary-macos.codex-sandbox-macos
    source: .github/workflows/codex-binary-macos.yml
    purpose: Reports on every PR and queue build that the macOS Codex suites passed, were out of scope, or already passed on the PR head, and fails closed on anything else (DOR-4402).

  # --- mac-browser-reading.yml ---
  - id: wf.mac-browser-reading.read
    source: .github/workflows/mac-browser-reading.yml
    purpose: On request, reads on macOS whether http pages stay http and what flags both Agent browser windows run with, for one commit's CLI tarball.

  # --- app-frame-browser.yml ---
  - id: wf.app-frame-browser.gesture-spec
    source: .github/workflows/app-frame-browser.yml
    purpose: On PRs that change the app frame, runs its cross-app page spec in real Chromium, ahead of the merge queue.

  # --- mutation-pilot.yml ---
  - id: wf.mutation-pilot.shared
    source: .github/workflows/mutation-pilot.yml
    purpose: On request, mutation-tests packages/shared with Stryker on CI and keeps the report, to calibrate which tests catch real changes.

  # --- coverage-unique.yml ---
  - id: wf.coverage-unique.cover
    source: .github/workflows/coverage-unique.yml
    purpose: On request, runs one sixteenth of a package's test files one at a time with coverage and records the lines each reaches.
  - id: wf.coverage-unique.combine
    source: .github/workflows/coverage-unique.yml
    purpose: On request, lists the package's test files that reach no source line another test file does not.

  # --- browser-test.yml ---
  - id: wf.browser-test.text-only-scope
    source: .github/workflows/browser-test.yml
    purpose: Decides, from scripts/text-only-scope.mjs on the base commit, whether a pull request only rewrites strings, comments and Markdown, and if so which browser specs quote the old text (DOR-4834); browser-smoke reads its answer. A merge queue build always answers full without running the classifier, so the queue runs the whole browser suite.
  - id: wf.browser-test.browser-smoke
    source: .github/workflows/browser-test.yml
    purpose: Runs @smoke browser tests on four PR shards before queue entry.
  - id: wf.browser-test.browser-shard
    source: .github/workflows/browser-test.yml
    purpose: Runs one sixth of the Playwright browser suite against the merge queue's combined tree.
  - id: wf.browser-test.first-run
    source: .github/workflows/browser-test.yml
    purpose: Times a never-onboarded install from Welcome to DorkBot's first reply on both first-run paths; the browser-test fan-in fails unless it passed.
  - id: wf.browser-test.browser-test
    source: .github/workflows/browser-test.yml
    purpose: The required browser-test check; requires successful smoke shards on PRs, or the full shards and first-run journey with execution proof off PRs.
  - id: wf.browser-test.copy-spec-drift
    source: .github/workflows/browser-test.yml
    purpose: Warns when a copy change will break a browser spec's expected text, so it is fixed before the queue finds it.

  # --- build-cache.yml ---
  - id: wf.build-cache.test-builds
    source: .github/workflows/build-cache.yml
    purpose: After every merge to main, builds what the test suites import and saves main's test build cache and ubuntu-latest pnpm store for the queue and pull requests. Never required.
  - id: wf.build-cache.browser-builds
    source: .github/workflows/build-cache.yml
    purpose: After every merge to main, builds what the browser suite boots from and saves main's browser build cache and 24.04 pnpm store for the queue and pull requests. Never required.
  - id: wf.build-cache.prune
    source: .github/workflows/build-cache.yml
    purpose: After every merge to main, deletes main's older turbo build caches, keeping the newest three of each family, so per-merge saves stay inside the cache budget. Never required.

  # --- cache-cleanup.yml ---
  - id: wf.cache-cleanup.cache-cleanup
    source: .github/workflows/cache-cleanup.yml
    purpose: Deletes a pull request's Actions caches when it closes, and twice a day sweeps the caches of every closed or merged PR; never touches main's or an open PR's. Never required.

  # --- changelog-fragment-check.yml ---
  - id: wf.changelog-fragment-check.fragment-present
    source: .github/workflows/changelog-fragment-check.yml
    purpose: Fails a PR whose user-facing commits have no changelog fragment, and any PR that adds a malformed fragment.
  - id: wf.changelog-fragment-check.no-fragment-under-skip-label
    source: .github/workflows/changelog-fragment-check.yml
    purpose: Fails a PR labelled skip-changelog that still adds a changelog fragment.

  # --- ci-steward.yml ---
  - id: wf.release-branch-contents.release-branch-contents
    source: .github/workflows/release-branch-contents.yml
    purpose: Refuses a commit in a pull request into release/v<X.Y.Z> unless DOR-4638's check-picks rule (main's copy) accepts it as a byte-exact cherry-pick -x of main or the release commit, titled chore(release) v<X.Y.Z> and touching only release metadata.
  - id: wf.ci-steward.collect
    source: .github/workflows/ci-steward.yml
    purpose: Daily at 05:00 UTC, records what the pipeline did, computes ledger verdicts, the improvement triggers and the day's HTML report (plus the weekly deep summary on Mondays), and pushes them to the ci-steward-data branch; red when its own health fails. Never required.

  # --- claude-code-review.yml ---
  - id: wf.claude-code-review.review
    source: .github/workflows/claude-code-review.yml
    purpose: Automated Claude review of a PR against REVIEW.md; its Security lens feeds security-verdict and so pr-gates, and review-redispatch re-requests the review up to three times per head SHA.

  # --- claude.yml ---
  - id: wf.claude.claude
    source: .github/workflows/claude.yml
    purpose: Answers @claude mentions from maintainers in PR and issue threads, and can push fixes when asked.

  # --- cli-smoke-test.yml ---
  - id: wf.cli-smoke-test.build-tarball
    source: .github/workflows/cli-smoke-test.yml
    purpose: Packs the dorkos CLI tarball exactly as npm would publish it, for the smoke jobs to install.
  - id: wf.cli-smoke-test.smoke-test-bare
    source: .github/workflows/cli-smoke-test.yml
    purpose: Installs the packed CLI on a bare runner (Node 22 and 24) and proves it starts and answers.
  - id: wf.cli-smoke-test.smoke-test-docker
    source: .github/workflows/cli-smoke-test.yml
    purpose: Installs the packed CLI in the Docker smoke image and proves it starts there.
  - id: wf.cli-smoke-test.integration-test
    source: .github/workflows/cli-smoke-test.yml
    purpose: Runs the Docker integration image end to end against the packed CLI.
  - id: wf.cli-smoke-test.codex-docker-sandbox
    source: .github/workflows/cli-smoke-test.yml
    purpose: Builds the product image and proves, on Ubuntu's AppArmor, that with the opt-in seccomp profile Codex's sandbox gets past seccomp and is refused by AppArmor's mount rule, and that it fails closed on Docker's default, with the same user, capability sets, NoNewPrivs and AppArmor label in both.
  - id: wf.cli-smoke-test.hub-smoke-test
    source: .github/workflows/cli-smoke-test.yml
    purpose: Boots the hub image against a stand-in for DorkOS Cloud and proves it refuses while pooled, takes an assignment, and admits only front-door traffic.

  # --- codeql.yml ---
  - id: wf.codeql.analyze
    source: .github/workflows/codeql.yml
    purpose: Weekly CodeQL security scan of main for injection, path traversal and similar bug classes.

  # --- credential-free-build.yml ---
  - id: wf.credential-free-build.attest
    source: .github/workflows/credential-free-build.yml
    purpose: In a merge group only, checks whether credential-free-build already succeeded on the entry PR's current head, so the queue can skip re-running it (DOR-5130); any doubt runs the real check.
  - id: wf.credential-free-build.credential-free-build
    source: .github/workflows/credential-free-build.yml
    purpose: Proves the app installs, builds, typechecks, lints and boots with no cloud credentials or private-repo variables present.

  # --- db-check.yml ---
  - id: wf.db-check.db-check
    source: .github/workflows/db-check.yml
    purpose: Fails when a Drizzle schema change ships without the migration it implies.

  # --- dependabot-lockfile-repair.yml ---
  - id: wf.dependabot-lockfile-repair.repair-lockfile
    source: .github/workflows/dependabot-lockfile-repair.yml
    purpose: Restores the pnpm overrides block Dependabot drops from pnpm-lock.yaml, so its PRs can install at all.

  # --- desktop-release.yml ---
  - id: wf.desktop-release.tag-is-on-main
    source: .github/workflows/desktop-release.yml
    purpose: On a manual run of main's copy only, picks the commit to build (main's, or the tag input's) and refuses it unless main's tag-is-on-main.sh accepts it, so the signing job only ever runs checked code.
  - id: wf.desktop-release.build-macos
    source: .github/workflows/desktop-release.yml
    purpose: Builds the macOS desktop app at the checked commit, signs and notarizes it behind the release environment (main only), checks its signature and Gatekeeper, and uploads it for publish.
  - id: wf.desktop-release.build-windows
    source: .github/workflows/desktop-release.yml
    purpose: Builds the unsigned Windows installer, silent-installs it, and uploads it for publish, without blocking the release.
  - id: wf.desktop-release.publish
    source: .github/workflows/desktop-release.yml
    purpose: On a tag run of main's copy only, checks the tag still names the built commit, attaches the verified macOS and Windows artifacts to the draft release and publishes it; the one job here that may write to a release.

  # --- desktop-renderer.yml ---
  - id: wf.desktop-renderer.renderer-defines
    source: .github/workflows/desktop-renderer.yml
    purpose: Builds the desktop renderer and fails if a build define was left unsubstituted (the v0.63.0 black-window class).

  # --- desktop-smoke.yml ---
  - id: wf.desktop-smoke.packaged-runtime
    source: .github/workflows/desktop-smoke.yml
    purpose: Packages and launches the macOS app and proves its bundled server answers and shuts down cleanly.

  # --- docs-openapi-check.yml ---
  - id: wf.docs-openapi-check.attest
    source: .github/workflows/docs-openapi-check.yml
    purpose: In a merge group only, checks whether openapi-fresh already succeeded on the entry PR's current head, so the queue can skip re-running it (DOR-5130); any doubt runs the real check.
  - id: wf.docs-openapi-check.openapi-fresh
    source: .github/workflows/docs-openapi-check.yml
    purpose: Fails when the committed OpenAPI spec or generated API reference has drifted from the Zod schemas.

  # --- evals.yml ---
  - id: wf.evals.structural
    source: .github/workflows/evals.yml
    purpose: Runs the credential-free agent eval suites in test mode, daily and on PRs labelled run-evals.
  - id: wf.evals.credentialed
    source: .github/workflows/evals.yml
    purpose: Runs the credentialed eval suite against a real model on manual dispatch, under a hard spend ceiling.

  # --- harness-windows.yml ---
  - id: wf.harness-windows.harness-windows
    source: .github/workflows/harness-windows.yml
    purpose: Runs the harness projection engine and CLI harness-sync suites on a real Windows runner.

  # --- lint.yml ---
  - id: wf.lint.attest
    source: .github/workflows/lint.yml
    purpose: In a merge group only, checks whether lint already succeeded on the entry PR's current head, so the queue can skip re-running it (DOR-5130); any doubt runs the real check.
  - id: wf.lint.lint
    source: .github/workflows/lint.yml
    purpose: Full-monorepo Prettier check, ESLint for every package, and ESLint for the repo-root scripts and hooks.

  # --- neon-preview-sweep.yml ---
  - id: wf.neon-preview-sweep.sweep
    source: .github/workflows/neon-preview-sweep.yml
    purpose: Nightly, deletes Neon preview databases idle 7+ days whose git branch has no open PR; green with a notice until NEON_API_KEY is set, red when it cannot read Neon or GitHub or a delete fails. Never required.

  # --- operating-skills-version-check.yml ---
  - id: wf.operating-skills-version-check.version-outranks-base
    source: .github/workflows/operating-skills-version-check.yml
    purpose: Fails a change to the seeded skill pack unless its version is strictly higher than the base branch's.

  # --- publish-docker.yml ---
  - id: wf.publish-docker.tag-is-on-main
    source: .github/workflows/publish-docker.yml
    purpose: On a manual run of main's copy with a tag only, refuses to push or mirror any image unless main's tag-is-on-main.sh accepts that tag's commit.
  - id: wf.publish-docker.build-and-push
    source: .github/workflows/publish-docker.yml
    purpose: On a manual run of main's copy with a tag, builds the multi-arch Docker image at the tag's checked commit from the published npm package and pushes it to GHCR.
  - id: wf.publish-docker.build-and-push-hub
    source: .github/workflows/publish-docker.yml
    purpose: On a manual run of main's copy with a tag, builds the hub image DorkOS Cloud boots at the tag's checked commit, pushes it to GHCR by version and commit, and attests and verifies its digest.
  - id: wf.publish-docker.mirror-docker-hub
    source: .github/workflows/publish-docker.yml
    purpose: In the same run, copies the GHCR image build-and-push just pushed to Docker Hub by its digest, when the mirror is switched on.

  # --- publish-community.yml ---
  - id: wf.publish-community.tag-is-on-main
    source: .github/workflows/publish-community.yml
    purpose: On a v* tag push, refuses to publish the Community image and manifest unless the tag is exactly vX.Y.Z and main's tag-is-on-main.sh accepts its commit.
  - id: wf.publish-community.build-and-publish
    source: .github/workflows/publish-community.yml
    purpose: On a v* tag push, publishes and attests the immutable Community image and its strict version-to-digest release manifest.

  # --- review-redispatch.yml ---
  - id: wf.review-redispatch.redispatch
    source: .github/workflows/review-redispatch.yml
    purpose: Never gates a merge. On every CLI Smoke Test finish on main (a tick after each push) and a 10-minute cron backstop, re-requests a lost automated review (re-review label) on PRs whose review check is red, up to the ladder in should-redispatch-review.sh, so pr-gates is not left waiting (DOR-5124; was merge-tail's second duty).

  # --- release-publish.yml ---
  - id: wf.release-publish.prove
    source: .github/workflows/release-publish.yml
    purpose: Before anything from the release branch is installed or run, refuses unless the tip is the SHA QA and the PM named, the base is QA's pin or a published tag, and every commit is a main cherry-pick or the release commit.
  - id: wf.release-publish.prepare
    source: .github/workflows/release-publish.yml
    purpose: After the proof passes, installs and builds the release commit with main's release-cli (which proves again) and packs the three packages.
  - id: wf.release-publish.gate
    source: .github/workflows/release-publish.yml
    purpose: Right before npm, refuses the publish unless main's release-gate.sh answers exactly SHIP for P, the proven release point (on main's first-parent history and not reverted, its full run on main green, every required check green in its merge-queue build); read-only, no secrets (DOR-5123).
  - id: wf.release-publish.smoke
    source: .github/workflows/release-publish.yml
    purpose: Before npm, on ubuntu and macOS, refuses the publish unless the exact packed tarballs install into a clean prefix, report the release version, pass main's smoke test, answer a chat in the browser on the test runtime, and import cleanly; read-only, no secrets (DOR-5123).
  - id: wf.release-publish.publish
    source: .github/workflows/release-publish.yml
    purpose: Publishes the packed tarballs to npm by trusted publishing only after the gate shipped P, the named approver, not the dispatcher, approved npm-release, and the tip is unchanged.

  # --- queue-repeat-guard.yml ---
  - id: wf.queue-repeat-guard.door
    source: .github/workflows/queue-repeat-guard.yml
    purpose: Seconds after every merge-queue entry (when its changelog-fragment-check finishes), runs from main and takes a PR back out when its head already failed the same required check in two queue builds, and tells the author once.

  # --- queue-reentry.yml ---
  - id: wf.queue-reentry.sweep
    source: .github/workflows/queue-reentry.yml
    purpose: Never gates a merge. After the merge queue itself takes a PR out, turns auto-merge back on once its head is green and mergeable (at most twice per head, never after a person's dequeue, a hold or a repeat failure), and asks the author once per head to merge main when it conflicts; also tells the author, once per head, of any PR with auto-merge on that conflicts with main, since GitHub then runs no checks or review on it (DOR-5098).

  # --- security-verdict.yml ---
  - id: wf.security-verdict.security-verdict
    source: .github/workflows/security-verdict.yml
    purpose: After each Claude review run, posts a security-verdict commit status that is success only when the review's Security lens posted a pass for that exact head (DOR-5099), then re-runs that head's finished, unpassed pr-gates runs after a pass (DOR-5119).

  # --- after-merge-alert.yml ---
  - id: wf.after-merge-alert.alert
    source: .github/workflows/after-merge-alert.yml
    purpose: Never gates a merge. When a push-to-main check fails, comments on the merged PR and opens or updates one issue per failure group, assigned to the author; closes the groups when the check is green again (DOR-5121).

  # --- auto-revert.yml ---
  - id: wf.auto-revert.decide
    source: .github/workflows/auto-revert.yml
    purpose: Never gates a merge. When a push-to-main check fails, re-runs it once, then decides whether the merge broke it (green on the parent, never a release or revert commit) (DOR-5122).
  - id: wf.auto-revert.revert
    source: .github/workflows/auto-revert.yml
    purpose: Never gates a merge. Opens a revert PR with auto-merge for a merge that broke main, only while the AUTO_REVERT repo variable is on (DOR-5122).
  # --- rolling-bisect.yml ---
  - id: wf.rolling-bisect.next
    source: .github/workflows/rolling-bisect.yml
    purpose: Never gates a merge. When a rolling main run (browser-test) still fails after its re-run, binary-searches the merges since the last green run by dispatching the workflow on each midpoint, at most ceil(log2 N) runs for N <= 16 merges (DOR-5122).
  - id: wf.rolling-bisect.report
    source: .github/workflows/rolling-bisect.yml
    purpose: Never gates a merge. Names the bisected merge on its PR and the failure-group issues, or says once why the bisect stopped without one (DOR-5122).
  - id: wf.rolling-bisect.revert
    source: .github/workflows/rolling-bisect.yml
    purpose: Never gates a merge. Opens a revert PR for the bisected merge through auto-revert.sh's revert path, only while the AUTO_REVERT repo variable is on (DOR-5122).

  # --- daily-sweep.yml ---
  - id: wf.daily-sweep.due
    source: .github/workflows/daily-sweep.yml
    purpose: Never gates a merge. Lets the 17:13 UTC cron or the after-push backstop sweep only once today's slot has passed and no run has swept yet (timed-slot.sh).
  - id: wf.daily-sweep.sweep
    source: .github/workflows/daily-sweep.yml
    purpose: Never gates a merge. Once a day, rewrites one issue per release window listing the PRs merged since the last release that the design-ok or qa-real-data rules flag, for QA's and the designer's batch review (DOR-5120).

  # --- daily-release.yml ---
  - id: wf.daily-release.due
    source: .github/workflows/daily-release.yml
    purpose: Never gates a merge. Lets the 15:07 UTC cron or the after-push backstop go on only once today's slot has passed and no run has done it yet (timed-slot.sh), so the slot runs once a day even when GitHub drops the cron.
  - id: wf.daily-release.plan
    source: .github/workflows/daily-release.yml
    purpose: Never gates a merge. Once a day (and by hand), reads the release state with daily-release.sh, picks P (newest main commit of 48 h with a green full run that release-gate.sh ships; for a rollback, P_prev, which the gate must still ship), plans the version with release-commit.ts, and writes what it would do to the step summary (DOR-5123).
  - id: wf.daily-release.hold
    source: .github/workflows/daily-release.yml
    purpose: Never gates a merge. On a rollback dispatch (action=rollback), opens an issue labelled release-hold with GITHUB_TOKEN (issues write only), which holds every new daily cut until a person closes it once the fix is on main; only while DAILY_RELEASE_LIVE is on (DOR-5123, design §6).
  - id: wf.daily-release.cut
    source: .github/workflows/daily-release.yml
    purpose: Never gates a merge. Cuts release/vX.Y.Z at P and opens the release PR with the merge-tail app token, only while DAILY_RELEASE_LIVE is on; a rollback cuts release/vX.Y.(Z+1) at P_prev the same way, after its hold (DOR-5123).
  - id: wf.daily-release.advance
    source: .github/workflows/daily-release.yml
    purpose: Never gates a merge. Tags a merged release PR and dispatches the native artifact, or dispatches release-publish.yml once that is green, only while DAILY_RELEASE_LIVE is on (DOR-5123).
  - id: wf.daily-release.slot-done
    source: .github/workflows/daily-release.yml
    purpose: Never gates a merge. Uploads the day's timed-slot artifact once a slot run's plan and chosen step finished, so no later cron or backstop run repeats the day's slot.

  # --- release-watch.yml ---
  - id: wf.release-watch.due
    source: .github/workflows/release-watch.yml
    purpose: Never gates a merge. Lets a watch go on once Release Publish succeeds, and on the after-push tick or the hourly cron only while the newest npm release is under 24 hours old and was last watched 55 minutes ago or more, and marks it watched (release-watch.sh due, DOR-5123).
  - id: wf.release-watch.npx
    source: .github/workflows/release-watch.yml
    purpose: Never gates a merge. Checks that `npx -y dorkos@X.Y.Z --version` prints X.Y.Z from a clean npm cache on Linux, macOS and Windows, for the newest release's first 24 hours.
  - id: wf.release-watch.surfaces
    source: .github/workflows/release-watch.yml
    purpose: Never gates a merge. Checks the newest release's three npm packages, its GHCR image's health, the Homebrew formula and both dorkos.ai download links, and lists new issues naming it, for its first 24 hours.
  - id: wf.release-watch.report
    source: .github/workflows/release-watch.yml
    purpose: Never gates a merge. Opens or updates one release-watch issue per version and failing check group, and closes it when the group passes again (DOR-5123).

  # --- pr-gates.yml ---
  - id: wf.pr-gates.pr-gates
    source: .github/workflows/pr-gates.yml
    purpose: Fails while the head lacks Security's sign-off, so auto-merge waits for it (DOR-5107, DOR-5119). Security's sign-off is a signed review marker or the cloud verdict (a comment whose signature verifies against main's ci/security/allowed_signers for this head, or a passing security-verdict). QA and design labels are notes for the daily sweep, not gates.

  # --- hold-reason.yml ---
  - id: wf.hold-reason.hold-reason
    source: .github/workflows/hold-reason.yml
    purpose: Advisory; flags a PR carrying the hold label with no comment starting hold, so every hold says why and who lifts it.

  # --- not-held.yml ---
  - id: wf.not-held.not-held
    source: .github/workflows/not-held.yml
    purpose: Fails while a PR or merge-queue entry carries the hold label, so a hold stops a merge by itself once PRs auto-merge at open (DOR-5103). Advisory until added to the ruleset.

  # --- release-window.yml ---
  - id: wf.release-window.release-window
    source: .github/workflows/release-window.yml
    purpose: Fails while a freeze (MERGE_FREEZE variable) excludes the PR, while a release PR is not alone in its merge group, or while the version a PR would land on is not on npm (DOR-5102). Advisory until added to the ruleset.

  # --- release-window-refresh.yml ---
  - id: wf.release-window-refresh.refresh
    source: .github/workflows/release-window-refresh.yml
    purpose: Not a gate; re-runs failed release-window checks on open PRs once no freeze is set and main's VERSION is on npm, since GitHub raises no event for either; runs after every push to main, a release publish, a PR's failed first release-window attempt, and a 15-minute cron backstop.

  # --- scripts-test.yml ---
  - id: wf.scripts-test.attest
    source: .github/workflows/scripts-test.yml
    purpose: In a merge group only, checks whether fixtures already succeeded on the entry PR's current head, and whether harness needs to run (main's scope list, then the same attested exit), so the queue can skip re-running them (DOR-5130); any doubt runs the real check.
  - id: wf.scripts-test.fixtures
    source: .github/workflows/scripts-test.yml
    purpose: The required fixtures check; runs the shell fixture suites that pin the repo's guard hooks, gate scripts and assert scripts, and the docs-coverage-map drift check, on every PR and merge group.
  - id: wf.scripts-test.harness
    source: .github/workflows/scripts-test.yml
    purpose: Typechecks and tests the TypeScript under scripts/, which no workspace package covers, and runs the shell suites that need node_modules; on every PR and queue entry the scope list can reach, unless the queue entry's PR head already passed it.

  # --- site-build.yml ---
  - id: wf.site-build.site-build
    source: .github/workflows/site-build.yml
    purpose: Runs the marketing site's real next build so a build-time break fails here, not at the Vercel deploy.

  # --- test.yml ---
  - id: wf.test.codex-sandbox
    source: .github/workflows/test.yml
    purpose: Runs all Codex binary suites with distro bubblewrap and its scoped AppArmor profile, rejecting skips and requiring readable command controls and the preflighted executable.
  - id: wf.test.community-pg
    source: .github/workflows/test.yml
    purpose: Runs the community service's tests against a real Postgres and a real browser.
  - id: wf.test.community-packaged
    source: .github/workflows/test.yml
    purpose: Proves the packaged local-agent community journey with no public network, on every push to main (the rolling run, DOR-5130) and canary run, and on pull requests whose diff touches the community slice (scripts/community-packaged-scope.sh); a merge queue build reports green without it.
  - id: wf.test.test-shard-count
    source: .github/workflows/test.yml
    purpose: Picks how many test shards a run gets; six in the queue, on the canary and on a pull request that changes apps/server or packages/shared, two on other pull requests, and six whenever the diff cannot be read. On a pull request it also picks which suites run, by turbo task hash (scripts/pr-test-plan.sh), and picks every suite on any doubt or on a change to how tests are chosen or run. It also decides, from scripts/no-code-scope.sh on its depth-2 checkout, whether a pull request changes anything but changelog, docs or version lines, and hands test-shard and test-binary that answer. It also decides, from scripts/text-only-scope.mjs on the base commit, whether a pull request only rewrites strings, comments and Markdown, which cuts that pull request's run to one shard of `vitest related` (DOR-4834); a merge queue build always answers no without running the classifier and keeps every shard.
  - id: wf.test.test-binary
    source: .github/workflows/test.yml
    purpose: Runs every real-CLI suite outside codex/ (`*.binary.test.ts`, which the shards exclude) beside the shards, on PRs whose test plan reaches their package (none on a PR that changes only changelog, docs or version lines) and on every queue build and canary, and fails unless each planned file ran with no skipped test.
  - id: wf.test.test-shard
    source: .github/workflows/test.yml
    purpose: Runs one sixth of the unit suites (on PRs, the suites whose turbo hash the change moved, skipped on PRs that change only changelog, docs or version lines per scripts/no-code-scope.sh; the full sweep in the merge queue).
  - id: wf.test.test
    source: .github/workflows/test.yml
    purpose: The required test check; fails unless every shard, the binary and Codex suites and the community jobs passed, the shards together covered every package, and every binary suite was collected by name.

  # --- typecheck.yml ---
  - id: wf.typecheck.typecheck
    source: .github/workflows/typecheck.yml
    purpose: Full-monorepo typecheck, plus the policy gates (retired words, boundary, the 500-line ratchet, the API lint ratchet, NUL bytes, dead doc paths, one-shot browser routes) and the CI Steward census and ledger checks.

  # --- update-homebrew.yml ---
  - id: wf.update-homebrew.tag-is-on-main
    source: .github/workflows/update-homebrew.yml
    purpose: On a manual run of main's copy only, refuses to update the Homebrew tap unless main's tag-is-on-main.sh accepts the tag input's commit.
  - id: wf.update-homebrew.update-formula
    source: .github/workflows/update-homebrew.yml
    purpose: On a manual run of main's copy with a tag, updates the Homebrew formula (and the desktop cask once its dmg is attached) to that release.

  # --- lefthook.yml ---
  # Every command below opens with the CI Steward time-wrap
  # (packages/ci-steward/bin/time-wrap.sh), which records START and END for
  # local-commit and local-push. The wrapper is not a gate of its own, so it
  # has no id here: it catches nothing and can fail nothing. The content
  # ratchet `lefthook-time-wrap` and a packages/ci-steward test keep it on
  # every command.
  - id: lefthook.pre-commit.format
    source: lefthook.yml
    purpose: Formats staged files with Prettier and re-stages them.
  - id: lefthook.pre-commit.db-migrations
    source: lefthook.yml
    purpose: Generates and stages Drizzle migrations when a DB schema file is staged.
  - id: lefthook.pre-commit.dir-size
    source: lefthook.yml
    purpose: Fails a commit that grows a directory to 25 or more files.
  - id: lefthook.pre-commit.lint
    source: lefthook.yml
    purpose: Lints the packages the branch affects against origin/main, under the machine-wide heavy-run cap.
  - id: lefthook.pre-push.formatting
    source: lefthook.yml
    purpose: Fails a push whose changed files are not Prettier-clean, and prints the fix command.
  - id: lefthook.pre-push.fragments
    source: lefthook.yml
    purpose: Fails a push that carries a broken changelog fragment, usually an unedited seed, using fragment-present's own validity command.

  - id: lefthook.pre-push.max-lines
    source: lefthook.yml
    purpose: Refuses file-size ratchet growth before pushing.
  - id: lefthook.pre-push.own-mocks
    source: lefthook.yml
    purpose: Refuses new vi.mock calls on our own modules before pushing.
  - id: lefthook.pre-push.test-ratio
    source: lefthook.yml
    purpose: Refuses a package adding tests faster than source past its test budget, or a budget loosened by hand, before pushing.
  - id: lefthook.pre-push.ledger-coverage
    source: lefthook.yml
    purpose: Requires a ledger entry for changed pipeline paths before pushing.
  - id: lefthook.pre-push.ci-midrun
    source: lefthook.yml
    purpose: Refuses a push while this branch's test or browser-test run from the last push is under ten minutes old, since the push would cancel it.

  # --- windows-custody-witness.yml ---
  - id: wf.windows-custody-witness.x64-producer
    source: .github/workflows/windows-custody-witness.yml
    purpose: Builds the pinned private Windows guardian and ARM64 handoff, then records the x64 and ia32 witness cases on opt-in draft PRs.
  - id: wf.windows-custody-witness.native-arm64
    source: .github/workflows/windows-custody-witness.yml
    purpose: Verifies the exact prepared handoff and records the native ARM64 witness cases on the same opt-in draft PR.

  # --- .claude/settings.json ---
  - id: claude.PreToolUse.file-guard
    source: .claude/settings.json
    purpose: Refuses a Bash command that reads or writes a path the permissions deny list protects.
  - id: claude.PreToolUse.git-guard
    source: .claude/settings.json
    purpose: Refuses git stash and path-scoped checkout or restore, which silently destroy uncommitted work.
  - id: claude.PreToolUse.process-guard
    source: .claude/settings.json
    purpose: Refuses pkill, killall and group kills, which take down other agents' and the operator's processes.
  - id: claude.PreToolUse.merge-guard
    source: .claude/settings.json
    purpose: Refuses admin merges and direct REST or GraphQL merges that step around the merge queue and its required checks.
  - id: claude.PreToolUse.pr-create-guard
    source: .claude/settings.json
    purpose: Refuses a bare gh pr create, or a REST or GraphQL PR create, and points to scripts/open-pr.sh, which applies the PR-opening rules.
  - id: claude.PreToolUse.heavy-command-guard
    source: .claude/settings.json
    purpose: Refuses a raw heavy command (a whole vitest suite, playwright test, a heavy turbo task) in a bare session and points to pnpm heavy, which waits in the DorkOS load gate.
  - id: claude.PostToolUse.typecheck-changed
    source: .claude/settings.json
    purpose: Typechecks the edited file's workspace after every edit and blocks on type errors.
  - id: claude.PostToolUse.lint-changed
    source: .claude/settings.json
    purpose: Lints the edited file after every edit and blocks on lint errors.
  - id: claude.PostToolUse.check-any-changed
    source: .claude/settings.json
    purpose: Warns when an edit introduces an explicit any type.
  - id: claude.PostToolUse.spec-status-sync
    source: .claude/settings.json
    purpose: Keeps a spec's manifest status in step with its files after a write, and reminds about ADRs.
  - id: claude.Stop.create-checkpoint
    source: .claude/settings.json
    purpose: Saves a recoverable checkpoint of a worktree's uncommitted work at the end of each turn.
  - id: claude.Stop.check-docs-changed
    source: .claude/settings.json
    purpose: Reminds at the end of a turn when changed code has developer docs that may need updating.
  - id: claude.Stop.format-changed
    source: .claude/settings.json
    purpose: Runs Prettier over the files changed in the turn, once, at turn end.
  - id: claude.SessionStart.session-maintenance
    source: .claude/settings.json
    purpose: Prints short nags at session start about ADR drift, backlog and stale state, and fast-forwards the main checkout's clean main to origin/main on startup.

  # --- ruleset 19893973 "main: merge queue" ---
  - id: ruleset.merge_queue
    source: github:ruleset/19893973
    purpose: Every change to main goes through the merge queue, which re-runs the required checks on the combined tree before merging.
  - id: ruleset.required_status_checks
    source: github:ruleset/19893973
    purpose: The nine contexts in ci/required-checks.json must pass, from the GitHub Actions app, before a PR can merge.
  - id: ruleset.deletion
    source: github:ruleset/19893973
    purpose: Nobody can delete the main branch.
  - id: ruleset.non_fast_forward
    source: github:ruleset/19893973
    purpose: Nobody can force-push to main and rewrite its history.
  - id: ruleset.bypass
    source: github:ruleset/19893973
    purpose: Only repository admins may bypass the rules, and only through a pull request, never by a direct push.
