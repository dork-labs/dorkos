# Repo specifics for the CI Steward engine (packages/ci-steward).
#
# The engine reads nothing about this repo from anywhere else: every path,
# branch, id and command it needs is here, so the package can move to a
# marketplace plugin unchanged (plan §4.1). Schema: ConfigSchema in
# packages/ci-steward/src/schemas.ts.
version: 1

default_branch: main
workflows_dir: .github/workflows
lefthook: lefthook.yml
claude_settings: .claude/settings.json

# Hook commands in .claude/settings.json route through these wrappers; the gate
# is the script the wrapper runs, not the wrapper itself.
claude_hook_wrappers:
  - .claude/hooks/in-project.sh
  - .claude/hooks/run-node-hook.sh

root_package_json: package.json

# The orphan, append-only branch the phase-1 collector writes observations to.
# Protected by ruleset `data_ruleset_id` (non_fast_forward + deletion only).
data_branch: ci-steward-data
data_ruleset_id: 23704437

# Every `gh api` call names this repository.
github_repo: dork-labs/dorkos

# Each Monday the collector tags the data branch's head `<prefix>YYYY-Www`.
# Ruleset `data_tag_ruleset_id` makes those tags permanent (no deletion, no
# update, no force-push), so they are the restore points if the branch is lost.
data_tag_prefix: ci-steward-data/
data_tag_ruleset_id: 23705388

# The "main: merge queue" ruleset: the only source of required checks since
# classic branch protection was deleted on 2026-09-19. `rules` names the rule
# and setting gates recorded as `ruleset.<rule>` in ci/gates.yaml; the
# collector reconciles them against the live ruleset from phase 1.
ruleset:
  id: 19893973
  integration_id: 15368 # GitHub Actions: every required context is pinned to it
  rules:
    - merge_queue
    - required_status_checks
    - deletion
    - non_fast_forward
    - bypass

hand_files:
  required_checks: ci/required-checks.json
  gates: ci/gates.yaml
  slos: ci/slos.yaml
  metrics: ci/metrics.yaml
  ratchets: ci/ratchets.yaml
  steward_owned_paths: ci/steward-owned-paths.json
  census_allowlist: ci/census-allowlist.yaml

ledger_dir: ci/ledger

# Ledger coverage (`ledger-check --coverage`, pull_request only).
#
# paths: a PR touching any of these must add or edit a ledger entry. Every
# workflow file, lefthook.yml, .claude/settings.json and each repo script a
# gate invokes are added on top of this list by the engine (derived from the
# run: lines and hook commands). A missing entry fails the PR.
coverage:
  paths:
    - .github/workflows/**
    - turbo.json
    - lefthook.yml
    - .claude/settings.json
    - ci/**
    - packages/ci-steward/src/**
    - .agents/skills/creating-pull-requests/**

# A branch with this prefix is an unattended ci-improve change and may not
# touch ci/steward-owned-paths.json (plan §4.7).
fence_branch_prefix: ci-improve/

# Docs that carry a block generated from ci/required-checks.json. The census
# fails when one drifts; `census --fix` rewrites it.
generated_blocks:
  required_checks:
    - .agents/skills/creating-pull-requests/SKILL.md
    - contributing/ci.md

# Commands quoted in failure messages, so the fix an agent reads is runnable.
commands:
  ledger_new: pnpm ci:ledger-new
  census_fix: pnpm ci:census --fix

# The daily collector (ci-steward collect, .github/workflows/ci-steward.yml).
collect:
  # Requests one run may make. The workflow runs on GITHUB_TOKEN, which allows
  # 1,000 REST requests an hour per repository; a day that needs more is
  # written as late and resumed by the next run, never cut short.
  api_budget: 700
  # Missing or late days this far back are collected again first.
  lookback_days: 7
  # Budget left after the recent days fills older days back to this date,
  # oldest first, while Actions still keeps them (90 days). This is how the
  # backfilled ledger entries (#1135, #1246, #1391) get live verdicts.
  backfill_from: '2026-08-12'
  # Queue builds a day whose test reports are downloaded for flaky-test-runs.
  # Each costs about nine requests (two listings, seven artifacts).
  artifact_builds_per_day: 10
  review_workflow: claude-code-review.yml
  # Playwright's JSON reporter counts flaky tests (failed, then passed on the
  # retry); the vitest shard reports carry executions and the flake list.
  artifacts:
    - { workflow: browser-test.yml, pattern: browser-results-shard-*, format: playwright }
    - { workflow: test.yml, pattern: vitest-shard-report-*, format: vitest }

# The quarantine lane (plan §4.9 L1): a test data has classified flaky runs and
# reports as usual, but does not fail the blocking queue job.
#
# The list itself lives on the data branch, as `file` below, so quarantining
# takes effect on the next queue build with no PR. Every number here is the
# fence around that: the classifier refuses evidence thinner than
# `min_occurrences`, the readers drop an entry past its expiry, and a list
# longer than `max_entries` is ignored whole. Schema: QuarantineConfigSchema in
# packages/ci-steward/src/schemas.ts.
quarantine:
  # Path on the data branch. Read by `ci-steward quarantine-list` in the queue.
  file: quarantine.json
  # Hard cap. A longer list is ignored ENTIRELY (fail safe: everything blocks
  # as normal), because a lane wide enough to hide a break is worse than none.
  max_entries: 10
  # How long an entry lives unless `quarantine add` is told otherwise.
  default_expiry_days: 7
  # The ceiling on that, enforced at READ time: a list holding an entry with a
  # longer life is ignored whole. The add path checking it would not be enough —
  # anything that can write the data branch can write a longer one.
  max_expiry_days: 14
  # The evidence window `ci-steward flaky` reads. Actions keeps artifacts for 7
  # days, so a 14-day window is only fully covered once the collector has been
  # recording per-test flakes for that long.
  window_days: 14
  # N: distinct merge-group SHAs on which the test failed and then passed. Two
  # is the plan's floor; one is a single bad runner, not a classification.
  min_occurrences: 2
  # A frequent flake that has gone quiet was probably FIXED, and quarantining it
  # spends a slot on nothing. A candidate is `cooling` — and refused — once the
  # clean queue builds since its last flake exceed its own average gap between
  # flakes (builds_sampled / occurrences), never on fewer than this many.
  cooling_min_clean_builds: 2
  # The daily triage flags an entry expiring within this many hours.
  near_expiry_hours: 48

# The main canary: the required suites run against `main` HEAD on a schedule,
# so a break that lands on `main` is found by something other than the next PR
# being ejected by it (plan §4.9, DOR-2150).
#
# There is no canary workflow. Each of these files runs its own suite on
# `schedule` and `workflow_dispatch` as well as on `pull_request` and
# `merge_group`, so there is exactly one definition of each suite and the
# canary cannot drift from what the queue runs. A run is a canary result when
# its file is named here, its event is `schedule` or `workflow_dispatch`
# (`CANARY_EVENTS` in packages/ci-steward/src/data.ts) and its branch is
# `default_branch`.
#
# The list is exhaustive on purpose. `ci-steward.yml`, `evals.yml` and
# `codeql.yml` also run on `schedule` against `main`; without this list the
# collector's own daily tick would report the pipeline healthy on the strength
# of the run that said so. `credential-free-build` is deliberately NOT here:
# it is an affected-only build that reads a base SHA no scheduled run carries,
# and at a 21% failure rate it would cry wolf every day. The PR-diff checks
# (fragment-present, no-fragment-under-skip-label, version-outranks-base,
# db-check) are not here either; they measure a diff, and `main` has none.
canary:
  workflows:
    - test.yml
    - browser-test.yml
    - typecheck.yml
    - lint.yml
  # Every workflow that owns a required context is in `workflows` or here, and
  # the census fails until it is. Without both directions, deleting a name from
  # the list above would leave the census green while the collector silently
  # stopped reading that workflow's runs and the silence arm stopped watching
  # for them — the canary would go quiet with nothing saying so.
  exempt:
    credential-free-build.yml: An affected-only build that reads a base SHA no scheduled run carries, and at a 21% failure rate it would cry wolf every day rather than report a break.
    changelog-fragment-check.yml: Measures a pull request's diff and labels against its base; main has no diff and no labels, so there is nothing for it to check here.
    operating-skills-version-check.yml: Compares the seeded skill pack's version against the base branch's; on main there is no base branch to outrank.
    db-check.yml: Fails when a Drizzle schema change ships without its migration, which is a property of a diff and not of a tree.

# The verdict engine (ci-steward verdicts, plan §4.4).
verdicts:
  before_days: 7
  # The minimum sample for a gate, hook or queue metric. An SLO metric uses
  # its own min_n from ci/slos.yaml.
  min_n: 10

# The improvement triggers (ci-steward triage, plan §4.4). One threshold per
# rule, in the order packages/ci-steward/src/triggers.ts implements them.
#
# This file is inside the fence (ci/steward-owned-paths.json), so an unattended
# ci-improve change cannot widen a threshold until its own trigger stops
# firing. Moving any number here is a hand change with a ledger entry.
triage:
  # 4. A gate whose failure rate is at least this much of the week before's,
  #    with at least this many completed runs in each week.
  #    Its second arm fires on the absolute rate alone, so a gate going from
  #    no failures at all to half of them is not silent (no ratio against zero
  #    can say that). Both arms need spike_min_days days of data in EACH week:
  #    7 days against 1 backfilled day is not a week-over-week comparison.
  failure_spike_ratio: 1.5
  failure_spike_min_n: 20
  failure_spike_absolute: 0.1
  spike_min_days: 5
  # 5. A gate whose p90 duration grew by this fraction week over week, and the
  #    same for job minutes per merged pull request.
  duration_growth: 0.25
  minutes_growth: 0.2
  # 6. The same job causing this many failed-checks ejections in this window.
  repeat_ejection_min: 3
  repeat_ejection_days: 7
  # 8. p95 duration over timeout-minutes at or above which a job has no room
  #    left. The same 0.9 as the `headroom` SLO's floor, deliberately: the SLO
  #    reads the worst gate, this names every gate that is there.
  headroom_ratio: 0.9
  # 9. How many recent days are checked for a collector health failure.
  collector_health_days: 3
  # 10. Days past an after-window's close before a missing verdict is stale,
  #     and days a `proposed` entry may sit before nobody is going to do it.
  stale_verdict_days: 7
  stale_proposed_days: 30
  # 11. Consecutive red main-canary runs of ONE workflow before `main canary
  #     red` fires, and hours without any canary result before the schedule is
  #     reported as stopped.
  #
  #     One run, not two. The 2026-09-20 fixture-clock break was deterministic
  #     inside its window and ejected three unrelated PRs nine times before a
  #     person diagnosed it; waiting for a second canary costs another six hours
  #     of cron for a signal the first run already gave. A canary red costs one
  #     line in a report and never a merge, so the cheap error to make is the
  #     false alarm — and the trigger clears itself on the next green run.
  #
  #     THE PRICE IS PRE-COMMITTED: at the measured 5.1% per-shard failure rate,
  #     one red round out of four a day fires a rank-2 red on about 46% of days.
  #     If that turns out to be noise rather than signal, raise this to 2 with a
  #     ledger entry, accepting that it doubles detection latency.
  #
  #     18 hours of silence, against a nominal 6-hour gap: `evals.yml`'s daily
  #     cron is delivered a median 2.60 h and p90 5.61 h late, so a tighter
  #     number would fire on throttling rather than on breakage. NOTE that 18
  #     here is not 18 hours of wall clock to detection: a day is collected the
  #     morning after and the rule reads the reported day's end, so a stopped
  #     canary is named in about 39 hours worst case. Collecting more often is
  #     what would shorten that, not a smaller number here.
  canary_red_min_runs: 1
  canary_silent_hours: 18
  # 12. A developer machine that is chronically saturated. Load average at hook
  #     start divided by that machine's online cores, p90 over the window, per
  #     clone. "My pushes are slow" was a feeling for months because nothing
  #     recorded the one number that explains most of it.
  #
  #     4.0 means every core has four runnable processes queued at the moment a
  #     gate starts — not a busy machine, a wedged one. 1.0 is fully busy and
  #     perfectly normal on a box doing work; 2.0 is a second agent, which is
  #     this repo's intended way of working and must not fire. The readings this
  #     was set from: ~36 (load 512 on 14 cores) while pre-push p90 sat at 26.6
  #     minutes. There is a lot of room between 4 and 36, deliberately — the
  #     trigger is for "this machine cannot do its job", not for "it is busy".
  #
  #     min_n is hook runs, not days: a machine that ran three hooks all week
  #     has a p90 of nothing in particular.
  machine_load_per_core: 4.0
  #
  #     MEMORY IS THE SECOND ILLNESS AND, ON THIS BOX TODAY, THE BINDING ONE.
  #     Load says the machine is busy; it does not say why three background
  #     processes were killed with "running low on memory" while a 22-minute
  #     push died on a tree it never touched. So two more arms, ORed with the
  #     one above, and the trigger names which fired.
  #
  #     `machine_mem_available_mb` reads available memory at p10 — the low end,
  #     where it hurt, not the average. 1024 MB is "the next `pnpm` fork is a
  #     gamble". Measured here at the time of writing: 681 to 1276 MB, on a
  #     48 GiB machine. Note the platform caveat in time-wrap.sh: on macOS this
  #     is free pages only, so it understates on Linux terms and the swap arm is
  #     the one that speaks first here.
  #
  #     `machine_swap_used_mb` reads swap at p50, because swap only means
  #     anything SUSTAINED: a spike is a program starting, a median is a machine
  #     thrashing, and thrashing is what turns a 2-minute suite into a 22-minute
  #     one. 2048 MB is well clear of the few hundred MB macOS parks there on a
  #     healthy day. Measured here: 15,881 MB of a 17,408 MB swap file.
  machine_mem_available_mb: 1024
  machine_swap_used_mb: 2048
  machine_load_min_n: 20
  # The report says how long a trigger has been open once it reaches this.
  open_days_warning: 14
  # Days of history each sparkline in the daily report draws.
  sparkline_days: 14

# Local hook timings (plan §4.5): the lefthook time-wrap and ci-local-export.
local:
  timings_file: ci-steward/local-timings.jsonl
  # A START with no END older than this was killed. It is the pre-push
  # watchdog's own ceiling (DORKOS_PREPUSH_MAX_SECONDS, 7200, in
  # scripts/pre-push-watchdog.sh) plus 5 minutes, so a push that is still
  # running is never called killed. A hook stopped by INT, TERM or HUP is
  # known at once: the time-wrap writes its END with 128+n.
  killed_after_seconds: 7500
  # The agent tool ceiling: the wait a killed push cost, in local-push's
  # excess wait-hours.
  tool_ceiling_seconds: 600
  retention_days: 30
  max_bytes: 5000000
  stale_after_days: 3
  retired_after_days: 14

  # THE MACHINE-WIDE CAP ON HEAVY LOCAL RUNS (scripts/heavy-run-lock.sh,
  # DOR-2160). Several agents and the operator's dev server share this box, and
  # nothing coordinated their test runs: each `turbo test --affected
  # --concurrency=1` runs one suite at a time but lets vitest keep a worker per
  # core, so each gate is a whole machine's worth of work. Four at once measured
  # a load average around 500 on 14 cores, with the kernel killing background
  # processes for memory.
  #
  # THREE, on 14 cores, is a judgement with its arithmetic shown. One would be
  # the tidiest cap and is wrong: the common case on this machine is a docs
  # commit whose affected set is empty, which holds a slot for a second, and
  # serialising those would add waiting to runs that cost nothing. Three allows
  # roughly 3x oversubscription — bad, but a long way from the ~10x measured —
  # and it leaves a slot free when one agent's pre-commit takes two (lint and
  # typecheck run concurrently in that hook). Raise it only with a ledger entry
  # and the load numbers from the daily report; lowering it is cheaper to try.
  #
  # The script reads these three with `sed`, because it runs before any
  # node_modules exist; local.test.ts pins its fallbacks to the values here so
  # the fallback can never quietly become the real number.
  heavy_run_slots: 3
  # How long a heavy command waits for a slot before running anyway, loudly.
  # 45s against the pre-push gate's 120s budget: the wait is INSIDE the budget,
  # so this is the most of it that may be spent queueing rather than testing.
  heavy_lock_wait_seconds: 45
  # A slot held longer than this is reclaimable even if its owner is alive. The
  # slowest heavy command measured here is a pre-commit lint at 734s; 900 is
  # above that and far below anything a healthy run reaches.
  heavy_lock_max_hold_seconds: 900
