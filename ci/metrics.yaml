# The metric catalogue: every metric id a ledger hypothesis may name (plan §3).
#
# A hypothesis that names a metric the collector cannot compute can never get a
# verdict, so `ledger-check` accepts only ids that resolve here:
#
#   gate.<gate-id>.<metric>   a gate_templates metric for any id in ci/gates.yaml,
#                             e.g. gate.wf.browser-test.browser-shard.failure_rate,
#                             over every event the gate runs on; add @<event>
#                             (an event_qualifiers entry) for one leg only, e.g.
#                             gate.wf.test.test-shard.duration_p50@merge_group
#   hook.<git-hook>.<metric>  a hook_templates metric for a lefthook hook,
#                             e.g. hook.pre-push.duration_p90
#   queue.*                   a queue-level metric below
#   tracked.*                 a tracked metric below (reported weekly, never scored)
#   <slo-id>                  any SLO in ci/slos.yaml (slo_metrics must list them all)
#
# Name the narrowest metric the change can move; put the SLO it serves in the
# hypothesis's `slo:` field. Ids follow OpenTelemetry CI/CD naming where one
# exists. Schema: MetricsSchema in packages/ci-steward/src/schemas.ts.
gate_templates:
  - metric: duration_p50
    unit: minutes
    definition: Median job duration (started to completed) of the gate's completed, non-skipped runs in the window.
  - metric: duration_p90
    unit: minutes
    definition: 90th-percentile job duration of the gate's completed, non-skipped runs in the window.
  - metric: failure_rate
    unit: ratio
    definition: Failed runs divided by completed, non-cancelled runs of the gate in the window.
  - metric: retry_rate
    unit: ratio
    definition: Runs that were re-run (run_attempt > 1) divided by all runs of the gate in the window.
  - metric: real_catches
    unit: count
    definition: Queue ejections for this gate's failure that were followed by a new commit before re-queue (a real defect caught), in the window.
  - metric: ejections_caused
    unit: count
    definition: Queue ejections whose failing required check was this gate, in the window.

# A sharded suite runs affected-only on a PR and in full in the queue, so an
# unqualified duration mixes two different jobs. Name the leg the change is
# about.
#
# `schedule` and `workflow_dispatch` are the main canary's legs: the same jobs,
# under the same gate ids, run against `main` HEAD. An UNQUALIFIED gate metric
# never includes them (`gateDays` in packages/ci-steward/src/data.ts), so a
# hypothesis about the canary itself has to say `@schedule` out loud.
event_qualifiers: [merge_group, pull_request, schedule, workflow_dispatch]

hook_templates:
  - metric: duration_p90
    unit: seconds
    definition: 90th-percentile whole-hook wall time from the time-wrap START/END records.
  - metric: killed_share
    unit: ratio
    definition: Share of hook runs with a START and no END older than the pre-push ceiling (killed by the agent tool ceiling).

queue:
  - id: queue.batch_wasted_share
    unit: ratio
    definition: Share of queue builds (batches of up to 5 entries) that were discarded because one entry failed, among all completed queue builds.
  - id: queue.queue_wait
    unit: minutes
    definition: Per merged PR, time from its first ADDED_TO_MERGE_QUEUE_EVENT to its merge, ejections and re-entries included; reported as p50 and p90, the verdict reads p50.

tracked:
  - id: tracked.escaped
    unit: count
    definition: Fix PRs citing a regression from a PR merged at most 7 days earlier (a prose match, too gameable to score).
  - id: tracked.time-to-detect
    unit: minutes
    definition: >-
      How long a break on main can go unseen: per main-canary result, the
      minutes from the PREVIOUS result's start to this one's finish, for the
      same canary workflow; p90. A run tests the tree it checked out, so a
      break landing just after run i-1 started hides until run i finishes —
      done(i) minus started(i-1), which is the real upper bound; done(i) minus
      done(i-1) would leave out the earlier run's own duration. Measured this
      way rather than as merge-to-first-red because main is usually green, and
      a metric with no value on a healthy week cannot say whether the canary is
      still running.
  - id: tracked.merged-to-released
    unit: hours
    definition: Time from a PR's merge to the first release tag that contains it; p50.
  - id: tracked.job-minutes-per-merged-pr
    unit: minutes
    definition: >-
      Runner minutes of every workflow run attributable to a merged PR (its PR
      runs and its queue builds), per merged PR. The main canary's minutes are
      NOT in it: it spends a fixed amount a day on a tree nobody is merging, so
      counting it would make this figure move with how busy the week was. They
      are carried beside, as tracked.canary-minutes.
  - id: tracked.canary-minutes
    unit: minutes
    definition: Runner minutes the main canary's own runs spent, per day. Reported, never charged to a merged PR.
  - id: tracked.machine-load
    unit: ratio
    definition: >-
      What the machines running the local hooks were doing while they ran, from
      the time-wrap's own event lines: load average divided by online cores at
      p90, available memory in MiB at p10, and swap in use in MiB at p50 — each
      read at its own bad end, because "the average was fine" is how a saturated
      machine hides. Reported, never scored: it is a fact about somebody's
      laptop, not about the pipeline, and no pipeline change moves it. It is
      here because local-commit and local-push are mostly a measurement of it,
      and until DOR-2160 nothing recorded it at all. The memory figure means
      MemAvailable on Linux and free pages on macOS (which compresses, so its
      "inactive" pool is not availability); read it beside swap, not alone.
  - id: tracked.gate-cut-short
    unit: ratio
    definition: >-
      Share of local hook runs that did not run as intended, split by why: taken
      away by the operating system (a signal END, or a START with no END past
      the ceiling), or run with no machine-wide slot because the wait for one
      ran out (the `lock_timeout` note scripts/heavy-run-lock.sh writes). Both
      are invisible in every other number — a killed hook leaves no verdict to
      count, and a command that ran uncapped looks exactly like one that had a
      slot to itself, which is how a concurrency cap stops existing without
      anybody noticing.
  - id: tracked.cache-hit-rate
    unit: ratio
    definition: Share of cache restore steps (pnpm store, Playwright, turbo) that hit an existing entry.
  - id: tracked.green-to-armed
    unit: minutes
    definition: Per merged PR, time from its final head's required checks all going green to the first auto-merge arming or queue entry after that; p50. Not yet computed by the collector (it needs the head SHA's check completion joined to the AUTO_MERGE_ENABLED and ADDED_TO_MERGE_QUEUE timeline events); the event-driven merge-tail experiment adds it.
  - id: tracked.repeat-ejections
    unit: count
    definition: >-
      Queue ejections, per 7 days, that repeat an earlier one on the same PR
      head: an ejection whose queue build failed a check (a gate, fan-ins
      included, as merge-tail's rule reads required contexts) that also failed
      an earlier, DIFFERENT queue build of that PR with no push in between.
      Computed by the collector (`repeatEjections` in
      packages/ci-steward/src/collect.ts) for the PRs merged each day, from the
      same timeline and queue-build data as real_catches, so a push is a
      timeline commit or force-push, exactly as `newCommit` reads it — not the
      head's first check suite, which the hand-measured baseline in
      ci/ledger/260923-095512 used. Scaled to 7 days over the days that carry
      the count; a day collected before it existed has none and is left out,
      never read as 0. PRs closed without merging are not counted, as for every
      other ejection figure.
  - id: tracked.review-runs-per-merged-pr
    unit: count
    definition: Automated review runs per merged PR.
  - id: tracked.review-red-rate
    unit: ratio
    definition: Share of first reviews that raise at least one Important finding; under 0.04 for 2 weeks is a health tripwire (baseline 0.097).
  - id: tracked.review-findings-unfixed-share
    unit: ratio
    definition: Share of real Important review findings whose PR merged without a fix or a written rebuttal (baseline 0.58, plan §5.1).

slo_metrics:
  - headroom
  - queue-green
  - wasted-queue-builds
  - flaky-test-runs
  - main-green
  - review-completes
  - review-recovery
  - pr-feedback
  - queue-build
  - lead-time
  - local-commit
  - local-push
