# Reasoned exceptions to the census (packages/ci-steward/src/required.ts).
#
# Each entry excuses exactly one site: {workflow, job, step?, kind}. `step` is
# the step's `name:`, else its `id:`, else its `uses:` without the @ref.
#
#   continue-on-error  a step (or job) in a required job, or in a job it
#                      needs, that can fail without failing the context.
#                      `expires` optional: give one when the exception is
#                      temporary.
#   no-timeout         a job with no timeout-minutes because there is no run
#                      data to measure one from. `expires` REQUIRED.
#   step-if            a step in a required job, or in a job it needs,
#                      whose `if:` is not true on both pull_request and
#                      merge_group. `expires` optional:
#                      deliberate event branching is permanent design, and a
#                      fake date would only red every PR at once.
#   job-if             a required job whose job-level `if:` can be false on an
#                      event (a skipped required check PASSES). `expires`
#                      optional.
#
# An expired entry fails the census, and so does an entry that excuses
# nothing. That makes an expiry a deadline for a person, never a switch:
# an expired entry turns EVERY PR's census red until a PR removes it, so never
# use one to schedule a behaviour change (put a date the tool reads in
# ci/config.yaml instead). Give an expiry only to an exception that is
# genuinely temporary, and remove it before the date.
# Conditions true on both events on a green run (e.g. `!cancelled()`) need no
# entry. Schema: AllowlistSchema in packages/ci-steward/src/schemas.ts.
entries:
  # --- typecheck.yml ---
  - workflow: typecheck.yml
    job: typecheck
    step: CI Steward ledger coverage
    kind: step-if
    reason: Coverage needs the PR's diff and branch name, which only pull_request carries, and it cannot change between the PR and the queue, where ledger validity re-runs. Dependabot PRs skip it too; Dependabot cannot write a ledger entry, and its PRs would otherwise stay red forever.

  # --- changelog-fragment-check.yml ---
  - workflow: changelog-fragment-check.yml
    job: fragment-present
    step: Require a changelog fragment for every user-facing commit
    kind: step-if
    reason: Coverage needs the PR's labels and number, absent from merge_group; it is decided on the PR, which must pass before queueing. Validity re-runs in the queue unconditionally.
  - workflow: changelog-fragment-check.yml
    job: fragment-present
    step: Note where coverage was decided
    kind: step-if
    reason: An echo-only step that says on merge_group runs where coverage was decided; it checks nothing.
  - workflow: changelog-fragment-check.yml
    job: no-fragment-under-skip-label
    kind: job-if
    reason: Reconciles the skip-changelog LABEL against the diff; the label exists only on the PR, so on merge_group the job skips (a pass) by design. It already ran on the PR, which could not enter the queue without passing it.

  # --- operating-skills-version-check.yml ---
  - workflow: operating-skills-version-check.yml
    job: version-outranks-base
    step: Compare the pack version against the base branch tip
    kind: step-if
    reason: Runs only when the scope step finds the seeded skill-pack content changed; on both events the same scope step decides, so nothing is skipped by event.
  - workflow: operating-skills-version-check.yml
    job: version-outranks-base
    step: Require a history entry for the new version
    kind: step-if
    reason: Same scope decision as the version comparison; runs on both events whenever the seeded pack content changed.

  # --- test.yml ---
  - workflow: test.yml
    job: test
    step: actions/checkout
    kind: step-if
    reason: The fan-in checks out code only for the merge_group shard-union proof; on pull_request the shards run affected-only and there is no full union to prove.
  - workflow: test.yml
    job: test
    step: actions/download-artifact
    kind: step-if
    reason: Collects the shards' collected-file lists, which only the merge_group full sweep uploads.
  - workflow: test.yml
    job: test
    step: Prove the shards' union covers every package
    kind: step-if
    reason: The union is only complete on the merge_group full sweep; on pull_request each shard is affected-only by design.

  - workflow: test.yml
    job: test
    step: Collect every shard's quarantine lane
    kind: step-if
    reason: Collects the lane the merge_group shards ran under; on pull_request the shards run affected-only, no lane applies and no shard uploads one.
  - workflow: test.yml
    job: test
    step: Agree on the lane this build ran under
    kind: step-if
    reason: Intersects the merge_group shards' copies of the lane for the union proof; there is no lane and no full union on a pull request.

  # --- browser-test.yml ---
  - workflow: browser-test.yml
    job: browser-test
    step: Defer to the merge queue on pull_request events
    kind: step-if
    reason: The browser suite runs in the merge queue only (ADR 260728-112203, #1246); on pull_request the fan-in reports a named pass-through.
  - workflow: browser-test.yml
    job: browser-test
    step: Refuse a run whose shards did not all pass
    kind: step-if
    reason: The shards run only on merge_group, so their result is only meaningful there; this is the step that fails the queue build on a red shard.
  - workflow: browser-test.yml
    job: browser-test
    step: actions/checkout
    kind: step-if
    reason: Checks out code for the merge_group executed-count proof only; the PR leg is a pass-through.
  - workflow: browser-test.yml
    job: browser-test
    step: Collect every shard's quarantine lane
    kind: step-if
    reason: Collects the lane the merge_group shards ran under; on pull_request the shards are skipped and none uploads one.
  - workflow: browser-test.yml
    job: browser-test
    step: Agree on the lane this build ran under
    kind: step-if
    reason: Intersects the merge_group shards' copies of the lane, so the execution proof can name what it absorbed and refuse a quarantined test that stopped running; the PR leg runs no suite.
  - workflow: browser-test.yml
    job: browser-test
    step: Collect every shard's JSON report
    kind: step-if
    reason: Only merge_group shards produce JSON reports to collect.
  - workflow: browser-test.yml
    job: browser-test
    step: Prove the browser suite actually executed
    kind: step-if
    reason: Proves the queue's shards really ran the suite; there is no PR run to prove.

  # --- credential-free-build.yml ---
  - workflow: credential-free-build.yml
    job: credential-free-build
    step: Save turbo's local cache
    kind: step-if
    reason: Saves the turbo cache on pull_request only, because a cache saved under a merge-queue ref can never be read by any other ref; it asserts nothing.

  # --- jobs the required fan-ins need (the census follows needs:) ---
  - workflow: test.yml
    job: test-shard
    step: Run every package's test suite (shard ${{ matrix.shard }}/4)
    kind: step-if
    reason: The full sweep runs in the merge queue; its pull_request twin below runs the affected packages. Exactly one of the pair runs on each event.
  - workflow: test.yml
    job: test-shard
    step: Run the affected packages' test suites (shard ${{ matrix.shard }}/4)
    kind: step-if
    reason: The affected-only pull_request leg; the merge_group twin above runs the full sweep. Exactly one of the pair runs on each event.
  - workflow: test.yml
    job: test-shard
    step: Hand this shard's quarantine lane to the fan-in
    kind: step-if
    reason: Uploads the lane this merge_group shard ran under, for the fan-in's union proof; on pull_request no lane is read and none is uploaded.
  - workflow: test.yml
    job: test-shard
    step: Read the quarantine lane
    kind: step-if
    reason: The quarantine lane applies to the merge_group full sweep, the only leg that retries and the only one whose failures can eject a queue build; the affected-only PR leg blocks on every failure as it always did.
  - workflow: test.yml
    job: test-shard
    step: Refuse any failure the quarantine lane does not cover
    kind: step-if
    reason: The gate for the merge_group sweep's exit code; the PR leg's own sweep step still fails the shard directly, so nothing is ungated on either event.
  - workflow: test.yml
    job: test-shard
    step: Prove the suite actually executed
    kind: step-if
    reason: Asserts every package executed with no cache replay, which only the merge_group full sweep can prove; an affected-only PR run legitimately skips packages.
  - workflow: test.yml
    job: test-shard
    step: Name the tests that only passed on a retry
    kind: step-if
    reason: Reports retried tests from the merge_group run, the only leg that retries; it prints, it does not gate.
  - workflow: test.yml
    job: test-shard
    step: Record the test files this shard collected
    kind: step-if
    reason: Feeds the fan-in's merge_group shard-union proof; there is no full union on a PR.
  - workflow: test.yml
    job: test-shard
    step: actions/upload-artifact
    kind: step-if
    reason: Uploads the collected-file list for the merge_group shard-union proof.
  - workflow: test.yml
    job: test-shard
    step: Upload this shard's vitest reports for CI Steward
    kind: step-if
    reason: Only the merge_group full sweep writes the vitest shard and flake reports; on a PR there is nothing to upload.
  - workflow: test.yml
    job: test-shard
    step: Upload this shard's vitest reports for CI Steward
    kind: continue-on-error
    reason: Observability for the CI Steward collector (flaky-test-runs); an artifact-service 403 must cost one sample, never a queue build. Phase 2's ratchet will read these in the fan-in and fail closed there instead.
  - workflow: test.yml
    job: community-packaged
    step: Packaged proof runs on the merge queue
    kind: step-if
    reason: An echo that names where the packaged proof runs; it checks nothing.
  - workflow: test.yml
    job: community-packaged
    step: actions/checkout
    kind: step-if
    reason: The packaged community proof runs on the merge queue's combined tree only; on a PR this job is a named pass-through.
  - workflow: test.yml
    job: community-packaged
    step: Build and test without public network access
    kind: step-if
    reason: The packaged community proof itself, merge_group only by design (too slow for every PR push); the fan-in fails the queue build when it fails.
  - workflow: test.yml
    job: community-packaged
    step: Preserve packaged community reports
    kind: step-if
    reason: Uploads evidence from the merge_group proof; asserts nothing.
  - workflow: browser-test.yml
    job: browser-shard
    step: Upload this shard's JSON report
    kind: continue-on-error
    reason: A first upload attempt that may hit GitHub's intermittent 403 (#1858); the retry step below has no continue-on-error, and the fan-in fails when any shard's results.json is missing, so nothing is hidden.
  - workflow: browser-test.yml
    job: browser-shard
    step: Upload this shard's JSON report (retry)
    kind: step-if
    reason: Runs only when the first upload failed; its own failure fails the shard.
  - workflow: browser-test.yml
    job: browser-shard
    step: Upload the Playwright report
    kind: continue-on-error
    reason: Uploads traces and screenshots after a shard already failed or was cancelled; diagnostics for a red run, which is red either way.
  - workflow: browser-test.yml
    job: browser-shard
    step: Upload the Playwright report
    kind: step-if
    reason: Diagnostics only, uploaded when the shard failed or was cancelled.
  - workflow: browser-test.yml
    job: browser-shard
    step: Upload the Playwright report (retry)
    kind: step-if
    reason: Retries the diagnostics upload after a failed shard; the run is already red.
