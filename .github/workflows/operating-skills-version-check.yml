name: operating-skills-version-check

# `OPERATING_SKILLS_VERSION` is what makes a correction to the Operating DorkOS
# skill pack REACH agents that already exist. `seed.ts` rewrites an unmodified
# seeded copy only when the copy's stored stamp is STRICTLY LOWER than the
# constant, so a version that merely EQUALS what `main` already ships delivers
# nothing, silently.
#
# That is not hypothetical. DOR-502 and DOR-509 were written in parallel and
# both bumped 4 to 5. DOR-502 merged first, and DOR-509's branch then sat at 5
# against a `main` already at 5. Every already-seeded agent would have kept
# reading exactly the text the PR existed to fix, and the PR's changelog entry
# claiming "existing agents pick up the corrected version automatically" would
# have been false. It cost a full review cycle to catch.
#
# Why this is CI and not a vitest test. The pack's own suite asserts
# `OPERATING_SKILLS_VERSION >= <floor>`, and a floor trails `main` by
# construction — the floor was 5, the value was 5, it passed. Raising the floor
# per correction keeps that test useful but cannot close the class, because the
# next two parallel pack PRs hit it again. "Higher than the merge base" is a
# fact about two commits, not about the working tree: a unit test would need the
# base ref, which `actions/checkout@v4` does not fetch by default, and a test
# that SKIPS when the ref is missing is an inert guard wearing a green check.
# Hence: `fetch-depth: 0`, read both sides, compare.
#
# "Both sides" means HEAD and the base branch's TIP, not HEAD and the merge base.
# See the comment on the first step: against the merge base this guard would be
# green on the exact case it exists to catch.
#
# LOAD-BEARING SETTING, OUTSIDE THIS FILE. `on: pull_request` does not re-fire
# when somebody pushes to the base branch, so a run that was green at base=5 /
# head=6 stays green after another pull request takes 6 — the exact DOR-509 hole,
# reopened by timing rather than by arithmetic. Something outside this file has
# to guarantee this job is re-evaluated against the base branch's REAL tip before
# the merge lands.
#
# That guarantor used to be `required_status_checks.strict = true` on `main`
# ("require branches to be up to date before merging"): it forced a branch
# update, which fired `synchronize`, which re-ran this against the new tip.
#
# It is now `on: merge_group`. The merge queue re-runs this job against
# `merge_group.base_sha` — the exact commit the merge will sit on — immediately
# before merging, which is a stronger guarantee than `strict` ever gave: `strict`
# only ensured the branch was up to date at the moment the author last updated
# it, and the base could still move between that re-run and the merge. The queue
# closes that residual window because nothing can land between the queue's check
# and the queue's merge, by construction.
#
# So: this guard now depends on `merge_group` staying in the `on:` list and on
# `version-outranks-base` staying in the branch's required checks. If the merge
# queue is ever removed, `strict` has to come back, or this guard silently
# regains the hole.
#
# There is deliberately NO `paths:` filter. GitHub leaves a filtered workflow
# Pending forever on a pull request that does not match, so a filtered check can
# never be a REQUIRED check (`.agents/skills/creating-pull-requests/SKILL.md`),
# and a guard that can fail but cannot block is not a gate — it is a suggestion
# that auto-merge will drive straight past. The "Decide whether the seeded pack
# content changed" step below does the precise scoping instead and short-circuits
# both later steps, so the cost on an unrelated pull request is one checkout.
#
# THAT SCOPING IS NOT FILE-GRANULAR, and the difference is the point. It used to
# be one `git diff --quiet` over both paths, which cannot tell a comment from
# skill text. DOR-671 rewrote the paragraph of `pack.ts` TSDoc that said the
# re-seed gap was still open — the gap that very pull request closed — and this
# job demanded a version bump for it. Nothing an agent reads had moved, and
# bumping to satisfy the guard would have rewritten all six seeded files in every
# workspace with byte-identical bodies and required a History entry describing a
# comment edit, devaluing the version trail the whole ratchet argument rests on.
# So the scoping now matches what this header already claimed: a pull request
# that does not change what gets seeded is not required to bump.
#
# The two paths are scoped DIFFERENTLY, and that asymmetry is deliberate:
#
#   PACK_FILE  — comment and blank lines are ignored. The file is mostly prose
#                ABOUT the pack (a ~90-line docblock, then the constant and the
#                array); none of it is seeded anywhere.
#   SKILLS_DIR — byte-granular, unchanged. A comment inside a skill body IS
#                seeded text: the bodies are template literals written for a
#                model to read, and `seed.ts` hashes them verbatim. Do not
#                soften this side to match the other.
#
# The decision itself lives in `scripts/seeded-pack-changed.sh` rather than
# inline here, for the reason `scripts/should-arm-automerge.sh` and
# `scripts/assert-tests-executed.sh` do: inline workflow bash cannot be tested,
# and a scoping rule that quietly stops matching turns a required check into a
# decoration without anything going red. Both directions are pinned by
# `scripts/test-seeded-pack-changed.sh`, including the DOR-509 shape above.

on:
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  version-outranks-base:
    runs-on: ubuntu-latest
    env:
      # The file carrying the constant, and the directory holding the seeded
      # skill text. Every step below reads these two.
      PACK_FILE: packages/operating-skills/src/pack.ts
      SKILLS_DIR: packages/operating-skills/src/skills
    steps:
      # The PR head, with full history so the base ref resolves. Without
      # fetch-depth: 0 there is no base side to compare against, which is the
      # whole reason this runs here rather than in the unit suite.
      # On `pull_request` this is the PR head. On `merge_group` there is no
      # pull_request object at all, and `github.sha` is already the queue branch
      # tip (main + everything ahead in the queue + this PR), which is exactly
      # the tree whose version needs to outrank the base.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Two different base commits, and the difference is the whole bug.
      #
      #   fork_point — where this branch left the base branch. The right frame for
      #     "what did THIS pull request change".
      #   base_tip   — what the base branch ships RIGHT NOW. The only frame for
      #     "will this version actually upgrade an already-seeded agent".
      #
      # Comparing the version against the fork point is precisely the failure this
      # guard exists to catch, and it would be inert: DOR-509 forked from a `main`
      # at 4 and bumped to 5, so fork point 4 < head 5 reads green — while `main`
      # had moved to 5 underneath it and the seeder would upgrade nobody.
      # In the merge queue both commits come straight from the event: the queue
      # branch is BUILT on `base_sha`, so the fork point and the base tip are the
      # same commit, and there is no drift between them to reason about. That is
      # the whole point of the queue, and it is what finally makes this guard
      # exact rather than best-effort — the DOR-509 failure mode it was written
      # for (fork from a base at 4, bump to 5, base moves to 5 underneath) cannot
      # occur when the base is pinned to the commit the merge will actually sit
      # on. The parallel-PR collision this job's own error message warns about is
      # likewise resolved here: two PRs both bumping to the same number can both
      # be green on their own PR runs, and the second one goes red in the queue.
      - name: Resolve the fork point and the base branch tip
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base_tip="${{ github.event.merge_group.base_sha }}"
            git fetch --no-tags origin "$base_tip" || git fetch --no-tags --depth=200 origin
            fork_point="$base_tip"
            echo "merge group: base pinned to the commit this will merge onto"
          else
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            base_tip="$(git rev-parse "origin/${{ github.base_ref }}")"
            fork_point="$(git merge-base "$base_tip" HEAD)"
          fi
          echo "fork_point=$fork_point" >> "$GITHUB_OUTPUT"
          echo "base_tip=$base_tip" >> "$GITHUB_OUTPUT"
          echo "fork point:    $fork_point"
          echo "base tip:      $base_tip"

      # A PR that does not change what gets seeded must not be required to bump.
      # This is the ONLY scoping in the workflow — there is no `paths:` filter, for
      # the reason in the header — so it carries the whole job: it runs on every
      # pull request and short-circuits the two steps below on all but the few that
      # touch seeded content. Editing seed.ts, the tests, or the package README
      # changes no agent's skill text and owes no new version, and neither does
      # editing the prose in pack.ts's own docblock. Scoped to the fork point,
      # because this asks what the branch did, not what the base branch did
      # meanwhile.
      #
      # The script reads PACK_FILE and SKILLS_DIR from this job's env, so the two
      # paths are declared once above and cannot drift between this step and the
      # two that read the version out of the same file. It exits 2 rather than
      # guessing if a ref will not resolve, which under the runner's default
      # `bash -e` fails this step loudly instead of scoping the whole job away.
      - name: Decide whether the seeded pack content changed
        id: scope
        run: |
          verdict="$(./scripts/seeded-pack-changed.sh "${{ steps.base.outputs.fork_point }}")"
          if [ "$verdict" = "changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Both sides are read from git rather than the working tree, so the base
      # value is the one the base branch actually ships and not whatever a stale
      # checkout holds. An unreadable value is a hard failure: if the constant is
      # ever renamed or reformatted this guard must go red and get fixed, never
      # quietly pass because a pattern found nothing.
      - name: Compare the pack version against the base branch tip
        if: ${{ steps.scope.outputs.changed == 'true' }}
        run: |
          base_tip="${{ steps.base.outputs.base_tip }}"
          # `github.base_ref` is bare (`main`); `merge_group.base_ref` is a full
          # ref (`refs/heads/main`). Strip the prefix so the messages below name
          # the same branch the same way on both trigger paths.
          base_name="${{ github.base_ref || github.event.merge_group.base_ref }}"
          base_name="${base_name#refs/heads/}"
          version_pattern='s/^export const OPERATING_SKILLS_VERSION = ([0-9]+);$/\1/p'

          base_version="$(git show "$base_tip:$PACK_FILE" | sed -nE "$version_pattern")"
          head_version="$(git show "HEAD:$PACK_FILE" | sed -nE "$version_pattern")"

          if [ -z "$base_version" ] || [ -z "$head_version" ]; then
            echo "::error::Could not read OPERATING_SKILLS_VERSION from $PACK_FILE (base='$base_version', head='$head_version'). This guard matches the line 'export const OPERATING_SKILLS_VERSION = <n>;' exactly. If the constant moved or was reformatted, update .github/workflows/operating-skills-version-check.yml in the same change."
            exit 1
          fi

          echo "$base_name tip ($base_tip): OPERATING_SKILLS_VERSION = $base_version"
          echo "this branch:                            OPERATING_SKILLS_VERSION = $head_version"

          if [ "$head_version" -le "$base_version" ]; then
            echo "::error::This pull request changes the Operating DorkOS skill pack, but its OPERATING_SKILLS_VERSION ($head_version) is not higher than the one $base_name already ships ($base_version). seed.ts rewrites an already-seeded skill only when the stored stamp is STRICTLY LOWER than this constant, so an equal version delivers the correction to nobody, silently. Re-bump to $((base_version + 1)) or higher, and add the matching History entry. If you hit this because another pack change merged while yours was open, resolve it by RE-BUMPING, never by keeping either side's number: two parallel pack PRs picking the same next number is exactly how this fails."
            exit 1
          fi

          echo "OK: $head_version > $base_version, so already-seeded agents will be upgraded."

      # The same conflict that duplicates a number also tends to REPLACE the
      # other side's history entry rather than join it, leaving the shipped pack
      # with no written record of one correction. That block is the only place
      # saying what a version changed and why, so a number without an entry is a
      # bump nobody can audit.
      - name: Require a history entry for the new version
        if: ${{ steps.scope.outputs.changed == 'true' }}
        run: |
          head_version="$(sed -nE 's/^export const OPERATING_SKILLS_VERSION = ([0-9]+);$/\1/p' "$PACK_FILE")"
          if ! grep -qE "^ \* - ${head_version}: " "$PACK_FILE"; then
            echo "::error::OPERATING_SKILLS_VERSION is $head_version but the History block in $PACK_FILE has no ' * - ${head_version}: ' entry saying what changed and why. Add one. If you just resolved a conflict on that block, check that you JOINED both sides' entries rather than replacing one with the other."
            exit 1
          fi
          echo "OK: the History block documents version $head_version."
