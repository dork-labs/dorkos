name: browser-test

# Runs the Playwright browser suite (apps/e2e) on merge groups only, as a
# REQUIRED check of the merge queue (ruleset "main: merge queue").
#
# Before this workflow existed, NOTHING in CI ran it. `grep -rlE
# 'playwright|e2e|browser' .github/workflows/` returned nothing across sixteen
# workflows, while apps/e2e declared `"e2e": "playwright test"` and 92 tests sat
# in 22 spec files that no gate ever executed. A change could break every browser
# test and merge green — and did. That is DOR-656. The suite itself was repaired
# to green in #605 (89 passed, 0 failed, 3 skipped); this workflow is the gate
# that keeps it that way.
#
# TWO JOBS, AND THE SECOND ONE IS THE CHECK (DOR-1363). `browser-shard` is a
# three-way matrix that runs a third of the suite each; `browser-test` is a
# fan-in gate that needs all three and fails if any of them did not pass. The
# reasoning for both the split and the shape is on those jobs.
#
# THE SUITE RUNS IN THE MERGE QUEUE ONLY; THE PR GETS A PASS-THROUGH CONTEXT
# (2026-08-23/24). This workflow used to fire the full suite on every PR push,
# every merge group AND every push to main — three full ~60-runner-minute runs
# per merged PR, on a Free-plan org capped at 20 concurrent hosted jobs. On
# 2026-08-23 that saturation had 88 workflow runs queued against 14 running
# and a two-hour merge queue: shards waited 15-40 minutes for a runner before
# executing a single test (run 32663568051 has the receipts). The merge-group
# run is the only one that sees the combined tree — the two-PR interaction
# class (each green alone against its own base, red together) that reached
# main as DOR-656 — so it is the only place the shards run now:
#
#   * `pull_request`: the shard matrix is SKIPPED and the `browser-test`
#     fan-in reports success immediately, stating it deferred to the queue.
#     This is not decoration — a required check must SUCCEED ON THE PULL
#     REQUEST before GitHub admits the PR to the merge queue at all (measured
#     on PR #1246, which dropped the trigger entirely and sat armed, green and
#     unqueueable for 15 hours; `enqueuePullRequest` refused it with "required
#     status checks have not succeeded: expected"). The pass-through satisfies
#     queue ENTRY; the queue run is still the gate that decides the MERGE, so
#     no browser regression can land — it is caught at the queue, minutes
#     later, instead of on every PR push, at full price.
#   * `push` to main: dropped. The tree the queue merges is byte-identical to
#     the tree it just tested (squash rewrites the SHA, not the content), so
#     the post-merge run re-proved what was already proven. A direct push to
#     main bypasses this — but it bypasses the queue and every other gate too,
#     which is already what an emergency bypass means here.
#
# FULL MONOREPO TRIGGER, NO `paths:` FILTER. Two independent reasons, and either
# alone would be enough.
#
#   1. A path filter would not have caught the regression this ticket cites. That
#      one was a changed placeholder STRING in apps/client which broke a
#      Playwright locator in apps/e2e. A filter scoped to `apps/e2e/**` misses it
#      by construction, and "scope asserted from where you happen to be working"
#      is a named recurring defect here. An honest filter would have to list
#      apps/client, apps/server, apps/site and most of packages/ — i.e. nearly
#      the whole tree — which buys a rounding error of runner time for a
#      permanent correctness hole.
#   2. A path-filtered workflow can never become a required check. GitHub's
#      troubleshooting-required-status-checks doc is explicit: "A workflow is
#      skipped by path filtering, branch filtering, or a commit message →
#      Associated checks stay in a 'Pending' state and block merging → Avoid
#      requiring workflows that can be skipped." A skipped JOB reports success; a
#      skipped WORKFLOW reports nothing at all, and under the merge queue
#      (ADR 260728-112203) a required check that never reports blocks the queue
#      until `check_response_timeout_minutes` (60) expires. So the filter and the
#      option of ever making this required are mutually exclusive.
#
# The trade this accepts, stated plainly: a docs-only or changelog-only PR pays
# for a browser run it cannot possibly break — once, in the queue, where the
# runner cost is bounded per merge rather than per push.
#
# THIS IS A REQUIRED CHECK on the merge queue, as of 2026-08-23 — the deliberate
# second act the previous version of this header planned for. The trigger landed
# first (per ADR 260728-112203, a required check must report on `merge_group` or
# the queue blocks until `check_response_timeout_minutes` expires), it ran green
# on real merge groups for weeks, and the ruleset toggle followed. Until the
# toggle, `test` failed twice in a merge group on 2026-08-23 and the entries
# merged anyway — the queue's most expensive signal was advisory, which is the
# same inversion DOR-544 named at the PR level. The `browser-test` NAME is
# load-bearing for the ruleset: sharding put the matrix under a different job id
# precisely so the fan-in job could keep the context string the ruleset
# requires. Rename it and the queue deadlocks on a check that never reports.
#
# THE PR PAYS FOR THAT TRADE IN ONE SPECIFIC WAY, AND `copy-spec-drift` IS THE
# REFUND (DOR-1647). apps/e2e deliberately asserts literal product copy, so a PR
# that rewrites a string is green here at PR time and reds in the queue — where a
# red is an EJECTION that also silently disarms auto-merge, costing a dequeue, a
# fix and a re-arm with operator attention in the middle. That happened twice in
# one day on 2026-08-31 (#1397's em-dash sweep, #1406's setting removal). The
# third job below is a static cross-reference that answers the string half of
# that class in seconds, on the PR, before anything can be ejected. It is a
# signal, not the gate: the shards above still decide the merge.
#
# ONE LIVE EXTERNAL DEPENDENCY, STATED SO NOBODY DISCOVERS IT MID-INCIDENT. The
# site leg's /marketplace pages fetch the dork-labs/marketplace registry from
# raw.githubusercontent.com SERVER-side on every run, and the marketplace specs
# need that registry reachable and NON-EMPTY to find a card. A bad push to that
# OTHER repository — or the registry going empty — reds this check on every
# queue entry, and since this check is required, blocks this repo's merges on a
# file it does not contain. That coupling is accepted: the specs' whole point is
# that the live pages work, GitHub runners reaching GitHub is the one network
# assumption CI already makes everywhere, and the failure is legible (the
# marketplace spec's header says exactly what an empty-registry red looks like
# and where to go). If it ever fires in anger, the decision to revisit is
# "pin a fixture registry for CI", not "delete the specs".
on:
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a
# group and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. Deliberately IDENTICAL in form to test.yml (keep them in
# step).
concurrency:
  group: browser-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-shard:
    name: browser-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    # Queue builds only — on pull_request the whole matrix is skipped and the
    # fan-in below answers instantly. See the header for why the PR still gets
    # a `browser-test` context at all.
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    # THREE SHARDS, AND HERE IS THE ARITHMETIC THAT PICKED THREE (DOR-1363).
    #
    # Measured on four consecutive main runs on 2026-08-19 (32251346554,
    # 32259784745, 32272418644, 32281755292):
    #
    #   * the `playwright test` step took 40m33s / 41m45s / 42m43s / 43m11s
    #   * the steps before it — checkout, pnpm, the browser cache, the turbo
    #     build — cost 1m35s to 1m46s
    #   * the whole job took 41 to 45 minutes
    #
    # Of that ~41-minute suite step, about 2m24s is fixed cost that every shard
    # re-pays: the webServer legs boot SEQUENTIALLY (Playwright runs one
    # plugin-setup task per leg, in order), then `global-setup.ts` runs. Measured
    # on run 32239903731, whose suite step started at 10:39:15 and whose
    # globalSetup blew a 180s `waitForSelector` at 10:44:39 — so the legs were up
    # by 10:41:39. That leaves ~38m of actual test execution, and only that part
    # divides.
    #
    #   shards   wall per shard (≈ 1m45s setup + 2m30s boot + 38m/N)
    #     1      42m   ← today
    #     2      23m   (-45%)
    #     3      17m   (-60%)
    #     4      14m   (-67%)
    #     6      11m   (-75%)
    #
    # Three is where the curve knees. Going 2→3 buys another six minutes; 3→4
    # buys three, 4→5 buys two, and every added runner re-pays the whole 4m15s of
    # fixed cost, boots five more webServer legs, and takes one more turn at the
    # two external dependencies that have actually broken this job — the apt
    # mirror that hung for an hour on 2026-08-19 (see the install step) and the
    # live marketplace registry the site leg fetches. At three, overhead is ~25%
    # of a shard's wall time; at six it is ~40% and the runner bill has doubled
    # for a six-minute gain.
    #
    # `--shard` divides by TEST COUNT, not by duration, and the split is even:
    # `playwright test --list --shard=i/3` reports 110 / 109 / 109 of 328
    # collected. What that does not prove is that the three take equally LONG —
    # shards 1 and 2 are pure `chromium` (the cockpit leg) while shard 3 carries
    # all six test-mode projects, and only a real CI run can weigh them. The
    # timeouts below are sized with that unknown in mind.
    strategy:
      # NEVER cancel the siblings. `fail-fast: true` (the default) cancels every
      # other shard the moment one fails, and a cancelled job uploads nothing —
      # which is precisely the output-less failure DOR-1110 exists to prevent,
      # just moved from the timeout to the matrix. One shard going red must still
      # leave the other two free to report their own results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # THE OUTERMOST RUNG OF A LADDER, AND IT MUST NEVER BE THE ONE THAT FIRES
    # (DOR-1110). A job that hits `timeout-minutes` is CANCELLED, not failed: the
    # suite step is killed mid-write and every later step is skipped, so no
    # report, trace, screenshot or video survives. A run that ends that way
    # proves nothing and reads as an infra hang — which is exactly what happened
    # when one product change broke 21 specs at once and the attempt was
    # cancelled with ZERO Playwright output, costing a whole extra debug cycle.
    #
    # So the deadlines are staggered, innermost first, and each rung below this
    # one leaves output behind when it fires. The numbers are per SHARD, derived
    # from the measurements above:
    #
    #   ~16m  a healthy shard (DERIVED: ~2m30s of webServer boot + a third of the
    #         ~38m of test execution). Not yet measured on CI at three shards —
    #         the first green run on main is what turns this into a measurement,
    #         and if it lands far off, this comment is what gets corrected.
    #    30m  playwright.config.ts `globalTimeout` — Playwright stops itself and
    #         flushes every reporter, so the job fails WITH a named report. It is
    #         derived from the shard count rather than typed in; see that file.
    #    35m  the suite step's own `timeout-minutes` — a hung Playwright that
    #         never reached its own deadline still fails the STEP, which leaves
    #         the upload steps below free to run
    #    45m  this — the backstop, reachable only if both rungs above failed
    #
    # The old unsharded ladder had drifted dangerously: it claimed "~30m healthy"
    # from a measurement taken on 2026-08-12 and set `globalTimeout` to 45m, but
    # by 2026-08-19 a healthy suite took 40m33s to 43m11s. That is under two
    # minutes of headroom on a bad day — the innermost rung was one slow runner
    # away from firing on a perfectly healthy suite. Sharding restores the
    # margin, and deriving `globalTimeout` from the shard count is what stops it
    # silently going stale again the next time this matrix changes size.
    timeout-minutes: 45
    env:
      # Belt and braces on where the server keeps data. Both Express legs now
      # name their OWN throwaway DORK_HOME in playwright.config.ts — port-keyed,
      # under /tmp, wiped before every boot (DOR-1223) — so nothing here resolves
      # a default at all. This stays because `resolveDorkHome()`
      # (apps/server/src/lib/dork-home.ts) falls back to the runner's real
      # `~/.dork` when NODE_ENV === 'production', and declaring development means
      # a future leg that forgets its DORK_HOME lands in the checkout rather than
      # in a home directory. The cockpit boundary needs no wiring here —
      # playwright.config.ts scopes DORKOS_BOUNDARY to the checkout itself,
      # wherever it lives.
      NODE_ENV: development
      # Boot the marketing-site leg and run the two specs that target it
      # (marketplace.spec.ts, features.spec.ts). The config already defaults
      # this on under CI; setting it explicitly means the suite's coverage does
      # not depend on a conditional that a future edit could invert. It also
      # keeps the invariant the assert step checks simple: every spec file runs
      # except the two named, self-policing exemptions the assert script pins
      # (the opt-in auth spec, and the @integration spec — which needs real
      # model credentials this runner does not have and spends real money, so
      # it stays out of CI; E2E_INTEGRATION is never set here).
      E2E_SITE: '1'
      # Boot the production leg and run the specs that target it (DOR-1723).
      # It is the ONLY place in this suite a browser sees the shipped
      # Content-Security-Policy: every other leg loads the app from Vite, whose
      # shell carries no header at all, so a directive that breaks a real surface
      # was invisible here until this leg existed (DOR-560 shipped exactly that
      # and no gate noticed). The config already defaults it on under CI; set
      # explicitly for the same reason E2E_SITE is — the coverage must not ride a
      # conditional a future edit could invert, and the assert step's invariant
      # stays "every spec file runs except the two named exemptions".
      #
      # It costs a client build, paid once per shard in the build step below.
      # The specs themselves are a smoke subset by design, not the suite; the
      # spec's own header says which surfaces earn a place there and why.
      E2E_PROD: '1'
      # How many ways the suite is being cut, so playwright.config.ts can size
      # its own `globalTimeout` to one shard instead of to the whole suite.
      # `strategy.job-total` is the matrix length, so the list above is the ONE
      # place the shard count is written: change `shard:` and the `--shard=i/N`
      # flag, this variable and the derived deadline all move with it.
      E2E_SHARD_TOTAL: ${{ strategy.job-total }}
      # RETRIES: the suite runs with ONE retry in CI (playwright.config.ts,
      # `retries: CI ? 1 : 0`) — a decision, not a default, so here is the
      # reasoning. Zero would be the principled choice, but the suite carries
      # one TRACKED,
      # test-side readiness flake — DOR-698, mention-picker's combobox, ~6% in
      # isolation and rarer in full runs — and a gate that goes red on a known
      # ticket trains people to route around it (test.yml's header has the
      # receipts on that). One retry, not two: a single retry absorbs exactly
      # the tracked flake class, while the old `retries: 2` was wide enough to
      # hide a real product race behind two coincidences — the outcome the
      # review that cleared this suite for CI named as the dangerous one (that
      # race, DOR-697, is since fixed). The budget is visible, not silent:
      # every test that passes only on a retry is NAMED in the job log by the
      # gate job's flaky warning. A test that keeps appearing there gets
      # fixed, or the budget goes to zero.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--with-deps` installs the OS libraries headless Chromium needs, which
      # ubuntu-latest does not ship in full. Without it the browser is present
      # but fails to launch, and a launch failure is an error rather than a skip
      # — but only if the binary was fetched at all, so this step failing is
      # meant to fail the job.
      # The browser download is the one pre-suite step that talks to a CDN and
      # to apt, and on 2026-08-19 it hung for 25 and then 60 minutes on
      # GitHub-hosted runners (DOR-1363), eating the suite's whole budget and
      # ending the job as an output-less cancel: the DOR-1110 failure mode from
      # a different step. Two guards, both cheap: the browser binaries are
      # cached between runs keyed on the Playwright version (so a healthy run
      # downloads nothing), and the install itself gets a short deadline so a
      # slow CDN fails THIS step, visibly, in minutes rather than an hour.
      # `--with-deps` still runs on a cache hit because the OS packages are
      # not part of the cache; it is apt, and fast when the mirrors are up.
      # VERIFIED WARM on 2026-08-19 (run 32281755292): the restore step logged
      # `Cache hit for: playwright-chromium-Linux-1.59.1`, restored ~253 MB, and
      # the post step logged `Cache hit occurred on the primary key ... not
      # saving cache.` The install step below took 12-14s on all four main runs
      # that day, which is `install-deps` alone — nothing was downloaded.
      - name: Resolve the Playwright version the cache is keyed on
        id: pw
        run: echo "version=$(pnpm --filter @dorkos/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restore the Chromium browser Playwright drives
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The part that actually hung on 2026-08-19 was apt inside `--with-deps`:
      # the runner image's first mirror (azure.archive.ubuntu.com) stopped
      # answering and apt's default per-connection timeout is 120 s, retried
      # per file, so a dead mirror is an hour of silence. Shorter acquire
      # timeouts make apt fall through the image's mirror list in seconds; the
      # retry covers a mirror that flaps rather than dies.
      - name: Install the Chromium browser Playwright drives
        timeout-minutes: 10
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-acquire-timeouts >/dev/null
          # The image's mirror list puts azure.archive.ubuntu.com first. On
          # 2026-08-19 it was dead for hours and then TRICKLED: it answered the
          # InRelease probe in time and then stalled mid-package (fonts-wqy-zenhei,
          # 7 MB, never finished), which neither an acquire timeout nor a
          # liveness probe catches. The upstream archive.ubuntu.com answered
          # every time. So for CI the Azure mirror is simply dropped from the
          # list and apt goes straight upstream (DOR-1363). Revisit if upstream
          # ever becomes the slow one.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2; do
            if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
              pnpm --filter @dorkos/e2e exec playwright install-deps chromium && exit 0
            else
              pnpm --filter @dorkos/e2e exec playwright install --with-deps chromium && exit 0
            fi
            echo "playwright install attempt $attempt failed; retrying once" >&2
            sleep 15
          done
          exit 1

      # Warm the turbo cache with everything the webServer legs need, OUTSIDE
      # their readiness timeouts. The three Express legs each run
      # `turbo run build --filter=@dorkos/server` before booting, the Vite legs'
      # `turbo dev` pulls `^build`, and the site leg imports @dorkos/icons and
      # @dorkos/marketplace dists — all inside webServer timeouts sized for a
      # warm tree. Building here turns the in-leg builds into cache replays, so
      # a slow cold build fails THIS step with a build error instead of failing
      # six legs later as an opaque readiness timeout.
      #
      # `@dorkos/client` itself, not just its dependencies (DOR-1723): the
      # production leg SERVES that package's `dist/`, so unlike the two Vite
      # legs it cannot boot without a built client. Everything else here stayed
      # `^...` because a dev server needs its dependencies and nothing more.
      - name: Build what the webServer legs boot from
        run: pnpm exec turbo run build --filter=@dorkos/server --filter=@dorkos/client --filter=@dorkos/site^...

      # No `--reporter` flag, deliberately: passing one REPLACES the config's
      # reporter list rather than adding to it, and the json reporter is what the
      # gate job reads. A run invoked with `--reporter=list` writes no
      # results.json and the proof step has nothing to check.
      #
      # `--shard` IS passed, and `pnpm run` forwards it without a `--` separator
      # — with one, pnpm 10.28.2 refuses the command outright ("You may need to
      # escape symbols like ...", exit 1). Verified locally on the pinned pnpm.
      #
      # apps/e2e/reporters/manifest-reporter.ts rewrites apps/e2e/manifest.json
      # after every run that executes at least one test (`--list` and empty
      # runs no longer touch it), but that file is GITIGNORED (DOR-726) — every
      # run rewrites its lastRun/run-count fields, so no legitimate action
      # could ever leave it clean tracked. This step and its sharding leave it
      # dirty on disk, which costs nothing on an ephemeral runner: nothing
      # later in this workflow reads the file, and it is never uploaded.
      #
      # apps/e2e/manifest-curated.json — the hand-curated relatedCode/
      # explorationNotes half — IS tracked, but the reporter only ever READS
      # it (see `applyCurated`); no run, sharded or not, writes to it. A "the
      # tree is clean" assertion on this job is safe with respect to both
      # files today, for different reasons.
      #
      # `description` refresh is a separate, narrower thing (DOR-1555): the
      # `pnpm --filter @dorkos/e2e run e2e` script this step calls sets
      # `E2E_REFRESH_MANIFEST=1` for every invocation, including this sharded
      # one — but the reporter ANDs that opt-in with `config.shard === null`,
      # and `--shard` below is never absent here, so no shard ever refreshes a
      # description. This job has no non-sharded full pass to set the opt-in
      # on instead (`pull_request` skips the matrix entirely, `merge_group`
      # always runs all three), so the shard check is what actually keeps
      # descriptions out of CI's reach, not the absence of the env var.
      #
      # `timeout-minutes` here is the middle rung of the ladder described on the
      # job's own timeout (DOR-1110). It sits ABOVE playwright.config.ts's
      # `globalTimeout` (30m per shard) so Playwright normally stops itself first
      # and flushes its reporters, and BELOW the job's ceiling (45m) so that a
      # Playwright which somehow hangs without honouring its own deadline fails
      # this STEP rather than cancelling the JOB — the difference being that a
      # failed step still lets the uploads below run, and a cancelled job does
      # not.
      - name: Run the browser suite
        timeout-minutes: 35
        run: pnpm --filter @dorkos/e2e run e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The machine-readable half of this shard's result, handed to the gate job
      # below — which is the only place the "did the suite really run" assertion
      # can be made, because no single shard sees the whole suite.
      #
      # Only on success, matching what the unsharded job did: the assert step ran
      # with the default `if: success()`, because a red suite is already a red
      # job and "did anything actually run" only matters when the answer looks
      # like yes. A shard that failed therefore uploads no report, the gate
      # refuses on the shard result before it ever looks for one, and the HTML
      # report below is what carries the failure detail.
      #
      # `if-no-files-found: error` because a silent absence here would reach the
      # gate as a smaller union of specs — i.e. as a mysterious "these files
      # exist on disk but no test from them appears in the run".
      #
      # `overwrite: true` because artifact names are unique per RUN, not per
      # attempt: v4 answers 409 Conflict when the name already exists, so "Re-run
      # all jobs" after a flake would fail three green shards at their upload
      # step. A re-run is meant to replace the attempt it repeats.
      - name: Upload this shard's JSON report
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-shard-${{ matrix.shard }}
          path: apps/e2e/test-results/results.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # The report is the only way to read a browser failure after the fact: it
      # carries the trace, the screenshot and the video the config captures on
      # failure. Uploaded on anything-but-green, because a green run's report is
      # 100MB of things nobody opens. Named per shard because artifact names must
      # be unique within a run.
      #
      # `cancelled()` is in the condition on purpose (DOR-1110). A step whose
      # `if:` names no status function is implicitly `success() && ...`, and
      # plain `failure()` is false during a cancellation — so a job killed by
      # its own ceiling, or a run a human cancels, skipped this step and threw
      # away whatever partial evidence Playwright had already written. That is
      # the "cancelled with zero output" failure this ticket is about. Naming
      # `cancelled()` opts the step into GitHub's best-effort window so the
      # report is uploaded even then.
      #
      # `overwrite: true` for the same reason as the JSON upload above: a re-run
      # of a failed attempt must replace that attempt's report, not 409 on it.
      - name: Upload the Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/e2e/playwright-report/
          overwrite: true
          retention-days: 7

  # THE CHECK. Everything above is an implementation detail of this job's answer.
  #
  # Two things it does, and it must do both:
  #
  #   1. Fail unless every shard passed. `if: always()` is not optional here. A
  #      job with `needs:` and no condition is SKIPPED when a dependency fails,
  #      and a skipped job reports a `skipped` conclusion that branch protection
  #      and the merge queue treat as satisfied — so the naive fan-in turns a red
  #      suite into a green required check. Running always, and refusing on
  #      `needs.browser-shard.result`, is what makes the name mean what it says.
  #      (`result` on a matrix dependency is the aggregate: `success` only when
  #      every leg succeeded.) The accepted cost: a run somebody cancels by hand
  #      now posts a RED `browser-test` rather than a cancelled one, because
  #      `cancelled` is not `success`. That is the side to err on — the obvious
  #      softening, `if: ${{ !cancelled() }}`, would skip this job on a cancel,
  #      and a skipped check reads as satisfied the day this becomes required.
  #   2. Prove the suite actually executed — see the step's own comment. That
  #      question can only be answered here, because assertion 2 of the script is
  #      "every spec file on disk appears in the report" and no single shard
  #      contains them all. The script takes the three shard reports and asserts
  #      against their union.
  #
  # It needs neither Node nor the browser: a checkout for the script, `jq` (on
  # every ubuntu-latest image) and the three uploaded reports. That is why it
  # costs seconds rather than re-paying the setup a fourth time.
  browser-test:
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Nothing here waits on anything slow. Ten minutes is a backstop against a
    # hung artifact download, not a budget anything is expected to approach.
    timeout-minutes: 10
    steps:
      # The pull_request pass-through. On a PR event the shard matrix was
      # skipped by design, so this succeeds loudly and every later step (all
      # gated on merge_group) is skipped. The real verdict on this code is
      # rendered by the merge-group run before anything merges.
      - name: Defer to the merge queue on pull_request events
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "browser suite deferred — it runs (and gates) in the merge queue's combined-tree build."

      # `merge_group &&` on this and everything below, because on pull_request
      # the shard matrix is skipped and `skipped != success` would otherwise
      # turn every PR red here.
      - name: Refuse a run whose shards did not all pass
        if: ${{ github.event_name == 'merge_group' && needs.browser-shard.result != 'success' }}
        run: |
          echo "::error::the browser suite did not pass — the browser-shard matrix reported '${{ needs.browser-shard.result }}'. Open the shard jobs above for the failing specs, and the playwright-report-shard-* artifacts for their traces, screenshots and videos."
          exit 1

      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'merge_group' }}

      - name: Collect every shard's JSON report
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/download-artifact@v8
        with:
          pattern: browser-results-shard-*
          path: shard-reports

      # THE POINT OF THIS STEP. Playwright exits 0 in more ways than it fails.
      # A `testIgnore` glob widened by accident drops a whole spec file from the
      # run while it still prints "N passed" and exits 0 (verified against
      # 1.59.1 on a two-spec tree). A spec whose tests all skip is green. A spec
      # moved out of testDir is simply never collected. None of that is visible
      # in the exit code, so this reads the JSON reports and asserts against the
      # FILESYSTEM that every spec file in apps/e2e actually executed something.
      # See scripts/assert-browser-tests-executed.sh for the full argument and
      # scripts/test-assert-browser-tests-executed.sh for its fixtures.
      #
      # Handing it every shard's report rather than one is what keeps the
      # assertion at full strength under sharding: the script unions them, and
      # its first check is that the reports it was given are a COMPLETE set of
      # shards (each report carries its own `--shard=i/N` in `.config.shard`, so
      # a missing, duplicated or stale artifact is refused by name rather than
      # surfacing as a spec that mysteriously did not run).
      #
      # The `[ -f ]` guard is not decoration. A workflow definition is evaluated
      # from a different ref than the tree it checks out, so on a branch that
      # predates the script this step would otherwise die with a bare `exit 127`
      # that names neither the file nor the fix — a required check has already
      # failed exactly that way on an unrelated PR (2026-07-29). The guard turns
      # that into a message naming the cause.
      - name: Prove the browser suite actually executed
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          if [ ! -f scripts/assert-browser-tests-executed.sh ]; then
            echo "::error::scripts/assert-browser-tests-executed.sh is not in this checkout — this tree predates the script the workflow calls. Update the branch from main (or merge main in) to pick it up."
            exit 1
          fi
          shopt -s nullglob
          reports=(shard-reports/*/results.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::every shard reported success but not one of them uploaded a results.json. Nothing proves the suite ran, so this fails rather than certifying it."
            exit 1
          fi
          bash scripts/assert-browser-tests-executed.sh "${reports[@]}"

  # THE PR-TIME SIGNAL (DOR-1647). See the header: the suite above defers to the
  # queue on a PR, and the one regression class that costs is a copy rewrite
  # that strands a literal assertion. This job cross-references the two
  # statically — the runs of authored copy the change deleted, against every
  # string under apps/e2e — and reds in about two minutes instead of forty.
  #
  # A SEPARATE JOB, NOT A STEP IN `browser-test`. That job's name is the context
  # string the merge-queue ruleset requires (see its own comment), and stapling
  # a second, differently-shaped assertion onto it would mean a copy-drift
  # finding blocks the queue the day the ruleset is edited, which is not this
  # signal's job. Its own name keeps the two verdicts separately readable.
  #
  # IT IS DELIBERATELY NOT A REQUIRED CHECK, and making it one is a
  # branch-protection change only the operator can make. It reports on
  # `merge_group` anyway — a required check that never reports blocks the queue
  # until `check_response_timeout_minutes` expires (ADR 260728-112203), so a
  # check that might be promoted later has to report from the start. Nothing
  # here needs editing when that day comes.
  #
  # A red is still not free: `scripts/should-arm-automerge.sh` refuses to arm
  # auto-merge while ANY check is failing, so a false positive costs a human
  # look. That is why the script's thresholds are calibrated on replayed history
  # rather than picked — its module doc has the numbers, and the pin suite
  # `scripts/__tests__/check-copy-spec-drift.test.ts` holds them still.
  copy-spec-drift:
    runs-on: ubuntu-latest
    # Nothing here runs a browser or a build. Two minutes is the install; ten is
    # a backstop, not a budget.
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` because the gate diffs against the base commit, and the
      # default shallow fetch of a merge ref does not contain it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The base differs by event and neither payload carries the other's field,
      # so it is resolved here rather than guessed by the script: a pull request
      # is measured against its own base, a queue build against the commit the
      # group was cut from (i.e. every PR in the group at once).
      #
      # The `[ -f ]` guard is the same one the proof step above carries, for the
      # same reason: a workflow is evaluated from a different ref than the tree
      # it checks out, so on a branch that predates this script the run would
      # otherwise die with a bare `exit 127` naming neither the file nor the fix.
      - name: Cross-reference changed copy against the browser suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ ! -f scripts/check-copy-spec-drift.ts ]; then
            echo "::error::scripts/check-copy-spec-drift.ts is not in this checkout — this tree predates the script the workflow calls. Update the branch from main (or merge main in) to pick it up."
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error::neither pull_request.base.sha nor merge_group.base_sha was set on a '${{ github.event_name }}' event, so there is no base to diff against. Refusing rather than certifying an unchecked tree."
            exit 1
          fi
          pnpm exec tsx scripts/check-copy-spec-drift.ts "$BASE_SHA"
