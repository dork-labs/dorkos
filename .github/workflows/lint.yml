name: lint

# Runs ESLint across every package in the monorepo, and checks Prettier
# formatting, on every PR and in the merge queue (DOR-627).
#
# Before this workflow existed, the only ESLint anywhere in CI was
# `pnpm exec eslint scripts/` in scripts-test.yml — the root `scripts/`
# directory, no app and no package. AGENTS.md opens its Hard Rules section with
# "Non-negotiable, enforced by ESLint/CI/convention", and for the four rules
# ESLint actually implements, the "CI" half was false:
#
#   1. FSD layer violations       no-restricted-imports, apps/client/eslint.config.js
#   2. SDK imports confined       no-restricted-imports, apps/server/eslint.config.js
#   3. os.homedir() banned        no-restricted-imports + no-restricted-properties
#   4. TSDoc on exports           jsdoc/*, packages/eslint-config/base.js
#
# All four are `error`, so all four fail `eslint` — but nothing downstream ever
# ran `eslint`. Enforcement was the lefthook pre-commit hook plus a developer
# choosing to run `pnpm verify`, and both are bypassable: `--no-verify` is a
# documented, routinely-used escape in this repo. This is the same argument
# typecheck.yml makes in its own header; that workflow exists because the
# argument was accepted once, and it is not weaker for lint.
#
# Rule 4 was weaker still and needed a code change, not just a job. Every jsdoc
# rule was registered at `warn`, and every package's lint script is a bare
# `eslint .`, which exits 0 on warnings — so the TSDoc rule failed nothing
# anywhere, this workflow included, and "enforced by eslint-plugin-jsdoc" was a
# statement about a plugin being installed. DOR-627 promoted the jsdoc rules to
# `error` in packages/eslint-config/base.js and cleared the 20 violations that
# surfaced. See that file's header for why only the jsdoc rules moved and why
# there is no `--max-warnings 0` here.
#
# FULL MONOREPO, not affected-only (the mode `pnpm verify` uses via
# `turbo run typecheck lint --affected`). Same reasoning typecheck.yml gives
# for the same choice, and lint has the same exposure: two PRs can each be
# affected-only clean against the base they branched from and still combine
# into a red `main`. That is not hypothetical for lint — a PR that tightens a
# `no-restricted-imports` block and a PR that adds an import the new block
# forbids are, individually, both green. Only a full run against the tree they
# combine into can see it, which is what a merge-queue build is.
#
# ALSO RUNS THE FORMATTING GATE (DOR-485, moved here in the DOR-627
# follow-up, 2026-09-02). AGENTS.md Hard Rule 5 says "Prettier + Tailwind
# class sorting are automatic — never hand-sort," which reads as a guarantee.
# It was not one until DOR-485: formatting was enforced only by the lefthook
# pre-commit hook, so `git commit --no-verify`, a hook failure, a fresh clone
# that never ran `pnpm install`, or an agent that bypasses the hook landed
# unformatted code silently. PR #463 merged a test file that was
# prettier-unformatted, seven lines over 100 columns, and #515 merged a stray
# double blank line; nothing objected to either.
#
# DOR-485 put the step in typecheck.yml because `lint` did not exist yet, and
# a gate on a non-required check is not a gate — `typecheck` was already
# required. That reasoning flipped the day `lint` itself joined the ruleset's
# required contexts (2026-09-02): the step now belongs with the rest of the
# style gate it is philosophically part of, rather than riding a workflow it
# has nothing else to do with.
#
# NO build step: the shared config is syntax-only (`tseslint.configs.recommended`,
# no type-aware rules), so ESLint never reads a dependency's dist and nothing
# here needs `^build`. `turbo.json` declares `lint` with `dependsOn: ["^lint"]`
# for the same reason. If a type-aware rule is ever added, that changes and this
# comment is wrong — turbo will need `^build` on the task before this job is.
#
# WHY NOT ASSERT THE TASKS ACTUALLY EXECUTED, the way the merge-group `test` run
# does via scripts/assert-tests-executed.sh: that guard exists because turbo can
# replay a full cache hit in ~280ms while printing "successful" for every
# package. It can only do that from a cache that outlives the run, and this repo
# configures no turbo remote cache — no TURBO_TOKEN, no TURBO_TEAM, no
# remoteCache block in turbo.json. Every runner starts with an empty
# `.turbo/cache`, so all 21 tasks execute here every time. Wiring up remote
# caching later would make this comment false and this job silently skippable;
# add the assertion in the same change.
#
# THE push-to-main LEG IS DROPPED (DOR-627 follow-up, 2026-09-02), matching
# `test`: `lint` joined the ruleset's required contexts, so the merge queue
# now guarantees every commit that reaches `main` already ran this job
# against the exact combined tree (squash rewrites the SHA, not the content).
# The leg was kept until now for the opposite reason AGENTS.md's CI section
# gives for retiring it on `test` — `lint` was not yet required, so the queue
# could not make that guarantee, and a ~40s re-run on main was cheap insurance
# against the gap. That gap is closed.
on:
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a
# group and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. (Copied deliberately from test.yml, now that push-to-main is
# dropped here too — same reasoning, same fix.)
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # A full cold lint (`turbo lint --force`, 21 packages, no cache) measured
    # ~40s on an idle developer machine, and `prettier --check .` over ~7,300
    # files measured 2m17s there (the same numbers typecheck.yml carried before
    # the DOR-627 follow-up moved the formatting step here). The ceiling is
    # deliberately far above that combined total: the same lint command took
    # over four minutes on the same machine while several agents were running,
    # so the number to budget against is a loaded runner, not a quiet one.
    # This is a stop for a hung run, not a perf budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm format:check` (`prettier --check .`), never `npx prettier`: npx
      # resolves a different binary than pnpm does in this workspace, and only
      # `pnpm exec` matches what the lefthook pre-commit hook runs. A backstop
      # that resolves differently from the hook it backs up can pass where the
      # hook would reformat, which is the same class of gap as having no gate.
      # Runs first so the cheap-to-fix failure is the first thing in the log:
      # `pnpm format` fixes every one of them.
      - name: Formatting gate — prettier --check (DOR-485)
        run: pnpm format:check

      # `--continue` so one package's errors don't hide another's: a run that
      # stops at the first red package makes fixing lint an N-round loop.
      #
      # Warnings do not fail this. `eslint` exits 0 on warnings and no
      # `--max-warnings` is passed, so the ~210 outstanding `max-lines`,
      # `no-restricted-syntax` and `no-unused-vars` warnings stay visible in the
      # log without blocking. The per-rule severity in
      # packages/eslint-config/base.js is the gate — anything meant to fail CI
      # belongs at `error` there, not behind a flag added here.
      #
      # `if: !cancelled()` so a formatting failure above still reports every
      # lint error in the same run, for the same reason `--continue` does.
      - name: Lint every package
        if: ${{ !cancelled() }}
        run: pnpm exec turbo lint --continue
