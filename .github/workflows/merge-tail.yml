name: merge-tail

# Arm auto-merge on pull requests that are finished.
#
# Why this exists: nothing in this repo ever armed auto-merge. ADR-0276's
# auto-merge recovery ladder is real but lives in the flow plugin behind
# autonomous Pulse mode (`enabled: false` in v1); outside that loop
# `flow__flow-drain` stops agents at the review gate, and the `gh pr merge --auto`
# line in the creating-pull-requests skill is prose nothing executes. The result
# was finished, green, reviewed PRs sitting open until a human armed each one by
# hand. This is that hand.
#
# What it deliberately does NOT do: update branches. `main` merges through a
# merge queue (ADR 260728-112203), which tests each PR on top of `main` itself,
# so being behind `main` blocks nothing and a branch update only re-runs jobs.
#
# The arming decision lives in scripts/should-arm-automerge.sh, fixture-pinned by
# scripts/test-should-arm-automerge.sh, because the failure mode of this workflow
# is silent: a refusal that stops matching keeps returning ARM and the first
# symptom is unreviewed code on main.
#
# WHOSE KEY IT HOLDS: the `dorkos-merge-tail` GitHub App (client id in the
# `MERGE_TAIL_APP_CLIENT_ID` secret, key in the `MERGE_TAIL_APP_PRIVATE_KEY`
# secret). It can write code and pull requests and read checks, and it has NO
# Administration permission, so this workflow cannot edit the ruleset or bypass
# the merge queue (contributing/ci.md: "no admin credential in Actions"). It
# replaced `MERGE_TAIL_TOKEN`, an admin's `repo`-scoped PAT that could do both.
# An app token is not GITHUB_TOKEN, so the merge groups it creates receive their
# check runs (see the step comment below for why that matters).

on:
  schedule:
    # Every 10 minutes. The window only has to be short relative to how long a
    # finished PR should wait, not to how fast main moves.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the verdict for every open PR without arming anything'
        type: boolean
        default: false

# Never let two ticks arm the same PR concurrently.
concurrency:
  group: merge-tail
  cancel-in-progress: false

# `contents: read` for the workflow's own GITHUB_TOKEN, deliberately. Arming
# under a merge queue needs `contents: write`, and a merge group created by
# GITHUB_TOKEN receives no checks and blocks the queue for every pull request
# behind it. Every GitHub call in this job uses the app token below instead,
# so GITHUB_TOKEN needs only enough to check the repo out.
permissions:
  contents: read

jobs:
  arm:
    runs-on: ubuntu-latest
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 299 completed
    # runs over 2026-08-22..09-19, p95 0.67 min, max 1.45. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Never GITHUB_TOKEN for this job. GitHub suppresses workflow runs for
      # events its own token triggered, and enqueueing is such an event: a merge
      # group created by GITHUB_TOKEN gets ZERO check runs (verified on PR #581,
      # whose queue branch had 0 workflow runs while #583's, enqueued by a
      # person, had 4). The entry then sits at AWAITING_CHECKS until
      # `check_response_timeout_minutes` expires and BLOCKS THE QUEUE for every
      # PR behind it. With no app key this step fails, and the job stops loudly
      # instead of jamming the queue.
      - name: Mint the merge-tail app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The client id is a secret, not a variable, on purpose: repo secrets
          # are proven to reach Dependabot's pull_request_target runs; vars.* there is not.
          client-id: ${{ secrets.MERGE_TAIL_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_TAIL_APP_PRIVATE_KEY }}

      - name: Arm auto-merge on finished PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          # Every payload is composed from FILES with `jq -s`, never from shell
          # interpolation. A multi-line gh error captured into a shell variable
          # and passed to --argjson is a parse failure that reads as an
          # unreadable payload, which is indistinguishable from a real refusal.
          work=$(mktemp -d)
          armed=0; skipped=0; failed=0; perm_denied=0

          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number --jq '.[].number' > "$work/prs.txt" || {
              echo "::error::could not list pull requests"; exit 1; }

          echo "Open PRs: $(wc -l < "$work/prs.txt" | tr -d ' ')"
          echo

          while read -r pr; do
            [[ -n "$pr" ]] || continue

            if ! gh pr view "$pr" --repo "$REPO" \
                 --json number,state,isDraft,mergeStateStatus,autoMergeRequest,reviewDecision,labels \
                 > "$work/meta.json" 2>"$work/err.txt"; then
              echo "PR #$pr -> SKIP could-not-read-pr ($(tr '\n' ' ' < "$work/err.txt" | cut -c1-120))"
              skipped=$(( skipped + 1 )); continue
            fi

            # `gh pr checks` exits non-zero when any check is failing or pending,
            # which is information we want, not an error. Keep the output and let
            # the gate judge it; only an unparseable body is a real failure.
            gh pr checks "$pr" --repo "$REPO" --json name,bucket > "$work/checks.json" 2>/dev/null
            jq -e . "$work/checks.json" >/dev/null 2>&1 || echo '[]' > "$work/checks.json"

            # `mergeQueueEntry` rides along here rather than in `gh pr view`
            # because it is GraphQL-only. It is not optional: a pull request in
            # the merge queue reports `autoMergeRequest: null`, so without it
            # the gate's already-armed branch misses every queued pull request
            # and this workflow re-arms them all on every tick.
            gh api graphql -F number="$pr" -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
              query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    mergeQueueEntry{ position state }
                    reviewThreads(last:100){ nodes{ isResolved } } } } }' \
              > "$work/gql.json" 2>/dev/null
            threads=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]?
                           | select(.isResolved == false)] | length' \
                      "$work/gql.json" 2>/dev/null)
            queued=$(jq -c '.data.repository.pullRequest.mergeQueueEntry // null' \
                     "$work/gql.json" 2>/dev/null)
            # An unreadable queue entry must not read as "not queued".
            [[ -n "$queued" ]] || { echo "PR #$pr -> SKIP could-not-read-queue-entry"; skipped=$(( skipped + 1 )); continue; }
            # An unreadable thread count must not read as zero. Zero means
            # "checked, none open"; unknown means "do not arm".
            if ! [[ "$threads" =~ ^[0-9]+$ ]]; then
              echo "PR #$pr -> SKIP could-not-read-review-threads"
              skipped=$(( skipped + 1 )); continue
            fi

            jq -s --argjson t "$threads" --argjson q "$queued" \
              '.[0] + {checks: .[1], unresolvedThreads: $t, mergeQueueEntry: $q}' \
              "$work/meta.json" "$work/checks.json" > "$work/payload.json"

            verdict=$(./scripts/should-arm-automerge.sh "$work/payload.json")

            if [[ "$verdict" != "ARM" ]]; then
              echo "PR #$pr -> $verdict"
              skipped=$(( skipped + 1 )); continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "PR #$pr -> ARM (dry run, not armed)"
              armed=$(( armed + 1 )); continue
            fi

            # `--squash` is ignored when a merge queue is configured (the queue
            # owns the strategy) and gh says so on stderr. Kept anyway so this
            # still does the right thing if the queue is ever removed; the
            # warning is only read when the call fails.
            if out=$(gh pr merge --auto --squash "$pr" --repo "$REPO" 2>&1); then
              echo "PR #$pr -> ARMED"
              armed=$(( armed + 1 ))
            else
              one_line=$(tr '\n' ' ' <<<"$out" | cut -c1-200)
              # Two very different failures wore the same label before, and the
              # difference is the whole diagnostic value. Losing a race (the PR
              # merged or closed between the read and the write) is expected and
              # self-correcting. A permissions refusal means this workflow cannot
              # do its job AT ALL and every run is a no-op, which is exactly how
              # it sat broken from the moment the merge queue went live: correct
              # verdicts, zero actions, nothing red. Make that one shout.
              # `not accessible` rather than the full
              # "Resource not accessible by integration": the long form is a
              # substring of the short one's match, so listing both adds no
              # coverage and only invites the two to drift apart.
              if [[ "$one_line" == *"not accessible"* \
                 || "$one_line" == *"HTTP 403"* ]]; then
                echo "::error::merge-tail cannot arm pull requests: $one_line"
                echo "::error::This is a token-permission failure, not a race. The workflow is inert until it is fixed."
                perm_denied=$(( perm_denied + 1 ))
              else
                echo "PR #$pr -> ARM FAILED: $one_line"
              fi
              failed=$(( failed + 1 ))
            fi
          done < "$work/prs.txt"

          echo
          echo "armed=$armed skipped=$skipped failed=$failed perm_denied=$perm_denied"

          # The summary is written BEFORE the failure exit, not after. The
          # permission-denied bullet below only ever prints when perm_denied > 0,
          # which is the exact condition that exits — so writing it after the
          # exit made it unreachable, and the one case the message exists for was
          # the one case it could never render.
          #
          # `if`, NOT `[[ ... ]] && echo`. GitHub runs this block with `bash -e`
          # (`shell: /usr/bin/bash -e {0}`), and a trailing `&&` chain whose test
          # is false returns 1 — as the last command in the group that failed the
          # whole step. Every non-dry-run tick reported failure for that reason
          # alone, while doing its job correctly. `set -e` is not in this
          # script's own `set` line; it arrives from the shell GitHub picks.
          {
            echo "### merge-tail"
            echo
            echo "- armed: $armed"
            echo "- skipped: $skipped"
            echo "- arm failed: $failed"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- (dry run: nothing was actually armed)"
            fi
            if [[ "$perm_denied" -gt 0 ]]; then
              echo "- **permission denied on $perm_denied arm(s) — this workflow is inert**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A workflow that evaluates everything correctly and then arms nothing
          # because it is not allowed to looks identical to a quiet day. Fail
          # loudly instead of reporting a green no-op.
          if [[ "$perm_denied" -gt 0 ]]; then
            echo "::error::merge-tail is inert: $perm_denied arm attempt(s) refused for lack of permission."
            exit 1
          fi
