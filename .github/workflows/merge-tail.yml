name: merge-tail

# Two duties, one tick over the open pull requests: arm auto-merge on the ones
# that are finished, and re-request the automated Claude review on the ones that
# lost theirs to an infrastructure failure. They share this loop because they
# need the same two reads per PR.
#
# Arm auto-merge on pull requests that are finished.
#
# Why this exists: nothing in this repo ever armed auto-merge. ADR-0276's
# auto-merge recovery ladder is real but lives in the flow plugin behind
# autonomous Pulse mode (`enabled: false` in v1); outside that loop
# `flow__flow-drain` stops agents at the review gate, and the `gh pr merge --auto`
# line in the creating-pull-requests skill is prose nothing executes. The result
# was finished, green, reviewed PRs sitting open until a human armed each one by
# hand. This is that hand.
#
# What it deliberately does NOT do: update branches. `main` merges through a
# merge queue (ADR 260728-112203), which tests each PR on top of `main` itself,
# so being behind `main` blocks nothing and a branch update only re-runs jobs.
#
# The arming decision lives in scripts/should-arm-automerge.sh, fixture-pinned by
# scripts/test-should-arm-automerge.sh, because the failure mode of this workflow
# is silent: a refusal that stops matching keeps returning ARM and the first
# symptom is unreviewed code on main.
#
# It also stops re-arming a PR the queue keeps rejecting: once the same check
# has failed twice in the queue on the same head commit, the PR is not armed
# again until a new commit lands, and the author is told once, in a PR comment.
# The PR's own checks cannot see this (the browser suite runs only in the
# queue), and #1964 was re-armed unchanged five times before anyone fixed it.
#
# WHOSE KEY IT HOLDS: the `dorkos-merge-tail` GitHub App (client id in the
# `MERGE_TAIL_APP_CLIENT_ID` secret, key in the `MERGE_TAIL_APP_PRIVATE_KEY`
# secret). It can write code and pull requests and read checks, and it has NO
# Administration permission, so this workflow cannot edit the ruleset or bypass
# the merge queue (contributing/ci.md: "no admin credential in Actions"). It
# replaced `MERGE_TAIL_TOKEN`, an admin's `repo`-scoped PAT that could do both.
# An app token is not GITHUB_TOKEN, so the merge groups it creates receive their
# check runs (see the step comment below for why that matters).

on:
  schedule:
    # Asks for every 10 minutes, but GitHub throttles scheduled workflows:
    # measured over 200 runs (2026-08-25 to 09-19), the median gap was 162
    # minutes (p90 305, max 748). This is a backstop; agents arm their own PRs,
    # and ledger entry 260919-204500 proposes an event-driven trigger.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the verdict for every open PR without arming anything'
        type: boolean
        default: false

# Never let two ticks arm the same PR concurrently.
concurrency:
  group: merge-tail
  cancel-in-progress: false

# `contents: read` for the workflow's own GITHUB_TOKEN, deliberately. Arming
# under a merge queue needs `contents: write`, and a merge group created by
# GITHUB_TOKEN receives no checks and blocks the queue for every pull request
# behind it. Every GitHub call in this job uses the app token below instead,
# so GITHUB_TOKEN needs only enough to check the repo out.
permissions:
  contents: read

jobs:
  arm:
    runs-on: ubuntu-latest
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 299 completed
    # runs over 2026-08-22..09-19, p95 0.67 min, max 1.45. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Never GITHUB_TOKEN for this job. GitHub suppresses workflow runs for
      # events its own token triggered, and enqueueing is such an event: a merge
      # group created by GITHUB_TOKEN gets ZERO check runs (verified on PR #581,
      # whose queue branch had 0 workflow runs while #583's, enqueued by a
      # person, had 4). The entry then sits at AWAITING_CHECKS until
      # `check_response_timeout_minutes` expires and BLOCKS THE QUEUE for every
      # PR behind it. With no app key this step fails, and the job stops loudly
      # instead of jamming the queue.
      - name: Mint the merge-tail app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The client id is a secret, not a variable, on purpose: repo secrets
          # are proven to reach Dependabot's pull_request_target runs; vars.* there is not.
          client-id: ${{ secrets.MERGE_TAIL_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_TAIL_APP_PRIVATE_KEY }}
          # NO `permission-*` INPUTS HERE, deliberately, and the reason is the
          # opposite of what it looks like. Those inputs are a SCOPE-DOWN, not an
          # addition: the action's own README says the token "inherits all of the
          # installation's permissions" by default, and naming even one permission
          # replaces that inheritance with exactly the named set. So adding
          # `permission-actions: read` to make the review-retry ladder work would
          # have silently stripped the `contents: write` and `pull-requests: write`
          # this job needs to ARM anything — trading an inert ladder for an inert
          # workflow. The Actions: read grant is an installation-level change the
          # operator makes on the app; the probe below is what makes its absence
          # loud instead of silent.
          #
          # WHAT THE END STATE SHOULD BE, so the next reader does not "fix" this
          # by deleting the paragraph above. Once the app actually holds Actions:
          # read, the right thing IS to enumerate — least privilege, and the
          # action's own README recommends it — as all four at once:
          #   permission-actions: read
          #   permission-checks: read
          #   permission-contents: write
          #   permission-pull-requests: write
          # Enumerating them BEFORE the grant lands does not degrade gracefully:
          # requesting a permission the installation does not have fails the
          # mint, and this job stops arming entirely. So the order is grant
          # first, enumerate second.
          #
          # `issues: write` is NOT in that list, and the question was asked
          # rather than assumed. `gh pr edit --add-label` / `--remove-label`
          # reach the issue-labels endpoints
          # (`POST`/`DELETE /repos/{owner}/{repo}/issues/{n}/labels`), which
          # sounds like the Issues permission — but GitHub's "Permissions
          # required for GitHub Apps" reference lists those endpoints under BOTH
          # the Issues and the Pull requests permission, each at write, and an
          # endpoint listed under several permissions is reachable with any ONE
          # of them. This job only ever labels PULL REQUESTS, never a plain
          # issue, so `pull-requests: write` covers it. The reference marks that
          # row as possibly needing additional permissions, so the thing that
          # actually settles it is the first successful label write after the
          # enumeration lands: if it 403s, add `permission-issues: write` and
          # nothing else.

      # THE LADDER'S ONE PREREQUISITE, checked once per tick instead of being
      # discovered per PR. Listing a workflow's runs needs Actions: read, which
      # is not among the app's original grants (contents and pull requests write,
      # checks read). Without it every review retry would report
      # `could-not-read-review-runs` and the ladder would be a silent no-op —
      # the exact shape in which this workflow once sat broken for weeks with
      # correct verdicts, zero actions and nothing red.
      #
      # It does NOT fail the job. Arming is this workflow's primary duty and
      # works without Actions: read, so a missing grant must cost the retries
      # and nothing else.
      - name: Check the token can read workflow runs
        id: actions-read
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/actions/workflows/claude-code-review.yml/runs?per_page=1" \
               --jq '.total_count' >/dev/null 2>&1; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            echo "the merge-tail app can read workflow runs; the review-retry ladder is live"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::error::The merge-tail app cannot list claude-code-review runs. No lost review will be re-requested this tick, and a re-review label stranded on a conflicting pull request will not be cleared either, because both go through this call. Grant the dorkos-merge-tail GitHub App the Actions: read permission. Arming still works."
          fi

      - name: Arm auto-merge on finished PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Consumed, not decorative: the probe above already said, once and
          # loudly, that the ladder cannot run. Without this the same fact would
          # be repeated per pull request as `could-not-read-review-runs` and
          # counted into the warning at the end, burying the one message that
          # names the fix under N copies of its symptom.
          CAN_READ_RUNS: ${{ steps.actions-read.outputs.ok }}
        run: |
          set -uo pipefail

          # Every payload is composed from FILES with `jq -s`, never from shell
          # interpolation. A multi-line gh error captured into a shell variable
          # and passed to --argjson is a parse failure that reads as an
          # unreadable payload, which is indistinguishable from a real refusal.
          work=$(mktemp -d)
          armed=0; skipped=0; failed=0; perm_denied=0
          rereviewed=0; cleared=0; review_failed=0; review_unreadable=0
          repeat_declined=0; repeat_commented=0; comment_failed=0; history_unknown=0

          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number --jq '.[].number' > "$work/prs.txt" || {
              echo "::error::could not list pull requests"; exit 1; }

          echo "Open PRs: $(wc -l < "$work/prs.txt" | tr -d ' ')"
          echo

          while read -r pr; do
            [[ -n "$pr" ]] || continue

            # `headRefOid` is for the review-retry block below, not for arming:
            # it keys the retry ladder to the code that was actually reviewed.
            # The changed-file list is deliberately NOT taken from here —
            # `gh pr view --json files` caps at 100 entries with no indication
            # that it truncated, so a large PR editing the review workflow would
            # slip past the refusal that exists for it. The retry block fetches
            # a complete, paginated list instead, and only for the handful of
            # PRs that reach it.
            if ! gh pr view "$pr" --repo "$REPO" \
                 --json number,state,isDraft,mergeStateStatus,autoMergeRequest,reviewDecision,labels,headRefOid \
                 > "$work/meta.json" 2>"$work/err.txt"; then
              echo "PR #$pr -> SKIP could-not-read-pr ($(tr '\n' ' ' < "$work/err.txt" | cut -c1-120))"
              skipped=$(( skipped + 1 )); continue
            fi

            # `gh pr checks` exits non-zero when any check is failing or pending,
            # which is information we want, not an error. Keep the output and let
            # the gate judge it; only an unparseable body is a real failure.
            gh pr checks "$pr" --repo "$REPO" --json name,bucket > "$work/checks.json" 2>/dev/null
            jq -e . "$work/checks.json" >/dev/null 2>&1 || echo '[]' > "$work/checks.json"

            # ── re-request a lost automated review ──────────────────────────
            #
            # A second job for this loop, deliberately sharing its two reads
            # rather than getting a workflow of its own: it needs exactly the PR
            # metadata and check list already on disk here, and a separate
            # workflow would double every API call to answer the same question.
            #
            # WHY AT ALL: `review-completes` sits at 88.5% against a 90% floor
            # because a failed review is never retried by anything. Nobody
            # notices, so about one PR in nine merges having been looked at by
            # nothing. See scripts/should-redispatch-review.sh for the decision
            # and the measurements; the mechanism is the `re-review` label,
            # which is the same button a person presses and needs only the
            # `pull-requests: write` this app already holds.
            #
            # It runs BEFORE the arming block on purpose, and independently of
            # it: a PR with a red review will never arm, so putting this after
            # the arm verdict's `continue` would make it dead code for exactly
            # the PRs it exists for.
            #
            # Nothing here may fail the tick. Arming is this workflow's primary
            # duty and a broken review-retry must not stop it, so every failure
            # in this block is a counted skip.
            # `|| x=` on every capture, and on the gate call below. GitHub runs
            # this block with `bash -e`, under which an assignment from a
            # failing command substitution exits the STEP — and the gate exits 2
            # on an unreadable payload by design. Without these, a single
            # malformed payload would stop the tick and take the arming half
            # down with it.
            review_bucket=$(jq -r 'first(.[]? | select(.name == "review") | .bucket) // ""' \
                            "$work/checks.json" 2>/dev/null) || review_bucket=
            head_sha=$(jq -r '.headRefOid // ""' "$work/meta.json" 2>/dev/null) || head_sha=

            # Two ways in. The ordinary one is a red review check. The other is
            # a PR that is CONFLICTING and still carries `re-review`: GitHub
            # builds no run at all while a PR conflicts, so that label can never
            # be cleared from inside a run and the human button stays pressed
            # down forever. Such a PR may have no review check whatsoever — it
            # was opened conflicted and nothing ever ran — so the red-check
            # condition alone would never look at it.
            stranded=$(jq -r 'if ((.mergeStateStatus // "") | ascii_upcase) == "DIRTY"
                                 and ([(.labels // [])[] | (if type == "object" then (.name // "") else tostring end) | ascii_downcase] | index("re-review")) != null
                              then "yes" else "no" end' \
                       "$work/meta.json" 2>/dev/null) || stranded=no
            if [[ "$CAN_READ_RUNS" != "yes" ]]; then
              : # the probe already said why, once; do not repeat it per PR
            elif [[ ( "$review_bucket" == "fail" || "$stranded" == "yes" ) && -n "$head_sha" ]]; then
              # Every review run for THIS head, which is what the ladder counts.
              # `actions: read` on the app token is what makes this call work; if
              # it is missing, the call fails and the block below says so loudly
              # rather than reporting a quiet "nothing to retry" forever. That
              # silent shape is how this workflow sat inert once already.
              # No `--paginate`: it would emit one array per page, and a stream
              # of arrays is not the single JSON document the payload build
              # below splices in. One page of 50 is far more than the ladder's
              # ceiling of 4 could ever need.
              if gh api \
                   "repos/$REPO/actions/workflows/claude-code-review.yml/runs?head_sha=$head_sha&per_page=50" \
                   --jq '[.workflow_runs[]? | {id, status, conclusion, run_attempt, updated_at}]' \
                   > "$work/runs.json" 2>/dev/null \
                 && jq -e 'type == "array"' "$work/runs.json" >/dev/null 2>&1; then

                # The COMPLETE changed-file list, paginated. `gh pr view --json
                # files` stops at 100 and says nothing about it, which would let
                # a large PR editing the review workflow past the one refusal
                # that is guaranteed correct. `--jq` emitting one name per line
                # rather than an array is deliberate: `--paginate` concatenates
                # whatever the filter produces per page, so an array filter
                # would yield a stream of arrays instead of one document. Git
                # cannot store a newline in a path, so splitting on newlines is
                # exact.
                files_ok=no
                if gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" \
                     --jq '.[].filename' 2>/dev/null \
                   | jq -R -s 'split("\n") | map(select(length > 0))' \
                   > "$work/files.json" \
                   && jq -e 'type == "array"' "$work/files.json" >/dev/null 2>&1; then
                  files_ok=yes
                fi

                # NOT `continue`: this block is a passenger on the arming
                # loop, and skipping the rest of the iteration would refuse to
                # ARM a PR because its review retry could not be evaluated. An
                # unreadable file list must not read as "edits nothing" either,
                # so the whole retry is abandoned for this PR and counted.
                if [[ "$files_ok" != yes ]]; then
                  echo "PR #$pr -> review-retry SKIP could-not-read-files"
                  review_unreadable=$(( review_unreadable + 1 ))
                else

                  # The newest ATTEMPT's outcome class, from its own
                  # `review-outcome-class` notice annotation. For an Actions job
                  # the check-run id IS the job id, so this is two calls, and only
                  # for a PR that already has a red review. Anything unreadable
                  # stays empty, which the gate treats as "decide without me".
                  #
                  # ATTEMPT, NOT RUN, and the filter has to be the same one the
                  # gate applies or the two halves of the decision disagree about
                  # what a run is: a `skipped` label run or a `cancelled` dedupe
                  # landing AFTER the failure would otherwise be the newest row,
                  # and its job carries no class, so the answer would silently be
                  # empty exactly when the class mattered most.
                  review_class=
                  newest_run=$(jq -r '
                      [ .[]
                        | select(.id != null)
                        | select(((.conclusion // "") | ascii_downcase)
                                 | (. == "skipped" or . == "cancelled") | not) ]
                      | max_by(.updated_at // "") | .id // ""' \
                               "$work/runs.json" 2>/dev/null) || newest_run=
                  if [[ -n "$newest_run" ]]; then
                    job_id=$(gh api "repos/$REPO/actions/runs/$newest_run/jobs" \
                             --jq '.jobs[0].id // ""' 2>/dev/null) || job_id=
                    if [[ -n "$job_id" ]]; then
                      # The LAST matching notice, not the first. The trusted
                      # emitter is the final step of that job, so anything else
                      # bearing this title got there earlier — and since this
                      # value can now stop a retry, letting an earlier
                      # annotation win would be handing that lever to whatever
                      # wrote it. `annotation_level` is checked for the same
                      # reason. Hardening, not a demonstrated hole: nothing is
                      # known to echo PR-authored text into an annotation.
                      review_class=$(gh api "repos/$REPO/check-runs/$job_id/annotations" \
                        --jq 'last(.[] | select(.title == "review-outcome-class")
                                       | select(.annotation_level == "notice")
                                       | .message) // ""' \
                        2>/dev/null) || review_class=
                    fi
                  fi

                  jq -s --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg class "$review_class" \
                    '.[0] + {checks: .[1], reviewRuns: .[2], files: .[3],
                             reviewClass: $class, now: $now}' \
                    "$work/meta.json" "$work/checks.json" "$work/runs.json" "$work/files.json" \
                    > "$work/review-payload.json"
                  rverdict=$(./scripts/should-redispatch-review.sh "$work/review-payload.json") \
                    || rverdict="SKIP unreadable-payload"
                  if [[ "$rverdict" == "RETRY" && "$DRY_RUN" == "true" ]]; then
                    echo "PR #$pr -> review-retry RETRY (dry run, no label applied)"
                    rereviewed=$(( rereviewed + 1 ))
                  elif [[ "$rverdict" == "RETRY" ]]; then
                    if gh pr edit "$pr" --repo "$REPO" --add-label re-review >/dev/null 2>&1; then
                      echo "PR #$pr -> review-retry REQUESTED"
                      rereviewed=$(( rereviewed + 1 ))
                    else
                      echo "PR #$pr -> review-retry could-not-label"
                      review_failed=$(( review_failed + 1 ))
                    fi
                  # A conflicting PR produces no workflow run at all, so a
                  # `re-review` label on one is never cleared by the review
                  # workflow and the human button stays pressed down for good.
                  # Removing it is the only way anyone gets to press it again.
                  elif [[ "$rverdict" == CLEAR* && "$DRY_RUN" == "true" ]]; then
                    echo "PR #$pr -> review-retry $rverdict (dry run, label left in place)"
                    cleared=$(( cleared + 1 ))
                  elif [[ "$rverdict" == CLEAR* ]]; then
                    # Re-read the labels immediately before writing. The review
                    # workflow clears `re-review` itself from inside a run, and
                    # the PR metadata this decision was made from is seconds to
                    # minutes old, so the label can legitimately be gone
                    # already. `gh pr edit --remove-label` errors on a label the
                    # PR does not carry, and counting that as `review_failed`
                    # would report a benign race in the same bucket as a
                    # permissions refusal — which is the bucket that tells the
                    # operator something is broken.
                    # Into a file, never through `grep -q`: grep exits at its
                    # first match and closes the pipe, `pipefail` then makes the
                    # SIGPIPE the status of the whole pipeline, and the read
                    # would report "no label" for a PR that has one.
                    gh pr view "$pr" --repo "$REPO" --json labels \
                      --jq '.labels[].name' > "$work/labels.txt" 2>/dev/null \
                      || : > "$work/labels.txt"
                    if ! grep -qx 're-review' "$work/labels.txt"; then
                      echo "PR #$pr -> review-retry $rverdict, label already gone"
                    elif gh pr edit "$pr" --repo "$REPO" --remove-label re-review >/dev/null 2>&1; then
                      echo "PR #$pr -> review-retry $rverdict, label removed"
                      cleared=$(( cleared + 1 ))
                    else
                      echo "PR #$pr -> review-retry could-not-clear-label"
                      review_failed=$(( review_failed + 1 ))
                    fi
                  else
                    echo "PR #$pr -> review-retry $rverdict"
                  fi
                fi
              else
                echo "PR #$pr -> review-retry SKIP could-not-read-review-runs"
                review_unreadable=$(( review_unreadable + 1 ))
              fi
            fi

            # `mergeQueueEntry` rides along here rather than in `gh pr view`
            # because it is GraphQL-only. It is not optional: a pull request in
            # the merge queue reports `autoMergeRequest: null`, so without it
            # the gate's already-armed branch misses every queued pull request
            # and this workflow re-arms them all on every tick.
            #
            # The same call reads the queue's memory for the repeat-ejection
            # rule (scripts/should-arm-automerge.sh explains it): the head
            # commit's check suites, whose earliest is when the head was pushed,
            # and the last 10 queue removals with the check runs that failed on
            # each removal's merge-group commit. Riding this query costs no extra
            # call per PR. Ten removals is plenty: the rule counts only the ones
            # since the current head was pushed, and it fires at two.
            gh api graphql -F number="$pr" -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
              query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    mergeQueueEntry{ position state }
                    reviewThreads(last:100){ nodes{ isResolved } }
                    commits(last:1){ nodes{ commit{ oid
                      checkSuites(first:50){ nodes{ createdAt } } } } }
                    timelineItems(last:10, itemTypes:[REMOVED_FROM_MERGE_QUEUE_EVENT]){ nodes{
                      ... on RemovedFromMergeQueueEvent{ createdAt reason
                        beforeCommit{ checkSuites(first:20){ nodes{
                          checkRuns(first:50, filterBy:{conclusions:[FAILURE,TIMED_OUT,STARTUP_FAILURE]}){
                            nodes{ name } } } } } } } } } } }' \
              > "$work/gql.json" 2>/dev/null
            threads=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]?
                           | select(.isResolved == false)] | length' \
                      "$work/gql.json" 2>/dev/null)
            queued=$(jq -c '.data.repository.pullRequest.mergeQueueEntry // null' \
                     "$work/gql.json" 2>/dev/null)
            # An unreadable queue entry must not read as "not queued".
            [[ -n "$queued" ]] || { echo "PR #$pr -> SKIP could-not-read-queue-entry"; skipped=$(( skipped + 1 )); continue; }
            # An unreadable thread count must not read as zero. Zero means
            # "checked, none open"; unknown means "do not arm".
            if ! [[ "$threads" =~ ^[0-9]+$ ]]; then
              echo "PR #$pr -> SKIP could-not-read-review-threads"
              skipped=$(( skipped + 1 )); continue
            fi

            # The queue's memory, flattened into the two fields the gate reads.
            # Anything unreadable becomes null, which the gate treats as
            # unknown history and skips: a partial GraphQL answer must not read
            # as "never ejected". `headSince` is null when the commit list and
            # `headRefOid` disagree (a push landed between the two reads).
            jq -s '
                .[0] as $meta | .[1].data.repository.pullRequest as $p
                | ($p.commits.nodes[0].commit // null) as $head
                | $meta + {
                    headSince: (if $head != null and $head.oid == $meta.headRefOid
                                then ([$head.checkSuites.nodes[]?.createdAt] | min)
                                else null end),
                    queueRemovals: (if ($p.timelineItems.nodes | type) == "array"
                                    then [$p.timelineItems.nodes[]
                                          | {at: .createdAt, reason,
                                             failedChecks: ([.beforeCommit.checkSuites.nodes[]?
                                                             .checkRuns.nodes[]?.name] | unique)}]
                                    else null end) }' \
              "$work/meta.json" "$work/gql.json" > "$work/meta-queue.json" 2>/dev/null \
              || jq '. + {queueRemovals: null}' "$work/meta.json" > "$work/meta-queue.json"

            jq -s --argjson t "$threads" --argjson q "$queued" \
              '.[0] + {checks: .[1], unresolvedThreads: $t, mergeQueueEntry: $q}' \
              "$work/meta-queue.json" "$work/checks.json" > "$work/payload.json"

            verdict=$(./scripts/should-arm-automerge.sh "$work/payload.json")

            if [[ "$verdict" == "SKIP queue-history-unknown" ]]; then
              history_unknown=$(( history_unknown + 1 ))
            fi

            # A repeat is the one refusal a fully green PR can earn, so it has
            # to be SAID where the author looks, or the PR just sits there
            # looking finished. Once per head, not once per tick: the comment
            # carries a marker naming the head SHA, and an existing comment with
            # that marker means the author has already been told. A new commit
            # is a new head, and if the queue rejects that one twice too, that
            # is news worth a new comment. If the existing comments cannot be
            # read, say nothing rather than risk a comment on every tick.
            if [[ "$verdict" == "SKIP repeat-queue-failure" ]]; then
              repeat_declined=$(( repeat_declined + 1 ))
              marker="<!-- merge-tail:repeat-queue-failure head=$head_sha -->"
              if [[ "$DRY_RUN" == "true" || -z "$head_sha" ]]; then
                : # a dry run changes nothing; no head, no marker to de-duplicate on
              elif ! gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" \
                     --jq '.[].body' > "$work/comments.txt" 2>/dev/null; then
                echo "PR #$pr -> could not read comments; not telling the author this tick"
                comment_failed=$(( comment_failed + 1 ))
              elif grep -qF -- "$marker" "$work/comments.txt"; then
                : # already told about this head
              else
                ./scripts/should-arm-automerge.sh --repeat-failure "$work/payload.json" \
                  > "$work/repeats.txt" 2>/dev/null || : > "$work/repeats.txt"
                {
                  echo "**merge-tail will not re-arm this pull request.** The merge queue has rejected this exact commit (\`${head_sha:0:7}\`) at least twice, and the same check failed each time:"
                  echo
                  sed 's/.*/- `&`/' "$work/repeats.txt"
                  echo
                  echo "A check that fails twice on unchanged code is most likely a real regression, not a flaky test. This pull request's own checks can all be green while this happens, because the browser tests run only in the merge queue."
                  echo
                  echo "**What to do:** open the failing job in the merge-group run (\`gh run list --event merge_group -L 100 --json headBranch,name,conclusion,databaseId\`, rows whose \`headBranch\` contains \`pr-$pr-\`), fix the cause and push. merge-tail arms the new commit once it is green."
                  echo
                  echo "If the same check is also red on \`main\` or on other pull requests, the fault is not in this branch: once \`main\` is fixed, re-arm this one yourself with \`gh pr merge --auto $pr\`."
                  echo
                  echo "$marker"
                } > "$work/comment.md"
                if gh pr comment "$pr" --repo "$REPO" --body-file "$work/comment.md" >/dev/null 2>&1; then
                  echo "PR #$pr -> told the author about the repeated queue failure"
                  repeat_commented=$(( repeat_commented + 1 ))
                else
                  echo "PR #$pr -> could not post the repeated-queue-failure comment"
                  comment_failed=$(( comment_failed + 1 ))
                fi
              fi
            fi

            if [[ "$verdict" != "ARM" ]]; then
              echo "PR #$pr -> $verdict"
              skipped=$(( skipped + 1 )); continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "PR #$pr -> ARM (dry run, not armed)"
              armed=$(( armed + 1 )); continue
            fi

            # `--squash` is ignored when a merge queue is configured (the queue
            # owns the strategy) and gh says so on stderr. Kept anyway so this
            # still does the right thing if the queue is ever removed; the
            # warning is only read when the call fails.
            if out=$(gh pr merge --auto --squash "$pr" --repo "$REPO" 2>&1); then
              echo "PR #$pr -> ARMED"
              armed=$(( armed + 1 ))
            else
              one_line=$(tr '\n' ' ' <<<"$out" | cut -c1-200)
              # Two very different failures wore the same label before, and the
              # difference is the whole diagnostic value. Losing a race (the PR
              # merged or closed between the read and the write) is expected and
              # self-correcting. A permissions refusal means this workflow cannot
              # do its job AT ALL and every run is a no-op, which is exactly how
              # it sat broken from the moment the merge queue went live: correct
              # verdicts, zero actions, nothing red. Make that one shout.
              # `not accessible` rather than the full
              # "Resource not accessible by integration": the long form is a
              # substring of the short one's match, so listing both adds no
              # coverage and only invites the two to drift apart.
              if [[ "$one_line" == *"not accessible"* \
                 || "$one_line" == *"HTTP 403"* ]]; then
                echo "::error::merge-tail cannot arm pull requests: $one_line"
                echo "::error::This is a token-permission failure, not a race. The workflow is inert until it is fixed."
                perm_denied=$(( perm_denied + 1 ))
              else
                echo "PR #$pr -> ARM FAILED: $one_line"
              fi
              failed=$(( failed + 1 ))
            fi
          done < "$work/prs.txt"

          echo
          echo "armed=$armed skipped=$skipped failed=$failed perm_denied=$perm_denied"
          echo "reviews re-requested=$rereviewed stranded-labels-cleared=$cleared label-failed=$review_failed unreadable=$review_unreadable"
          echo "repeat-queue-failures declined=$repeat_declined authors-told=$repeat_commented comment-failed=$comment_failed queue-history-unknown=$history_unknown"

          # The summary is written BEFORE the failure exit, not after. The
          # permission-denied bullet below only ever prints when perm_denied > 0,
          # which is the exact condition that exits — so writing it after the
          # exit made it unreachable, and the one case the message exists for was
          # the one case it could never render.
          #
          # `if`, NOT `[[ ... ]] && echo`. GitHub runs this block with `bash -e`
          # (`shell: /usr/bin/bash -e {0}`), and a trailing `&&` chain whose test
          # is false returns 1 — as the last command in the group that failed the
          # whole step. Every non-dry-run tick reported failure for that reason
          # alone, while doing its job correctly. `set -e` is not in this
          # script's own `set` line; it arrives from the shell GitHub picks.
          {
            echo "### merge-tail"
            echo
            echo "- armed: $armed"
            echo "- skipped: $skipped"
            echo "- arm failed: $failed"
            echo "- reviews re-requested: $rereviewed"
            if [[ "$repeat_declined" -gt 0 ]]; then
              echo "- not re-armed after a repeated queue failure: $repeat_declined (authors told this tick: $repeat_commented)"
            fi
            if [[ "$comment_failed" -gt 0 ]]; then
              echo "- repeated-queue-failure comment could not be read or posted: $comment_failed"
            fi
            if [[ "$history_unknown" -gt 0 ]]; then
              echo "- **could not read the queue history of $history_unknown PR(s); they were not armed**"
            fi
            if [[ "$cleared" -gt 0 ]]; then
              echo "- stranded re-review labels cleared: $cleared"
            fi
            # Two different shapes of not-retrying, and only one of them is a
            # bug. `could-not-read-review-runs` on every candidate means the app
            # token is missing `actions: read`, which makes the whole retry
            # ladder a silent no-op — the same failure shape as the
            # permission-denied arm below, and the reason that one is shouted
            # about rather than counted quietly.
            if [[ "$review_failed" -gt 0 ]]; then
              echo "- review re-request failed: $review_failed"
            fi
            if [[ "$review_unreadable" -gt 0 ]]; then
              echo "- **could not read review runs on $review_unreadable PR(s) — the retry ladder is inert; the app token likely lacks \`actions: read\`**"
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- (dry run: nothing was actually armed)"
            fi
            if [[ "$perm_denied" -gt 0 ]]; then
              echo "- **permission denied on $perm_denied arm(s) — this workflow is inert**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A workflow that evaluates everything correctly and then arms nothing
          # because it is not allowed to looks identical to a quiet day. Fail
          # loudly instead of reporting a green no-op.
          # A retry ladder that can never read a review run is inert in exactly
          # the way the arming path was once inert: correct verdicts, zero
          # actions, nothing red. It is a WARNING rather than a failure because
          # arming is this workflow's primary duty and still worked — but it must
          # not be discoverable only by reading a log nobody opens.
          if [[ "$review_unreadable" -gt 0 ]]; then
            echo "::warning::merge-tail could not read claude-code-review runs on $review_unreadable pull request(s), so no lost review was re-requested. The merge-tail app probably needs the Actions: read permission."
          fi
          # The same inert shape for arming: if the queue-history read breaks
          # (a GraphQL schema change, a missing Checks: read), every PR that was
          # ever ejected skips as unknown and nothing says why.
          if [[ "$history_unknown" -gt 0 ]]; then
            echo "::warning::merge-tail could not read the merge-queue history of $history_unknown pull request(s), so it did not arm them. Check the GraphQL query in the arming step."
          fi

          if [[ "$perm_denied" -gt 0 ]]; then
            echo "::error::merge-tail is inert: $perm_denied arm attempt(s) refused for lack of permission."
            exit 1
          fi
