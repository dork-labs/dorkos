name: security-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  statuses: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Security's list (#dorkos, 2026-10-22 04:56). The workflow and its
  # implementation are themselves covered by .github/. Match both sides of renames.
  SECURITY_PATH_PATTERN: '^(apps/server/src/services/core/(auth|turn-power|capabilities|session-relay)/|apps/server/src/(http|routes)/|apps/server/src/services/(connectors|relay|extensions|mesh|browser|session/local-browser)/|apps/server/src/db/migrations/|drizzle/|packages/shared/src/schemas\.ts$|packages/cli/src/lib/agent-browser/|\.github/|scripts/(release|publish))|turn-ceiling|continuation-hold|agent-level'

jobs:
  security-gate:
    # Enforcement requires the ruleset workflow source pinned to main. A named
    # status check alone lets a candidate replace this YAML. See ci/security-gate-promotion.md.
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    env:
      SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an immutable base SHA
        run: '[[ "$SECURITY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_BASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Security gate fixtures
        run: node --test .github/scripts/security-gate.test.mjs
      - name: Check approval on each exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/security-gate.mjs
