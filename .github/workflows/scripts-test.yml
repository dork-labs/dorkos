name: scripts-test

# Runs the shell-script fixture suites under scripts/.
#
# These have no package to belong to, so `pnpm verify`'s affected-only turbo run
# ignores them: a change touching only `scripts/` resolves to 0 affected packages.
# `pnpm verify` does call `pnpm test:scripts` first, but that is a local habit, not
# a guarantee — nothing in the pre-push gate or in any other workflow runs it. The
# suite covers two scripts behind the automated PR reviewer, and both have already
# failed quietly once: classify-review-failure.sh decides what the reviewer TELLS
# you when it fails (DOR-457 was that message being confidently wrong twice), and
# review-gh.sh is the reviewer's only GitHub access (DOR-464), where a wrong path
# or a loosened argument check is a silent hole rather than a red check.
#
# claude-code-review.yml is in the path filter because the suite asserts against
# it: the allow-list entry, the materialized helper path and the reviewer prompt
# all name one absolute path, and drift between them denies every tool call while
# leaving the check green. That workflow cannot test itself on a PR (the action
# refuses to run when the file differs from the default branch), so this job is
# where such a change gets checked at all.
#
# The git-guard suite runs in `fixtures` for the same reason in a sharper form:
# .claude/hooks/git-guard.mjs is a safety control, and the only thing separating
# "refuses git stash" from "refuses nothing" is a matcher that no other test
# touches. It also pins the ALLOW half, because a guard that blocks
# `git checkout main` or `git stash list` gets switched off, and then it protects
# nothing at all. That suite is why `fixtures` sets up Node: it costs a couple of
# seconds, unlike the `pnpm install` this job still deliberately avoids, and it
# beats inheriting whatever Node the runner image happens to ship. It pins the
# same Node 22 as `harness`, which is the version the repo runs.
#
# lefthook.yml is in the path filter because `scripts/__tests__/turbo-affected-
# base-pinned.test.ts` asserts against it: every local `turbo --affected` call
# site must pin TURBO_SCM_BASE, and two of the four live in that file. Dropping
# a pin is invisible — the hook still runs, still exits 0, still prints an
# affected set, it just silently stops scoping (DOR-833, DOR-1717). Without this
# entry the one PR shape that regression takes, an edit to lefthook.yml alone,
# would never trigger the job that would catch it.
#
# turbo.json is in the scope for the same reason (DOR-3274 Phase 2):
# `scripts/__tests__/heavy-turbo-slot.test.ts` asserts that every build,
# typecheck, test and lint task in it depends on `@dorkos/heavy-slot#slot`, the host-wide
# heavy-run cap for a bare `turbo` run. A package override that drops it runs
# uncapped with nothing red, and an edit to turbo.json alone is that PR's shape.
#
# `.claude/scripts/__tests__/*.test.ts` (spec-manifest-ops.ts, id.ts, and the
# changelog-fragment merge-behavior experiments, DOR-751/DOR-818) rides
# `fixtures` for the same "no node_modules needed" reason: every file there
# imports only `node:*` built-ins and sibling `.claude/scripts/*.ts` files.
# Before this step, nothing executed that directory at all — not
# `pnpm verify` (no package.json owns it, so turbo's affected-only resolution
# always sees 0 affected packages), not `test:scripts` (it never named the
# files). A regression test could sit there green forever and prove nothing.
#
# TWO JOBS, on purpose. `fixtures` needs only bash, jq, iconv and Node, so
# skipping the pnpm toolchain keeps it a few seconds, which is worth preserving
# for the reviewer scripts it guards. `harness` covers the TypeScript under
# scripts/ (the Q3 contention harness, DOR-500) plus the two bash suites that
# need a node_modules — the os.homedir() ban fixtures, which lint through the
# real server ESLint config, and the format-changed hook fixtures, which run the
# real prettier — all of which want pnpm.
# Splitting
# them keeps the fast signal fast instead of putting a minute of install in front
# of it.
#
# Neither job calls `pnpm test:scripts` even though that script runs every
# suite: locally it is one command (and `pnpm verify` calls it), but in CI
# running it from either job would re-run the other job's suites for nothing.
# Each job calls the same runner for its own lane instead:
# `bash scripts/run-scripts-suites.sh --suites fixtures|harness`.
#
# NO SUITE IS LISTED ANYWHERE. The runner finds every `scripts/test-*.sh` and
# `.agents/skills/*/scripts/test-*.sh` by glob, so CI and `pnpm verify` cannot
# drift apart the way they did when each kept its own list (this workflow ran
# eleven suites while `test:scripts` ran ten, so `pnpm verify` came back green
# having never executed `test-process-guard.sh`, DOR-1515), and two PRs adding a
# suite no longer conflict over the same lines (ledger fixture-suites-by-glob).
# Adding a suite is adding the file. One that needs a node_modules puts
# `# scripts-suite-lane: harness` near its top. Do not add a step per suite:
# `scripts/__tests__/shell-suite-parity.test.ts` fails on one, and pins the
# globs against the tree. It rides the `harness` job's `Unit tests` step.

### The `harness` job depends on files OUTSIDE scripts/: the root package.json
### (defines typecheck:scripts and holds @types/node) and the root vitest.config.ts,
### which registers the scripts project for path-based bare-vitest runs from the
### repo root and is now imported directly by
### scripts/__tests__/vitest-projects.test.ts. That vitest.config.ts entry used to
### be conservative; since DOR-670 it is load-bearing, because that test reads the
### real project list and asserts it still covers every workspace package with
### tests. Without these in the filter, a PR touching only them could break this
### job without triggering it, and the breakage would surface later on an
### unrelated scripts/ PR.
###
### Every workspace package.json is in the filter for the OTHER half of that same
### guard. A package gains tests by editing its own manifest and nothing else, and
### such a PR need not touch scripts/, the root package.json or vitest.config.ts —
### so without these globs the one guard that catches an unregistered package
### would sit out the one PR that creates one. That is how DOR-670 went unnoticed
### across ten packages. Dependency bumps trigger this workflow too; a few seconds
### of bash plus a one-minute harness job is the honest price of a guard that
### fires when it matters.
###
### `.claude/hooks/**` is in the filter for the hook suites, which test scripts
### living there rather than under scripts/: git-guard and process-guard in
### `fixtures`, and format-changed in `harness` (it needs the real prettier).
### The ESLint configs are in the filter for the same reason as
### claude-code-review.yml: test-homedir-guard.sh asserts against them. The
### os.homedir() ban lives in apps/server/eslint.config.js and its severity
### depends on packages/eslint-config/, so a PR that deletes or loosens the guard
### must trigger the suite that pins it — otherwise the guard can be removed
### without anything going red, which is the exact history that suite exists for
### (DOR-668).
###
### test.yml is in the filter for that same reason once more, and this one is
### sharper than most: `scripts/__tests__/vitest-flake-reporter.test.ts` asserts
### that its merge-queue leg still passes `--retry=1` and still loads
### scripts/vitest-flake-reporter.ts (DOR-1701). Drop either flag and nothing
### goes red — the suite runs exactly as before, absorbing nothing and naming
### nothing — so the guard has to fire on the one PR shape that regression takes,
### an edit to test.yml alone. `scripts/` belongs to no workspace package, so
### `turbo test` cannot reach that guard from test.yml's own full-monorepo sweep;
### THIS job is the only place in CI it runs at all.
###
### .github/dependabot.yml is in the filter because
### `scripts/__tests__/dependabot-lockstep-families.test.ts` asserts against it
### (DOR-1644): a Dependabot `ignore` entry must name a WHOLE lockstep family —
### parent, `-sdk` companion and per-platform siblings — never one member of
### one, because an ignore that covers a parent but not its siblings does not
### stop a bump, it splits one. Nothing else in CI executes that config at all,
### so tidying a trailing `*` off an entry is invisible until Dependabot next
### opens a group PR (that is exactly how PR #1407 shipped platform binaries at
### 0.3.250 against an SDK pinned to 0.3.224). Without this entry, the one PR
### shape that regression takes — an edit to dependabot.yml alone — would never
### trigger the job that catches it.
###
### operating-skills-version-check.yml is in the filter for the same reason:
### test-seeded-pack-changed.sh asserts that seeded-pack-changed.sh's default
### PACK_FILE and SKILLS_DIR match that workflow's job `env:`, which is where
### they come from in CI. Drift is invisible from either side alone — the
### fixtures would keep passing against the script defaults while the job scoped
### on something else — so a change to those env values has to trigger the suite
### that pins them.
###
### contributing/INDEX.md is in the list because the `Docs-coverage-map drift
### check` step parses it: `.claude/scripts/docs-coverage-map.json` is GENERATED
### from its three tables, and the one PR shape that drifts them is an edit to
### INDEX.md alone — nothing under `.claude/scripts/**` need change for the
### committed JSON to go stale. That is exactly how it went stale on main:
### #1397 edited one description cell, regenerated nothing, and `--check` went
### red on origin/main for the 160-odd commits before DOR-1781 noticed. That
### step now rides `fixtures`, which runs unscoped, so the entry no longer
### decides whether the drift check runs; it stays because pruning the list is
### the regression every entry above was added to stop.
###
### ci/space-server.env and publish-community.yml are in the list because the
### suites under scripts/__tests__/ that pin the space server's folder read
### them (DOR-3007): space-server.test.ts holds the file's three readings
### together, and community-release-workflow.test.ts asserts the publish
### workflow reads the folder from that file instead of naming it. The program
### merge moves the folder by editing the file alone, so that one-file PR has
### to run the suites that read it.
###
### THE FILTER ABOVE IS NO LONGER A `paths:` FILTER. `fixtures` is a REQUIRED
### check (ci/required-checks.json, ledger 260923-094812-required-openapi-and-
### scripts-fixtures): the docs-coverage-map drift it catches reached main
### twice while this workflow was advisory (#1397, then #1657, which was red here and
### merged anyway). A required check has to report on every pull
### request and every merge group, and a workflow skipped by a path filter
### reports NOTHING — which keeps every unrelated PR out of the queue until it
### times out (PR #1246 sat armed, green and unqueueable for 15 hours that
### way). So:
###
###   * `fixtures` runs on every event, UNSCOPED. It is about a minute of bash
###     and Node with no install, and scoping it would have cost an `if:` on
###     each of its steps (each one a census exception) to save ~40 seconds
###     of a runner the job holds anyway — while bringing back the "a file
###     outside the list broke a suite that did not run" class this header is a
###     catalogue of. Unscoped, it also sees the queue's combined tree, where an
###     INDEX.md edit in one PR and a stale map in another only meet.
###   * `harness` keeps the scope, decided from ONE list,
###     scripts/scripts-test-scope.sh (pinned by test-scripts-test-scope.sh):
###     by the first step of `fixtures` on a pull request or push, and by the
###     `attest` job, from main's copy, in the merge queue. Every entry
###     discussed above lives there. `harness` is being made REQUIRED (ledger
###     261125-110419-harness-required): it reports on every event, because a
###     job-level skip reports `skipped`, which a required check counts as a
###     pass. So the scope skip is safe only because the scope list is the one
###     reviewed copy, and every way the scope cannot be decided runs the job.
###
### `push` to main STAYS, unfiltered, for one reader: the `main-green` SLO
### (ci/slos.yaml) is computed from push-to-main runs, and this workflow is one
### of its sensors. Retiring the leg would drop red episodes mechanically and
### credit the experiment that required `fixtures` with a change in the
### measuring instrument. That retirement is its own proposal
### (ledger 260919-175509), still unstarted.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Opt into Node 24 for JavaScript-based actions (checkout) ahead of GitHub's
# Sept 2026 cutoff for the Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs on the same ref for PRs only. For push events, group by
# SHA instead of ref: GitHub only lets one run per group be *pending* at a time,
# so several quick merges to main sharing a `scripts-test-refs/heads/main` group
# would cancel each other's queued runs and only the final push would actually be
# checked. Per-SHA groups give every push-to-main its own slot.
#
# Deliberately IDENTICAL in form to typecheck.yml (fixed by #543, DOR-517) and
# test.yml. Three CI workflows with different concurrency semantics is the kind
# of divergence nobody notices until a run goes missing; keep them in step.
concurrency:
  group: scripts-test-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # DOR-5130 step 1: in a merge group, the heavy job below is skipped when
  # this same check already succeeded on the entry PR's current head
  # (scripts/attest-pr-check.sh, read from main). It caught no real failure in
  # 457 queue builds (week of Nov 16-22). Any doubt, error or missing run runs
  # the real check. The push-to-main run plus after-merge-alert.yml are the
  # backstop for a two-PR clash. On every other event this job is skipped and
  # the heavy job runs as before.
  #
  # It also decides `harness` for the queue (output `harness`), on the same
  # runner so the queue pays for no extra one: `fixtures` is often skipped
  # there, so its scope answer cannot be the queue's.
  attest:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      attested: ${{ steps.attest.outputs.attested }}
      harness: ${{ steps.harness.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/attest-pr-check.sh
            scripts/queue-repeat-guard.sh
            scripts/scripts-test-scope.sh
          sparse-checkout-cone-mode: false
      - name: Did fixtures already pass on this PR's head?
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        # The checkout above is main's, and main has no attest script until the
        # PR that adds it lands (that PR's own queue entry exited 127 on
        # 2026-11-24). A missing script runs the real check: never toward skipping.
        # Pinned by packages/ci-steward/src/__tests__/workflow-script-checkout.test.ts.
        run: |
          if [ ! -f scripts/attest-pr-check.sh ]; then
            echo "attested=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/attest-pr-check.sh is not on main yet, so the real check runs."
            exit 0
          fi
          bash scripts/attest-pr-check.sh fixtures "$HEAD_REF" >> "$GITHUB_OUTPUT"

      # `harness=false` only when main's scope list says this entry cannot
      # reach `harness`, or `harness` already succeeded on the entry PR's
      # current head. The entry's change is its commit against the group's base
      # (main plus every entry ahead of it), fetched by SHA. The list is MAIN's
      # copy, so a PR cannot narrow the scope that grades it in the queue.
      # Every doubt (no script on main yet, a fetch or diff that fails) answers
      # true and runs `harness`. A PR that `harness` skipped by scope is not
      # attested (a skipped run proves nothing), so the scope comes first.
      - name: Does harness need to run for this queue entry?
        id: harness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -uo pipefail
          answer() {
            echo "$2"
            echo "harness=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -f scripts/scripts-test-scope.sh ] ||
            answer true 'scripts/scripts-test-scope.sh is not on main; harness runs'
          git fetch --no-tags --quiet --depth=2 origin "$HEAD_SHA" ||
            answer true "could not fetch the queue commit ${HEAD_SHA}; harness runs"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA" ||
              answer true "could not fetch the group's base ${BASE_SHA}; harness runs"
          fi
          changed=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA") ||
            answer true 'git could not diff this entry; harness runs'
          verdict=$(printf '%s\n' "$changed" | bash scripts/scripts-test-scope.sh) ||
            answer true 'the scope list failed; harness runs'
          [ "$verdict" = false ] &&
            answer false 'Nothing in this entry can reach harness, so it does not run in the queue.'
          [ -f scripts/attest-pr-check.sh ] ||
            answer true 'scripts/attest-pr-check.sh is not on main; harness runs'
          [ "$(bash scripts/attest-pr-check.sh harness "$HEAD_REF")" = attested=true ] &&
            answer false "harness already succeeded on this PR's head; the queue skips it (DOR-5130)."
          answer true 'This entry can reach harness and no pass on the PR head proves it; harness runs.'

  fixtures:
    # Skipped only when attest proved this check passed on the PR's head (a
    # skipped required job reports success). `!cancelled()`, not `always()`,
    # and `!= 'true'`, so a failed or missing attest runs the real check.
    needs: attest
    if: ${{ !cancelled() && needs.attest.outputs.attested != 'true' }}
    runs-on: ubuntu-latest
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 298 completed
    # runs over 2026-09-07..09-19, p95 1.12 min, max 1.30. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 10
    outputs:
      harness: ${{ steps.scope.outputs.harness }}
    steps:
      # The census's fan-in rule (DOR-5130): this job runs only when attest did
      # not prove a pass, and attest must have succeeded (merge_group) or been
      # skipped (every other event). An attest that failed fails this check
      # closed rather than letting it report success.
      - name: Require the attest job to have succeeded or been skipped
        env:
          ATTEST: ${{ needs.attest.result }}
        run: |
          if [ "$ATTEST" != success ] && [ "$ATTEST" != skipped ]; then
            echo "::error::the attest job ended '$ATTEST', so this check cannot tell whether it was skipped on purpose. Re-run the workflow."
            exit 1
          fi
      # Depth 2 so a pull request's test-merge commit has its first parent (the
      # base it was merged onto) locally; everything else the scope step needs
      # it fetches by SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Decides whether `harness` starts, from the one scope list in
      # scripts/scripts-test-scope.sh (the header says why that list is no longer
      # a workflow-level `paths:` filter). It scopes `harness` only: every step
      # below it runs on every event whatever it says, and it has no `if:`, so
      # this required job never skips anything on its account. It lives here
      # rather than in a job of its own so a pull request pays for no extra
      # runner, and it is FIRST so its answer exists even when a suite fails.
      #
      # pull_request diffs the test-merge commit against its first parent, so
      # it sees exactly the PR's change on top of the current base. push diffs
      # the push's own range, fetched by SHA, because one queue merge can push
      # several commits at once. merge_group answers false here: in the queue
      # the `attest` job decides `harness`, because this job is often skipped
      # there. A base git cannot fetch (a new branch's zero SHA) runs `harness`
      # rather than guessing.
      #
      # `--no-renames` is load-bearing: with rename detection on, moving a file
      # OUT of scope reports only the destination path, so a change that
      # deletes a pinned file would score as not touching it.
      - name: Decide whether this change can reach the harness job
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$(git rev-parse --verify --quiet 'HEAD^1' || true) ;;
            push) base=$BEFORE ;;
            *)
              echo "$EVENT run: harness does not run here"
              echo 'harness=false' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Every failure below FAILS OPEN to running harness, never to a red
          # step: this job is a required context, and a scope decision that
          # could not be made is no reason to block a merge. The diff is
          # captured before it is matched, so a git failure is seen as a
          # failure and never as an empty, out-of-scope diff.
          verdict=true
          if [ -n "$base" ] && { git cat-file -e "${base}^{commit}" 2>/dev/null ||
            git fetch --no-tags --quiet --depth=1 origin "$base"; } &&
            changed=$(git diff --no-renames --name-only "$base" HEAD); then
            verdict=$(printf '%s\n' "$changed" | bash scripts/scripts-test-scope.sh)
          else
            echo "cannot diff against the base (${base:-none}); running harness"
          fi
          echo "harness=$verdict" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # security-gate.yml checks out the base and runs the base's copy of these
      # tests, so a gate PR's own code is tested only here.
      - name: Security gate's own tests
        run: node --test .github/scripts/security-*.test.mjs

      # security-findings.sh's round trip needs the real age, so install the
      # pinned build and (REQUIRE_AGE below) make a missing one a failure in
      # that suite rather than a skip.
      - name: Install age for the Security findings fixtures
        run: |
          bash scripts/install-age.sh "$RUNNER_TEMP/age-bin"
          echo "AGE_BIN_DIR=$RUNNER_TEMP/age-bin" >>"$GITHUB_ENV"

      # EVERY shell fixture suite that needs no node_modules, found by glob
      # (`scripts/test-*.sh`, `.agents/skills/*/scripts/test-*.sh`), in one
      # step. Adding a suite is adding the file: no step here, no line in
      # run-scripts-suites.sh (they used to be one step each, and parallel PRs
      # adding suites conflicted on them). A suite that needs node_modules says
      # `# scripts-suite-lane: harness` near its top and runs in `harness`.
      # Each suite's output is its own collapsible group, a failing one gets an
      # error annotation naming it, and the step fails at the end naming every
      # suite that failed, or if the glob found none. What each suite pins, and
      # why, is in that suite's own header.
      - name: Shell fixture suites (each in its own group; failures listed at the end)
        env:
          REQUIRE_AGE: '1'
        run: bash scripts/run-scripts-suites.sh --suites fixtures

      # spec-manifest-ops.ts, id.ts, and the changelog merge-behavior experiments
      # under .claude/scripts/ had a test directory (`__tests__/*.test.ts`,
      # Node's built-in runner, no workspace) that nothing ran (DOR-751): not
      # `pnpm verify` (no package.json owns this directory, so turbo's
      # affected-only resolution sees 0 affected packages), not `test:scripts`
      # (it never named the files), not this workflow. A round-trip regression
      # test could sit here green forever without ever executing. Every file
      # imports only `node:*` built-ins plus sibling `.ts` files under
      # .claude/scripts/ — no npm dependency — so, like the suites above it,
      # this belongs in `fixtures` rather than `harness`: no `pnpm install`
      # needed.
      - name: Spec-manifest-ops and changelog-fragment merge fixtures
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            --test .claude/scripts/__tests__/*.test.ts

      # The step above pins the coverage map's PARSER; this one pins the
      # committed ARTIFACT it parses into. `.claude/scripts/docs-coverage-map.json`
      # is generated from contributing/INDEX.md and read at runtime by the docs
      # Stop hook and /docs:reconcile, so drift between the two is silent by
      # construction: the hook keeps matching a stale copy and goes on suggesting
      # the guides INDEX.md USED to describe, while the table a human reads says
      # something else. Nothing goes red, because nothing was asking.
      #
      # `--check` is the script's own drift guard and it already existed — it was
      # wired into no CI job at all, so it went red on origin/main in #1397 and
      # stayed red for the 160-odd commits until DOR-1781 ran it by hand. A guard
      # nobody runs certifies nothing; this step is what makes it a gate, and
      # `test:scripts` runs it locally so `pnpm verify` catches the drift first.
      # Fix a red by regenerating:
      # `node .claude/scripts/docs-coverage-map.mjs --regen`.
      #
      # It compares the two sides re-serialized through JSON.stringify, so it is
      # insensitive to WHITESPACE but NOT to key order: JSON.stringify preserves
      # insertion order, so a hand-reordered key in the committed file reds this
      # step even though the map means the same thing. That is a feature, not a
      # rough edge — `--regen` always emits the canonical order, so regenerating
      # is the one correct fix for every red here, and hand-editing the JSON is
      # never it. The file is in .prettierignore for the matching reason: the
      # committed artifact is meant to be byte-reproducible from the generator.
      #
      # In `fixtures` rather than `harness` for the same reason as the step above
      # it: the script imports only `node:*` built-ins, so it needs no pnpm
      # install.
      - name: Docs-coverage-map drift check
        run: node .claude/scripts/docs-coverage-map.mjs --check

  # The TypeScript under scripts/ belongs to no pnpm workspace, so `pnpm verify`'s
  # affected-only turbo run resolves a scripts-only change to 0 affected packages
  # and covers none of it. Without this job the Q3 harness — its overlap and work
  # proofs, its canary accounting, and the destructive-path guard in provision.ts —
  # would have no automated gate at all.
  #
  # Skipped only when the scope says the change cannot reach it: `fixtures`'
  # scope step on a pull request or push, the `attest` job in the merge queue
  # (which also says false when harness already succeeded on the entry PR's
  # head, DOR-5130's attested exit). `!= 'false'`, so a missing answer runs
  # it, and `!cancelled()` rather than the default `success()`, so a red
  # fixture does not also hide this job's answer.
  #
  # BEING MADE REQUIRED (ledger 261125-110419-harness-required). Ledger
  # 260923-094812 left it advisory and out of the queue (3 reds in ~240 PR
  # runs, none on main), so a PR red here could merge anyway and break main
  # (#4396 nearly did). A skipped job reports success, so the scope skip above is the one
  # way it passes without running; the first step fails it closed when attest
  # failed.
  #
  # One part of it did (ledger 261112-185148): the suites that read the whole
  # repo went red on main three times in one week, each time after a PR this
  # job's scope never saw. Those suites, listed in
  # scripts/repo-wide-suites.ts, now ALSO run in the required `typecheck`
  # job on every PR and queue build. The unit-test step below still runs the
  # whole project, them included.
  harness:
    needs: [attest, fixtures]
    if: >-
      ${{ !cancelled() && (
      github.event_name == 'merge_group' && needs.attest.outputs.harness != 'false' ||
      github.event_name != 'merge_group' && needs.fixtures.outputs.harness != 'false') }}
    runs-on: ubuntu-latest
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 291 completed
    # runs over 2026-09-07..09-19, p95 4.13 min, max 4.58. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 13
    steps:
      # The census's fan-in rule (DOR-5130), as in `fixtures`: in the queue
      # this job runs when attest did not answer false, and an attest that
      # failed fails this check closed rather than letting a skip report
      # success. `fixtures` is read only for its scope answer: a red fixtures
      # is its own required check and does not stop this one, but outside the
      # queue it never skips, so a skipped one means the answer is missing.
      - name: Require the attest job to have succeeded or been skipped
        env:
          ATTEST: ${{ needs.attest.result }}
          FIXTURES: ${{ needs.fixtures.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ATTEST" != success ] && [ "$ATTEST" != skipped ]; then
            echo "::error::the attest job ended '$ATTEST', so this check cannot tell whether it was skipped on purpose. Re-run the workflow."
            exit 1
          fi
          if [ "$EVENT" != merge_group ] && [ "$FIXTURES" = skipped ]; then
            echo "::error::fixtures was skipped on a $EVENT run, where it always runs, so this check has no scope answer. Re-run the workflow."
            exit 1
          fi
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      # THE PNPM STORE: every ref restores it, only `refs/heads/main` saves it
      # (DOR-4537, ledger 261117-141554). setup-node's `cache: pnpm` saved a
      # store under any ref whose restore missed, PR merge refs included, where
      # no other ref can read it. Same key as test.yml's test-shard, which has
      # the full reasoning, so on Linux this restores the store main saved.
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "image=${ImageOS:?ImageOS is not set on this runner}" >> "$GITHUB_OUTPUT" && echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store built on this runner image
        id: pnpm-store-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.image }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # main only, after a good install: test.yml's test-shard says why (DOR-4537).
      - name: Save the pnpm store for the queue and pull requests
        if: ${{ github.ref == 'refs/heads/main' && steps.pnpm-store-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.image }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The Q3 harness imports nothing from the workspace packages, by design —
      # it must be runnable without a built tree. The H-tier smoke under
      # `scripts/harness-smoke/` is the one deliberate exception: it applies the
      # BUILT engine (`packages/harness/dist`), because a claim about what a real
      # `claude` or `codex` reads is only worth making against the artifact that
      # ships. So this job builds that one package (and `@dorkos/shared` under
      # it) before the typecheck can resolve those imports (DOR-1856).
      - name: Build the harness engine the H-tier smoke applies
        run: pnpm exec turbo build --filter=@dorkos/harness

      - name: Typecheck
        run: pnpm typecheck:scripts

      # NO LINT STEP HERE ANY MORE (DOR-1696). It used to run
      # `pnpm exec eslint scripts/`, and its comment said folding that into the
      # `lint` workflow would delete the coverage rather than move it — true
      # while that workflow only ran `turbo lint`, which cannot reach a
      # directory that is not a workspace package. It stopped being true when
      # `lint` gained an explicit `pnpm lint:root` step: `eslint .` from the
      # repo root covers `scripts/` AND the `.claude/` and `.agents/`
      # automation that nothing linted at all. That step is in a REQUIRED
      # merge-queue check, where this job was advisory and is scoped, so the
      # coverage moved strictly upward. Leaving the old step would have linted
      # `scripts/` twice on every PR and left two places to keep in step.
      #
      # The shell fixture suites that need a node_modules: each says
      # `# scripts-suite-lane: harness` near its top. They lint through the
      # REAL server ESLint config, run the REAL prettier, or need tsx and zod,
      # because a stub cannot tell the difference that matters to them. Same
      # runner and discovery as `fixtures`; each suite's header says what it pins.
      - name: Shell fixture suites that need node_modules
        run: bash scripts/run-scripts-suites.sh --suites harness

      # check-vocab-gate.ts (DOR-855) is pinned by this step, and ENFORCED
      # somewhere else. Its pin suite (__tests__/check-vocab-gate.test.ts) is
      # mostly synthetic fixtures plus one "regression canary" that runs the
      # real gate against this checkout, and for a long time that canary was
      # the only place the gate ran at all — which was the hole DOR-1814
      # found: this job is scoped to `scripts/**` and friends and
      # did not run in the merge queue, so a PR touching nothing but
      # apps/client/src copy never reached the canary. The gate itself now
      # runs as its own step in typecheck.yml, which is unfiltered, required,
      # and reports on merge_group. Keep both: that step enforces the result,
      # this one proves the classifier still tells copy from an identifier.
      #
      # check-boundary.ts (DOR-2024) is pinned here on the same terms, and its
      # suite carries one case no other guard needs: the boundary guard runs in
      # a PUBLIC repository, so it must never print the text it matched, and
      # the suite seeds an invented term, runs the real CLI, and fails if that
      # term appears anywhere in stdout or stderr. Both directions of that
      # property were mutation-checked when it landed.
      - name: Unit tests
        run: pnpm exec vitest run --config scripts/vitest.config.ts --project scripts
