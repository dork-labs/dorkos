name: scripts-test

# Runs the shell-script fixture suites under scripts/.
#
# These have no package to belong to, so `pnpm verify`'s affected-only turbo run
# ignores them: a change touching only `scripts/` resolves to 0 affected packages.
# `pnpm verify` does call `pnpm test:scripts` first, but that is a local habit, not
# a guarantee — nothing in the pre-push gate or in any other workflow runs it. The
# suite covers two scripts behind the automated PR reviewer, and both have already
# failed quietly once: classify-review-failure.sh decides what the reviewer TELLS
# you when it fails (DOR-457 was that message being confidently wrong twice), and
# review-gh.sh is the reviewer's only GitHub access (DOR-464), where a wrong path
# or a loosened argument check is a silent hole rather than a red check.
#
# claude-code-review.yml is in the path filter because the suite asserts against
# it: the allow-list entry, the materialized helper path and the reviewer prompt
# all name one absolute path, and drift between them denies every tool call while
# leaving the check green. That workflow cannot test itself on a PR (the action
# refuses to run when the file differs from the default branch), so this job is
# where such a change gets checked at all.
#
# The git-guard suite runs in `fixtures` for the same reason in a sharper form:
# .claude/hooks/git-guard.mjs is a safety control, and the only thing separating
# "refuses git stash" from "refuses nothing" is a matcher that no other test
# touches. It also pins the ALLOW half, because a guard that blocks
# `git checkout main` or `git stash list` gets switched off, and then it protects
# nothing at all. That suite is why `fixtures` sets up Node: it costs a couple of
# seconds, unlike the `pnpm install` this job still deliberately avoids, and it
# beats inheriting whatever Node the runner image happens to ship. It pins the
# same Node 22 as `harness`, which is the version the repo runs.
#
# TWO JOBS, on purpose. `fixtures` needs only bash, jq, iconv and Node, so
# skipping the pnpm toolchain keeps it a few seconds, which is worth preserving
# for the reviewer scripts it guards. `harness` covers the TypeScript under
# scripts/ (the Q3 contention harness, DOR-500), which does need pnpm. Splitting
# them keeps the fast signal fast instead of putting a minute of install in front
# of it.
#
# Neither job calls `pnpm test:scripts` even though that script runs all three
# suites: locally it is one command (and `pnpm verify` calls it), but in CI
# running it from either job would re-run the other job's suite for nothing.

### The `harness` job depends on two files OUTSIDE scripts/: the root package.json
### (defines typecheck:scripts and holds @types/node) and the root vitest.config.ts
### (registers the scripts project for path-based bare-vitest runs from the repo
### root; the harness job itself no longer reads it, so that entry is conservative).
### Without them
### in the filter, a PR touching only those could break this job without triggering
### it, and the breakage would surface later on an unrelated scripts/ PR.
###
### `.claude/hooks/**` is in the filter for the `fixtures` job, which tests the
### git-guard hook that lives there rather than under scripts/.
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'vitest.config.ts'
      - '.claude/hooks/**'
      - '.github/workflows/scripts-test.yml'
      - '.github/workflows/claude-code-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'vitest.config.ts'
      - '.claude/hooks/**'
      - '.github/workflows/scripts-test.yml'
      - '.github/workflows/claude-code-review.yml'

# Opt into Node 24 for JavaScript-based actions (checkout) ahead of GitHub's
# Sept 2026 cutoff for the Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs on the same ref for PRs only. For push events, group by
# SHA instead of ref: GitHub only lets one run per group be *pending* at a time,
# so several quick merges to main sharing a `scripts-test-refs/heads/main` group
# would cancel each other's queued runs and only the final push would actually be
# checked. Per-SHA groups give every push-to-main its own slot.
#
# Deliberately IDENTICAL in form to typecheck.yml (fixed by #543, DOR-517) and
# test.yml. Three CI workflows with different concurrency semantics is the kind
# of divergence nobody notices until a run goes missing; keep them in step.
concurrency:
  group: scripts-test-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reviewer shell-script fixtures
        run: bash scripts/test-review-classifier.sh

      - name: Git-guard hook fixtures
        run: bash scripts/test-git-guard.sh

      # assert-tests-executed.sh decides whether the `test` workflow's green
      # means anything — it is what stops a 280ms turbo cache replay being
      # reported as a passing suite. Same argument as the two suites above: the
      # gate is one matcher away from certifying nothing, so its verdicts are
      # pinned. Hermetic (synthetic workspaces in a temp dir), so it never reads
      # this repo's real packages.
      - name: Test-execution assertion fixtures
        run: bash scripts/test-assert-tests-executed.sh

  # The TypeScript under scripts/ belongs to no pnpm workspace, so `pnpm verify`'s
  # affected-only turbo run resolves a scripts-only change to 0 affected packages
  # and covers none of it. Without this job the Q3 harness — its overlap and work
  # proofs, its canary accounting, and the destructive-path guard in provision.ts —
  # would have no automated gate at all.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step: scripts/ imports nothing from the workspace packages, by
      # design — the harness must be runnable without a built tree.
      - name: Typecheck
        run: pnpm typecheck:scripts

      - name: Lint
        run: pnpm exec eslint scripts/

      - name: Unit tests
        run: pnpm exec vitest run --config scripts/vitest.config.ts
