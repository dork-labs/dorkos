name: scripts-test

# Runs the shell-script fixture suites under scripts/.
#
# These have no package to belong to, so `pnpm verify`'s affected-only turbo run
# ignores them: a change touching only `scripts/` resolves to 0 affected packages.
# `pnpm verify` does call `pnpm test:scripts` first, but that is a local habit, not
# a guarantee — nothing in the pre-push gate or in any other workflow runs it. The
# suite covers two scripts behind the automated PR reviewer, and both have already
# failed quietly once: classify-review-failure.sh decides what the reviewer TELLS
# you when it fails (DOR-457 was that message being confidently wrong twice), and
# review-gh.sh is the reviewer's only GitHub access (DOR-464), where a wrong path
# or a loosened argument check is a silent hole rather than a red check.
#
# should-arm-automerge.sh joins them for the same reason at higher stakes: it is
# the gate merge-tail.yml consults before arming auto-merge, so a refusal that
# quietly stops matching does not crash, it lands unreviewed code on main. Its
# fixtures bend one field of a known-good PR at a time, so a failure names the
# field rather than just going red.
#
# claude-code-review.yml is in the path filter because the suite asserts against
# it: the allow-list entry, the materialized helper path and the reviewer prompt
# all name one absolute path, and drift between them denies every tool call while
# leaving the check green. That workflow cannot test itself on a PR (the action
# refuses to run when the file differs from the default branch), so this job is
# where such a change gets checked at all.
#
# The git-guard suite runs in `fixtures` for the same reason in a sharper form:
# .claude/hooks/git-guard.mjs is a safety control, and the only thing separating
# "refuses git stash" from "refuses nothing" is a matcher that no other test
# touches. It also pins the ALLOW half, because a guard that blocks
# `git checkout main` or `git stash list` gets switched off, and then it protects
# nothing at all. That suite is why `fixtures` sets up Node: it costs a couple of
# seconds, unlike the `pnpm install` this job still deliberately avoids, and it
# beats inheriting whatever Node the runner image happens to ship. It pins the
# same Node 22 as `harness`, which is the version the repo runs.
#
# TWO JOBS, on purpose. `fixtures` needs only bash, jq, iconv and Node, so
# skipping the pnpm toolchain keeps it a few seconds, which is worth preserving
# for the reviewer scripts it guards. `harness` covers the TypeScript under
# scripts/ (the Q3 contention harness, DOR-500) plus the two bash suites that
# need a node_modules — the os.homedir() ban fixtures, which lint through the
# real server ESLint config, and the format-changed hook fixtures, which run the
# real prettier — all of which want pnpm.
# Splitting
# them keeps the fast signal fast instead of putting a minute of install in front
# of it.
#
# Neither job calls `pnpm test:scripts` even though that script runs every
# suite: locally it is one command (and `pnpm verify` calls it), but in CI
# running it from either job would re-run the other job's suites for nothing.
#
# THAT is why the same suite list is written out twice, here and in
# `test:scripts`, and why the two drifted: this workflow ran eleven suites while
# `test:scripts` ran ten, so `pnpm verify` came back green having never executed
# `test-process-guard.sh` at all (DOR-1515). If you add a step below, add it to
# `test:scripts` too — `scripts/__tests__/shell-suite-parity.test.ts` reads both
# lists and fails naming whichever suite is missing from whichever side, so you
# will hear about it either way. It rides the `harness` job's `Unit tests` step.

### The `harness` job depends on files OUTSIDE scripts/: the root package.json
### (defines typecheck:scripts and holds @types/node) and the root vitest.config.ts,
### which registers the scripts project for path-based bare-vitest runs from the
### repo root and is now imported directly by
### scripts/__tests__/vitest-projects.test.ts. That vitest.config.ts entry used to
### be conservative; since DOR-670 it is load-bearing, because that test reads the
### real project list and asserts it still covers every workspace package with
### tests. Without these in the filter, a PR touching only them could break this
### job without triggering it, and the breakage would surface later on an
### unrelated scripts/ PR.
###
### Every workspace package.json is in the filter for the OTHER half of that same
### guard. A package gains tests by editing its own manifest and nothing else, and
### such a PR need not touch scripts/, the root package.json or vitest.config.ts —
### so without these globs the one guard that catches an unregistered package
### would sit out the one PR that creates one. That is how DOR-670 went unnoticed
### across ten packages. Dependency bumps trigger this workflow too; a few seconds
### of bash plus a one-minute harness job is the honest price of a guard that
### fires when it matters.
###
### `.claude/hooks/**` is in the filter for the hook suites, which test scripts
### living there rather than under scripts/: git-guard and process-guard in
### `fixtures`, and format-changed in `harness` (it needs the real prettier).
### The ESLint configs are in the filter for the same reason as
### claude-code-review.yml: test-homedir-guard.sh asserts against them. The
### os.homedir() ban lives in apps/server/eslint.config.js and its severity
### depends on packages/eslint-config/, so a PR that deletes or loosens the guard
### must trigger the suite that pins it — otherwise the guard can be removed
### without anything going red, which is the exact history that suite exists for
### (DOR-668).
###
### operating-skills-version-check.yml is in the filter for the same reason:
### test-seeded-pack-changed.sh asserts that seeded-pack-changed.sh's default
### PACK_FILE and SKILLS_DIR match that workflow's job `env:`, which is where
### they come from in CI. Drift is invisible from either side alone — the
### fixtures would keep passing against the script defaults while the job scoped
### on something else — so a change to those env values has to trigger the suite
### that pins them.
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.agents/skills/creating-pull-requests/scripts/**'
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'vitest.config.ts'
      - 'pnpm-workspace.yaml'
      - '.claude/hooks/**'
      - 'apps/server/eslint.config.js'
      - 'packages/eslint-config/**'
      - '.github/workflows/scripts-test.yml'
      - '.github/workflows/claude-code-review.yml'
      - '.github/workflows/merge-tail.yml'
      - '.github/workflows/operating-skills-version-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.agents/skills/creating-pull-requests/scripts/**'
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'vitest.config.ts'
      - 'pnpm-workspace.yaml'
      - '.claude/hooks/**'
      - 'apps/server/eslint.config.js'
      - 'packages/eslint-config/**'
      - '.github/workflows/scripts-test.yml'
      - '.github/workflows/claude-code-review.yml'
      - '.github/workflows/merge-tail.yml'
      - '.github/workflows/operating-skills-version-check.yml'

# Opt into Node 24 for JavaScript-based actions (checkout) ahead of GitHub's
# Sept 2026 cutoff for the Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs on the same ref for PRs only. For push events, group by
# SHA instead of ref: GitHub only lets one run per group be *pending* at a time,
# so several quick merges to main sharing a `scripts-test-refs/heads/main` group
# would cancel each other's queued runs and only the final push would actually be
# checked. Per-SHA groups give every push-to-main its own slot.
#
# Deliberately IDENTICAL in form to typecheck.yml (fixed by #543, DOR-517) and
# test.yml. Three CI workflows with different concurrency semantics is the kind
# of divergence nobody notices until a run goes missing; keep them in step.
concurrency:
  group: scripts-test-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Reviewer shell-script fixtures
        run: bash scripts/test-review-classifier.sh

      - name: Git-guard hook fixtures
        run: bash scripts/test-git-guard.sh

      # process-guard is the same shape of control for `pkill`/`killall`/group
      # kills (it exists because one broad `pkill -f` took down the operator's
      # dev server, 2026-08-18) and shares its parser with git-guard through
      # .claude/hooks/lib/shell-command.mjs, so a parser change is checked
      # against both suites here.
      - name: Process-guard hook fixtures
        run: bash scripts/test-process-guard.sh

      # assert-tests-executed.sh decides whether the `test` workflow's green
      # means anything — it is what stops a 280ms turbo cache replay being
      # reported as a passing suite. Same argument as the two suites above: the
      # gate is one matcher away from certifying nothing, so its verdicts are
      # pinned. Hermetic (synthetic workspaces in a temp dir), so it never reads
      # this repo's real packages.
      - name: Test-execution assertion fixtures
        run: bash scripts/test-assert-tests-executed.sh

      # The same argument one runner over: assert-browser-tests-executed.sh is
      # what stops the `browser-test` workflow certifying a run that collected
      # nothing. Playwright exits 0 when a testIgnore glob quietly drops a spec
      # file, so that gate is the only thing standing between "N passed" and
      # "N passed out of a suite that used to have more in it". Hermetic like
      # the others — synthetic trees in a temp dir, never this repo's real
      # apps/e2e.
      - name: Browser-test-execution assertion fixtures
        run: bash scripts/test-assert-browser-tests-executed.sh

      # assert-migrations-current.sh replaced a one-liner that was green on a
      # drifted schema, and both halves of that one-liner failed OPEN: drizzle-kit
      # exits 0 when it refuses to run for want of a TTY, and `pnpm --filter
      # <name>` exits 0 when it matches nothing. The replacement is affirmative —
      # it only passes when the generator announced a known outcome — which means
      # its verdicts live in a handful of greps. Pin them, or the next person to
      # loosen one turns the gate back into a decoration silently.
      - name: Migration-currency assertion fixtures
        run: bash scripts/test-assert-migrations-current.sh

      - name: Auto-merge arming-gate fixtures
        run: bash scripts/test-should-arm-automerge.sh

      # should-reap-worktree.sh is the other side of the same coin: the arming
      # gate decides what LANDS without a human, this one decides what gets
      # DELETED without a human. A refusal that quietly stops matching does not
      # go red, it removes a branch whose only copy was local — and the first
      # version of the gate did exactly that to `ci-browser-suite-gate`, which is
      # pushed, PR-less, and the only home of a CI gate not in main. Every KEEP
      # slug has a fixture for that reason.
      - name: Worktree reaping-gate fixtures
        run: bash scripts/test-should-reap-worktree.sh

      # seeded-pack-changed.sh is the only scoping the `version-outranks-base`
      # required check has, so it can fail in two directions and both are quiet.
      # Too broad demands a version bump nobody owes, and the cheap way out is a
      # bump with no content behind it. Too narrow waves a real pack edit through
      # and the correction reaches no existing agent — that is DOR-509, and the
      # check goes green while it happens. Hermetic (throwaway git repos in a
      # temp dir), so it never reads this repo's history.
      - name: Seeded-pack scoping fixtures
        run: bash scripts/test-seeded-pack-changed.sh

      # check-dir-size.sh is the pre-commit dir-size guard (lefthook's
      # `dir-size` job). Its blocking growth tier and its non-blocking,
      # repo-wide census tier (DOR-930) both fail quietly: a matcher that
      # stops selecting a directory does not crash, it just never mentions
      # that directory again. Hermetic (throwaway git repos in a temp dir),
      # so it never reads this repo's real directories or thresholds.
      - name: Dir-size guard fixtures
        run: bash scripts/test-check-dir-size.sh

      # check-nul-bytes.sh (DOR-1561) is the guard neither round of the raw-NUL-
      # byte mistake got: DOR-1450 fixed one file with no guard, and the same
      # mistake reached six more files before this one landed. Hermetic
      # (throwaway git repos in a temp dir, one per case), so it never reads
      # this repo's real source — it asserts the guard finds the separator
      # mistake, ignores genuine binary assets, and respects the
      # `nul-byte-allow` escape hatch for content that is deliberately under
      # test rather than a mistake.
      - name: Raw-NUL-byte guard fixtures
        run: bash scripts/test-check-nul-bytes.sh

      # wait-for-npm.sh is the shared npm-availability wait used by
      # publish-docker.yml and update-homebrew.yml (DOR-1606) — a script that
      # gives up too early does not crash, it exits 1 on a release that would
      # have succeeded a few minutes later, which is exactly what shipped
      # (copy-pasted into both workflows) from v0.63.0 through v0.66.0.
      # Hermetic: a stub `npm` on PATH and the script's test-only
      # WAIT_FOR_NPM_POLL_SECONDS / WAIT_FOR_NPM_TIMEOUT_SECONDS overrides mean
      # it never touches the real registry and runs in well under a second.
      - name: npm-availability wait fixtures
        run: bash scripts/test-wait-for-npm.sh

      # test-watch-prs.sh pins watch-prs.sh's classify() vocabulary AND (as of
      # DOR-1630) a probe-seam tier that drives its real `gh pr checks`
      # collection path against a stubbed `gh`. Before DOR-1630 nothing
      # anywhere ran this suite: it lived only as a thing you might remember
      # to run by hand, so the bug that made FAILING() permanently
      # unreachable shipped and stayed shipped. Needs only bash, jq and a
      # stubbed `gh` on PATH — no pnpm — so it belongs in `fixtures`, not
      # `harness`. Lives under `.agents/skills/creating-pull-requests/scripts/`
      # (the skill's real files; `.claude/skills/creating-pull-requests` is a
      # symlink to it), not `scripts/`, so it is named directly here rather
      # than through `shell-suite-parity.test.ts`'s `scripts/test-*.sh` regex.
      - name: Watch-PRs FAILING-state regression fixtures
        run: bash .agents/skills/creating-pull-requests/scripts/test-watch-prs.sh

  # The TypeScript under scripts/ belongs to no pnpm workspace, so `pnpm verify`'s
  # affected-only turbo run resolves a scripts-only change to 0 affected packages
  # and covers none of it. Without this job the Q3 harness — its overlap and work
  # proofs, its canary accounting, and the destructive-path guard in provision.ts —
  # would have no automated gate at all.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step: scripts/ imports nothing from the workspace packages, by
      # design — the harness must be runnable without a built tree.
      - name: Typecheck
        run: pnpm typecheck:scripts

      - name: Lint
        run: pnpm exec eslint scripts/

      # In `harness` rather than `fixtures` because it is the only job with a
      # node_modules: the suite lints fixture text through the REAL server ESLint
      # config, which is the only way to test the thing that actually broke — the
      # per-directory files/ignores globs, not the presence of config text. The
      # ban it pins spent its whole life matching nothing, and a lint rule that
      # stops matching exits 0 rather than crashing (DOR-668).
      - name: os.homedir() ban fixtures
        run: bash scripts/test-homedir-guard.sh

      # In `harness` for the same reason as the suite above it: it is the only
      # job with a node_modules, and this suite needs the REAL prettier. A stub
      # could prove the hook called something, but not that eligible files come
      # out formatted and ignored ones do not, which is half of what it pins.
      #
      # .claude/hooks/format-changed.sh went from a 13-line PostToolUse
      # one-liner to a ~126-line Stop hook with real file-collection logic, and
      # the automated reviewer flagged that it had arrived untested. Its failure
      # modes are all quiet: it is silent by design, so "formatted nothing this
      # turn" and "formatted everything" look identical from the outside, and
      # the two gates behind it (lefthook pre-commit, CI prettier --check) would
      # absorb the drift without ever naming the hook. The one loud failure is
      # the one that matters most — a Stop hook exiting 2 blocks the turn from
      # ending — so every case asserts exit 0.
      - name: Format-changed hook fixtures
        run: bash scripts/test-format-changed.sh

      # Pins scripts/check-banned-words.sh, the DOR-1517 prose guard. The guard
      # itself runs in the `typecheck` workflow (already a required check, and
      # it reports on merge_group); this step proves the guard still goes red on
      # a seeded violation and still stays green on all four things that sweep
      # deliberately kept. A guard nobody has watched fail is not a gate.
      - name: Banned-words prose guard fixtures
        run: bash scripts/test-check-banned-words.sh

      # check-vocab-gate.ts (DOR-855) rides this step rather than getting a
      # dedicated one: its own pin suite (__tests__/check-vocab-gate.test.ts)
      # includes a "regression canary" test that runs the real gate against
      # this checkout, not just synthetic fixtures. A retired word landing
      # back in apps/client or apps/site copy fails that one test right here —
      # there is no second job to wire up, and the CLI entry point
      # (`pnpm check:vocab-gate`) stays available for a human to run by hand.
      - name: Unit tests
        run: pnpm exec vitest run --config scripts/vitest.config.ts
