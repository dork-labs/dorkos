name: Release Publish

# Publishes a release cut on release/vX.Y.Z to npm (DOR-4638, ADR 261118-135124).
# Dispatched on main ONLY: this file and every proof it runs come from main, and
# the release branch is checked out as data at the exact SHA QA and the PM named.
# On a release/* ref the branch's own copy of this file would run, and a PR there
# could change the checks without the approver seeing it (Security, 2026-11-17).
#
# prove:   proves the branch (tip, base, cherry-picks) with main's scripts BEFORE
#          anything from the branch is installed or run: node builtins, git, gh.
# prepare: only after that passes, installs the release checkout, builds and
#          packs the three packages with main's release-cli (which proves again).
#          No npm or deploy rights.
# gate:    after both, right before npm (DOR-5123, ADR clause 6): main's
#          scripts/release-gate.sh must answer exactly SHIP for P, the release
#          point prove verified (the branch's merge-base with main). REFUSE
#          fails the job, so publish never starts. Read-only token, no secrets.
# smoke:   after prepare, on ubuntu and macOS: installs the exact packed
#          tarballs into a clean prefix and runs main's smoke test, one browser
#          check that a chat gets a reply, and an import of the two libraries.
#          Read-only, no secrets, no environment (DOR-5123, design §6).
# publish: waits for a person's approval on npm-release, checks that approval
#          inside the job, re-checks the tip, then publishes the exact packed
#          tarballs with npm trusted publishing (OIDC, no npm token).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, X.Y.Z (the branch is release/vX.Y.Z)'
        required: true
        type: string
      expected_sha:
        description: 'Full SHA QA and the PM named; the branch tip must equal it'
        required: true
        type: string
      mode:
        description: 'routine (cut from QA pin on main) or hotfix (cut from a published tag)'
        required: true
        type: choice
        options: [routine, hotfix]
      base:
        description: "routine: QA's full pin SHA. hotfix: the vX.Y.Z tag it starts from"
        required: true
        type: string

permissions: {}

concurrency:
  # One publish at a time, never cancelled midway.
  group: release-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
  RELEASE_MODE: ${{ inputs.mode }}
  RELEASE_BASE: ${{ inputs.base }}

jobs:
  prove:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # P, the release point: set only after proof.ts has shown it is the
      # branch's merge-base with main (routine mode). The gate job reads it.
      p: ${{ steps.proven.outputs.p }}
    steps:
      - name: Refuse anything but main's copy and strict inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/release-publish.yml@refs/heads/main" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$RELEASE_MODE" in
            routine) [[ "$RELEASE_BASE" =~ ^[0-9a-f]{40}$ ]] ;;
            # Hotfix publishing is off until tags are locked (Security M2, Nov 19).
            hotfix) echo "::error::Hotfix publishing is off: its base is a movable tag."; exit 1 ;;
            *) exit 1 ;;
          esac
      - name: Check out main's proofs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the release branch as data, at the named SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_EXPECTED_SHA }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prove the release branch before anything from it runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --experimental-strip-types trusted/packages/cli/scripts/release-branch/proof.ts \
            release "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$RELEASE_EXPECTED_SHA" \
            "release/v$RELEASE_VERSION" "$RELEASE_MODE" "$RELEASE_BASE" "$RELEASE_EXPECTED_SHA"
      - name: Name the proven release point P
        id: proven
        run: |
          set -euo pipefail
          # Reached only when the proof passed: in routine mode proof.ts asserts
          # that the merge-base of the tip and main equals this base.
          [[ "$RELEASE_MODE" == routine && "$RELEASE_BASE" =~ ^[0-9a-f]{40}$ ]]
          echo "p=$RELEASE_BASE" >>"$GITHUB_OUTPUT"

  prepare:
    needs: prove
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      dorkos_sha256: ${{ steps.collect.outputs.dorkos }}
      cloud_api_sha256: ${{ steps.collect.outputs.cloud_api }}
      connector_providers_sha256: ${{ steps.collect.outputs.connector_providers }}
    steps:
      - name: Refuse anything but main's copy and strict inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/release-publish.yml@refs/heads/main" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$RELEASE_MODE" in
            routine) [[ "$RELEASE_BASE" =~ ^[0-9a-f]{40}$ ]] ;;
            # Hotfix publishing is off until tags are locked (Security M2, Nov 19).
            hotfix) echo "::error::Hotfix publishing is off: its base is a movable tag."; exit 1 ;;
            *) exit 1 ;;
          esac
      - name: Check out main's proofs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the release branch as data, at the named SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_EXPECTED_SHA }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # pnpm's version comes from main, not from the checkout being built.
          package_json_file: trusted/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the release checkout
        working-directory: release
        run: pnpm install --frozen-lockfile
      - name: Prove the release branch and build dorkos with main's release-cli
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}/cli
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          node --experimental-strip-types trusted/packages/cli/scripts/release-cli.ts \
            --release-branch "release/v$RELEASE_VERSION" \
            --mode "$RELEASE_MODE" \
            --base "$RELEASE_BASE" \
            --expected-sha "$RELEASE_EXPECTED_SHA" \
            --root release
      - name: Build and pack the cloud contract and connector providers
        working-directory: release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packed"
          for pkg in cloud-api connector-providers; do
            pnpm --filter "@dork-labs/$pkg" run prepublishOnly
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/packed")
          done
      - name: Collect and check the three tarballs
        id: collect
        run: |
          set -euo pipefail
          shopt -s nullglob
          cli=("$RUNNER_TEMP"/cli/dorkos-cli-release-*/packed/*.tgz)
          receipts=("$RUNNER_TEMP"/cli/dorkos-cli-release-*/release-receipt.json)
          [[ ${#cli[@]} -eq 1 && ${#receipts[@]} -eq 1 ]]
          [[ "$(jq -r .commit "${receipts[0]}")" == "$RELEASE_EXPECTED_SHA" ]]
          [[ "$(jq -r .version "${receipts[0]}")" == "$RELEASE_VERSION" ]]
          cp "${cli[0]}" "$RUNNER_TEMP/packed/dorkos.tgz"
          cp "${receipts[0]}" "$RUNNER_TEMP/packed/release-receipt.json"
          gate=trusted/packages/cli/scripts/release-branch/publish-gate.ts
          packed=("$RUNNER_TEMP"/packed/*.tgz)
          [[ ${#packed[@]} -eq 3 ]]
          for row in "dorkos:dorkos.tgz:dorkos" \
                     "@dork-labs/cloud-api:dork-labs-cloud-api-$RELEASE_VERSION.tgz:cloud_api" \
                     "@dork-labs/connector-providers:dork-labs-connector-providers-$RELEASE_VERSION.tgz:connector_providers"; do
            IFS=: read -r name file key <<< "$row"
            node --experimental-strip-types "$gate" tarball "$RUNNER_TEMP/packed/$file" "$name" "$RELEASE_VERSION"
            echo "$key=$(sha256sum "$RUNNER_TEMP/packed/$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs-${{ github.run_id }}
          path: ${{ runner.temp }}/packed
          if-no-files-found: error
          retention-days: 7

  gate:
    # Right before npm (DOR-5123; ADR 261118-135124 clause 6): main's
    # scripts/release-gate.sh must print exactly SHIP for P. It re-proves at
    # publish time what made P worth releasing: on main's first-parent history,
    # not reverted, no open auto-revert PR, its full run on main green, and
    # every required check green in its merge-queue build. Anything else is
    # REFUSE <reason>: this job fails, so publish never starts. After prepare,
    # so the answer is as fresh as it can be before npm.
    needs: [prove, prepare]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only, no secrets, no environment: only the reads release-gate.sh makes.
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    env:
      P: ${{ needs.prove.outputs.p }}
      # The workflows whose newest completed push/schedule run on P must have
      # passed: the full browser suite and, since #4257 made it a rolling run
      # on main, the full unit sweep.
      FULL_RUN_WORKFLOWS: browser-test.yml test.yml
    steps:
      - name: Refuse anything but main's copy, routine mode and a proven P
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/release-publish.yml@refs/heads/main" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # Hotfix mode is refused (ADR clause 6) and prove already stopped it;
          # the gate refuses it again rather than trust job order alone.
          if [[ "$RELEASE_MODE" != routine ]]; then
            echo "::error::release-gate: mode $RELEASE_MODE is not gated for npm; only routine publishes."
            exit 1
          fi
          [[ "$P" =~ ^[0-9a-f]{40}$ && "$P" == "$RELEASE_BASE" ]]
      - name: Check out main's gate script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is main's commit this run's own file came from (the job
          # runs only on refs/heads/main). Never the release branch.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release-gate.sh
          sparse-checkout-cone-mode: false
      - name: Ship only on the exact answer SHIP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/release-gate-facts.json"
          bash scripts/release-gate.sh facts "$RELEASE_VERSION" "$P" >"$facts"
          echo "::group::facts"
          cat "$facts"
          echo "::endgroup::"
          decision=$(bash scripts/release-gate.sh decide "$facts")
          echo "Decision: $decision"
          {
            echo "### Release gate: v$RELEASE_VERSION from P \`${P:0:12}\`"
            echo
            echo "\`${decision//\`/}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$decision" != SHIP ]]; then
            echo "::error title=release-gate refused v$RELEASE_VERSION::${decision//$'\n'/ }"
            exit 1
          fi

  smoke:
    # The exact tarballs prepare packed, installed and run before npm sees them
    # (DOR-5123, design §6): their sha256 again, `npm i -g` into a clean prefix,
    # main's scripts/smoke-test.sh, one browser check that a chat gets a reply,
    # and an import of the two libraries. Everything the job runs beyond the
    # tarballs is main's own copy. Read-only, no secrets, no environment, no
    # id-token: the server runs the built-in test runtime on a throwaway home,
    # so no model is reached.
    needs: prepare
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SHA_DORKOS: ${{ needs.prepare.outputs.dorkos_sha256 }}
      SHA_CLOUD_API: ${{ needs.prepare.outputs.cloud_api_sha256 }}
      SHA_CONNECTOR_PROVIDERS: ${{ needs.prepare.outputs.connector_providers_sha256 }}
    steps:
      - name: Refuse anything but main's copy and strict inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/release-publish.yml@refs/heads/main" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          for sha in "$SHA_DORKOS" "$SHA_CLOUD_API" "$SHA_CONNECTOR_PROVIDERS"; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          done
      - name: Check out main's smoke test and browser check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's commit this run's own file came from. Never the release branch.
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: trusted/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs-${{ github.run_id }}
          path: ${{ runner.temp }}/packed
      - name: Check the tarballs are the ones prepare packed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packed"
          printf '%s  %s\n' \
            "$SHA_DORKOS" dorkos.tgz \
            "$SHA_CLOUD_API" "dork-labs-cloud-api-$RELEASE_VERSION.tgz" \
            "$SHA_CONNECTOR_PROVIDERS" "dork-labs-connector-providers-$RELEASE_VERSION.tgz" \
            | shasum -a 256 --check
      - name: Install dorkos into a clean prefix and a throwaway home
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"
          npm install -g --prefix "$prefix" "$RUNNER_TEMP/packed/dorkos.tgz"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          home="$RUNNER_TEMP/home"
          mkdir -m 700 -p "$home/.dork" "$home/.claude"
          {
            echo "HOME=$home"
            echo "DORK_HOME=$home/.dork"
            echo "CLAUDE_CONFIG_DIR=$home/.claude"
            echo "DORKOS_TEST_RUNTIME=true"
          } >> "$GITHUB_ENV"
          version=$("$prefix/bin/dorkos" --version)
          if [[ "$version" != *"$RELEASE_VERSION"* ]]; then
            echo "::error::dorkos --version printed '$version', not $RELEASE_VERSION."
            exit 1
          fi
      - name: Run main's smoke test against the installed dorkos
        working-directory: trusted
        run: bash scripts/smoke-test.sh --port 4242 --timeout 60
      - name: Install Playwright from main's lockfile
        working-directory: trusted
        env:
          # pnpm and Playwright cache under HOME; keep them off the throwaway one.
          HOME: ${{ runner.temp }}/tools
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tools/browsers
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @dorkos/e2e --ignore-scripts
          pnpm --filter @dorkos/e2e exec playwright install --with-deps chromium
      - name: A chat on the installed release gets a reply
        working-directory: trusted/apps/e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tools/browsers
          RELEASE_SMOKE_URL: http://localhost:4243
          RELEASE_SMOKE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          dorkos --port 4243 > "$RUNNER_TEMP/dorkos.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4243/api/health > /dev/null && break
            sleep 1
          done
          status=0
          HOME="$RUNNER_TEMP/tools" pnpm exec playwright test -c playwright.release-smoke.config.ts || status=$?
          if [[ "$status" != 0 ]]; then
            echo "::group::dorkos log"
            tail -n 200 "$RUNNER_TEMP/dorkos.log"
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Import the cloud contract and connector providers
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/libraries"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y > /dev/null
          npm install "zod@^4.6.6" \
            "$RUNNER_TEMP/packed/dork-labs-cloud-api-$RELEASE_VERSION.tgz" \
            "$RUNNER_TEMP/packed/dork-labs-connector-providers-$RELEASE_VERSION.tgz"
          node --input-type=module -e "await import('@dork-labs/cloud-api'); await import('@dork-labs/connector-providers'); console.log('both import');"

  publish:
    needs: [prepare, gate, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewer: one account only the person holds; branches: main only.
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # The one account allowed to approve a publish (Security, 2026-11-18). It is
      # hardcoded here, not a repo variable the agents' admin token could edit, so
      # changing it takes a reviewed PR to main. PLACEHOLDER until Dorian names the
      # account: it is not a valid GitHub login, so every publish refuses until then.
      RELEASE_APPROVER: '<approver-not-named-yet>'
      # The same account's numeric user id: a login can be renamed and reclaimed,
      # an id cannot. PLACEHOLDER (0 is no account) until the account is named.
      RELEASE_APPROVER_ID: '0'
      SHA_DORKOS: ${{ needs.prepare.outputs.dorkos_sha256 }}
      SHA_CLOUD_API: ${{ needs.prepare.outputs.cloud_api_sha256 }}
      SHA_CONNECTOR_PROVIDERS: ${{ needs.prepare.outputs.connector_providers_sha256 }}
    steps:
      - name: Refuse anything but main's copy and strict inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/release-publish.yml@refs/heads/main" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_APPROVER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          [[ "$RELEASE_APPROVER_ID" =~ ^[1-9][0-9]*$ ]]
          for sum in "$SHA_DORKOS" "$SHA_CLOUD_API" "$SHA_CONNECTOR_PROVIDERS"; do
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]]
          done
      - name: Check out main's gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require the approver's own approval, and the tip unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gate=trusted/packages/cli/scripts/release-branch/publish-gate.ts
          node --experimental-strip-types "$gate" approval "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$RELEASE_APPROVER" "$RELEASE_APPROVER_ID" "$GITHUB_ACTOR"
          node --experimental-strip-types "$gate" approval "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$RELEASE_APPROVER" "$RELEASE_APPROVER_ID" "$GITHUB_TRIGGERING_ACTOR"
          node --experimental-strip-types "$gate" tip "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$RELEASE_EXPECTED_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs-${{ github.run_id }}
          path: ${{ runner.temp }}/packed
      - name: Check the tarballs are the ones prepare packed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packed"
          printf '%s  %s\n' \
            "$SHA_DORKOS" dorkos.tgz \
            "$SHA_CLOUD_API" "dork-labs-cloud-api-$RELEASE_VERSION.tgz" \
            "$SHA_CONNECTOR_PROVIDERS" "dork-labs-connector-providers-$RELEASE_VERSION.tgz" \
            | sha256sum --check --strict
      - name: Require npm with trusted publishing (11.5.1 or newer)
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - name: Publish dorkos, then the cloud contract, then connector providers
        run: |
          set -euo pipefail
          gate=trusted/packages/cli/scripts/release-branch/publish-gate.ts
          # Order matters: connector-providers pins cloud-api at this exact version.
          for row in "dorkos:dorkos.tgz" \
                     "@dork-labs/cloud-api:dork-labs-cloud-api-$RELEASE_VERSION.tgz" \
                     "@dork-labs/connector-providers:dork-labs-connector-providers-$RELEASE_VERSION.tgz"; do
            IFS=: read -r name file <<< "$row"
            tarball="$RUNNER_TEMP/packed/$file"
            local_integrity=$(node --experimental-strip-types "$gate" integrity "$tarball")
            published=$(npm view "$name@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
            if [[ -n "$published" ]]; then
              # Never publish twice. Skipping is safe only when npm holds these exact bytes.
              if [[ "$published" != "$local_integrity" ]]; then
                echo "::error::$name@$RELEASE_VERSION is already on npm with different contents."
                exit 1
              fi
              echo "$name@$RELEASE_VERSION is already on npm with these exact bytes; skipping."
              continue
            fi
            npm publish "$tarball" --access public
          done
