name: Publish Community Image

# PUBLISHED ON A `v*` TAG PUSH (DOR-4030, Security ruling Nov 19). Unlike
# publish-docker.yml, desktop-release.yml and update-homebrew.yml, which are
# dispatched on main, this one still runs on the tag push: the launcher trusts
# a Community release attested from its own `refs/tags/vX.Y.Z`, and moving that
# identity to main is its own later PR, not this one. So this workflow holds no
# environment secret, only GITHUB_TOKEN. tag-is-on-main runs main's
# scripts/ci/tag-is-on-main.sh on the tagged commit (on main, or the run-time
# tip of a release/vX.Y.Z branch that passes main's release-branch check), and
# each job's first step refuses anything but a strict vX.Y.Z tag push. Both are
# defense in depth: a tag push runs the tagged commit's own copy of this file.
# The census's tag gate (ci/config.yaml) keeps the job-level `if:` on the tag.
#
# KNOWN GAP (predates DOR-4030; follow-up DOR-4795). The GHCR package is not
# locked to this workflow: any workflow run whose GITHUB_TOKEN may write
# packages, including a tag's or a branch's own copy of some other file, can
# push to ghcr.io/dork-labs/dorkos-community. The launcher only deploys an
# image whose digest a manifest attested by this workflow names, so a stray
# push there is never deployed; it is still not stopped.
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-community-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dork-labs/dorkos-community
  MINIMUM_FLYCTL_VERSION: 0.4.104
  MINIMUM_NEON_CLI_VERSION: 5.0.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # DOR-4030: no Community image or manifest is published from a commit that
  # main's scripts/ci/tag-is-on-main.sh refuses (on main, or the run-time tip
  # of a release/vX.Y.Z branch that passes main's release-branch check).
  # Anonymous, so this job reads no secret and holds no token. It is defense in
  # depth: a pushed tag runs its own commit's copy of this file, which is why
  # this workflow holds no environment secret, only GITHUB_TOKEN.
  tag-is-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Refuse anything but a strict v* tag push
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push ]] || exit 1
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            { echo "::error::The tag must be exactly vX.Y.Z. Nothing was built or published."; exit 1; }
      # Node runs main's release-branch check for a release-branch tag.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fail unless this commit is on main or a checked release branch
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # Main's copy of the gate, never the tagged commit's (scripts/ci/tag-is-on-main.sh).
          git init -q "$RUNNER_TEMP/main-check"
          git -C "$RUNNER_TEMP/main-check" remote add origin "$REPO_URL"
          git -C "$RUNNER_TEMP/main-check" fetch -q --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git -C "$RUNNER_TEMP/main-check" show origin/main:scripts/ci/tag-is-on-main.sh > "$RUNNER_TEMP/tag-is-on-main.sh"
          bash "$RUNNER_TEMP/tag-is-on-main.sh" --dir "$RUNNER_TEMP/main-check" \
            --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --what 'The Community image is published'

  build-and-publish:
    needs: tag-is-on-main
    # Publishes, so it runs only on a `v*` tag (DOR-4030; the census's tag gate checks this line).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Refuse anything but a strict v* tag push
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push ]] || exit 1
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Where the space server lives (ci/space-server.env, DOR-3007): its
      # KEY=value lines become this job's environment, read below as
      # "$SPACE_DIR" and ${{ env.SPACE_DIR }}. This file's own name and the
      # image name stay as they are: the launcher trusts both.
      - name: Read where the space server lives
        run: grep -E '^SPACE_[A-Z_]*=.' ci/space-server.env >> "$GITHUB_ENV" && grep -qE '^SPACE_DIR=.' ci/space-server.env

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # NO dependency cache, restored or saved (DOR-4635, DOR-4695). This job runs
      # on a tag push and holds release credentials, so it installs cold from the
      # registry, checked against pnpm-lock.yaml's integrity hashes. (Saving into
      # a tag's scope was also waste: a tag's cache is readable only by that tag.)
      # Cost: one cold install per job per release.

      - name: Install manifest generator dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Extract release metadata
        id: release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a supported release version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest=community-release-v${version}.json" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Community image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          # The space image is the repository Dockerfile's `space` target (server-merge
          # step 7f). This workflow's file name and the image name stay as they are: the
          # launcher trusts both.
          file: ./Dockerfile
          target: space
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # No layer cache (DOR-4635). This workflow runs only on tag pushes, and a
          # tag ref's Actions cache can be restored only by that same tag, so the
          # next release never reads it. mode=max multi-arch layers wrote ~3.9 GB
          # per release (with publish-docker.yml) and pushed the repo past its
          # 10 GB cache budget, evicting main's CI caches.

      - name: Attest the immutable image digest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # Step outputs reach scripts through `env:`, never `${{ }}` inside `run:`.
      - name: Inspect the pushed OCI index
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"
          if ! docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --raw > community-image-index.json; then
            echo "::error::The Community GHCR package must be public before its first release can become ready." >&2
            exit 1
          fi

      - name: Generate the release manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          MANIFEST: ${{ steps.release.outputs.manifest }}
        run: |
          pnpm tsx scripts/generate-community-release-manifest.ts \
            --version "$RELEASE_VERSION" \
            --digest "$IMAGE_DIGEST" \
            --index community-image-index.json \
            --output "$MANIFEST" \
            --migrations "$SPACE_DIR/migrations" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --minimum-flyctl "$MINIMUM_FLYCTL_VERSION" \
            --minimum-neon-cli "$MINIMUM_NEON_CLI_VERSION"

      - name: Attest the release manifest
        id: manifest-attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release.outputs.manifest }}

      - name: Verify both attestations before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          MANIFEST: ${{ steps.release.outputs.manifest }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "$MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-community.yml" \
            --source-ref "$GITHUB_REF"
          gh attestation verify \
            "oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-community.yml" \
            --source-ref "$GITHUB_REF"

      - name: Wait for the draft release and attach the signed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST: ${{ steps.release.outputs.manifest }}
          BUNDLE_PATH: ${{ steps.manifest-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=1
              break
            fi
            echo "Release $GITHUB_REF_NAME not found yet (attempt $attempt/30); waiting 20s…"
            sleep 20
          done
          if [ -z "$found" ]; then
            echo "::error::Release $GITHUB_REF_NAME does not exist; refusing to create a notes-less release." >&2
            exit 1
          fi
          cp "$BUNDLE_PATH" "${MANIFEST}.sigstore.json"
          bash scripts/publish-community-release-assets.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "$MANIFEST" \
            "${MANIFEST}.sigstore.json" \
            "$GITHUB_REPOSITORY/.github/workflows/publish-community.yml" \
            "$GITHUB_REF"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: community-release-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.release.outputs.manifest }}
            ${{ steps.release.outputs.manifest }}.sigstore.json
          if-no-files-found: error
          retention-days: 90
