name: typecheck

# Type-checks every package that declares a `typecheck` script, on every PR
# and in the merge queue. See the KNOWN GAPS note below for what this does not
# cover. (The formatting gate that used to ride this workflow moved to
# lint.yml in the DOR-627 follow-up, 2026-09-02 — see that file's header.)
#
# Before this workflow existed, NOTHING in CI ran `pnpm typecheck`. Enforcement
# was the lefthook pre-commit hook plus a developer choosing to run
# `pnpm verify` before opening a PR. Both are bypassable — `--no-verify` is a
# documented, routinely-used escape in this repo (AGENTS.md and several
# contributing notes prescribe it, because the pre-push hook hangs from
# worktrees) — and nothing downstream ever re-checked.
#
# This is not theoretical. PR #489 (DOR-508) tightened `apps/server/tsconfig.json`
# to typecheck server test files for the first time. PR #488 (DOR-501 phase 2)
# landed ~40 minutes later with new/modified test files written on a branch that
# predated #489, so its own CI run never typechecked them under the new,
# stricter config. Each PR was green alone; the moment they combined on `main`,
# typecheck went red with four errors (fixed by PR #491). No CI job noticed — a
# human found it by running `pnpm typecheck` locally. That gap is this ticket,
# DOR-517.
#
# FULL MONOREPO, not affected-only (the mode `pnpm verify` uses via
# `turbo run typecheck --affected`). Affected-only is faster, but it would have
# MISSED the #488/#489 failure above: each PR's own diff was affected-only clean
# against the base it branched from. The break only existed in the state
# produced by combining both PRs' merges — a per-PR diff can't see an
# interaction between two PRs it doesn't know about. Only a full run against
# `main`'s actual tip (which is what a PR's merge commit or a push to main
# represents) can catch that. Plain `turbo typecheck`, no `--affected`, is the
# same turbo invocation the root `pnpm typecheck` script runs, minus the local
# `dotenv` wrapper (there's no `.env` on a runner).
#
# NO separate build step: `typecheck` declares `dependsOn: ["^build"]` in
# turbo.json, so `turbo typecheck` already builds every dependency package
# (e.g. `@dorkos/shared`) before typechecking anything that imports its dist —
# turbo computes and runs that from the task graph on its own. Skipping this
# would make the job either not build shared dists at all (false-red `TS6053`
# on every downstream import) or need a hand-maintained second build step that
# duplicates what turbo already does correctly.
#
# KNOWN GAPS: this only covers packages that declare a `typecheck` script.
# Every workspace package now declares one — `dorkos` (packages/cli, the
# published npm package) was the last holdout and joined in DOR-530, along
# with `@dorkos/icons` and `@dorkos/test-utils`. The two that still do not,
# `@dorkos/eslint-config` and `@dorkos/typescript-config`, contain no
# TypeScript source at all (plain `.js` and `.json`), so there is nothing for
# tsc to check. What that leaves uncovered:
#
#   - Root-level `scripts/*.ts`. They belong to no workspace package, and
#     turbo only runs package tasks (there is no `//#typecheck` root task), so
#     no tsconfig includes them and nothing here checks them.
#   - The test files quarantined in `apps/server/tsconfig.json`'s `exclude`.
#     That list is deliberate, shrink-only, and enforced by
#     `apps/server/src/__tests__/tsconfig-quarantine.test.ts`; see the comment
#     there for the rules.
#
# Anything added to this list is a real hole — say which files it leaves
# unchecked and why, rather than naming a package.
# `merge_group` is where this workflow finally does the job its header describes.
# The #488/#489 break it was written for was an INTERACTION between two PRs, each
# green alone against the base it branched from. A `pull_request` run cannot see
# that by construction: it only ever knows its own diff. The merge queue builds
# `main` + every PR ahead in the queue + this one and runs the checks against
# that combined tree, so the interaction is checked before anything lands rather
# than discovered on `main` afterwards.
#
# THE push-to-main LEG IS DROPPED (DOR-627 follow-up, 2026-09-02), matching
# `test` and now `lint`: this job is already required and already reports on
# `merge_group`, so the queue guarantees every commit that reaches `main`
# already ran it against the exact combined tree (squash rewrites the SHA,
# not the content). A push-to-main re-run would have been a same-answer
# rerun of a check the queue had already settled.
on:
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a
# group and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. (Copied deliberately from test.yml, now that push-to-main is
# dropped here too — same reasoning, same fix.)
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # A full cold typecheck (no turbo cache) is ~35-40s on a warm developer
    # machine; generous headroom for a colder/slower CI runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Retired vocabulary in user-facing prose (DOR-1517). It rides THIS job
      # because `typecheck` is already a required status check and already
      # reports on `merge_group`, so a new workflow would go red without
      # blocking a merge until someone amended branch protection — and a gate
      # on a non-required check is not a gate. Needs no node_modules; it is
      # bash and grep over prose files.
      #
      # This is the second half of a deliberate split. Render-path strings in
      # app source are judged by scripts/check-vocab-gate.ts, which parses
      # TypeScript so it can tell copy from an identifier; it runs in
      # scripts-test.yml via its own pin suite. This step covers the prose and
      # data files that gate cannot read: READMEs, docs MDX, blog posts,
      # context7.json, the PWA manifest, and the generated openapi.json.
      - name: Retired-vocabulary gate — prose surfaces (DOR-1517)
        if: ${{ !cancelled() }}
        run: bash scripts/check-banned-words.sh

      # Raw NUL bytes pasted into text files (DOR-1561). Rides THIS job for
      # the same reason the gate above it does: `typecheck` is already a
      # required status check that reports on `merge_group`, and a gate on a
      # non-required check is not a gate. Needs only `git` and `perl`, both on
      # the runner already — no node_modules, and it runs in ~1-2s over the
      # whole repo.
      - name: Raw-NUL-byte gate — text files (DOR-1561)
        if: ${{ !cancelled() }}
        run: bash scripts/check-nul-bytes.sh

      # `!cancelled()` so an earlier gate's failure still reports every type
      # error in the same run, for the same reason the step below passes
      # `--continue`.
      - name: Typecheck every package that declares a typecheck script
        if: ${{ !cancelled() }}
        run: pnpm exec turbo typecheck --continue
