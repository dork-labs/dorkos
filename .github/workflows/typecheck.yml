name: typecheck

# Type-checks every package that declares a `typecheck` script, on every PR
# and in the merge queue. See the KNOWN GAPS note below for what this does not
# cover. (The formatting gate that used to ride this workflow moved to
# lint.yml in the DOR-627 follow-up, 2026-09-02 — see that file's header.)
#
# Before this workflow existed, NOTHING in CI ran `pnpm typecheck`. Enforcement
# was the lefthook pre-commit hook plus a developer choosing to run
# `pnpm verify` before opening a PR. Both are bypassable — `--no-verify` is a
# documented, routinely-used escape in this repo (AGENTS.md and several
# contributing notes prescribe it, because the pre-push hook hangs from
# worktrees) — and nothing downstream ever re-checked.
#
# This is not theoretical. PR #489 (DOR-508) tightened `apps/server/tsconfig.json`
# to typecheck server test files for the first time. PR #488 (DOR-501 phase 2)
# landed ~40 minutes later with new/modified test files written on a branch that
# predated #489, so its own CI run never typechecked them under the new,
# stricter config. Each PR was green alone; the moment they combined on `main`,
# typecheck went red with four errors (fixed by PR #491). No CI job noticed — a
# human found it by running `pnpm typecheck` locally. That gap is this ticket,
# DOR-517.
#
# FULL MONOREPO, not affected-only (the mode `pnpm verify` uses via
# `turbo run typecheck --affected`). Affected-only is faster, but it would have
# MISSED the #488/#489 failure above: each PR's own diff was affected-only clean
# against the base it branched from. The break only existed in the state
# produced by combining both PRs' merges — a per-PR diff can't see an
# interaction between two PRs it doesn't know about. Only a full run against
# `main`'s actual tip (which is what a PR's merge commit or a push to main
# represents) can catch that. Plain `turbo typecheck`, no `--affected`, is the
# same turbo invocation the root `pnpm typecheck` script runs, minus the local
# `dotenv` wrapper (there's no `.env` on a runner).
#
# NO separate build step: `typecheck` declares `dependsOn: ["^build"]` in
# turbo.json, so `turbo typecheck` already builds every dependency package
# (e.g. `@dorkos/shared`) before typechecking anything that imports its dist —
# turbo computes and runs that from the task graph on its own. Skipping this
# would make the job either not build shared dists at all (false-red `TS6053`
# on every downstream import) or need a hand-maintained second build step that
# duplicates what turbo already does correctly.
#
# KNOWN GAPS: this only covers packages that declare a `typecheck` script.
# Every workspace package now declares one — `dorkos` (packages/cli, the
# published npm package) was the last holdout and joined in DOR-530, along
# with `@dorkos/icons` and `@dorkos/test-utils`. The two that still do not,
# `@dorkos/eslint-config` and `@dorkos/typescript-config`, contain no
# TypeScript source at all (plain `.js` and `.json`), so there is nothing for
# tsc to check. What that leaves uncovered:
#
#   - Root-level `scripts/*.ts`. They belong to no workspace package, and
#     turbo only runs package tasks (there is no `//#typecheck` root task), so
#     no tsconfig includes them and nothing here checks them.
#   - The test files quarantined in `apps/server/tsconfig.json`'s `exclude`.
#     That list is deliberate, shrink-only, and enforced by
#     `apps/server/src/__tests__/tsconfig-quarantine.test.ts`; see the comment
#     there for the rules.
#
# Anything added to this list is a real hole — say which files it leaves
# unchecked and why, rather than naming a package.
# `merge_group` is where this workflow finally does the job its header describes.
# The #488/#489 break it was written for was an INTERACTION between two PRs, each
# green alone against the base it branched from. A `pull_request` run cannot see
# that by construction: it only ever knows its own diff. The merge queue builds
# `main` + every PR ahead in the queue + this one and runs the checks against
# that combined tree, so the interaction is checked before anything lands rather
# than discovered on `main` afterwards.
#
# THE push-to-main LEG IS DROPPED (DOR-627 follow-up, 2026-09-02), matching
# `test` and now `lint`: this job is already required and already reports on
# `merge_group`, so the queue guarantees every commit that reaches `main`
# already ran it against the exact combined tree (squash rewrites the SHA,
# not the content). A push-to-main re-run would have been a same-answer
# rerun of a check the queue had already settled.
# THE MAIN CANARY (DOR-2150, plan §4.9): `schedule` and `workflow_dispatch`.
#
# This workflow gates the queue but never watches `main` afterwards, so a break
# that lands is invisible until the next PR is ejected by it. The canary is
# this workflow, unchanged, run against `main` HEAD four times a day. Every
# step here already runs on both events, so nothing needed rewriting: the one
# step that is `pull_request`-only (the ledger COVERAGE check, which needs a
# PR's diff and branch) simply does not run, as it does not in the queue.
#
# A scheduled run reports on no PR and no queue build, so it can neither block
# nor eject anything, and `scripts/assert-canary-ref.sh` runs first in the job
# so a dispatch aimed anywhere but `main` fails instead of posting this check
# on a pull request's head. The reasoning, the four slots and what their
# coverage is worth given GitHub's throttling are in test.yml's matching
# header; the cron here is the same four hours, offset by minutes so the four
# canary workflows do not ask for runners in the same second.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '29 0,5,10,21 * * *'
  workflow_dispatch:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a
# group and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. (Copied deliberately from test.yml, now that push-to-main is
# dropped here too — same reasoning, same fix.)
concurrency:
  # EVENT-AWARE, because of the canary. A `schedule` run and a
  # `workflow_dispatch --ref main` run share `github.ref`, so on one group the
  # on-demand leg would queue behind a scheduled round for up to half an hour —
  # and the two are correlated in time, because the reason to dispatch by hand
  # is usually the reason a round is already running. The suffix is constant
  # for `pull_request` and `merge_group`, so neither changes behaviour.
  group: typecheck-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # MEASURED, not inherited: this was `10` unchanged since the workflow's
    # first commit (PR #606, 2026-07-29) and never revisited — same shape as
    # `test`'s old 45-minute ceiling before DOR-1726. Job-level start/complete
    # (the time `timeout-minutes` actually governs, NOT workflow-run time,
    # which also counts runner-queue wait) over a 207-run sample of
    # merge_group `typecheck` jobs spanning 2026-08-11 through 2026-09-03:
    # 206 green, wall clock min 3.07 min, p50 4.62, p90 7.64, p95 7.83, max
    # 8.52. A 10-minute ceiling left the slowest sampled honest run under 1.5
    # minutes of margin, and that thin margin cashed out twice: PR #1280
    # (2026-08-25) and PR #1530 (2026-09-03) both hit "the job has exceeded
    # the maximum execution time of 10m0s" and were reported `cancelled`
    # ("the operation was canceled") with their typechecks still passing —
    # evicting a fully green entry from the merge queue on wall-clock alone,
    # not a defect. Normal duration for this job is 3-6 minutes.
    #
    # This job serves BOTH `pull_request` and `merge_group` with the SAME
    # full-monorepo `turbo typecheck` (see the KNOWN GAPS comment above), so
    # this ceiling is felt on both legs — unlike `test`, where the timeout
    # sits on a job that is a multi-minute shard fan-in on merge_group and a
    # much larger affected sweep on pull_request. `pull_request` runs here are
    # typically faster and tighter (own runner, no merge-queue rivals for the
    # same capacity), so the tail risk this ceiling exists to absorb is almost
    # entirely a `merge_group` one.
    #
    # 20, not more: leaves the slowest sampled honest run (8.52 min) over 11
    # minutes of room — comparable margin to DOR-1726's `test` ceiling — while
    # still killing a genuinely hung `tsc`/turbo process in a bounded time.
    # The merge queue's own check_response_timeout_minutes is 120, so this
    # cannot stall the queue either way (`main: merge queue` ruleset).
    #
    # Checked lint.yml (`timeout-minutes: 15`) and site-build.yml (`30`) for
    # the same trap: no merge_group `cancelled`/`timed_out` runs turned up for
    # either in the sampled history, so neither shows this failure class and
    # neither changes here. (DOR-1775)
    timeout-minutes: 20
    steps:
      # A canary run is against `main` or it is nothing, and this says so before
      # anything is installed. No `if:`: the script is a no-op on the gating
      # events, which keeps it out of the census allowlist. See its header.
      - name: A canary run is against main
        run: bash scripts/assert-canary-ref.sh
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Retired vocabulary in user-facing prose (DOR-1517). It rides THIS job
      # because `typecheck` is already a required status check and already
      # reports on `merge_group`, so a new workflow would go red without
      # blocking a merge until someone amended branch protection — and a gate
      # on a non-required check is not a gate. Needs no node_modules; it is
      # bash and grep over prose files.
      #
      # This is the second half of a deliberate split. Render-path strings in
      # app source are judged by scripts/check-vocab-gate.ts, which parses
      # TypeScript so it can tell copy from an identifier; it runs in
      # scripts-test.yml via its own pin suite. This step covers the prose and
      # data files that gate cannot read: READMEs, docs MDX, blog posts,
      # context7.json, the PWA manifest, and the generated openapi.json.
      - name: Retired-vocabulary gate — prose surfaces (DOR-1517)
        if: ${{ !cancelled() }}
        run: bash scripts/check-banned-words.sh

      # The other half of that split: render-path strings in app source, judged
      # by the TypeScript parser rather than grep (DOR-855 wave 1, DOR-1517
      # wave 2, DOR-1756 wave 3, DOR-1814 wave 4 — the four words ADR
      # 260804-021140 retired for "Connections").
      #
      # It rides THIS job because until DOR-1814 it rode nothing that could
      # stop a copy change. Its only CI home was the real-repo canary inside
      # scripts/__tests__/check-vocab-gate.test.ts, run by scripts-test.yml —
      # which is path-filtered to `scripts/**` and friends and carries no
      # `merge_group:` trigger. A PR that touched only apps/client/src copy
      # therefore never ran the gate at all, which is precisely the PR the gate
      # exists for. `typecheck` is unfiltered, required, and reports on
      # `merge_group`, so the guard now fails the merge rather than a workflow
      # nobody was watching. The canary test stays where it is: it pins the
      # mechanism, this step enforces the result.
      - name: Retired-vocabulary gate — app render paths (DOR-855)
        if: ${{ !cancelled() }}
        run: pnpm run check:vocab-gate

      # The public/private boundary (DOR-2024): a control-plane hostname, a
      # price or plan name, or anything else that belongs to the closed-source
      # side of DorkOS Cloud, reaching this repository's source or prose.
      # AGENTS.md ("## DorkOS Cloud") has stated that rule for months with
      # nothing enforcing it; a 2026-09-13 audit found two live examples.
      # Rides THIS job for the same reason the three gates above it do:
      # `typecheck` is already required and already reports on `merge_group`,
      # and a gate on a non-required check is not a gate.
      #
      # TWO TIERS, AND THE SECRET IS ONLY HALF OF IT. The committed shape
      # patterns (scripts/boundary/shape-rules.tsv) describe forms and are safe
      # to publish. The exact term list is private and arrives as the
      # organisation secret BOUNDARY_TERMS. A fork PR gets no secrets, so the
      # guard runs shape-only there and says so on stdout — one of
      # `boundary: mode=shape-only …` or `boundary: mode=shape+terms …` is
      # printed on every run, and neither line names a term.
      #
      # WHY `BOUNDARY_TERMS_REQUIRED` IS A SEPARATE, EXPLICIT SWITCH. GitHub
      # sets a missing secret to the EMPTY STRING, so emptiness alone cannot
      # distinguish "this is a fork" from "someone renamed the secret and the
      # gate has quietly been checking nothing". The repository/organisation
      # VARIABLE below is the operator's declaration that the secret exists;
      # with it set, an absent or empty ruleset fails the job (exit 2) instead
      # of silently downgrading. Until the operator sets it, this step enforces
      # the shape patterns only — which is also what keeps this PR from
      # deadlocking the merge queue on a secret that does not exist yet.
      #
      # WHO GETS NO SECRETS, and therefore must not be held to the full
      # ruleset. `github.event.pull_request.head.repo.fork` is null on
      # merge_group, so `!= true` is true there, which is correct: the queue is
      # never a fork. Dependabot is the trap: its PRs come from an IN-REPO
      # branch, so the fork test passes, but GitHub withholds repository
      # secrets from `dependabot[bot]`-actored `pull_request` runs — without
      # the actor test below, every dependency PR would exit 2 on a required
      # check and could never enter the queue.
      #
      # The variable is tested for non-emptiness rather than against '1', so an
      # operator who writes `true` or `yes` still gets enforcement instead of a
      # silent downgrade to shape-only — which is the hazard the switch exists
      # to prevent, not one it should introduce.
      #
      # Operator steps, in this order: contributing/boundary-guard.md.
      - name: Public/private boundary gate (DOR-2024)
        if: ${{ !cancelled() }}
        env:
          BOUNDARY_TERMS: ${{ secrets.BOUNDARY_TERMS }}
          BOUNDARY_REQUIRE_TERMS: ${{ (vars.BOUNDARY_TERMS_REQUIRED != '' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]') && '1' || '' }}
        run: pnpm run check:boundary

      # Raw NUL bytes pasted into text files (DOR-1561). Rides THIS job for
      # the same reason the gate above it does: `typecheck` is already a
      # required status check that reports on `merge_group`, and a gate on a
      # non-required check is not a gate. Needs only `git` and `perl`, both on
      # the runner already — no node_modules, and it runs in ~1-2s over the
      # whole repo.
      - name: Raw-NUL-byte gate — text files (DOR-1561)
        if: ${{ !cancelled() }}
        run: bash scripts/check-nul-bytes.sh

      # A ground-truth doc naming a path that no longer exists (DOR-1762) —
      # contributing/styling-theming.md once taught a dead `@/components/`
      # import alias as the ✅ pattern. Rides THIS job for the same reason as
      # the two gates above: needs no node_modules, and `typecheck` is already
      # required and already reports on `merge_group`.
      - name: Dead-path gate — ground-truth docs (DOR-1762)
        if: ${{ !cancelled() }}
        run: bash scripts/check-dead-doc-paths.sh

      # CI Steward census (plans/ci-steward-plan.md §4.2). Proves that ci/, the
      # pipeline's stated intent, matches the workflows, lefthook commands and
      # Claude hooks that actually run: every gate has a stated purpose in
      # ci/gates.yaml, every job has a timeout, every required context in
      # ci/required-checks.json can report on both pull_request and
      # merge_group with no path filter and no pass-by-skip (the deadlock
      # invariant), no required job hides a failure behind continue-on-error
      # or an unexplained step `if:`, and the generated required-checks blocks
      # in the docs match. Rides THIS job for the same reason the gates above
      # do: `typecheck` is required and reports on `merge_group`, so this needs
      # no new required context and adds no deadlock exposure. Plain Node over
      # a few dozen small files, about a second, no build.
      #
      # Invoked by path, never through a package.json script, on purpose: the
      # content ratchet `typecheck-runs-steward` in ci/ratchets.yaml matches
      # these exact command strings, and the root package.json sits outside
      # the steward's fence (ci/steward-owned-paths.json), so an alias there
      # could be quietly rewritten to a no-op.
      - name: CI Steward census
        if: ${{ !cancelled() }}
        run: node packages/ci-steward/src/cli.ts census

      # Validity of every ci/ledger entry (plan §4.3): frontmatter schema, id
      # equal to the file-name prefix, only hand states on main (verdicts live
      # on the ci-steward-data branch), a hypothesis naming a metric the
      # collector can compute, gates that exist. Runs on pull_request AND in
      # the queue, so a malformed entry cannot land.
      - name: CI Steward ledger check
        if: ${{ !cancelled() }}
        run: node packages/ci-steward/src/cli.ts ledger-check

      # Ledger COVERAGE, pull_request only: a PR that touches a gate source, a
      # script a gate invokes, turbo.json, lefthook.yml, .claude/settings.json,
      # ci/** or the creating-pull-requests skill must add or edit a
      # ci/ledger entry, and a `ci-improve/*` branch may not touch the
      # steward's own files. Like fragment coverage, it needs the PR's diff and
      # branch name, which cannot change between here and the queue.
      #
      # BLOCKING FROM DAY ONE (operator decision, 2026-09-19): a missing
      # entry fails the PR, with no warn-only trial period.
      #
      # DEPENDABOT IS EXEMPT. Its monthly actions group edits workflow files
      # and its npm group bumps package manifests, and it cannot write a
      # ledger entry, so without this its PRs would stay red forever. A
      # version bump is recorded by the Dependabot PR itself; a pipeline
      # change a person or agent makes on top of one still needs an entry.
      #
      # The base, adapted from changelog-fragment-check.yml's "Determine the
      # base" step: that job checks out the PR head with full history and asks
      # for the merge-base. This job keeps its cheap depth-1 checkout of the
      # PR's test-merge commit instead, fetches one more level, and diffs
      # against the merge commit's first parent, which is the base-branch tip
      # the PR was merged onto: the same diff, without the history.
      - name: CI Steward ledger coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          base="$(git rev-parse HEAD^1)"
          echo "base: $base"
          node packages/ci-steward/src/cli.ts ledger-check --coverage --base "$base" --branch "$HEAD_REF"

      # `!cancelled()` so an earlier gate's failure still reports every type
      # error in the same run, for the same reason the step below passes
      # `--continue`.
      - name: Typecheck every package that declares a typecheck script
        if: ${{ !cancelled() }}
        run: pnpm exec turbo typecheck --continue
