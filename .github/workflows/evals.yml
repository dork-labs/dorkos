name: Evals

# Eval cadence (spec `agent-trust`, task 3.5), scoped honestly to what runs
# credential-free in CI:
#
#   1. structural (per-PR)   — label-gated on `run-evals`. Two free runs on
#                              `--tier test-mode`: `--suite core` and
#                              `--suite rooms`. No model, minutes. Cases that
#                              declare a credentialed runtime are skipped, not
#                              run against the deterministic one.
#   2. structural (nightly)  — the same run on a schedule, so drift surfaces
#                              without anyone remembering to ask.
#   3. credentialed          — manual `workflow_dispatch` only. Runs the
#                              quarantined cases on `claude-code-cheap` and
#                              uploads `results.json` as evidence.
#
# A developer does not need this workflow to run a credentialed eval. `pnpm
# evals:local` runs the same suite on their own machine against their own Claude
# sign-in; see `packages/evals/README.md`. CI needs a secret because a runner has
# no sign-in of its own.
#
# Promotion out of quarantine stays a HUMAN decision made on that green
# evidence: the credentialed job publishes results and never edits code.
#
# CI budget discipline: there is deliberately NO automatic per-PR eval run. A PR
# runs evals only when someone applies the `run-evals` label.

on:
  pull_request:
    # `labeled` makes applying `run-evals` trigger a run immediately;
    # `synchronize` re-runs it on later pushes while the label is still on.
    #
    # Deliberately NO `paths:` filter: the label IS the filter. A path filter
    # would silently swallow a labeled run on a PR that only touches workflows
    # or docs, which is exactly when someone is trying to prove the job works.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 08:00 UTC daily (~midnight US Pacific) — off-peak for the shared runners.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Eval suite to run (core, smoke, rooms, memory, experimental, connector, all, or a case id)'
        required: false
        default: 'core'
      budget_usd:
        # REQUIRED on purpose. An empty value reached the shell as `--budget ""`,
        # which the CLI once read as NaN — and a NaN ceiling does not raise the
        # cap, it removes it (`total > NaN` is always false). The CLI now rejects
        # that outright; making the input required stops it being submitted at all.
        description: 'Hard spend ceiling for the run, in USD'
        required: true
        default: '3'

# Cancel superseded runs on the same ref for PRs only — nightly and dispatched
# runs each keep their own completed run as the record.
concurrency:
  group: evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  structural:
    name: Structural suite (test-mode)
    # Per-PR runs require the `run-evals` label; scheduled runs always go.
    # `workflow_dispatch` is handled by the credentialed job below.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-evals'))
    runs-on: ubuntu-latest
    # The suite itself is seconds; the headroom is for a cold pnpm/turbo cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The harness imports its workspace deps through their `exports` maps,
      # which point at `dist/` — so those dists must exist before the run, or
      # every case dies on a stale/missing build. `...` builds the dependency
      # closure (shared, db, test-utils, server, …), not just the leaf.
      - name: Build eval harness dependencies
        run: pnpm turbo build --filter=@dorkos/evals...

      # `--tier test-mode` boots the deterministic in-process runtime: no model,
      # no credentials, no spend. Cases that declare a credentialed runtime are
      # SKIPPED here (`skipped-wrong-tier`) rather than run against it — running
      # them produced a verdict about a model that was never asked.
      #
      # Read the GATING line at the bottom of the run's output before trusting a
      # green tick. It states how many of the cases this run STARTED could fail
      # it; today that is ONE (`widget-round-trip`), because every other core
      # case needs a real model. A green structural run means "the harness boots
      # and the one credential-free product case holds" — not "the product is
      # proven". A run that gates on ZERO cases FAILS rather than reporting green.
      - name: Run structural suite
        run: pnpm --filter @dorkos/evals run evals -- --suite core --tier test-mode --out "$RUNNER_TEMP/evals-runs"

      # A SECOND step rather than a longer selector: `--suite` takes one name,
      # and the rooms structural cases are deliberately not tagged `core` —
      # `core` is what `pnpm evals:local` runs against a real model, so a free
      # case tagged into it would spend on every local run.
      #
      # This prints FOUR cases and eight `skipped-wrong-tier` rows. The four
      # gate: they boot a real room on the test-mode runtime and assert on the
      # room's own event stream and its `room_turn_spend` rows — a mentioned
      # agent runs a turn, an unaddressed message runs none and costs nothing, a
      # burst collects into one charged turn, and Stop interrupts a live turn and
      # says so once. The eight are the suite's credentialed half; they declare a
      # real runtime, so the runner never starts them here rather than running
      # them against a scripted echo and reporting a verdict about a model that
      # was never asked (`runner/run-suite.ts`).
      - name: Run rooms structural suite
        run: pnpm --filter @dorkos/evals run evals -- --suite rooms --tier test-mode --out "$RUNNER_TEMP/evals-runs"

      # The `logs/**` line is a no-op HERE, not decoration: `test-mode` boots
      # in-process and never calls `initLogger` (`harness-boot.ts`), so a
      # structural run never has a `logs/` dir to retain (DOR-1241) in the
      # first place. It is kept for parity with the credentialed job below —
      # an empty match costs nothing, `if-no-files-found: warn` only fires
      # when EVERY line matches nothing, and drifting the two globs apart
      # invites forgetting the credentialed one if this job's boot path ever
      # changes.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-structural-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evals-runs/**/results.json
            ${{ runner.temp }}/evals-runs/**/logs/**
          retention-days: 14
          if-no-files-found: warn

  credentialed:
    name: Credentialed suite (claude-code-cheap)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Real model calls over several cases; the run budget is the real ceiling.
    timeout-minutes: 45
    steps:
      # A `secrets` context cannot be read from a job-level `if`, so the skip
      # decision is a step. Dry-running without either secret configured is a
      # first-class path: it reports clearly and the job ends green rather than
      # failing confusingly.
      #
      # TWO secret names are accepted, and BOTH are PINNED here rather than named
      # by a dispatch input. The pinning is the security property, not the count:
      # an earlier version let the caller name which secret to read, which meant a
      # stale or mistyped name would ship that credential to api.anthropic.com as
      # an auth header (auth fails, but the token has already landed in a third
      # party's request logs), and it was a ready-made exfil lever the moment a
      # second write-access collaborator exists. Adding a source means adding a
      # literal name here, never an input.
      #
      # `ANTHROPIC_API_KEY` wins when both are set, matching the runner's own
      # precedence (`packages/evals/src/runner/credentials.ts`).
      - name: Resolve model credential
        id: key
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using the model credential from the ANTHROPIC_API_KEY repository secret."
          elif [ -n "${OAUTH_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using the model credential from the CLAUDE_CODE_OAUTH_TOKEN repository secret."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Credentialed evals skipped::Neither the ANTHROPIC_API_KEY nor the CLAUDE_CODE_OAUTH_TOKEN repository secret has a value. Configure one to run the credentialed suite. Skipping — this is not a failure."
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.key.outputs.present == 'true'

      - name: Build eval harness dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm turbo build --filter=@dorkos/evals...

      # `--isolation child-process` is pinned deliberately: the docker isolation
      # tier needs a prebuilt eval image that CI does not have, and `auto` would
      # probe for a daemon and degrade anyway. Naming the honest path keeps the
      # run's containment legible instead of implied.
      #
      # This is the run that exercises the quarantined cases for real. Read the
      # uploaded results.json, then decide by hand whether to drop `quarantined`
      # from a case — the job never edits code.
      #
      # `suite` and `budget_usd` reach the shell as environment variables, never
      # as `${{ }}` interpolated into the script body: a dispatch input is
      # attacker-influenced text, and interpolating it would splice it straight
      # into the command (the standard Actions script-injection footgun). Quoted
      # shell vars are passed as data and cannot break out.
      - name: Run credentialed suite
        if: steps.key.outputs.present == 'true'
        env:
          # Both are exported; the runner picks between them in its documented
          # order and prints which one it used. An unset secret arrives as an
          # empty string, which the resolver treats as unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUITE: ${{ github.event.inputs.suite }}
          BUDGET_USD: ${{ github.event.inputs.budget_usd }}
        run: |
          pnpm --filter @dorkos/evals run evals -- \
            --suite "$SUITE" \
            --tier claude-code-cheap \
            --isolation child-process \
            --budget "$BUDGET_USD" \
            --out "$RUNNER_TEMP/evals-runs"

      # `always()` so a failed or over-budget run still publishes its evidence —
      # that transcript is the whole point of dispatching the job. This is the
      # run that exercises the quarantined cases for real, on an EPHEMERAL
      # runner: a retained sandbox here dies with the job, so the `logs/**`
      # line is the only way DOR-1241's retained server log (a quarantined
      # case's failure, exactly the one worth reading) leaves the runner at
      # all — without it the feature's headline value never survives the job,
      # unlike a local `pnpm evals:local` run where the sandbox itself
      # persists on disk until `pnpm evals:sweep`.
      - name: Upload results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-credentialed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evals-runs/**/results.json
            ${{ runner.temp }}/evals-runs/**/*.jsonl
            ${{ runner.temp }}/evals-runs/**/logs/**
          retention-days: 30
          if-no-files-found: warn
