name: Update Homebrew Formula

on:
  # One automatic trigger per release: the tag push (`v*`), which updates the
  # CLI formula once npm has the version. The dmg is NOT attached yet at this
  # point (desktop-release.yml spends 5-15+ min signing and notarizing), so
  # the cask step skips on this run.
  #
  # There used to be a second, `release: published`, meant to land the cask
  # bump. It never fired: desktop-release.yml publishes the release with
  # GITHUB_TOKEN, and GitHub starts no workflow for an event that token
  # caused. Every run on record (checked 2026-11-09) is a tag push. Under
  # DOR-4030 each run also asks Dorian to approve `release-publish`, so a
  # second trigger would only add a click; it was removed. The cask bump is
  # a manual run from the release tag once the dmg is attached.
  #
  # `workflow_dispatch` works only for manual runs started from a `v*` tag:
  # the `release-publish` environment deploys nothing else, main included
  # (DOR-4030).
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., 1.2.3). Leave empty to use latest from npm.'
        required: false

# Opt into Node 24 for every JavaScript-based action (checkout) ahead of
# GitHub's Sept 2026 hard cutoff for Node 20 runtime. See
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # DOR-4030: the tap is updated only for a commit on main. GITHUB_SHA is the
  # tag's commit, on a tag push or a manual run from the tag. Only the commit graph is fetched (tree:0), anonymously,
  # so this job reads no secret and holds no token. It is a backstop: the tap
  # token's real lock is the `release-publish` environment on update-formula.
  tag-is-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fail unless this commit is on main
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/main-check"
          git -C "$RUNNER_TEMP/main-check" remote add origin "$REPO_URL"
          git -C "$RUNNER_TEMP/main-check" fetch -q --no-tags --filter=tree:0 origin \
            "+refs/heads/main:refs/remotes/origin/main" "$GITHUB_SHA"
          if ! git -C "$RUNNER_TEMP/main-check" merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} (${GITHUB_REF}) is not on main. The Homebrew tap is updated only for commits on main; nothing was pushed."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main."

  update-formula:
    needs: tag-is-on-main
    # Publishes, so it runs only on a `v*` tag (DOR-4030; the census's tag gate checks this line).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # HOMEBREW_TAP_TOKEN lives only in the `release-publish` environment
    # (DOR-4030), which needs Dorian's approval and deploys only `v*` tags. A
    # manual run must start from a `v*` tag.
    environment: release-publish
    # Read-only: the tap push uses HOMEBREW_TAP_TOKEN, and this token only
    # reads this repository's releases for the cask step.
    permissions:
      contents: read
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 10 completed
    # runs over 2026-08-22..09-14, p95 30.38 min, max 30.38. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 92
    steps:
      # The version reaches shells and sed replacements below, and a git ref or
      # an input may hold `; | $ ( ) "`, so it must be a plain release version
      # or nothing runs (DOR-4030). Later steps read it from `env:`, never
      # `${{ }}` in a script.
      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Tag run: derive the version from the pushed tag (strip the `v`).
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(npm view dorkos version)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a release version (X.Y.Z or X.Y.Z-pre); the tap was not touched."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Updating Homebrew formula to v$VERSION"

      # On a tag run the tag is pushed before npm publish finishes, so wait for
      # the exact version to land on npm before computing its tarball SHA (the
      # tarball 404s until then). Skipped for workflow_dispatch, which either
      # names an already-published version or reads npm's current latest — keeping manual runs
      # byte-for-byte as before. Shares scripts/wait-for-npm.sh with
      # publish-docker.yml's "Wait for npm package availability" step
      # (DOR-1606) rather than carrying its own copy of the loop.
      - name: Checkout for the shared npm-wait script
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/wait-for-npm.sh

      - name: Wait for npm package availability
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/wait-for-npm.sh "$VERSION"

      - name: Compute SHA256
        id: sha
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL_URL="https://registry.npmjs.org/dorkos/-/dorkos-${PKG_VERSION}.tgz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d ' ' -f 1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: dork-labs/homebrew-dorkos
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          sed -i "s|url \"https://registry.npmjs.org/dorkos/-/dorkos-.*\.tgz\"|url \"https://registry.npmjs.org/dorkos/-/dorkos-${PKG_VERSION}.tgz\"|" Formula/dorkos.rb
          sed -i "s|sha256 \".*\"|sha256 \"${PKG_SHA256}\"|" Formula/dorkos.rb
          sed -i "s|version \".*\"|version \"${PKG_VERSION}\"|" Formula/dorkos.rb

      # Bump the desktop cask too, when it's ready. The cask
      # (Casks/dorkos-desktop.rb — `dorkos` is owned by the CLI formula) is
      # added to the tap separately, and desktop builds can lag a CLI release,
      # so this step SKIPS GRACEFULLY when either the cask file is absent from
      # the tap OR the GitHub release for this version has no macOS .dmg asset
      # yet — the CLI formula update still lands on its own. On the tag-push
      # run the dmg is never attached yet (see the trigger comment up top), so
      # the skip path is expected there; a manual run from the tag, once the
      # dmg is attached, is the one that lands the cask bump.
      #
      # When both are present: download the dmg, compute its sha256, and rewrite
      # the cask's `version` + `sha256` fields (the cask's `url` interpolates
      # #{version}, so it follows automatically). The dmg asset name is
      # DorkOS-<version>-arm64.dmg — the `dmg.artifactName` in
      # apps/desktop/electron-builder.yml, confirmed against the real v0.48.0
      # release assets.
      - name: Update desktop cask (if ready)
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f Casks/dorkos-desktop.rb ]; then
            echo "Casks/dorkos-desktop.rb not present in the tap yet — skipping cask update (desktop builds can lag CLI releases)."
            exit 0
          fi

          tag="v${PKG_VERSION}"
          dmg_name="DorkOS-${PKG_VERSION}-arm64.dmg"
          if ! gh release view "$tag" --repo dork-labs/dorkos --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -qx "$dmg_name"; then
            echo "No ${dmg_name} on release ${tag} yet — skipping cask update (desktop builds can lag CLI releases)."
            exit 0
          fi

          echo "Found ${dmg_name}; updating the cask."
          gh release download "$tag" --repo dork-labs/dorkos \
            --pattern "$dmg_name" --dir "$RUNNER_TEMP" --clobber
          DMG_SHA256=$(shasum -a 256 "$RUNNER_TEMP/$dmg_name" | cut -d ' ' -f 1)
          echo "dmg sha256: $DMG_SHA256"
          rm -f "$RUNNER_TEMP/$dmg_name"

          sed -i "s|version \".*\"|version \"${PKG_VERSION}\"|" Casks/dorkos-desktop.rb
          # The greedy sha256 pattern is safe only while the cask is
          # single-arch (one sha256 line); revisit if an on_intel/on_arm
          # split is ever added.
          sed -i "s|sha256 \".*\"|sha256 \"${DMG_SHA256}\"|" Casks/dorkos-desktop.rb

      - name: Commit and push
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dorkos.rb
          # Stage the cask too when it exists; a no-op if this run left it
          # unchanged (cask absent, or no dmg asset yet).
          if [ -f Casks/dorkos-desktop.rb ]; then
            git add Casks/dorkos-desktop.rb
          fi
          # Idempotent: a manual re-run after the tag push may change nothing
          # (the formula is already bumped and the cask unchanged), so log and
          # exit cleanly instead of letting `git commit` fail.
          if git diff --cached --quiet; then
            echo "Nothing to update — tap already at ${PKG_VERSION}."
            exit 0
          fi
          git commit -m "Update dorkos to ${PKG_VERSION}"
          git push
