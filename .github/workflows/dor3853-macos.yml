name: DOR-3853 macOS evidence

# Temporary, non-required, never-merged draft. No secrets or login required.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dor3853-macos.yml
      - apps/server/src/services/runtimes/codex/app-server/__tests__/dor3853.binary.test.ts

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  macos-evidence:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DORKOS_TEST_RUNTIME: 'true'
    steps:
      - name: Set isolated CI paths
        run: |
          echo "DORK_HOME=$RUNNER_TEMP/dor3853-dork-home" >> "$GITHUB_ENV"
          echo "DOR3853_OUT=$RUNNER_TEMP/dor3853-out" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install the PATH rg witness dependency
        run: brew install ripgrep
      - name: Record host and rg version
        run: |
          mkdir -p "$DOR3853_OUT"
          sw_vers > "$DOR3853_OUT/platform.txt"
          uname -m >> "$DOR3853_OUT/platform.txt"
          rg --version >> "$DOR3853_OUT/platform.txt"
      # bwrap/AppArmor are Linux-only; macOS uses its native sandbox.
      - name: Build workspace dependencies in CI only
        run: pnpm exec turbo run build --filter='@dorkos/server^...'
      - name: Original readable controls, all three modes and both transports
        id: readable
        continue-on-error: true
        run: pnpm vitest run apps/server/src/services/runtimes/codex/app-server/__tests__/app-server.binary.test.ts --testNamePattern='protects fake secrets through' --reporter=default --reporter=json --outputFile=${{ runner.temp }}/dor3853-out/readable-original.json
      - name: macOS readable and chmod-000 controls at each mode
        id: probe
        continue-on-error: true
        run: pnpm vitest run apps/server/src/services/runtimes/codex/app-server/__tests__/dor3853.binary.test.ts --reporter=default --reporter=json --outputFile=${{ runner.temp }}/dor3853-out/macos-matrix.json
      - name: Require executed rows and successful native assertions
        if: always()
        env:
          READABLE: ${{ steps.readable.outcome }}
          PROBE: ${{ steps.probe.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          assert.equal(process.env.READABLE, 'success');
          assert.equal(process.env.PROBE, 'success');
          for (const [file, count] of [['readable-original.json', 2], ['macos-matrix.json', 6]]) {
            const report = JSON.parse(fs.readFileSync(`${process.env.DOR3853_OUT}/${file}`, 'utf8'));
            const rows = report.testResults.flatMap(s => s.assertionResults).filter(t => t.status !== 'pending');
            assert.equal(rows.length, count, `${file}: missing/extra rows`);
            assert(rows.every(t => t.status === 'passed'), `${file}: a row failed`);
          }
          NODE
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dor3853-macos-evidence
          path: ${{ runner.temp }}/dor3853-out
          if-no-files-found: error
          retention-days: 14
