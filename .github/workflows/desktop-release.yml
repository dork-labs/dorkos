name: Desktop Release

# Rides the unified `v*` product release tags (the same tags `/system:release`
# creates). When that command bumps VERSION, commits, tags `vX.Y.Z`, and pushes,
# this workflow builds two independent platform packages and ATTACHES their
# assets to the GitHub Release the command already created — it never creates
# its own release or rewrites the human-written notes:
#
#   - macOS (build-macos): signs + notarizes the arm64 app, attaches
#     .dmg + .zip + .blockmap + latest-mac.yml. electron-updater (Squirrel.Mac)
#     reads the .zip as the update payload and the .blockmap for differential
#     (delta) downloads; the .dmg is the human-facing installer.
#   - Windows (build-windows): packages an UNSIGNED x64 NSIS installer
#     (signing is a business-gated follow-up — see
#     specs/desktop-windows-support/02-specification.md "Decision: signing"),
#     attaches .exe + latest.yml + .blockmap. electron-updater (NSIS updater)
#     reads latest.yml to find the update payload; without it, update checks
#     404. The .exe is the human-facing installer.
#
# `/system:release` creates the release as a DRAFT (Phase 6.11, --draft).
# electron-updater ignores draft releases, so clients keep seeing the previous
# release as the latest — and correctly report "up to date" — until a release is
# published. The two build jobs ATTACH their assets to that draft (attach-only:
# they never create a release, flip the draft flag, or rewrite the human-written
# notes). Each build job verifies its own installer on its own runner BEFORE
# attaching it ("Verify the macOS app bundle", "Verify the Windows installer"),
# so a broken installer is never attached at all.
#
# TWO JOBS, ONE RUNNER EACH (DOR-2728). Verification and publishing used to be
# three more jobs (verify-macos, verify-windows, publish-release). Each needed a
# fresh runner, and each runner assignment is a place a release can stall: on
# v0.98.0, during a GitHub runner-assignment incident, verify-macos waited 10.7
# min for a Mac and publish-release never got a runner at all. The checks were
# the same commands against the same files, so they now run as steps after the
# package step, and publishing is the last step of build-macos. Nothing they
# enforced was dropped; ci/ledger/*-desktop-release-one-runner-per-platform.md
# records the change and the metric that judges it.
#
# ASYMMETRIC gating — macOS gates, Windows does not. macOS is the shipped,
# signed + notarized surface, so the release is published only by build-macos's
# last step, which runs only when every earlier step (package, verify, attach)
# passed. The Windows build is an explicitly-unverified early alpha (AGENTS.md —
# labeled alpha, behind the demo-claim gate), so build-windows is
# `continue-on-error: true`: it still runs and surfaces problems in the run, but
# a Windows failure must never hold back an otherwise-good macOS release. The
# publish step first waits for build-windows to FINISH, whatever its outcome, so
# on the happy path every asset (installer + latest*.yml) is attached before the
# release is visible and an update check can never 404 on a not-yet-uploaded
# metadata file. If the Windows verify step fails, the Windows assets are
# never attached (before DOR-2728 a broken installer was attached and shipped),
# so the release goes out macOS-only and Windows update checks 404 until the
# next release; dorkos.ai/download/windows falls back to the newest release
# that has an .exe.
#
# A desktop failure never unwinds the CLI/product release (that release is
# published by /system:release's own npm + changelog path). If build-macos
# fails, the desktop-facing GitHub Release stays an unpublished DRAFT (the safe
# outcome — electron-updater ignores drafts, so users keep the previous version)
# until a human re-runs the failed job from the Actions UI; the publish step is
# idempotent (--draft=false on a published release is a no-op).
#
# `workflow_dispatch` builds and verifies both apps without attaching or
# publishing: off a tag (or with `dry_run`), the publish step rehearses (waits
# for build-windows, then says what it would publish) and changes nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not publish)'
        type: boolean
        default: false

# Opt into Node 24 for every JavaScript-based action (checkout, setup-node,
# upload-artifact, action-gh-release, etc.) ahead of GitHub's Sept 2026 hard
# cutoff for Node 20 runtime. See
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-macos:
    runs-on: macos-latest
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 9 completed
    # runs over 2026-08-22..09-14, p95 18.38 min, max 18.38. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 56
    permissions:
      contents: write
      # The publish step reads this run's own jobs list to wait for
      # build-windows to finish.
      actions: read
    steps:
      # The publish step's wait budget is measured from here: see its comment.
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop app
        # Through turbo (not a bare pnpm --filter run) so workspace
        # dependencies build first (^build): the renderer imports
        # @dorkos/extension-api and friends, whose exports resolve to dist/
        # — absent on a fresh runner unless the dependency graph builds.
        #
        # Heap ceiling: the same one desktop-smoke.yml sets, for the same
        # reason, and its comment holds the measurements. Both Vite builds in
        # this graph (the client's and the desktop renderer's) peak above the
        # ~2 GB default Node picks on this 7 GB runner; desktop-smoke.yml's
        # identical build died there 27 times in 98 main runs, 09-29..10-01.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec turbo build --filter=@dorkos/desktop

      # Flips better-sqlite3/node-pty to Electron's ABI right before
      # packaging (electron-builder.yml has npmRebuild: false — see
      # scripts/rebuild-natives.ts for why its built-in rebuild is bypassed).
      # Deliberately NOT part of `pnpm build`: on a dev machine that flip
      # poisons the shared pnpm store for plain-Node vitest monorepo-wide.
      - name: Rebuild native modules for Electron
        run: pnpm --filter @dorkos/desktop exec tsx scripts/rebuild-natives.ts

      - name: Package DMG (unsigned)
        if: ${{ !vars.APPLE_DEVELOPER_CONFIGURED }}
        run: |
          cd apps/desktop
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package DMG (signed + notarized)
        if: ${{ vars.APPLE_DEVELOPER_CONFIGURED == 'true' }}
        run: |
          cd apps/desktop
          npx electron-builder --mac --arm64 --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      # The gate that used to be the verify-macos job, unchanged except that it
      # reads the .dmg where the package step wrote it instead of downloading
      # the artifact on a second runner. It runs BEFORE upload and attach, so a
      # .dmg that fails it is never attached to the release.
      - name: Verify the macOS app bundle
        # spctl's Gatekeeper assessment only makes sense for a real Developer ID
        # signature, so it is gated on the SAME repo variable that chooses the
        # signed vs unsigned package step above (APPLE_DEVELOPER_CONFIGURED).
        # codesign --verify runs unconditionally: electron-builder ad-hoc-signs
        # the arm64 app even when unsigned (arm64 binaries must carry at least an
        # ad-hoc signature to run), and --verify checks structural integrity, not
        # trust — so it passes for ad-hoc and Developer ID alike. Neither check
        # reads the signing keychain the package step used: codesign checks the
        # bundle against itself and spctl against Apple's roots and the
        # notarization ticket, so this runner gives the same answer a clean one
        # would.
        env:
          APPLE_DEVELOPER_CONFIGURED: ${{ vars.APPLE_DEVELOPER_CONFIGURED }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/release/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg found in apps/desktop/release." >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          echo "Attaching ${dmg}…"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          apps=("$mount_dir"/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app bundle found inside ${dmg}." >&2
            exit 1
          fi
          app="${apps[0]}"
          echo "Found app bundle: ${app}"

          echo "Verifying code signature (structural integrity)…"
          if ! codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "::error::codesign --verify --deep --strict failed for ${app}." >&2
            exit 1
          fi

          if [ "${APPLE_DEVELOPER_CONFIGURED:-}" = "true" ]; then
            echo "Signed build — asserting Gatekeeper acceptance…"
            if ! spctl --assess --type execute --verbose=4 "$app"; then
              echo "::error::spctl --assess rejected ${app}; a signed build must pass Gatekeeper." >&2
              exit 1
            fi
          else
            echo "Unsigned build (APPLE_DEVELOPER_CONFIGURED != true) — skipping spctl Gatekeeper assessment."
          fi
          echo "macOS artifact verification passed."

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: DorkOS-macOS-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap

      # Attaches the macOS artifacts to the vX.Y.Z release that /system:release
      # created (Phase 6.11). This step is ATTACH-ONLY on purpose: `gh release
      # upload` uploads assets to an existing release without ever creating one,
      # touching the draft flag, or regenerating notes — so the human-written
      # narrative notes always survive. It deliberately does NOT use
      # action-gh-release, which would CREATE a release when none exists yet and
      # could win a race against Phase 6.11, minting a bare, notes-less release.
      #
      # Ordering: /system:release pushes the tag (Phase 6.10, triggers this run)
      # then creates the release (Phase 6.11) seconds-to-minutes later, while
      # this job spends many minutes signing + notarizing before it reaches this
      # step — so the release is normally already present. The poll below only
      # covers a slow operator, and FAILS LOUDLY if the release is still absent
      # (Phase 6.11 skipped): a red run is the correct signal, not a silent bare
      # release. The release is created as a DRAFT; the "Publish the release"
      # step below flips it to published once both platform builds finish, which
      # is what makes dorkos.ai/download/mac resolve the .dmg.
      #
      # The .zip must ship alongside the .dmg: latest-mac.yml points
      # electron-updater (Squirrel.Mac) at the zip as the update payload, so
      # a release without it 404s every auto-update check. The dmg is only
      # the human-facing installer. The .blockmap files (one per target) enable
      # differential (delta) downloads for Squirrel.Mac auto-updates — without
      # them electron-updater logs "Cannot download differentially… status 404"
      # and falls back to a full download every time (confirmed in a real
      # user's log).
      - name: Attach macOS artifacts to the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Wait up to ~10 min for the release (created in /system:release
          # Phase 6.11) to exist. Never create it here.
          found=""
          for attempt in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then
              found=1
              break
            fi
            echo "Release $tag not found yet (attempt $attempt/30); waiting 20s…"
            sleep 20
          done
          if [ -z "$found" ]; then
            echo "::error::Release $tag does not exist. /system:release Phase 6.11 must create the GitHub Release before the desktop build can attach to it; this workflow will not mint a bare release (it would drop the human-written notes)." >&2
            exit 1
          fi
          gh release upload "$tag" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/*.blockmap \
            apps/desktop/release/latest-mac.yml \
            --clobber

      # Flip the draft release (created by /system:release Phase 6.11 with
      # --draft) to published. This is what closes the auto-update window
      # described in the file header: until it runs, electron-updater sees the
      # previous release as latest and reports "up to date".
      #
      # It was its own ubuntu job until DOR-2728, and on v0.98.0 that job never
      # got a runner. As the last step here it needs none: reaching it means
      # the package, verify and attach steps above all passed, which is the
      # whole macOS gate.
      #
      # First it waits for build-windows to FINISH, with any outcome, so the
      # Windows installer and latest.yml are attached before the release is
      # visible. The old publish-release job got that from `needs:`, which
      # waits without limit. A step cannot: it lives inside this job's 56-min
      # timeout, and `timeout-minutes` counts from when a runner picks a job
      # up, so a build-windows stuck QUEUED (the v0.98.0 incident) can outlast
      # any cap. So the wait spends this job's own remaining budget: it keeps
      # polling until 50 min after this job started (see "Record job start"),
      # leaving 6 min to publish. Only past that does it publish without the
      # Windows assets, with a warning, because the Windows alpha must never
      # hold back the macOS release. Windows update checks then 404 on
      # latest.yml until build-windows attaches it; re-run build-windows.
      #
      # build-windows is found by its job id as the jobs API names it. Give
      # that job a `name:` and this lookup must change with it: on a first
      # attempt a missing build-windows is warned about, never silently passed.
      #
      # If this step fails, publish by hand (`gh release edit vX.Y.Z
      # --draft=false`) rather than re-running this job: a re-run repeats the
      # whole build and notarization.
      #
      # Off a tag, or with dry_run, it does the wait and stops before changing
      # anything, so a workflow_dispatch run rehearses the whole path.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
        run: |
          set -euo pipefail
          jobs_api="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs"
          deadline=$(( ${JOB_STARTED_AT:?Record job start must run first} + 50 * 60 ))
          while :; do
            # A failed read is retried, never treated as "finished".
            if ! status="$(gh api "$jobs_api" --jq '[.jobs[] | select(.name == "build-windows") | .status] | first // "absent"' 2>/dev/null)"; then
              status=unknown
            fi
            case "$status" in
              completed)
                echo "build-windows finished."
                break
                ;;
              absent)
                if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
                  echo "::warning::No job named build-windows in this run; publishing without waiting for it. Was the job renamed?"
                else
                  echo "build-windows was not re-run in attempt ${GITHUB_RUN_ATTEMPT}; nothing to wait for."
                fi
                break
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::build-windows still '${status}' 50 min after this job started; publishing without the Windows assets. Re-run build-windows to attach them."
              break
            fi
            echo "build-windows is '${status}'; checking again in 20s…"
            sleep 20
          done

          tag="${GITHUB_REF_NAME}"
          if [ "$PUBLISH" != "true" ]; then
            echo "Rehearsal (not a tag push, or dry_run): would publish release '${tag}'. Changed nothing."
            exit 0
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag does not exist. /system:release Phase 6.11 must create it (as a draft) before this workflow can publish it." >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published release $tag."

  build-windows:
    # Non-gating: the Windows build is an explicitly-unverified early alpha
    # (see AGENTS.md — labeled alpha, behind the demo-claim gate). It runs the
    # installer check so a failure is visible in the run, but it must never
    # block publishing an otherwise-good release. build-macos's publish step
    # waits for this job to finish, whatever its outcome, so the Windows assets
    # are attached first; continue-on-error keeps a failure here from turning
    # the run red in a way that reads as a failed release.
    continue-on-error: true
    # build-macos's publish step finds this job by the name the jobs API
    # reports, which is this id while no `name:` is set. Keep it that way, or
    # change that lookup with it.
    # Pinned to windows-2022, NOT windows-latest, on purpose. windows-latest now
    # ships Visual Studio 18 (2026), and node-gyp 11.x — which @electron/rebuild
    # uses to force-compile better-sqlite3 + node-pty against Electron's ABI —
    # does not yet recognize VS 18: its VisualStudioFinder rejects the unknown
    # version and fails with "Could not find any Visual Studio installation to
    # use", even with the vcvars environment fully set up. windows-2022 ships
    # VS 2022 (v17), which node-gyp detects natively. Revisit windows-latest
    # once node-gyp ships VS 18 support.
    runs-on: windows-2022
    # Measured, not guessed (CI Steward phase 0, 2026-09-19): 9 completed
    # runs over 2026-08-22..09-14, p95 12.90 min, max 12.90. Ceiling =
    # max(10, ceil(3 x p95)). Raise it only with new data and a ci/ledger entry.
    timeout-minutes: 39
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop app
        # Through turbo (not a bare pnpm --filter run) so workspace
        # dependencies build first (^build): the renderer imports
        # @dorkos/extension-api and friends, whose exports resolve to dist/
        # — absent on a fresh runner unless the dependency graph builds.
        #
        # Heap ceiling: set to match the macOS job (see desktop-smoke.yml for
        # the measurements). This 16 GB runner's default is already about
        # this size, so it changes nothing today; it is pinned so the
        # Windows build does not depend on whatever default the next runner
        # image picks.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec turbo build --filter=@dorkos/desktop

      # Flips better-sqlite3/node-pty to Electron's ABI right before
      # packaging (electron-builder.yml has npmRebuild: false — see
      # scripts/rebuild-natives.ts for why its built-in rebuild is bypassed).
      # Deliberately NOT part of `pnpm build`: on a dev machine that flip
      # poisons the shared pnpm store for plain-Node vitest monorepo-wide.
      - name: Rebuild native modules for Electron
        run: pnpm --filter @dorkos/desktop exec tsx scripts/rebuild-natives.ts

      # windows-latest's default `run:` shell is pwsh; the multi-line
      # `cd && npx …` scripts below use POSIX syntax, so pin bash explicitly
      # (GitHub Actions runs it via the Git for Windows bash that ships on
      # windows-latest — no extra setup needed) to keep these steps
      # byte-for-byte comparable with the macOS job's steps.
      #
      # Unsigned for the alpha (see
      # specs/desktop-windows-support/02-specification.md "Decision: signing").
      # This is a SINGLE unconditional step on purpose: unlike the macOS job —
      # whose signed/unsigned split carries a real behavioral difference
      # (Apple codesign env vs CSC_IDENTITY_AUTO_DISCOVERY=false) — Windows has
      # no signing wired yet, so a parallel "signed" branch here would be
      # byte-for-byte identical to this one. That is a trap: flipping
      # AZURE_SIGNING_CONFIGURED would run a step labeled "signed" that still
      # emits an UNSIGNED artifact. So we keep one honest step now and leave
      # the seam as this comment. The Azure Artifact Signing follow-up is a
      # drop-in: add an `azure/login` OIDC step ahead of this one and a
      # win.azureSignOptions block in electron-builder.yml, then electron-
      # builder signs during packaging — no `if:` gymnastics needed.
      - name: Package Windows installer (unsigned)
        shell: bash
        run: |
          cd apps/desktop
          npx electron-builder --win --x64 --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gate that used to be the verify-windows job, unchanged except that
      # it runs the installer the package step just wrote instead of
      # downloading the artifact on a second runner (windows-latest then; this
      # windows-2022 runner now, which matters only for compiling native
      # modules, and this step compiles nothing). It runs BEFORE upload and
      # attach, so an installer that fails it is never attached.
      - name: Verify the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path apps/desktop/release -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error 'No .exe installer found in apps/desktop/release.'
            exit 1
          }
          Write-Host "Running silent install of $($exe.FullName)…"
          # electron-builder's NSIS installer supports /S for a silent install.
          # oneClick is false, but /S forces the silent path and installs to the
          # default location. Note: electron-builder's NSIS defaults include
          # runAfterFinish=true, so the silent install may auto-launch the app
          # in the background — harmless on a throwaway runner; this step only
          # tracks the installer process, never the app.
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -PassThru
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill()
            Write-Error 'Installer did not finish within 180s.'
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($proc.ExitCode)."
            exit 1
          }
          # electron-builder NSIS default per-user install dir (perMachine: false
          # in apps/desktop/electron-builder.yml) is
          # %LOCALAPPDATA%\Programs\<productName>; productName is DorkOS, so the
          # launcher is DorkOS.exe there.
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\DorkOS'
          $appExe = Join-Path $installDir 'DorkOS.exe'
          if (-not (Test-Path $appExe)) {
            if (Test-Path $installDir) {
              Write-Host "Contents of ${installDir}:"
              Get-ChildItem -Recurse $installDir | Select-Object -First 50 | Format-Table FullName
            }
            Write-Error "Expected installed executable not found at $appExe."
            exit 1
          }
          Write-Host "Windows installer verification passed: $appExe exists."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: DorkOS-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap

      # Attaches the Windows artifacts to the vX.Y.Z release that
      # /system:release created (Phase 6.11), mirroring "Attach macOS
      # artifacts to the release" above — same attach-only rationale, same
      # poll-for-release loop, same fail-loud-if-release-absent behavior. See
      # that step's comment for the full explanation; only the platform and
      # asset globs differ here.
      #
      # latest.yml must ship alongside the .exe: it's electron-updater's
      # (NSIS updater's) update manifest, and a release without it 404s every
      # auto-update check on Windows — the .exe is only the human-facing
      # installer. The .blockmap enables differential (delta) downloads for
      # NSIS auto-updates.
      - name: Attach Windows artifacts to the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Wait up to ~10 min for the release (created in /system:release
          # Phase 6.11) to exist. Never create it here.
          found=""
          for attempt in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then
              found=1
              break
            fi
            echo "Release $tag not found yet (attempt $attempt/30); waiting 20s…"
            sleep 20
          done
          if [ -z "$found" ]; then
            echo "::error::Release $tag does not exist. /system:release Phase 6.11 must create the GitHub Release before the desktop build can attach to it; this workflow will not mint a bare release (it would drop the human-written notes)." >&2
            exit 1
          fi
          gh release upload "$tag" \
            apps/desktop/release/*.exe \
            apps/desktop/release/latest.yml \
            apps/desktop/release/*.blockmap \
            --clobber
