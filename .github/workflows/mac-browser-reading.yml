name: Mac Browser Reading

# An on-demand reading of the Agent browser's managed Chromium on macOS, for a
# Playwright bump. Linux showed an alpha Playwright letting Chromium upgrade
# http:// pages (DOR-3884); this reads whether the Mac does the same, without
# launching a browser on anyone's Mac login.
#
# It runs CI's own cli-tarball for the exact commit named, on the test runtime,
# with no account and no secrets. Made-up hosts only, in this runner's /etc/hosts.
# It never checks out or builds the named commit: the scripts come from the ref
# this workflow runs on, and the commit's code runs only as its built tarball.
#
# NOT a required check: it holds a macOS runner, the scarcest GitHub-hosted
# resource, so it runs when a person asks. The tarball lives one day
# (cli-smoke-test.yml, retention-days: 1), so dispatch it within a day of the push.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit that has a cli-tarball from CLI Smoke Test
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  read:
    runs-on: macos-latest
    # Two self-test runs on 2026-11-04 took under 4 minutes. 25 leaves room for a slow
    # runner and a cold browser download; lower it once there are more runs.
    timeout-minutes: 25
    permissions:
      contents: read
      # Only to read the cli-tarball artifact from the CLI Smoke Test run.
      actions: read
    env:
      READING_SHA: ${{ inputs.sha }}
      SCRIPTS: .github/scripts/mac-browser-reading
    steps:
      - name: Refuse anything but a full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$READING_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Test the verdict
        run: node --test "$SCRIPTS/verdict.test.mjs"

      - name: Fetch CI's tarball for exactly that commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$READING_SHA" --workflow cli-smoke-test.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run_id" ]] || { echo "::error::No CLI Smoke Test run for $READING_SHA"; exit 1; }
          # A run from a fork could carry the same commit id under someone else's build.
          read -r head_sha head_repo < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '"\(.head_sha) \(.head_repository.full_name)"')
          [[ "$head_sha" == "$READING_SHA" && "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::Run $run_id is $head_sha from $head_repo"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tarball"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n cli-tarball -D "$RUNNER_TEMP/tarball" || {
            echo "::error::Run $run_id has no cli-tarball. It lasts a day; push again or use a newer commit."; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          { echo "run $run_id"; shasum -a 256 "$RUNNER_TEMP"/tarball/dorkos-*.tgz; } | tee "$RUNNER_TEMP/out/tarball.txt"

      - name: Install it and its browser, in a sealed home
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          npm install -g --prefix "$home/cli" "$RUNNER_TEMP"/tarball/dorkos-*.tgz
          cli="$home/cli/lib/node_modules/dorkos"
          {
            echo "READING_HOME=$home"
            echo "READING_CLI=$cli"
            echo "PLAYWRIGHT_BROWSERS_PATH=$home/browsers"
          } >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$home/browsers" node "$cli/node_modules/playwright-core/cli.js" install chromium
          node "$SCRIPTS/patch-bundle.mjs" "$cli/dist/server/index.js" "$PWD/$SCRIPTS/scenario.mjs"

      - name: Serve the made-up hosts on 80 and 443
        shell: bash
        run: |
          set -euo pipefail
          ca="$RUNNER_TEMP/ca"
          mkdir -p "$ca"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$ca/ca.key" -out "$ca/ca.crt" -days 2 -subj "/CN=Made Up Reading CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout "$ca/site.key" -out "$ca/site.csr" -subj "/CN=both.example.com" 2>/dev/null
          printf 'subjectAltName=DNS:both.example.com\n' > "$ca/ext"
          openssl x509 -req -in "$ca/site.csr" -CA "$ca/ca.crt" -CAkey "$ca/ca.key" -CAcreateserial -out "$ca/site.crt" -days 2 -extfile "$ca/ext" 2>/dev/null
          # Trusted, or an upgrade to https would fail for the certificate and hide what it would do.
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$ca/ca.crt"
          # macOS has only 127.0.0.1 until asked. The http-only host needs an address with nothing on 443.
          sudo ifconfig lo0 alias 127.0.0.2 up
          printf '127.0.0.1 both.example.com\n127.0.0.2 only-http.example.com\n' | sudo tee -a /etc/hosts >/dev/null
          hits="$RUNNER_TEMP/out/hits.jsonl"
          : > "$hits"
          chmod 666 "$hits"
          echo "READING_HITS=$hits" >> "$GITHUB_ENV"
          # shellcheck disable=SC2024 # the runner's own file; only the listener needs root
          sudo -b "$(command -v node)" "$SCRIPTS/hosts.mjs" "$hits" "$ca/site.key" "$ca/site.crt" > "$RUNNER_TEMP/out/hosts.log" 2>&1
          # The page the agent starts from, on a port upgrades don't touch.
          nohup node -e "require('node:http').createServer((q,s)=>{s.setHeader('content-type','text/html');s.end('<!doctype html><title>Start</title><h1>Start</h1>')}).listen(4412,'127.0.0.1')" >/dev/null 2>&1 &
          sleep 2
          curl -fsS --max-time 5 http://both.example.com/check >/dev/null
          curl -fsS --max-time 5 --cacert "$ca/ca.crt" https://both.example.com/check >/dev/null
          curl -fsS --max-time 5 http://only-http.example.com/check >/dev/null
          if curl -sS --max-time 5 -k https://only-http.example.com/check >/dev/null 2>&1; then
            echo "::error::only-http.example.com answered on 443"; exit 1
          fi
          curl -fsS --max-time 5 http://127.0.0.1:4412/ >/dev/null
          : > "$hits"

      - name: Read the rows
        env:
          READING_OUT: ${{ runner.temp }}/out
        run: node "$SCRIPTS/reading.mjs"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-browser-reading-${{ inputs.sha }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 14
