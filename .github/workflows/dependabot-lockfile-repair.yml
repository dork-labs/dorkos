name: dependabot-lockfile-repair

# Repairs `pnpm-lock.yaml` on Dependabot PRs.
#
# THE ONE REPAIR: RESTORE THE pnpm CONFIG BLOCK (DOR-1644). Dependabot
# regenerates the lockfile without the `overrides:` block that the root
# package.json's `pnpm.overrides` declares (~40 entries here, several of them
# CVE pins). pnpm compares the two and refuses: every job on the PR dies at
# `pnpm install --frozen-lockfile` with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH,
# which reads as six unrelated broken checks rather than one config mismatch.
# The hand repair was `pnpm install --no-frozen-lockfile` plus a lockfile
# commit, on every group bump, forever (observed on PR #1407).
#
# This is a Dependabot-only failure mode, which is why a bot-only workflow is
# the whole fix. Anything that regenerates the lockfile through pnpm itself —
# a human, an agent, `pnpm install`, `pnpm update` — writes the `overrides:`
# block from package.json as a matter of course and cannot produce the
# mismatch. Dependabot does not speak pnpm, so it alone drops it. And when the
# mismatch does occur it is self-announcing: `pnpm install --frozen-lockfile`
# is the first thing every CI job that installs does, and it fails with the
# error named above plus the exact command that fixes it, so no separate drift
# guard is warranted (assessed in DOR-1715).
#
# THERE USED TO BE A SECOND REPAIR — a Prettier pass over the lockfile
# (DOR-1554) — because `prettier --check .` in lint.yml gated the whole repo on
# Prettier formatting, lockfile included, and pnpm writes the file in its own
# compact style. DOR-1715 deleted that step and put `pnpm-lock.yaml` in
# `.prettierignore` instead. The measurement is in the .prettierignore entry;
# the short version is that the reviewability argument for formatting the
# lockfile was measuring a one-time format conversion, not a dependency bump,
# and a bump is actually the smaller diff compact. Ignoring the file also made
# this workflow and hand-made dependency branches behave identically, which
# was the point: no automation here has to stay in sync with the lefthook hook
# and the CI gate, because all three simply honor `.prettierignore`.
#
# WHY `pull_request_target`, NOT `pull_request`: GitHub gives workflows
# triggered by Dependabot via `push`, `pull_request`,
# `pull_request_review`, or `pull_request_review_comment` a **read-only**
# `GITHUB_TOKEN` with **no access to repository secrets at all** —
# regardless of what `permissions:` this file declares (GitHub's own
# troubleshooting doc: "the only secrets available to the workflow are
# Dependabot secrets... GitHub Actions secrets are not available"). A
# `pull_request`-triggered version of this job could never authenticate a
# push, PAT or not. `pull_request_target` is GitHub's documented escape
# from exactly this restriction: it runs with the base branch's workflow
# definition (never a PR-modified one) and normal token/secret access.
#
# WHAT THAT TRADES AWAY, AND HOW THIS JOB STAYS SAFE ANYWAY:
# `pull_request_target` is the trigger behind most "PR pwns CI" writeups,
# because the usual mistake is checking out PR HEAD and then BUILDING it —
# running `npm install`/test scripts/etc. against attacker-controlled code
# while holding real secrets and write access. This job checks out PR HEAD
# too (needed, see below), but never executes anything the PR authored:
#
#   - NOTHING FROM THE PR'S DEPENDENCY GRAPH IS DOWNLOADED, LINKED OR RUN.
#     The config-restore step is
#     `pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts`,
#     which is a resolver run, not an install: `--lockfile-only` writes the
#     lockfile and never creates a `node_modules`, so no package tarball from
#     the (Dependabot-proposed, but still externally-influenced) graph is
#     fetched and no lifecycle script of any package in it can execute.
#     `--ignore-scripts` is belt-and-braces on top of that, and
#     `--no-frozen-lockfile` is required because pnpm freezes by default under
#     CI — freezing is the exact condition being repaired.
#
#     WHAT LEAVES THE RUNNER IS *METADATA*, AND IT IS THE AUTHORSHIP GATE THAT
#     MAKES THAT SENTENCE TRUE — not the flags on their own. `--lockfile-only`
#     bounds resolution to metadata, but it does not bound WHERE that metadata
#     is fetched from or WHOSE host answers: a checked-out `.npmrc` can point
#     the resolver at another registry, and a `git+`/`https:` dependency
#     specifier is contacted at resolution time, before any tarball or script
#     would enter the picture. Neither is reachable here, because Dependabot
#     authors neither an `.npmrc` nor a `git+` specifier — which is exactly
#     what the `dependabot[bot]` gate below buys, and why that gate is a
#     safety control rather than a scoping convenience. Widen the actor gate
#     and this bullet stops being true, flags unchanged.
#
#     That matters because THIS job can mint the merge-tail app key; lint.yml's `pull_request` job
#     does run a real `pnpm install --frozen-lockfile` against the same
#     untrusted lockfile, but only ever holds the secret-less, read-only
#     Dependabot token — see above.
#     If you ever need a full install here, that is a different job with a
#     different threat model. Do not drop `--lockfile-only` from this one.
#   - The actor gate below keeps this job from ever running, with secrets,
#     against a human-authored (and therefore adversarial-fork-capable) PR.
#
# WHY THE ACTOR GATE: `pull_request_target` fires for every PR touching
# `pnpm-lock.yaml`, not just Dependabot's. Scoping to Dependabot as both the
# PR's author AND the event's sender keeps the elevated-permission path
# exclusive to the one actor this job trusts; the author alone is not enough,
# since anyone who can push to the branch raises the next `synchronize`
# (DOR-4030). (`dependabot[bot]`'s login can't be spoofed by an external
# contributor.) It is also what bounds where the resolver may go — see the
# `.npmrc`/`git+` note in the bullet above before widening it.
#
# AND THE FILE GATE, before any checkout (DOR-4030): the PR may change only
# package.json files and `pnpm-lock.yaml`. pnpm reads more than the manifests
# from the checkout (`.npmrc`, `.pnpmfile.cjs`, `pnpm-workspace.yaml`, and the
# `packageManager` field that picks the pnpm binary), so none of those may come
# from the PR: the file gate keeps the first three as main has them,
# `--ignore-pnpmfile` skips the hook file regardless, and pnpm's version is
# pinned in this workflow, with a PR that changes `packageManager` refused.
# The checkout keeps no credential, and the App token is minted only after
# pnpm has exited, for the push alone.
#
# WHY THE MERGE-TAIL APP TOKEN, NOT `github.token`, FOR THE PUSH: this is
# not a style choice, it changes whether the fix actually un-blocks the PR.
# GitHub does not create new workflow runs for events triggered by the
# default `GITHUB_TOKEN` (documented, and load-bearing for merge-tail.yml's
# own design — see its header). If this job pushed the repaired commit
# with `github.token`, the push would silently succeed but the
# `pull_request` triggers would NOT re-fire on the new commit — the required
# checks would keep showing the OLD (failing) commit's result, or nothing at
# all, and the PR would be stuck exactly as before, just less visibly. A push
# made with a GitHub App installation token does re-trigger `pull_request`
# workflows normally, which is what actually flips the checks green. It reuses
# merge-tail.yml's app (`dorkos-merge-tail`: contents and pull requests write,
# no Administration) rather than provisioning a second credential for the
# same class of problem. If the app key is unset, the token step fails loudly
# rather than this job pushing an inert commit that looks like a fix and isn't.
#
# IDEMPOTENT BY CONSTRUCTION: `--lockfile-only` against a lockfile that already
# satisfies the manifests writes nothing, so the second run this job's own push
# triggers (synchronize, same path filter) finds nothing to commit and exits at
# the `git diff --quiet` check below. No self-trigger loop, no extra commit.
#
# WHY THE RESTORE STEP CANNOT SILENTLY WIDEN THE BUMP: `pnpm install` only
# re-resolves what the manifests no longer satisfy; it does not move
# already-satisfied ranges to their newest match (that is `pnpm update`). So on
# a Dependabot branch it restores the dropped config and re-resolves exactly the
# packages Dependabot's own edits require, leaving the rest of the lockfile
# alone. The versions the PR proposes stay the versions the PR proposes.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'pnpm-lock.yaml'

# One in flight per PR — if two events land in quick succession (e.g. a
# force-push right after open), the later run's repair+push subsumes the
# earlier one; no need for both to race a push at the same branch.
concurrency:
  group: dependabot-lockfile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only for GITHUB_TOKEN: the one write, the push, uses the merge-tail
# App token, minted only after pnpm has exited (DOR-4030).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  repair-lockfile:
    # Elevated-permission gate: only Dependabot's own PRs, pushed by
    # Dependabot itself, reach a job that holds the merge-tail app key under
    # `pull_request_target`. The author alone is not enough (DOR-4030): anyone
    # who can push to the branch would otherwise run here as "Dependabot's PR".
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.sender.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The App key lives only in the `automation` environment (DOR-4030), which
    # deploys only `main`. A `pull_request_target` run runs on the base branch,
    # so its ref is main.
    environment: automation
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the changed-file list, before anything is checked out
    steps:
      # Before any checkout (DOR-4030): every file the PR changes must be a
      # package.json or the lockfile. Those are the only files Dependabot's npm
      # updates write, so an `.npmrc`, `.pnpmfile.cjs`, `pnpm-workspace.yaml`
      # or anything else from the PR never reaches the runner. GitHub lists up
      # to 3,000 files; a longer list is refused.
      - name: Refuse unless the PR changes only package.json files and the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/changed-files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$files"
          count=$(wc -l < "$files" | tr -d ' ')
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            echo "::error::PR #$PR lists $count changed files; refusing to repair it."
            exit 1
          fi
          if bad=$(grep -vxE '(.+/)?package\.json|pnpm-lock\.yaml' "$files"); then
            echo "::error::PR #$PR changes files other than package.json and pnpm-lock.yaml; refusing to run pnpm on it:"
            echo "$bad"
            exit 1
          fi
          echo "PR #$PR changes only package.json files and pnpm-lock.yaml ($count files)."

      # Check out the PR's exact head commit (a SHA, not the floating branch),
      # with no credential left in .git/config while pnpm runs (DOR-4030).
      # Nothing from this checkout is ever executed; see the header comment.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pinned here, not read from the PR's package.json `packageManager`
      # (DOR-4030): the PR must not choose which pnpm runs. The step after
      # refuses a PR that changes it.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Refuse a PR that changes the pinned pnpm
        run: |
          set -euo pipefail
          want="pnpm@10.28.2"
          got=$(jq -r '.packageManager // ""' package.json)
          if [ "$got" != "$want" ]; then
            echo "::error::package.json asks for '${got}', not ${want}; refusing to run pnpm on it. Update the pin in this workflow on main first."
            exit 1
          fi

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      # DOR-1644: put back the `overrides:`/`settings:` block Dependabot's
      # regenerated lockfile drops, which otherwise fails every job on the PR
      # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      #
      # `--lockfile-only` is load-bearing and is NOT an optimisation: it is what
      # keeps this a resolver run rather than an install, so no package from the
      # PR's proposed graph is downloaded, linked or executed in the one job
      # that holds the merge-tail app key. Read the threat-model section of the header
      # before touching this line. `--no-frozen-lockfile` is required because
      # pnpm freezes by default under CI, and a frozen lockfile is precisely the
      # thing being repaired. `--ignore-pnpmfile` (DOR-4030): no `.pnpmfile.cjs`
      # hook runs, whatever the checkout holds.
      - name: Restore pnpm config in pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile

      # pnpm has exited. Commit locally first; the App token is minted only
      # if there is something to push.
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already carries its pnpm config — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          # Two `-m` flags rather than one embedded multi-line string: keeps
          # every line of this step at the same YAML block-scalar indent
          # (a dedented line here would break the `run: |` block).
          git commit \
            -m "chore: repair pnpm-lock.yaml for Dependabot" \
            -m "Dependabot cannot speak pnpm: it drops the root package.json's pnpm.overrides block from the lockfile, after which every job dies at pnpm install --frozen-lockfile with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (DOR-1644). Repaired automatically by .github/workflows/dependabot-lockfile-repair.yml."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Fails the job when the app key is missing, which is the point: see
      # the header on why a GITHUB_TOKEN push would look like a fix and isn't.
      # Minted only now, after pnpm has exited (DOR-4030), and scoped to the
      # one permission the push needs.
      - name: Mint the merge-tail app token
        if: steps.commit.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The client id is a secret, not a variable, on purpose: repo secrets
          # are proven to reach Dependabot's pull_request_target runs; vars.* there is not.
          client-id: ${{ secrets.MERGE_TAIL_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_TAIL_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the repair
        if: steps.commit.outputs.changed == 'true'
        env:
          # Routed through an env var rather than interpolated directly into
          # the script (actionlint flags the direct form): a branch name is
          # PR-author-influenced text and, unquoted in an inline expression,
          # is a script-injection vector. `head.ref` is trustworthy here
          # (Dependabot branch names, and this job already gates on
          # `dependabot[bot]` authorship) but the indirection costs nothing.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The token reaches git for this one push as an HTTP header in the
          # environment, never in .git/config or a remote URL.
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          # Push to the PR's actual branch name, not the detached HEAD this
          # job checked out (see the checkout step: we checked out a SHA).
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "HEAD:${HEAD_REF}"
