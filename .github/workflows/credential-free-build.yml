name: credential-free-build

# Builds, type-checks, lints, tests and BOOTS this repo with every hosted-side
# ("cloud") environment variable unset, and asserts a clean exit (DOR-2081).
#
# WHY THIS EXISTS. The app promises it can be cloned, built, tested and run on
# its own — no access to the hosted control plane, no credentials of any kind.
# That promise is load-bearing for an open-source app and, until this job, it
# was only a promise: nothing anywhere checked it. The property being checked is
# one sentence long, and it is worth stating exactly, because it is narrower
# than "the build passes":
#
#   UNSET MUST MEAN "THAT FEATURE IS OFF", NEVER "THE BUILD IS BROKEN".
#
# A hosted-dependent module whose absent variable throws at import, fails a type
# check, or reds a test is the failure this job exists to catch. A module that
# reads an absent variable and quietly turns its feature off is the behaviour it
# exists to protect.
#
# IS THIS NOT ALREADY COVERED? Nearly, and by accident — which is the whole
# argument for a job that covers it on purpose. `test`, `typecheck`, `lint` and
# `site-build` all run on runners where no hosted variable happens to be set,
# because no secret is wired into any of them. That is a property of today's
# workflow files, not of this repo, and it is exactly the kind of property that
# stops holding the first time somebody adds a `secrets.` line or a repo-level
# variable to get one job green. Three things make this job different:
#
#   1. It SCRUBS rather than relies on absence (scripts/run-credential-free.sh),
#      so it keeps meaning what it says even in an environment that has hosted
#      variables in it.
#   2. It BOOTS THE APP. Nothing else in CI starts the server without
#      credentials. A type check never executes a module and a build only
#      evaluates what the bundler reaches, so an import-time throw on the boot
#      path — the likeliest shape of this defect — is invisible to every other
#      gate. See scripts/credential-free-smoke.sh.
#   3. It is one named check the hosted-side programme can be gated on. "The
#      public app builds without us" is not a claim any private repository can
#      make about this one; it has to be proven here.
#
# UNSET, NOT EMPTY. A workflow-level `env: DATABASE_URL: ''` is not this. It
# leaves the NAME present in `process.env`, so `!== undefined` is true, `in` is
# true, and a Zod `.optional()` sees a present empty string instead of skipping
# the field — every one of those reads the opposite way round from a
# contributor's machine. The scrub removes names; its fixture suite
# (scripts/test-run-credential-free.sh, run by scripts-test.yml) pins that
# distinction as its second case, along with the other direction — that PATH,
# HOME, CI, NODE_OPTIONS and the GITHUB_* plumbing Actions wires steps together
# with all survive.
#
# THE SCRUB LIST LIVES IN THE SCRIPT, NOT HERE, and it is patterns rather than
# names: the hosted seam gains variables, and a hand-kept list of exact names
# goes stale silently — the new variable is simply not scrubbed, this job stays
# green, and the gate quietly stops covering the newest part of the seam. The
# script's header carries that reasoning and the justification for each family.
#
# TWO EVENTS, ONE DEPTH, TWO BASES — and this is the one place this job
# deliberately does NOT copy test.yml, so here is the whole argument.
#
# test.yml runs the FULL monorepo sweep on `merge_group` because a per-PR
# affected diff cannot see an interaction between two PRs that each branched
# from a base predating the other. That reasoning is right, and it is satisfied
# here WITHOUT a full sweep, because `--affected` is computed against a base,
# not against a branch: in the queue the base is `merge_group.base_sha`, the
# commit the combined tree was built on, so the affected set spans main plus
# EVERY pull request in the group, evaluated on the combined tree. The two-PR
# interaction — one PR adds a module that reads a hosted variable at import,
# another adds the import that reaches it — is inside that set. A full sweep
# would add the packages neither PR can reach, which is precisely the work that
# cannot be affected by either.
#
# What a full sweep WOULD add here is 20-30 minutes on every merge, and it would
# add them to the wrong place. test.yml measures its own unsharded sweep at
# 19-29 minutes and shards it four ways for that reason; sharding this job is
# out of scope, so an unsharded sweep would make this check the queue's new long
# pole and push it toward the queue's 60-minute check-response window — the
# stall the rest of this header spends its length avoiding. And most of that
# sweep would re-prove what test.yml proved twenty minutes earlier: turbo runs
# in STRICT env mode (turbo.json declares no `envMode`), so the only hosted
# variables that reach a turbo task at all are the ones `globalPassThroughEnv`
# names — DORKOS_MANAGED_*, MCP_API_KEY, NGROK_AUTHTOKEN, TUNNEL_*, plus
# POSTHOG_*/NEXT_PUBLIC_POSTHOG_* on `build`. DATABASE_URL, BETTER_AUTH_*,
# DORKOS_CLOUD_*, NEON_*, STRIPE_*, COMPOSIO_*, NANGO_* and the OAuth client
# ids are stripped by turbo before this job's scrub ever matters. The scrub is
# load-bearing for the passthrough list, for `pnpm install`, and for the boot
# probe — none of which a bigger sweep would cover better.
#
# So both legs run the same command with a different base, and the difference
# between the events is which base:
#
#   * `merge_group`: `TURBO_SCM_BASE=merge_group.base_sha` — the combined tree
#     against the commit it was built on.
#   * `pull_request`: `TURBO_SCM_BASE=pull_request.base.sha` — the PR's own
#     diff and nobody else's. A SHA rather than `origin/<base_ref>` because a
#     ref resolves at checkout time and a merge landing in that window silently
#     changes the affected set (test.yml's header has the full argument).
#
# The PR leg exists at all because a required check must SUCCEED ON THE PULL
# REQUEST before GitHub will let the PR into the queue (measured on PR #1246: a
# merge_group-only required check deadlocks every PR out of the queue for
# `check_response_timeout_minutes`).
#
# THE BOOT PROBE IS THE ONE THING THAT IS NOT AFFECTED-SCOPED. It builds the
# `dorkos` CLI closure unconditionally (measured at 52s with the dependency
# packages warm, a few minutes cold, and most of it is shared with whatever the
# steps above already built). That is deliberate: the probe is this job's unique
# coverage, and an affected-scoped probe would skip exactly the pull request
# that changes nothing under apps/server — which is precisely the change that
# can break the boot path from a shared package or a dependency bump.
#
# THE SCOPE DECISION IS INSIDE THE JOB, never a workflow-level `paths:` filter,
# for the reason site-build.yml's header works through at length: a workflow
# skipped by path filtering reports NOTHING (not success), which keeps a PR out
# of the queue and then stalls the queue for an hour. Here the scope decision is
# turbo's `--affected` against a base, inside the run — there is no `if:` on any
# step and no filter on the workflow, so this job always runs, always executes
# every step, and always reports `credential-free-build`.
# scripts/__tests__/credential-free-workflow.test.ts fails if a `paths:` filter
# ever appears in the `on:` block.
#
# IT IS NOT A REQUIRED CHECK YET, and this file does not make it one. Branch
# protection is the operator's (the DOR-1519 precedent), and promoting it needs
# no edit here — the `merge_group:` trigger below is the half that has to land
# first, because a required context whose workflow lacks it never reports inside
# the queue and every pull request waits forever. Until the ruleset lists
# `credential-free-build`, a red here blocks merge-tail.yml from ARMING
# auto-merge (scripts/should-arm-automerge.sh requires every check settled
# green) but does not block the queue. Same half-gate `lint` lived in until
# 2026-09-02 and `site-build` still lives in.
#
# WHY IT WENT RED ON EVERY RUN AFTER ITS OWN (2026-09-16), and what this file
# does and does NOT claim about it. Read this before "fixing" it again, because
# three of the four obvious culprits are innocent and the fourth is unproven.
#
# The job's first two runs, on PR #1890 itself, both went GREEN end to end —
# 35029379795 (pull_request, 2m11s) and 35033321920 (merge_group, 2m0s), every
# step through the boot probe. Then nine consecutive runs failed. Two of those
# (35035970126, 35038048694) are ordinary concurrency supersedes: a second push
# to the same PR branch, conclusion `cancelled`, working as intended. The other
# seven all died the same way — `Build, typecheck and lint everything this
# change can reach` killed part-way, `##[error]The operation was canceled`,
# conclusion `failure` — at wildly different points: 3m44s, 5m09s, 7m22s,
# 11m06s, 11m27s, 12m54s, 13m09s of job time.
#
# WHAT IS RULED OUT, with evidence, so nobody re-treads it:
#
#   * NOT the `--affected` scoping. It works, on both events. Run 35038342317
#     logs "Packages in scope: //, @dorkos/desktop, @dorkos/evals,
#     @dorkos/obsidian-plugin, @dorkos/server, dorkos" — six of twenty-five,
#     against `pull_request.base.sha` — and the queue legs scope the same way
#     against `merge_group.base_sha` (35033546480, 35042360363: six packages,
#     not twenty-five). A docs-only change scopes to no packages at all.
#   * NOT `timeout-minutes`, FOR THOSE NINE. The longest of the seven is
#     13m09s against what was then a 50-minute ceiling, so raising or lowering
#     it would have changed nothing about any of them. Read that as scoped to
#     those runs, because it later stopped being true in general: a merge-group
#     run on a PR touching `packages/shared` spent 40m53s in the test step
#     alone and hit the ceiling. That is a different failure with a different
#     cause — see THE SERIAL COLD PATH below — and the ceiling has moved.
#   * NOT a concurrency cancel. A merge-group ref is unique per batch and
#     `cancel-in-progress` is already false on that event; see the block below.
#   * NOT simply "too slow", which is the tempting story and does not fit.
#     35033546480 finished turbo in 2m50.62s and died at 3m44s anyway.
#
# WHAT THE CAUSE ACTUALLY IS: NOT ESTABLISHED, and this file does not pretend
# otherwise. The strongest signal is run 35033546480's "##[error]The runner has
# received a shutdown signal", with a bare `Killed` on `@dorkos/server:typecheck`
# in that run and in 35038342317 — the shape of a runner reclaimed or a child
# reaped, not of a workflow-level cancel. A plausible contributor, named here as
# a hypothesis and not as a finding, is resource exhaustion: this step ran at
# turbo's default fan-out (turbo.json sets `concurrency: 15`) with
# `NODE_OPTIONS=--max-old-space-size=8192` on a 4-vCPU, 16 GB runner, so fifteen
# concurrent tsc/vite processes were each permitted an 8 GB heap.
#
# WHAT THIS CHANGE DOES ABOUT IT — two levers, both cheap, both defensible on
# their own merits whatever the actor turns out to be, and neither claimed as
# a cure:
#
#   1. Do less work. Every one of the nine runs logged `Cached: 0 cached`. This
#      job has no remote cache by design (a remote cache needs a token, and a
#      job whose premise is holding no credentials cannot have one) and had no
#      local one either, so it rebuilt its affected set from scratch every time.
#      `actions/cache` authenticates with the runner's own token, so it is the
#      one cache this job is allowed to have. Details at the step.
#   2. Stop oversubscribing the runner. `--concurrency=4` on the step below, for
#      the DOR-121 reason test.yml already applies to its own leg. See there.
#
# If the red returns with both of those in place, the next thing to look at is
# the runner itself — `free -m` and `df -h` around the step — not this file's
# flags again.
#
# THE SERIAL COLD PATH, and why this job has a second cost story.
#
# Everything above is about nine runs that died young. This is the opposite
# failure and it arrived later: a merge-group run on a PR touching
# `packages/shared` spent 40m53s in the test step alone — 149 tests passing,
# then a silent twelve-minute tsc build — and hit the 50-minute ceiling. Three
# facts make that structural rather than unlucky:
#
#   1. `packages/shared` is a dependency of nearly everything, so `--affected`
#      expands to 20 of 25 packages. For that change the worst case is not the
#      tail, it is the ONLY case.
#   2. The test step ran `--concurrency=1`, so those 20 packages ran one after
#      another, each paying its own dependency build through the task graph.
#   3. The local turbo cache added at the top of this job cannot help. A
#      merge-group ref whose shared inputs changed is cold BY DEFINITION — the
#      cache key includes the lockfile and the inputs — so every shared-package
#      PR pays the full serial cost in the queue, where it decides a merge.
#
# Two levers, both at their own steps: the ceiling moved to 110 (under the
# queue's real 120-minute `check_response_timeout_minutes`) and the test step
# went to `--concurrency=2`. Neither is a cure and neither is claimed as one;
# together they make the measured worst case fit with room, and a runaway still
# goes red rather than stalling the queue.
#
# THE FOLLOW-UP, SCOPED SO NOBODY HAS TO REDERIVE IT. If a healthy run
# approaches 110, the answer is to shard this job, not to raise the number a
# third time. The shape is test.yml's, and the one thing that makes it more
# than a copy is that `credential-free-build` IS A REQUIRED CONTEXT: a matrix
# renders `credential-free-build (1/4)` and the required name stops reporting,
# which deadlocks every PR out of the queue for the full check window (the
# failure PR #1246 measured for the mirror-image mistake). So it needs:
#
#   * `credential-free-shard (N/4)` matrix jobs running the test step as
#     vitest `--shard=N/4`, each keeping the scrub wrapper and the vars-unset
#     discipline. Each needs `--passWithNoTests`, which is not optional and not
#     cosmetic: a package with three test files legitimately contributes zero
#     files to one of four shards, and without the flag vitest exits 1 on an
#     empty selection.
#   * BUT `--passWithNoTests` also removes vitest's own zero-collected safety
#     net, so the anti-vacuity proof has to move up a level, exactly as
#     test.yml's header describes. Each shard records the test files vitest
#     collected (json reporter -> uploaded artifact) and the fan-in runs
#     `scripts/assert-shard-union.sh`, which fails unless every package that
#     declares a `test` script appears in the UNION of all shards. A per-shard
#     assertion cannot discriminate here; the union is where the guarantee
#     lives, and a sharded gate without it is WEAKER than the one it replaces.
#   * one fan-in job KEEPING THE NAME `credential-free-build`, with `needs` and
#     `always()` so a failed or skipped shard cannot skip it into a false
#     green — the single producer of the required context, on both events.
#   * THE BOOT PROBE STAYS IN THE FAN-IN, not in the shards. It is this job's
#     unique coverage, it is not a turbo task and can never be replayed from
#     cache, and running it four times buys nothing while paying the install
#     and CLI build four times over.
#
# And a caveat on the payoff, so nobody over-expects it: test.yml's header
# notes each shard still pays the full `^build` for its task graph, so sharding
# divides the TEST time and not the build time. Run 35064083857 spent 8m34s in
# the build/typecheck/lint step before the test step even started; four-way
# sharding would not have touched that 8m34s.
#
# That is a real change to a required gate and wants its own PR and its own
# review, which is why it is written down here rather than done in passing.
#
# WHAT IT DELIBERATELY DOES NOT RUN: `pnpm lint:root` (the second ESLint pass
# over scripts/, .claude/ and templates/) and the Playwright suites. Neither
# reads a hosted variable, so running them here would add minutes and no
# coverage of this property; `lint` and `browser-test` own them.
on:
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a group
# and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. Deliberately IDENTICAL in form to test.yml and site-build.yml
# (keep them in step).
#
# A SEPARATE merge_group GROUP WAS CONSIDERED AND IS NOT NEEDED, and the runs
# say so rather than the docs. `cancel-in-progress` is already `false` on
# `merge_group` — the expression below evaluates per event — and a queue run's
# ref is unique per batch, so two queue runs never share this group in the first
# place. Splitting the group by `github.event_name` would change nothing that
# can be observed. What actually killed runs 35037863831 and 35039034938 (both
# `merge_group`) was the queue TEARING DOWN its `gh-readonly-queue/...` ref the
# moment the required checks went green and the batch merged, while this
# not-yet-required job was still eight minutes from finishing. No concurrency
# setting anywhere prevents that: the branch is gone, so the run goes with it.
# The only two things that do are finishing faster (the cache below) and being
# required (branch protection, the operator's call — see IT IS NOT A REQUIRED
# CHECK YET). scripts/__tests__/credential-free-workflow.test.ts pins
# `cancel-in-progress` to the event-conditional form so no future edit can make
# a queue run cancellable on the way past.
concurrency:
  group: credential-free-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE ONE PRODUCER of the `credential-free-build` context, on both events. Do
  # not rename it, and do not split it into two same-named jobs under mutually
  # exclusive `if`s — test.yml's header explains why one producer is the only
  # shape whose required-check semantics are pinned down.
  credential-free-build:
    runs-on: ubuntu-latest
    # A ceiling on a hang, not a budget — and now a MEASURED one rather than an
    # extrapolated one. What the runs actually cost, all of them with
    # `Cached: 0 cached` because nothing cached anything until the step below:
    #
    #   * 6 affected packages, 39 tasks — build+typecheck+lint reached 9m56s
    #     (run 35038342317) and 10m18s (35039034938) and was still mid-task
    #     when the run was killed. The SAME set took 2m51s in 35033546480 and
    #     4m26s in 35042360363, which is the spread between runners, not
    #     between changes.
    #   * 20 affected packages, 56 tasks — 10m46s, likewise unfinished
    #     (35036585864).
    #   * A CI-only change, 1 package — the whole JOB, install to boot probe,
    #     in 2m11s (35029379795, PR #1890's own run) and 2m0s in the queue
    #     (35033321920). These two are the only runs that have finished.
    #
    # The worst case is the whole monorepo, which is what a change under
    # packages/shared expands to. Measured cold and unsharded on a developer
    # machine: `turbo build typecheck lint` over all 25 workspaces, 63 tasks,
    # every one of them cold, in 3m53s, writing a 178 MB local cache. CI ran 39
    # tasks in 9m56s against that machine's 63 in 3m53s — call it 4x slower per
    # task — so the full monorepo build+typecheck+lint lands near 16 minutes on
    # a runner. This job then adds `turbo test --concurrency=1` over the same
    # set, which test.yml measures at 19-29 minutes unsharded and shards four
    # ways for exactly that reason, plus the CLI build and the boot probe. So
    # the honest worst case is 37-48 minutes, and 50 was the TOP of that range,
    # not a comfortable margin above it.
    #
    # THAT ESTIMATE WAS RIGHT AND THE CEILING WAS STILL WRONG. Run 35064083857
    # (merge_group, PR #1906) spent 40m53s in the TEST step alone and was cut
    # off by the 50-minute ceiling, with the boot probe never reached. The
    # estimate above assumed the worst case was rare; for `packages/shared` it
    # is the ONLY case, and a queue ref with changed shared inputs is cold by
    # definition, so the local cache added at the top of this job cannot help
    # (that run's restore step was a 0-second miss). Every shared-package PR
    # pays it. See THE SERIAL COLD PATH in the header.
    #
    # 110 stays UNDER the queue's `check_response_timeout_minutes`, which is
    # 120 — read off the live branch ruleset, not inferred. FIVE comments in
    # this repo said 60 (browser-test.yml, db-check.yml, docs-openapi-check.yml,
    # site-build.yml and this one); all five are corrected in the same change, because the
    # hazard they each describe is real and the number they hang it on was not.
    # The hazard: a job that could outlive that window stalls the queue for the
    # whole window instead of going red, which is what this workflow's header
    # argues against everywhere else.
    #
    # 110 rather than something snugger because the number this guards is a
    # RUNAWAY, not a budget. The measured worst case is ~41 minutes in the test
    # step; anything approaching 110 is a different bug. If a healthy run ever
    # gets near it, shard this job rather than raising the number again — the
    # follow-up is scoped in the header.
    timeout-minutes: 110
    env:
      # Raise the V8 old-space ceiling for every Node process this job spawns —
      # pnpm, turbo and each `vitest run` worker inherit NODE_OPTIONS. The same
      # ceiling test.yml's shards carry, for the same reason (DOR-1576): a
      # single vitest process running many suites exhausted the default ~2GB
      # heap. The scrub leaves this alone; the fixtures pin that.
      NODE_OPTIONS: --max-old-space-size=8192
      # The boot probe's port. 4242 is the repo's production default and nothing
      # else is listening on a runner.
      DORKOS_PORT: '4242'
    steps:
      # fetch-depth: 0 for two independent reasons, both already established
      # elsewhere: the affected step below needs `origin/<base>` present to diff
      # against (site-build.yml), and the server suite's DOR-339 migration guard
      # reads `git tag -l`, which is empty at depth 1 and false-fails (DOR-884).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # ---- turbo's LOCAL cache, restored from GitHub's cache service ----
      #
      # WHY. This repo has no remote turbo cache and never will for this job:
      # a remote cache needs a token, and a job whose entire premise is "no
      # credentials of any kind" cannot hold one. So every run logged
      # `Cached: 0 cached, 39 total` and rebuilt its affected set from scratch.
      # This does NOT claim to be the cause of the nine failures — see WHY IT
      # WENT RED in the header, which declines to name one. It is the largest
      # piece of avoidable work in the job, removing it is right on its own
      # merits, and a run that does less is less exposed to whatever is
      # reclaiming these runners.
      #
      # actions/cache needs no credential — it is the runner's own token — so
      # it is the one cache this job is allowed to have. `.turbo/cache` is
      # turbo's local cache directory (turbo.json declares no `cacheDir`, so
      # this is the 2.x default, confirmed against turbo 2.10.12:
      # `Using shared worktree cache at: <root>/.turbo/cache`). It is in
      # .gitignore already.
      #
      # THE KEY, and why each part of it is there:
      #
      #   * `runner.os` — a Linux cache entry is not replayable on another OS.
      #   * `hashFiles('pnpm-lock.yaml')` — the POISONING GUARD. A dependency
      #     bump changes what every task's output should be, and an entry keyed
      #     without it could be restored into a tree whose deps have moved. It
      #     is belt AND braces: turbo already hashes each package's resolved
      #     dependency set into the task hash, so a stale entry would miss
      #     rather than be wrongly replayed. Putting the lockfile in the key as
      #     well means the stale entries are never even downloaded, which keeps
      #     the restored tarball small.
      #   * `github.sha` — makes the primary key unique per run, so it NEVER
      #     hits and the save step below always writes a fresh entry. Restores
      #     therefore always come from the restore-keys prefix, which is the
      #     documented rolling-cache shape.
      #
      # `restore-keys` falls back to the newest entry with the same OS and the
      # same lockfile, and deliberately NOT to anything looser: a prefix that
      # stopped at `runner.os` would pull an entry from before a dependency
      # bump, which is the poisoning this key is shaped to avoid.
      #
      # WHAT THIS DOES NOT REACH, stated plainly so the next reader does not
      # assume more coverage than there is. GitHub scopes caches by branch,
      # with a read-only fallback to the DEFAULT branch. This workflow has no
      # push-to-main leg (AGENTS.md, CI: the queue already tested the exact
      # tree), so nothing ever writes main's scope. Two consequences:
      #
      #   * a `merge_group` run is cold by construction — its scope is a
      #     `gh-readonly-queue/...` ref no other run can read, and there is no
      #     warm default-branch entry to fall back to;
      #   * the FIRST push of a new PR branch is cold too, for the same reason.
      #     The second and every later push restores its predecessor's entry.
      #
      # So this helps the leg that is red on every pull request and does
      # nothing at all for the queue leg. Accepted rather than overlooked: the
      # queue leg's problem is not speed (35033546480 finished turbo in 2m51s
      # and was killed anyway), so a cache was never going to rescue it. The
      # obvious follow-up, if the queue leg's red persists, is a small
      # cache-WARMING leg on `push: branches: [main]` writing this same key —
      # the default-branch fallback would then warm both legs on their first
      # run. It is deliberately not in this change: it gates nothing and so
      # does not conflict with the no-push-to-main rule, but it adds a run to
      # every merge and should be justified by evidence this change has not
      # yet collected.
      - name: Restore turbo's local cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-credential-free-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-credential-free-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Says out loud, before any of this repo's own commands run, what this
      # runner actually had set (the cache restore above it is runner plumbing
      # and sets no hosted-side variable).
      # On a healthy runner the answer is "nothing", and that is the point: a
      # reader can tell "the environment was already clean" apart from "the
      # scrub removed six things", which are very different facts about how this
      # repository is being built.
      - name: Report the hosted-side variables this runner has set
        run: bash scripts/run-credential-free.sh --print

      # The install runs scrubbed too. A postinstall script that reads a hosted
      # variable is as much a break of the promise as a source module that does,
      # and this is the first command that could hit one.
      - name: Install dependencies with no hosted-side variable set
        run: bash scripts/run-credential-free.sh pnpm install --frozen-lockfile

      # TURBO_SCM_BASE names the comparison base explicitly, and it is the ONLY
      # thing that differs between the two events (see TWO EVENTS, ONE DEPTH,
      # TWO BASES). It has to be named: the checkout is a detached ref with no
      # local `main`, so turbo's default base does not resolve here. Both values
      # are SHAs rather than `origin/<base_ref>` because a ref resolves at
      # checkout time and a merge landing in that window silently changes the
      # affected set. `merge_group.base_sha` is the commit the combined tree was
      # built on, so the affected set spans every pull request in the group.
      #
      # NO `if:` ON EITHER STEP, on purpose: a pair of copies under mutually
      # exclusive conditions would be the same command with one line changed, and
      # those are the copies a flag goes quietly missing from (test.yml's header
      # spends a paragraph on exactly which of its flags must NOT ride its second
      # leg). The expression picks the base; nothing else forks on the event.
      #
      # `--continue` so one red task still reports every other task's result
      # instead of hiding behind the first failure — the reason test.yml and
      # typecheck.yml pass it.
      #
      # `--concurrency=4` is the DOR-121 argument the step below already makes,
      # applied to the leg that had been missing it. turbo.json sets
      # `concurrency: 15` for developer machines; a GitHub runner has 4 vCPUs,
      # so the default is ~4x oversubscription of the CPU and — with this job's
      # `NODE_OPTIONS=--max-old-space-size=8192` — fifteen concurrent tsc and
      # vite processes each permitted an 8 GB heap on a 16 GB box. Nothing is
      # gained by queueing eleven extra compilers against four cores, and the
      # runs this change is fixing died with a bare `Killed` on a tsc child and,
      # once, "the runner has received a shutdown signal" (see WHY IT WENT RED).
      # 4 matches the cores; raise it only with a measurement.
      - name: Build, typecheck and lint everything this change can reach
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: bash scripts/run-credential-free.sh pnpm exec turbo build typecheck lint --affected --continue --concurrency=4

      # A SECOND turbo invocation rather than a fourth task on the line above,
      # because turbo hands a `--` passthrough to every task in the run: one
      # command would pass `--run` to eslint and tsc as well as to vitest, and
      # `eslint . --run` is an error. The tasks that take no passthrough go
      # above; the one that needs it goes here.
      #
      # `-- --run` is REQUIRED, not decoration: five packages' `test` scripts are
      # a bare `vitest`, which without it starts watch mode and never exits.
      # `--concurrency=2` AND `VITEST_MAX_WORKERS=2`, which are one decision and
      # have to be read together. COUNT PROCESSES, NOT TASKS - the mistake an
      # earlier draft of this comment made. Every task on this leg spawns a
      # vitest main plus a forks pool, and with the pool at its default of
      # `availableParallelism - 1` that is ~4 Node processes per task on a
      # 4-vCPU runner. So `--concurrency=2` on its own would be ~8 processes,
      # each permitted an 8 GB heap by this job's `NODE_OPTIONS` - TWICE the
      # process count of the build step above, which was dialled down to 4
      # precisely because oversubscription produced a bare `Killed` and a runner
      # shutdown (see WHY IT WENT RED). Raising this leg's fan-out without
      # bounding the pool would re-create the diagnosed hazard on the step with
      # the widest fan-out per task.
      #
      # Bounded, the arithmetic is 2 tasks x (1 main + 2 workers) = 6 processes,
      # against 4 at the old `--concurrency=1` and ~60 at turbo's default of
      # fifteen. Six on four vCPUs is a deliberate, modest overcommit - a suite
      # is I/O-bound for much of its life - and it is the first number to
      # revisit if this leg ever dies with `Killed` again.
      #
      # Why not stay at 1: 1 is a SERIAL chain over the affected set. For a
      # change under `packages/shared` that is 20 packages - measured, not
      # estimated: run 35064083857 logs "Running test in 20 packages" - one
      # after another, and that run spent 40m53s here before the ceiling cut it
      # off. Raise either number only with a measurement.
      #
      # `VITEST_MAX_WORKERS` is safe to set here: turbo.json lists it in
      # `globalPassThroughEnv`, and contributing/environment-variables.md
      # documents it as the knob for exactly this. It is not a hosted-side
      # variable, so the scrub leaves it alone.
      #
      # No `--retry`: this leg has no flake-naming step, and a retry
      # with nothing naming what it absorbed is the silent retry test.yml's
      # header refuses.
      #
      # No `--summarize` + scripts/assert-tests-executed.sh either, and that is a
      # decision rather than an omission: that assertion demands that EVERY
      # package declaring a `test` script ran, which an affected subset cannot
      # satisfy by construction. Its own header says so, and test.yml gates it to
      # the leg that sweeps everything for the same reason.
      #
      # THAT REASONING USED TO LEAN ON A SECOND LEG WHICH NO LONGER HOLDS, and
      # the change that removed it is in this very file, so read this before
      # reusing the argument. It used to add: "the cache-replay failure it
      # guards against needs a warm turbo cache, and this repo has no remote
      # cache and cold runners." The step near the top of this job now gives it
      # a warm local cache, so a second push to a branch CAN replay `test` as a
      # full cache hit — AGENTS.md's CI section measures that at ~280ms while
      # printing "29 successful", which is exactly why the merge-group `test`
      # leg asserts execution. Three things make it acceptable here, and the
      # third is the one that matters:
      #
      #   1. A hit means these task inputs already ran, green, IN THIS JOB and
      #      therefore under the scrub — the restorable entries are only this
      #      job's own `turbo-credential-free-*` ones. A replay is a correct
      #      answer about a tree that was genuinely proven, not a blank one.
      #   2. Only the pull-request leg is ever warm (the queue leg's cache scope
      #      is cold by construction, below), so the merge-group answer — the
      #      one a merge is decided on — is always executed.
      #   3. THE BOOT PROBE IS NOT A TURBO TASK. `credential-free-smoke.sh` is a
      #      plain `run:` and starts the server for real on every single run,
      #      warm or cold. This job's unique coverage can never be replayed, and
      #      that is the property worth protecting. If `build`/`typecheck`/
      #      `lint`/`test` ever become the load-bearing half here, add an
      #      affected-set-aware execution assertion rather than deleting the
      #      cache.
      - name: Test everything this change can reach
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          # Bounds each task's vitest pool; see the process arithmetic above.
          VITEST_MAX_WORKERS: '2'
        run: bash scripts/run-credential-free.sh pnpm exec turbo test --affected --continue --concurrency=2 -- --run

      # ---- both events: the boot probe ----
      #
      # `turbo build --filter=dorkos`, not `pnpm --filter`: turbo builds the
      # workspace dependencies first and exits 1 on a filter that stops matching,
      # where `pnpm --filter` prints "No projects matched" and exits 0 — the
      # silent-no-op defect site-build.yml, db-check.yml and desktop-renderer.yml
      # all document. Where the change already reached the CLI's closure, the
      # step above built it and this is a turbo cache hit.
      #
      # The CLI bundle is the entry point, not `apps/server/dist/index.js`:
      # `@dorkos/db` publishes TypeScript from its `exports` map, so the server's
      # tsc output is not runnable by bare node — only the esbuild bundle is. It
      # is also the thing a user actually runs, which is the point of a boot
      # probe.
      - name: Build the CLI the boot probe runs
        run: bash scripts/run-credential-free.sh pnpm exec turbo build --filter=dorkos

      - name: Boot the server and probe its health endpoint
        run: bash scripts/run-credential-free.sh bash scripts/credential-free-smoke.sh

      # TWO CONDITIONS, and each one is load-bearing in a different direction.
      #
      # `always()` rather than the split action's usual `success()`, and rather
      # than plain `actions/cache`'s implicit post step, for the failure mode
      # this whole change is about: every failing run of this job so far ended
      # in a cancel part-way through, and a post step does not run on a cancel.
      # Saving here means a torn-down run still hands its finished tasks to the
      # next push on the branch, so the run after a teardown starts warm instead
      # of repeating the work that got it killed. Turbo writes a task's entry
      # only once that task has finished, so a cache saved mid-run holds
      # completed entries and no partial ones — there is nothing to poison.
      #
      # `pull_request` only, because a `merge_group` save is pure waste. A queue
      # run's cache scope is its `gh-readonly-queue/main/pr-<n>-<sha>` ref, which
      # the queue deletes on merge; the entry is orphaned seconds after it is
      # written and no run of anything can ever restore it. It would still count
      # against GitHub's 10 GB per-repository cache budget until LRU eviction,
      # and at this repo's merge rate — ten PRs landed in the two hours these
      # runs came from — that is over a gigabyte an hour of writes nothing can
      # read, evicting entries other workflows DO read (browser-test.yml's
      # Playwright browsers, setup-node's pnpm store). The queue leg still
      # RESTORES, harmlessly and always to a miss, because the restore is the
      # same step shape on both events and splitting it would be the pair of
      # near-identical copies the header argues against.
      #
      # Safe to write unconditionally otherwise: the primary key carries
      # `github.sha`, so it cannot collide with or clobber an existing entry. A
      # re-run of the same SHA is the one exception and it is benign — the key
      # hits, the action logs "Cache already exists" and skips, non-fatal.
      #
      # SIZE, and the one thing to watch. A full cold monorepo cache measures
      # 178 MB on disk (all 63 tasks), so a single entry is small. But restore
      # pulls the previous entry in and save writes the whole directory back
      # out, so a branch's entry grows across its pushes — turbo's own pruning
      # (turbo.json: `cacheMaxAge` 7d, `cacheMaxSize` 10GB) does not bind at
      # this size. Bounded in practice by GitHub deleting caches untouched for
      # 7 days and by a branch's short life, but if the repo's cache budget
      # starts thrashing, prune `.turbo/cache` by mtime before this step rather
      # than dropping it.
      #
      # NOT a `run:` step on purpose: the drift guard in
      # scripts/__tests__/credential-free-workflow.test.ts asserts that every
      # `run:` in this file goes through the scrub, and a cache action has no
      # business in the scrubbed set — it is runner plumbing, not a command
      # this repo is claiming to survive without credentials.
      - name: Save turbo's local cache
        if: always() && github.event_name == 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-credential-free-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
