name: credential-free-build

# Builds, type-checks, lints, tests and BOOTS this repo with every hosted-side
# ("cloud") environment variable unset, and asserts a clean exit (DOR-2081).
#
# WHY THIS EXISTS. The app promises it can be cloned, built, tested and run on
# its own — no access to the hosted control plane, no credentials of any kind.
# That promise is load-bearing for an open-source app and, until this job, it
# was only a promise: nothing anywhere checked it. The property being checked is
# one sentence long, and it is worth stating exactly, because it is narrower
# than "the build passes":
#
#   UNSET MUST MEAN "THAT FEATURE IS OFF", NEVER "THE BUILD IS BROKEN".
#
# A hosted-dependent module whose absent variable throws at import, fails a type
# check, or reds a test is the failure this job exists to catch. A module that
# reads an absent variable and quietly turns its feature off is the behaviour it
# exists to protect.
#
# IS THIS NOT ALREADY COVERED? Nearly, and by accident — which is the whole
# argument for a job that covers it on purpose. `test`, `typecheck`, `lint` and
# `site-build` all run on runners where no hosted variable happens to be set,
# because no secret is wired into any of them. That is a property of today's
# workflow files, not of this repo, and it is exactly the kind of property that
# stops holding the first time somebody adds a `secrets.` line or a repo-level
# variable to get one job green. Three things make this job different:
#
#   1. It SCRUBS rather than relies on absence (scripts/run-credential-free.sh),
#      so it keeps meaning what it says even in an environment that has hosted
#      variables in it.
#   2. It BOOTS THE APP. Nothing else in CI starts the server without
#      credentials. A type check never executes a module and a build only
#      evaluates what the bundler reaches, so an import-time throw on the boot
#      path — the likeliest shape of this defect — is invisible to every other
#      gate. See scripts/credential-free-smoke.sh.
#   3. It is one named check the hosted-side programme can be gated on. "The
#      public app builds without us" is not a claim any private repository can
#      make about this one; it has to be proven here.
#
# UNSET, NOT EMPTY. A workflow-level `env: DATABASE_URL: ''` is not this. It
# leaves the NAME present in `process.env`, so `!== undefined` is true, `in` is
# true, and a Zod `.optional()` sees a present empty string instead of skipping
# the field — every one of those reads the opposite way round from a
# contributor's machine. The scrub removes names; its fixture suite
# (scripts/test-run-credential-free.sh, run by scripts-test.yml) pins that
# distinction as its second case, along with the other direction — that PATH,
# HOME, CI, NODE_OPTIONS and the GITHUB_* plumbing Actions wires steps together
# with all survive.
#
# THE SCRUB LIST LIVES IN THE SCRIPT, NOT HERE, and it is patterns rather than
# names: the hosted seam gains variables, and a hand-kept list of exact names
# goes stale silently — the new variable is simply not scrubbed, this job stays
# green, and the gate quietly stops covering the newest part of the seam. The
# script's header carries that reasoning and the justification for each family.
#
# TWO EVENTS, ONE DEPTH, TWO BASES — and this is the one place this job
# deliberately does NOT copy test.yml, so here is the whole argument.
#
# test.yml runs the FULL monorepo sweep on `merge_group` because a per-PR
# affected diff cannot see an interaction between two PRs that each branched
# from a base predating the other. That reasoning is right, and it is satisfied
# here WITHOUT a full sweep, because `--affected` is computed against a base,
# not against a branch: in the queue the base is `merge_group.base_sha`, the
# commit the combined tree was built on, so the affected set spans main plus
# EVERY pull request in the group, evaluated on the combined tree. The two-PR
# interaction — one PR adds a module that reads a hosted variable at import,
# another adds the import that reaches it — is inside that set. A full sweep
# would add the packages neither PR can reach, which is precisely the work that
# cannot be affected by either.
#
# What a full sweep WOULD add here is 20-30 minutes on every merge, and it would
# add them to the wrong place. test.yml measures its own unsharded sweep at
# 19-29 minutes and shards it four ways for that reason; sharding this job is
# out of scope, so an unsharded sweep would make this check the queue's new long
# pole and push it toward the queue's 60-minute check-response window — the
# stall the rest of this header spends its length avoiding. And most of that
# sweep would re-prove what test.yml proved twenty minutes earlier: turbo runs
# in STRICT env mode (turbo.json declares no `envMode`), so the only hosted
# variables that reach a turbo task at all are the ones `globalPassThroughEnv`
# names — DORKOS_MANAGED_*, MCP_API_KEY, NGROK_AUTHTOKEN, TUNNEL_*, plus
# POSTHOG_*/NEXT_PUBLIC_POSTHOG_* on `build`. DATABASE_URL, BETTER_AUTH_*,
# DORKOS_CLOUD_*, NEON_*, STRIPE_*, COMPOSIO_*, NANGO_* and the OAuth client
# ids are stripped by turbo before this job's scrub ever matters. The scrub is
# load-bearing for the passthrough list, for `pnpm install`, and for the boot
# probe — none of which a bigger sweep would cover better.
#
# So both legs run the same command with a different base, and the difference
# between the events is which base:
#
#   * `merge_group`: `TURBO_SCM_BASE=merge_group.base_sha` — the combined tree
#     against the commit it was built on.
#   * `pull_request`: `TURBO_SCM_BASE=pull_request.base.sha` — the PR's own
#     diff and nobody else's. A SHA rather than `origin/<base_ref>` because a
#     ref resolves at checkout time and a merge landing in that window silently
#     changes the affected set (test.yml's header has the full argument).
#
# The PR leg exists at all because a required check must SUCCEED ON THE PULL
# REQUEST before GitHub will let the PR into the queue (measured on PR #1246: a
# merge_group-only required check deadlocks every PR out of the queue for
# `check_response_timeout_minutes`).
#
# THE BOOT PROBE IS THE ONE THING THAT IS NOT AFFECTED-SCOPED. It builds the
# `dorkos` CLI closure unconditionally (measured at 52s with the dependency
# packages warm, a few minutes cold, and most of it is shared with whatever the
# steps above already built). That is deliberate: the probe is this job's unique
# coverage, and an affected-scoped probe would skip exactly the pull request
# that changes nothing under apps/server — which is precisely the change that
# can break the boot path from a shared package or a dependency bump.
#
# THE SCOPE DECISION IS INSIDE THE JOB, never a workflow-level `paths:` filter,
# for the reason site-build.yml's header works through at length: a workflow
# skipped by path filtering reports NOTHING (not success), which keeps a PR out
# of the queue and then stalls the queue for an hour. Here the scope decision is
# turbo's `--affected` against a base, inside the run — there is no `if:` on any
# step and no filter on the workflow, so this job always runs, always executes
# every step, and always reports `credential-free-build`.
# scripts/__tests__/credential-free-workflow.test.ts fails if a `paths:` filter
# ever appears in the `on:` block.
#
# IT IS NOT A REQUIRED CHECK YET, and this file does not make it one. Branch
# protection is the operator's (the DOR-1519 precedent), and promoting it needs
# no edit here — the `merge_group:` trigger below is the half that has to land
# first, because a required context whose workflow lacks it never reports inside
# the queue and every pull request waits forever. Until the ruleset lists
# `credential-free-build`, a red here blocks merge-tail.yml from ARMING
# auto-merge (scripts/should-arm-automerge.sh requires every check settled
# green) but does not block the queue. Same half-gate `lint` lived in until
# 2026-09-02 and `site-build` still lives in.
#
# WHAT IT DELIBERATELY DOES NOT RUN: `pnpm lint:root` (the second ESLint pass
# over scripts/, .claude/ and templates/) and the Playwright suites. Neither
# reads a hosted variable, so running them here would add minutes and no
# coverage of this property; `lint` and `browser-test` own them.
on:
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a group
# and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. Deliberately IDENTICAL in form to test.yml and site-build.yml
# (keep them in step).
concurrency:
  group: credential-free-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE ONE PRODUCER of the `credential-free-build` context, on both events. Do
  # not rename it, and do not split it into two same-named jobs under mutually
  # exclusive `if`s — test.yml's header explains why one producer is the only
  # shape whose required-check semantics are pinned down.
  credential-free-build:
    runs-on: ubuntu-latest
    # A ceiling on a hang, not a budget. The expensive shape is an affected set
    # that expands to most of the monorepo — a change under packages/shared —
    # where test.yml measured the unsharded sweep at 19-29 minutes; add the
    # build, typecheck and lint of the same set, the CLI build and the probe and
    # the worst case lands in the forties. The number stays UNDER the queue's
    # 60-minute `check_response_timeout_minutes` (the figure browser-test.yml,
    # db-check.yml and docs-openapi-check.yml all state) on purpose: a job that
    # could outlive that window stalls the queue for an hour instead of going
    # red, which is exactly what this workflow's header argues against
    # everywhere else. If a healthy run ever approaches this, shard the leg the
    # way test.yml shards its own rather than raising the number past 60.
    timeout-minutes: 50
    env:
      # Raise the V8 old-space ceiling for every Node process this job spawns —
      # pnpm, turbo and each `vitest run` worker inherit NODE_OPTIONS. The same
      # ceiling test.yml's shards carry, for the same reason (DOR-1576): a
      # single vitest process running many suites exhausted the default ~2GB
      # heap. The scrub leaves this alone; the fixtures pin that.
      NODE_OPTIONS: --max-old-space-size=8192
      # The boot probe's port. 4242 is the repo's production default and nothing
      # else is listening on a runner.
      DORKOS_PORT: '4242'
    steps:
      # fetch-depth: 0 for two independent reasons, both already established
      # elsewhere: the affected step below needs `origin/<base>` present to diff
      # against (site-build.yml), and the server suite's DOR-339 migration guard
      # reads `git tag -l`, which is empty at depth 1 and false-fails (DOR-884).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Says out loud, before anything runs, what this runner actually had set.
      # On a healthy runner the answer is "nothing", and that is the point: a
      # reader can tell "the environment was already clean" apart from "the
      # scrub removed six things", which are very different facts about how this
      # repository is being built.
      - name: Report the hosted-side variables this runner has set
        run: bash scripts/run-credential-free.sh --print

      # The install runs scrubbed too. A postinstall script that reads a hosted
      # variable is as much a break of the promise as a source module that does,
      # and this is the first command that could hit one.
      - name: Install dependencies with no hosted-side variable set
        run: bash scripts/run-credential-free.sh pnpm install --frozen-lockfile

      # TURBO_SCM_BASE names the comparison base explicitly, and it is the ONLY
      # thing that differs between the two events (see TWO EVENTS, ONE DEPTH,
      # TWO BASES). It has to be named: the checkout is a detached ref with no
      # local `main`, so turbo's default base does not resolve here. Both values
      # are SHAs rather than `origin/<base_ref>` because a ref resolves at
      # checkout time and a merge landing in that window silently changes the
      # affected set. `merge_group.base_sha` is the commit the combined tree was
      # built on, so the affected set spans every pull request in the group.
      #
      # NO `if:` ON EITHER STEP, on purpose: a pair of copies under mutually
      # exclusive conditions would be the same command with one line changed, and
      # those are the copies a flag goes quietly missing from (test.yml's header
      # spends a paragraph on exactly which of its flags must NOT ride its second
      # leg). The expression picks the base; nothing else forks on the event.
      #
      # `--continue` so one red task still reports every other task's result
      # instead of hiding behind the first failure — the reason test.yml and
      # typecheck.yml pass it.
      #
      - name: Build, typecheck and lint everything this change can reach
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: bash scripts/run-credential-free.sh pnpm exec turbo build typecheck lint --affected --continue

      # A SECOND turbo invocation rather than a fourth task on the line above,
      # because turbo hands a `--` passthrough to every task in the run: one
      # command would pass `--run` to eslint and tsc as well as to vitest, and
      # `eslint . --run` is an error. The tasks that take no passthrough go
      # above; the one that needs it goes here.
      #
      # `-- --run` is REQUIRED, not decoration: five packages' `test` scripts are
      # a bare `vitest`, which without it starts watch mode and never exits.
      # `--concurrency=1` for the DOR-121 reason test.yml gives — turbo's default
      # fan-out times ten, each spawning its own vitest worker pool, is ~10x
      # oversubscription on a 4-core runner, and starved suites report timeouts
      # as failures. No `--retry`: this leg has no flake-naming step, and a retry
      # with nothing naming what it absorbed is the silent retry test.yml's
      # header refuses.
      #
      # No `--summarize` + scripts/assert-tests-executed.sh either, and that is a
      # decision rather than an omission: that assertion demands that EVERY
      # package declaring a `test` script ran, which an affected subset cannot
      # satisfy by construction. Its own header says so, and test.yml gates it to
      # the leg that sweeps everything for the same reason. The cache-replay
      # failure it guards against needs a warm turbo cache, and this repo has no
      # remote cache and cold runners.
      - name: Test everything this change can reach
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: bash scripts/run-credential-free.sh pnpm exec turbo test --affected --continue --concurrency=1 -- --run

      # ---- both events: the boot probe ----
      #
      # `turbo build --filter=dorkos`, not `pnpm --filter`: turbo builds the
      # workspace dependencies first and exits 1 on a filter that stops matching,
      # where `pnpm --filter` prints "No projects matched" and exits 0 — the
      # silent-no-op defect site-build.yml, db-check.yml and desktop-renderer.yml
      # all document. Where the change already reached the CLI's closure, the
      # step above built it and this is a turbo cache hit.
      #
      # The CLI bundle is the entry point, not `apps/server/dist/index.js`:
      # `@dorkos/db` publishes TypeScript from its `exports` map, so the server's
      # tsc output is not runnable by bare node — only the esbuild bundle is. It
      # is also the thing a user actually runs, which is the point of a boot
      # probe.
      - name: Build the CLI the boot probe runs
        run: bash scripts/run-credential-free.sh pnpm exec turbo build --filter=dorkos

      - name: Boot the server and probe its health endpoint
        run: bash scripts/run-credential-free.sh bash scripts/credential-free-smoke.sh
