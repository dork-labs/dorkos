name: changelog-fragment-check

# Enforces the changelog-fragment guarantee at PR time.
#
# A fragment per user-facing change is normally minted by the local post-commit
# hook (.claude/git-hooks/changelog-populator.py). But that hook is a per-clone
# convenience, not a guarantee: it never runs on the squash-merged commit that
# actually lands on main, and it silently does nothing in a checkout where it was
# not installed or on a rebased/amended commit it treats as a replay. Six commits
# reached main with no fragment before this gate existed, surfacing only at the
# release-time backfill — the worst possible moment.
#
# This job re-runs the fragment analyzer (.claude/scripts/changelog_backfill.py)
# against the PR's own commits (merge-base..head) and fails if a user-facing
# commit (feat / fix / refactor / perf) has no fragment. It inspects the raw
# branch commits, so it is immune to squash-merge relabeling and to wherever the
# work was committed.
#
# Coverage is a declared fact (DOR-387): a fragment's `covers:` frontmatter names
# the commit subjects, SHAs, or PR it covers, and the hook that mints fragments
# pre-fills it. That keeps the gate independent of the fragment's prose, which
# authors are supposed to rewrite for a human. `--pr` is passed so a fragment
# declaring `"#<this PR>"` covers the whole PR. Fragments with no declaration
# still fall back to the old word-overlap match.
#
# To pass: add the fragment (see changelog/README.md + the writing-changelogs
# skill), or label the PR `skip-changelog` for a deliberately non-user-facing
# change — a pure refactor, a CI/build-infra fix (e.g. a `fix(ci):` scope), or a
# duplicate already covered by another fragment.
#
# A second job, `no-fragment-under-skip-label`, closes the opposite hole: a PR
# that claims `skip-changelog` and adds a fragment anyway. See its own comment.

# `merge_group` is here because both jobs below are REQUIRED checks, and a
# required check that never reports on a merge group blocks the queue forever.
#
# What each job can honestly do there differs, and the split is deliberate:
#
#   * VALIDITY (is a fragment's `covers:` block well-formed) needs only two
#     commits, and the merge group supplies both. It genuinely re-runs, against
#     the real commit the merge will sit on.
#   * COVERAGE (does this PR owe a fragment, and is it exempt) needs the PR's
#     LABELS and NUMBER. Neither exists in the `merge_group` payload, and the
#     only place they appear — the `gh-readonly-queue/...` ref format — is
#     explicitly not part of GitHub's API contract, so parsing it would be a
#     brittle gate on a policy question. Coverage therefore stays decided at pull
#     request time, which is the one moment both facts are known.
#
# That is sound rather than a hole because a pull request cannot ENTER the queue
# until its required checks have passed on the pull request itself. The coverage
# question is answered before queueing, and the answer cannot change afterwards:
# the label is fixed and the diff is fixed. What the queue adds is validity
# against the real base, which is the only half that a moving base can break.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fragment-present:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head (not the default merge ref) with full history so
      # the merge-base against the base branch resolves.
      - uses: actions/checkout@v7
        with:
          # On merge_group there is no pull_request object; github.sha is already
          # the queue branch tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Determine the base to diff against
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # The queue branch is built ON base_sha, so it IS the merge base.
            base="${{ github.event.merge_group.base_sha }}"
            git fetch --no-tags origin "$base" || git fetch --no-tags --depth=200 origin
          else
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "base: $base"

      # The gate guards itself: the analyzer's own tests run before it decides
      # anything. Pure-stdlib Python 3, seconds to run, and it fires even on a
      # `skip-changelog` PR so a regression in the gate can never slip through.
      #
      # That last part is only safe because the suite is HERMETIC: every case
      # builds a throwaway git repo in a temp dir, and nothing reads this repo's
      # real changelog/unreleased/ or commit history. A test that depended on live
      # repo state would red-light unrelated PRs — including the `skip-changelog`
      # ones this job is supposed to wave through. Keep it that way.
      - name: Test the fragment analyzer
        run: python3 .claude/scripts/__tests__/test_changelog_backfill.py

      # VALIDITY — deliberately separate from coverage below, on both axes:
      #
      #   * No `skip-changelog` bypass. A fragment with a broken `covers:` block is
      #     a defect regardless of whether this PR owes a changelog entry, and it
      #     is contagious: its declaration is ignored, so it silently claims
      #     nothing. Letting one in through the skip door means the NEXT PR pays.
      #   * `--changed-only`, so this step judges only the fragments this PR
      #     actually wrote. A stray broken fragment already on main is reported
      #     (see the NOTE in the step below) but never fails an author who did not
      #     write it.
      #
      # Those two together are what keep this gate's blast radius equal to the
      # PR's own diff. Do not re-widen either one: dropping `--changed-only` makes
      # innocent PRs red, and adding a `skip-changelog` bypass lets the defect in.
      - name: Validate the changelog fragments this PR touched
        run: |
          python3 .claude/scripts/changelog_backfill.py \
            --since "${{ steps.base.outputs.sha }}" --validate --changed-only

      # COVERAGE — skipped (success) when the PR carries `skip-changelog`, so a
      # deliberate non-user-facing PR is never blocked and the check still reports
      # green. `--changed-only` here too, so a stray malformed fragment downgrades
      # to a NOTE on stdout instead of failing this PR.
      # The analyzer is pure-stdlib Python 3 — no install/build step needed.
      #
      # `github.event_name == 'pull_request'` is load-bearing, not decoration. On
      # a merge group `contains(github.event.pull_request.labels.*.name, ...)` is
      # false because the object is absent, not because the label is absent — so
      # without this guard a `skip-changelog` PR would have its coverage check
      # run for the first time inside the queue, against a label it legitimately
      # carries, and fail there. That is the worst possible place to discover it:
      # the queue would eject the PR with no obvious cause.
      - name: Require a changelog fragment for every user-facing commit
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          python3 .claude/scripts/changelog_backfill.py \
            --since "${{ steps.base.outputs.sha }}" \
            --pr "${{ github.event.pull_request.number }}" --check --changed-only

      # Said out loud rather than left as an absent step, so that reading this
      # job's merge-group run does not look like coverage silently vanished.
      - name: Note where coverage was decided
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo "Fragment VALIDITY was re-checked above against the commit this"
          echo "merge will sit on (${{ steps.base.outputs.sha }})."
          echo
          echo "Fragment COVERAGE is not re-checked here, by design: it depends on"
          echo "the pull request's labels and number, which the merge_group payload"
          echo "does not carry. It was enforced on the pull request itself, which"
          echo "the PR had to pass before it could enter this queue, and neither"
          echo "the label nor the diff can change between there and here."

  # The mirror image of the job above, for the one case that job cannot see
  # (DOR-618). Two different things decide whether a change is user-facing, and
  # nothing reconciled them:
  #
  #   * the post-commit populator reads the COMMIT SUBJECT, so a `feat(` or
  #     `fix(` prefix mints a fragment;
  #   * the `skip-changelog` label governs the PULL REQUEST.
  #
  # So an internal-only PR carrying the label can still accumulate a stray
  # user-facing entry, because one commit happened to be typed `fix(` rather than
  # `chore(`. The coverage job above is satisfied either way: the label makes it
  # skip its coverage step entirely. That happened on PR #532 — a harness change
  # with `skip-changelog`, a fixup commit typed `fix(`, and a fragment nobody
  # asked for. The author caught it; nothing else would have, and it would have
  # ridden into the next release's compiled CHANGELOG.md as a user-facing bullet
  # about an internal hook.
  #
  # Teaching the populator the label was the other candidate and is not reliable:
  # a post-commit hook has no PR number on a branch's first commit, the label is
  # usually applied after the commits exist, and a hook that phones GitHub on
  # every commit fails offline. So the reconciliation happens here, at the one
  # moment both facts are known.
  no-fragment-under-skip-label:
    # Only meaningful when the label is on. With it off, the coverage job above
    # is already asking the harder question.
    #
    # On a merge group this is false because there is no pull_request object to
    # read labels from, so the job skips and the required check reports skipped,
    # which satisfies branch protection without asserting anything. That is the
    # intended behaviour and matches where the question belongs: this job
    # reconciles a LABEL against a DIFF, and the label only exists on the pull
    # request. It has already run there, and a PR cannot reach this queue without
    # passing it.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On merge_group there is no pull_request object; github.sha is already
          # the queue branch tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Determine the base to diff against
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # The queue branch is built ON base_sha, so it IS the merge base.
            base="${{ github.event.merge_group.base_sha }}"
            git fetch --no-tags origin "$base" || git fetch --no-tags --depth=200 origin
          else
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "base: $base"

      # `--diff-filter=AR`: a fragment that ARRIVED at a path it was not at before,
      # whether git calls that an add or a rename.
      #
      # `A` alone is not that. Rename an existing fragment and append a bullet in
      # the same commit, and git's rename detection (on by default) scores the pair
      # as one `R` — `R086` in the throwaway repo this was verified in, `R068` in
      # the reviewer's. `A` selects neither, so the step printed "No changelog
      # fragment added" over a genuinely new user-facing bullet.
      #
      # Do not "simplify" this back to `A` after seeing a rename report as `D` + `A`
      # in a quick test: rename detection has a similarity threshold, and a
      # two-line throwaway file falls under it while a real fragment does not. `AR`
      # is the letter set that is correct whether or not detection binds.
      #
      # A pure rename scores `R100` and is caught too. That is the right side to
      # err on: from this step a rename and a rewrite are the same event, and the
      # remedy is one label or one separate pull request away.
      #
      # `M` is deliberately still tolerated. A `skip-changelog` PR may be REQUIRED
      # to edit an existing fragment in place: the validity step above has no label
      # bypass, so repairing somebody's malformed `covers:` block is exactly the
      # kind of internal fix that carries this label, and failing on a modification
      # would make that repair impossible. The populator can only ever mint a new
      # file, never append to one, so the case this job exists for is fully covered.
      - name: Fail if a skip-changelog PR adds a changelog fragment
        run: |
          base="${{ steps.base.outputs.sha }}"
          added="$(git diff --name-only --diff-filter=AR "$base..HEAD" -- ':/changelog/unreleased/')"
          if [ -n "$added" ]; then
            echo "::error::This pull request is labeled 'skip-changelog', which says it has no user-facing change, but it puts a changelog fragment at a path that had none. Both cannot be true."
            echo "Fragments added or renamed into place by this pull request:"
            echo "$added" | sed 's/^/  /'
            echo ""
            echo "The post-commit populator mints a fragment from any commit subject starting"
            echo "'feat(', 'fix(', 'refactor(' or 'perf(' — it never sees the label. Pick one:"
            echo ""
            echo "  * The change IS user-facing: drop the 'skip-changelog' label and keep the"
            echo "    fragment, rewritten for a person (see changelog/README.md)."
            echo "  * The change is NOT user-facing: delete the fragment and retype the commit"
            echo "    subject as 'chore(' or 'ci(' so the populator stops minting it."
            echo "  * You only RENAMED a fragment somebody else wrote: that is caught here too,"
            echo "    on purpose, because a rename and a rewrite look the same from this step."
            echo "    Split the rename into its own unlabeled pull request, or drop the label."
            exit 1
          fi
          echo "No changelog fragment added, which is what 'skip-changelog' asserts."
