name: CLI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    # The tarball under test bundles apps/server and apps/client (esbuild), so
    # they gate PRs alongside the CLI package itself.
    paths:
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'apps/server/**'
      - 'apps/client/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/smoke-test.sh'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref for PRs only. For push events, group
# by SHA instead of ref: GitHub only lets one run per group be *pending* at a
# time, so several quick merges to main sharing a `cli-smoke-refs/heads/main`
# group would cancel each other's queued runs and only the final push would
# actually get checked — reproduced for typecheck.yml (DOR-517/#543), the same
# shape this workflow shared until DOR-637. Per-SHA groups give every
# push-to-main its own slot, and as a side effect also keep a workflow_dispatch
# run from ever sharing a group with a push to the same ref.
concurrency:
  group: cli-smoke-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt into Node 24 for every JavaScript-based action (checkout, setup-node,
# upload-artifact, download-artifact, etc.) ahead of GitHub's Sept 2026 hard
# cutoff for Node 20 runtime. See the deprecation notice at
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    # Baseline ~1.5-2 minutes on a warm turbo/pnpm cache; generous headroom
    # for a cold-cache run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter=dorkos run build

      - name: Pack tarball
        run: |
          cd packages/cli
          pnpm pack --pack-destination $GITHUB_WORKSPACE/artifacts
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - uses: actions/upload-artifact@v7
        with:
          name: cli-tarball
          path: artifacts/dorkos-*.tgz
          retention-days: 1

  smoke-test-bare:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Baseline ~40-70 seconds per matrix leg.
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # apt hung for a full 10 minutes on four runs on 2026-08-19 while the
      # Ubuntu mirrors were unreachable (DOR-1363). A short deadline plus one
      # retry turns that into a fast, named failure instead of a job that sits
      # on a stalled mirror. ubuntu-latest already ships python3 and
      # build-essential, so on a healthy runner this is a no-op either way.
      - name: Install build tools
        timeout-minutes: 6
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-acquire-timeouts >/dev/null
          # The image's mirror list puts azure.archive.ubuntu.com first. On
          # 2026-08-19 it was dead for hours and then TRICKLED: it answered the
          # InRelease probe in time and then stalled mid-package (fonts-wqy-zenhei,
          # 7 MB, never finished), which neither an acquire timeout nor a
          # liveness probe catches. The upstream archive.ubuntu.com answered
          # every time. So for CI the Azure mirror is simply dropped from the
          # list and apt goes straight upstream (DOR-1363). Revisit if upstream
          # ever becomes the slow one.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2; do
            if sudo apt-get update && sudo apt-get install -y python3 build-essential; then exit 0; fi
            echo "apt attempt $attempt failed; retrying once" >&2
            sleep 15
          done
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Mock Claude CLI
        run: |
          printf '#!/bin/sh\necho "claude mock 1.0.0"\n' | sudo tee /usr/local/bin/claude
          sudo chmod +x /usr/local/bin/claude

      - name: Install dorkos from tarball
        run: npm install -g dorkos-*.tgz

      - name: Verify install
        run: |
          set -e
          echo "=== which dorkos ==="
          which dorkos
          echo "=== dorkos --version ==="
          dorkos --version
          echo "=== dorkos --help ==="
          dorkos --help
          echo "=== dorkos --post-install-check ==="
          dorkos --post-install-check
          echo "=== dorkos init --yes ==="
          dorkos init --yes
          echo ""
          echo "All smoke tests passed"

  smoke-test-docker:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Baseline ~1-1.5 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Build smoke test image
        run: docker build --target smoke -t dorkos-smoke .

      - name: Run smoke tests
        run: docker run --rm dorkos-smoke

  integration-test:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Baseline ~1-1.2 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore
            scripts/smoke-test.sh

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Build integration test image
        run: docker build --target integration -t dorkos-integration .

      - name: Run integration tests
        run: docker run --rm dorkos-integration
