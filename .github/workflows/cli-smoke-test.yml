name: CLI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    # The tarball under test bundles apps/server and apps/client (esbuild), and
    # with them every workspace package they depend on at runtime, so all of
    # those gate PRs alongside the CLI package itself. This list is the
    # workspace closure of packages/cli: its own workspace deps (they sit in
    # devDependencies because esbuild inlines them), then each one's
    # `dependencies`, recursively. Add a package here when it joins that
    # closure; #3812 changed packages/db and got no tarball because db was missing.
    paths:
      - 'packages/cli/**'
      - 'apps/server/**'
      - 'apps/client/**'
      - 'packages/a2a-gateway/**'
      - 'packages/browser/**'
      - 'packages/cloud-api/**'
      - 'packages/connector-providers/**'
      - 'packages/db/**'
      - 'packages/decisions/**'
      - 'packages/doe/**'
      - 'packages/extension-api/**'
      - 'packages/harness/**'
      - 'packages/icons/**'
      - 'packages/keep-awake/**'
      - 'packages/marketplace/**'
      - 'packages/memory/**'
      - 'packages/mesh/**'
      - 'packages/operating-skills/**'
      - 'packages/relay/**'
      - 'packages/shared/**'
      - 'packages/skills/**'
      - 'packages/ui/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/smoke-test.sh'
      - 'scripts/hub-smoke/**'
      - 'scripts/hub-entrypoint.sh'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref for PRs only. For push events, group
# by SHA instead of ref: GitHub only lets one run per group be *pending* at a
# time, so several quick merges to main sharing a `cli-smoke-refs/heads/main`
# group would cancel each other's queued runs and only the final push would
# actually get checked — reproduced for typecheck.yml (DOR-517/#543), the same
# shape this workflow shared until DOR-637. Per-SHA groups give every
# push-to-main its own slot, and as a side effect also keep a workflow_dispatch
# run from ever sharing a group with a push to the same ref.
concurrency:
  group: cli-smoke-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt into Node 24 for every JavaScript-based action (checkout, setup-node,
# upload-artifact, download-artifact, etc.) ahead of GitHub's Sept 2026 hard
# cutoff for Node 20 runtime. See the deprecation notice at
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    # Baseline ~1.5-2 minutes on a warm turbo/pnpm cache; generous headroom
    # for a cold-cache run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # THE PNPM STORE: every ref restores it, only `refs/heads/main` saves it
      # (DOR-4537, ledger 261117-141554). setup-node's `cache: pnpm` saved a
      # store under any ref whose restore missed, PR merge refs included, where
      # no other ref can read it. Same key as test.yml's test-shard, which has
      # the full reasoning, so on Linux this restores the store main saved.
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "image=${ImageOS:?ImageOS is not set on this runner}" >> "$GITHUB_OUTPUT" && echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store built on this runner image
        id: pnpm-store-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.image }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      # main only, after a good install: test.yml's test-shard says why (DOR-4537).
      - name: Save the pnpm store for the queue and pull requests
        if: ${{ github.ref == 'refs/heads/main' && steps.pnpm-store-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.image }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build CLI
        run: pnpm --filter=dorkos run build

      - name: Pack tarball
        run: |
          cd packages/cli
          pnpm pack --pack-destination $GITHUB_WORKSPACE/artifacts
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - uses: actions/upload-artifact@v7
        with:
          name: cli-tarball
          path: artifacts/dorkos-*.tgz
          retention-days: 1

  smoke-test-bare:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Baseline ~40-70 seconds per matrix leg.
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # The hosted image already ships these tools. Check them directly instead
      # of depending on Ubuntu mirrors for an otherwise offline prerequisite.
      - name: Verify build tools
        timeout-minutes: 6
        run: |
          python3 --version
          gcc --version
          g++ --version
          make --version

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Mock Claude CLI
        run: |
          printf '#!/bin/sh\necho "claude mock 1.0.0"\n' | sudo tee /usr/local/bin/claude
          sudo chmod +x /usr/local/bin/claude

      - name: Install dorkos from tarball
        run: npm install -g dorkos-*.tgz

      - name: Verify install
        run: |
          set -e
          echo "=== which dorkos ==="
          which dorkos
          echo "=== dorkos --version ==="
          dorkos --version
          echo "=== dorkos --help ==="
          dorkos --help
          echo "=== dorkos --post-install-check ==="
          dorkos --post-install-check
          echo "=== dorkos init --yes ==="
          dorkos init --yes
          echo ""
          echo "All smoke tests passed"

  smoke-test-docker:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Baseline ~1-1.5 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Build smoke test image
        run: docker build --target smoke -t dorkos-smoke .

      - name: Run smoke tests
        run: docker run --rm dorkos-smoke

  integration-test:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Baseline ~1-1.2 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore
            scripts/smoke-test.sh

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Build integration test image
        run: docker build --target integration -t dorkos-integration .

      - name: Run integration tests
        run: docker run --rm dorkos-integration

  # The hub image (DOR-2935): what DorkOS Cloud boots for a person's own
  # DorkOS in the cloud. Boots it against a stand-in for Cloud
  # (scripts/hub-smoke/run.mjs).
  hub-smoke-test:
    needs: build-tarball
    runs-on: ubuntu-latest
    # Measured locally at about 15 seconds of checks after the image builds;
    # the build matches integration-test's.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore
            scripts/hub-smoke
            scripts/hub-entrypoint.sh

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball

      - name: Build hub smoke image
        run: docker build --target hub-smoke -t dorkos-hub-smoke .

      # DorkOS Cloud mounts a new, empty volume owned by root at the data
      # folder, so the run gets exactly that.
      - name: Run hub smoke checks on an empty root-owned data folder
        run: |
          data="$RUNNER_TEMP/hub-data"
          sudo mkdir -p "$data"
          sudo chown root:root "$data"
          sudo chmod 755 "$data"
          docker run --rm -v "$data:/home/node/.dork" dorkos-hub-smoke
