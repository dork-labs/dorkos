name: test

# Runs the unit test suite of every package that declares one, on every PR and
# on push to main.
#
# Before this workflow existed, NO CI job ran the tests. The only enforcement
# was the lefthook `pre-push` gate — and that gate ran all 18 package suites in
# one go, which on a machine already busy with other agents takes minutes and
# fails with rotating timeouts on a tree nobody touched. So it got bypassed:
# `--no-verify` was used six times on 2026-07-27 alone, by three different
# actors, correctly each time. A bypassable local gate plus no CI job means a
# change can reach `main` with no test having run anywhere. That is DOR-544.
#
# The companion half of the fix is in lefthook.yml: `pre-push` narrowed to
# `--affected` so it stays fast and survivable, with the full-monorepo sweep
# moved here where it can take its time.
#
# FULL MONOREPO, not affected-only — the same reasoning typecheck.yml spells
# out. A per-PR affected diff cannot see an interaction between two PRs that
# each branched from a base predating the other; only a full run against the
# tip catches it. `--continue` so one red package still reports every other
# package's result instead of hiding behind the first failure.
#
# NO separate build step: `test` declares `dependsOn: ["^build"]` in turbo.json,
# so `turbo test` builds every dependency package first. Turbo computes that
# from the task graph.
#
# `-- --run` is REQUIRED, not decoration. Five packages' `test` scripts are a
# bare `vitest` (@dorkos/db, harness, marketplace, operating-skills, skills),
# which without `--run` starts vitest in WATCH mode and never exits. It is also
# the exact passthrough the pre-push gate uses, so the two share a turbo cache
# key. And note AGENTS.md: a bare `pnpm vitest run` over the whole monorepo
# falsely fails two tests, so full runs go through turbo, never through vitest
# directly.
#
# VITEST_RETRY is deliberately NOT set here. Under lefthook it is 2, to absorb
# timing flake on a loaded developer machine; a CI runner is not contended the
# same way, and a retry budget in CI would quietly convert a real intermittent
# failure into a green check. Flake that shows up here should be fixed, not
# retried. (This does mean the same commit can pass one gate and fail the other
# — the retry setting is the reason, and it is intentional.)
# `merge_group` is what lets this become a REQUIRED check. Until now the full
# suite ran on every pull request and could block nothing, which is the exact
# inversion the repo had: the cheapest policy checks gated `main` while its most
# expensive and most valuable signal was advisory. A required check must report
# on merge groups or the queue blocks forever, so the trigger comes first and the
# branch-protection change follows it.
#
# The queue run is not redundant with the pull-request run. A pull request only
# ever tests its own diff against the base it branched from; the merge group
# tests `main` plus everything ahead of it in the queue plus this pull request.
# That difference is the #488/#489 class — two changes green apart, red together.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs on the same ref for PRs only. For push events, group
# by SHA instead of ref: GitHub only lets one run per group be *pending* at a
# time, so several quick merges to main sharing a `test-refs/heads/main` group
# would cancel each other's queued runs and only the final push would actually
# get tested. Per-SHA groups give every push-to-main its own slot.
#
# This job is slow (14 minutes on a runner), so a queue is the normal case here
# rather than a rare one, and a dropped run means a commit reaches main with
# the tests never executed against it — the exact hole this workflow closes.
#
# Deliberately IDENTICAL in form to typecheck.yml's group as fixed by #543
# (DOR-517), which found the same defect from the other end and cited four real
# merges on 2026-07-26 where two commits' runs were cancelled before they ever
# started. Two CI workflows with different concurrency semantics is the kind of
# divergence nobody notices until a run goes missing — keep these in step.
concurrency:
  group: test-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # MEASURED, not guessed: on 2026-08-19 the last eight green runs on main
    # took 19-29 minutes wall clock on ubuntu-latest (the suite has grown, and
    # a busy runner adds a few more), and one run finished its 30/30 turbo
    # tasks and was then CANCELLED by the previous 30-minute ceiling before
    # the assert step could run (DOR-1363). 45 keeps a hung watch-mode suite
    # from burning an hour while leaving real headroom above the measured
    # ceiling. If a healthy run ever crosses ~35 minutes, split the job
    # rather than raising this again.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 for the tags, not the history. actions/checkout@v4
      # defaults to depth 1 and does NOT fetch tags at that depth, so
      # `git tag -l` in config-manager.test.ts's DOR-339 regression guard
      # ("the newest migration key is strictly newer than every released
      # version") saw zero tags on every push/PR since the v0.57.0 release —
      # its own package.json fallback then collided with the newly-tagged
      # release version and its `git show v<tag>:...` shipped-in-release
      # check failed to resolve the tag, so the guard false-failed (DOR-884).
      # A full clone is the honest fix: it makes CI see the same tags a local
      # checkout already has, rather than teaching the guard to tolerate not
      # knowing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --summarize writes a machine-readable record of the run to
      # .turbo/runs/<id>.json. The next step is the only reason it is here.
      #
      # --concurrency=1 for the DOR-121 reason the pre-push gate already gives,
      # which applies harder here, not less. Turbo's default is to fan out ten
      # package suites at once, and every `vitest run` then spawns its own
      # ~CPU-count worker pool. That is ~10x oversubscription on a 14-core
      # developer machine; ubuntu-latest has 4 cores, so it is worse. Suites run
      # one at a time and each keeps its internal parallelism, which is the
      # right shape for a small runner.
      #
      # This is not a preference. The first two runs of this workflow at the
      # default concurrency failed on a DIFFERENT pair of timing-sensitive tests
      # each time, on code neither run had changed — "dev child #0 was never
      # spawned", "Test timed out in 5000ms". Starving a suite of CPU and then
      # reporting its timeouts as failures makes the gate a coin toss, and a
      # gate people cannot trust is a gate people route around. Retries would
      # have hidden this; running the work properly fixes it.
      - name: Run every package's test suite
        run: pnpm exec turbo test --summarize --continue --concurrency=1 -- --run

      # THE POINT OF THIS STEP: turbo caches `test`, and a full cache hit prints
      # "Tasks: 29 successful, 29 total" (18 test tasks plus the 11 builds they
      # depend on), exits 0, and takes ~280ms without starting a
      # single test process. A job that reports green off that is worse than no
      # job, because it manufactures a signal. So the run has to PROVE it
      # executed: this reads the summary above and fails if any package's test
      # task was a cache replay, or if fewer packages ran than declare a `test`
      # script. See scripts/assert-tests-executed.sh for why this rather than
      # --force, and scripts/test-assert-tests-executed.sh for its fixtures.
      #
      # It runs only when the previous step succeeded (default `if: success()`),
      # which is exactly right — a red suite is already a red job, and the
      # question "did anything actually run" only matters when the answer looks
      # like yes.
      - name: Prove the suite actually executed
        run: bash scripts/assert-tests-executed.sh
