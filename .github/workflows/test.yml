name: test

# Runs the unit test suite of every package that declares one — the whole
# monorepo on merge groups, where it is a REQUIRED check of the merge queue
# (ruleset "main: merge queue"), and the affected packages on pull requests,
# where the same required context has to report before a PR may enqueue at all.
# Both are split four ways; see TWO EVENTS, TWO DEPTHS below.
#
# Before this workflow existed, NO CI job ran the tests. The only enforcement
# was the lefthook `pre-push` gate — and that gate ran every package's suite in
# one go, which on a machine already busy with other agents takes minutes and
# fails with rotating timeouts on a tree nobody touched. So it got bypassed:
# `--no-verify` was used six times on 2026-07-27 alone, by three different
# actors, correctly each time. A bypassable local gate plus no CI job means a
# change can reach `main` with no test having run anywhere. That is DOR-544.
#
# The companion half of the fix is in lefthook.yml: `pre-push` narrowed to
# `--affected` so it stays fast and survivable, with the full-monorepo sweep
# moved here where it can take its time.
#
# FULL MONOREPO, not affected-only — the same reasoning typecheck.yml spells
# out. A per-PR affected diff cannot see an interaction between two PRs that
# each branched from a base predating the other; only a full run against the
# tip catches it. `--continue` so one red package still reports every other
# package's result instead of hiding behind the first failure.
#
# SHARDED ACROSS FOUR RUNNERS (2026-08-29, queue leg; 2026-09-06, PR leg too).
# The queue leg previously ran as a single serialized job and took 19–29 minutes
# wall clock — the ceiling comment below said "split the job rather than raising
# this again", and this is that split. Every shard runs the FULL `turbo test`
# task graph; the split happens inside vitest (`--shard=N/4`), which partitions
# each package's test FILES across the four runners. Coverage is unchanged: the
# union of the four shards is exactly the old single run, and each shard still
# executes every package's suite (so the per-shard assert step below keeps its
# "every package with a `test` script ran" guarantee). File-level sharding was
# chosen over package-level filters because the suite's wall clock is dominated
# by one package (apps/server); a package-level split cannot divide it, a
# file-level split can.
#
# THAT SPLIT REACHES apps/server, and it is worth writing the measurement down
# because the opposite was believed for a while (DOR-1731 was filed as "the
# merge-queue test job runs @dorkos/server unsharded"). It does not. Run
# 34080120717's four shard-files artifacts hold 241 / 240 / 240 / 240
# apps/server test files, union 961, with ZERO files appearing in two shards.
# The queue leg's shards measure 8–13 minutes each; it has never been the slow
# one. The 46-minute cancellation that prompted the ticket (run 33711507309, PR
# #1486) was `event: pull_request` with `test-shard` skipped — the PR leg, which
# really did run unsharded until this change. See the fan-in job's ceiling
# comment for the numbers that made splitting it worth ~27% more runner-minutes.
#
# The other half of that ticket, also for the record: the "EMFILE (too many open
# files)" in those logs is not the runner exhausting descriptors. Every EMFILE
# string in a CI log is FABRICATED BY A TEST — `EMFILE: injected by test` from
# services/core/__tests__/config-load-failure.test.ts, and `new Error('EMFILE:
# too many open files')` from the chokidar-error cases in binding-store,
# adapter-config, task-file-watcher, session-list-watcher and extension-manager.
# They are fault injections proving the server degrades gracefully, they appear
# in every green run, and there is no descriptor ceiling to raise. Do not tune
# `ulimit` or `maxWorkers` on this evidence.
#
# `--passWithNoTests` rides ONLY the sharded legs: a package with three
# test files legitimately contributes zero files to one of four shards, and
# without the flag vitest exits 1 on an empty selection. The flag also removes
# vitest's zero-collected-files safety net, so the net is rebuilt one level up
# where it can actually discriminate: every shard records the test files
# vitest collected (json reporter → artifact), and the fan-in runs
# scripts/assert-shard-union.sh, which fails unless every package that
# declares a `test` script contributed at least one collected file across the
# UNION of all shards. Same shape as browser-test.yml's union check, for the
# same reason: a partitioned run is only as honest as the proof that the
# partitions add back up.
#
# NO separate build step: `test` declares `dependsOn: ["^build"]` in turbo.json,
# so `turbo test` builds every dependency package first. Turbo computes that
# from the task graph. (Each shard pays that build; that is the price of the
# split and it is a few minutes against the ~20 it buys back.)
#
# `-- --run` is REQUIRED, not decoration. Five packages' `test` scripts are a
# bare `vitest` (@dorkos/db, harness, marketplace, operating-skills, skills),
# which without `--run` starts vitest in WATCH mode and never exits. It is also
# the exact passthrough the pre-push gate uses, so the two share a turbo cache
# key. And note AGENTS.md: a bare `pnpm vitest run` over the whole monorepo
# falsely fails two tests, so full runs go through turbo, never through vitest
# directly.
#
# RETRIES: the queue leg runs with ONE retry, and every test that only passes
# because of it is NAMED (DOR-1701). Both halves of that are the decision; the
# retry alone would be the thing this comment used to refuse.
#
# Until 2026-09-03 the queue leg ran at zero retries, on the argument that a
# retry budget in CI quietly converts a real intermittent failure into a green
# check. That argument is right about a SILENT retry and says nothing about a
# named one — and the zero-retry position had a cost of its own: under lefthook
# VITEST_RETRY is 2, so a test that flakes on a contended machine is absorbed
# locally with nobody told, then fails a queue run on a tree nobody touched, and
# the only record of it is a red check somebody re-runs. Neither gate ever
# produced a NAME.
#
# So the bargain is the one browser-test.yml already struck for Playwright
# (`retries: CI ? 1 : 0`, plus the flaky-naming block in
# scripts/assert-browser-tests-executed.sh): one retry absorbs the
# cold-start/contention class, and the pass it buys costs visibility rather than
# nothing. The reporter is scripts/vitest-flake-reporter.ts, loaded by the
# passthrough below because vitest's built-in json reporter carries no retry
# information at all; the "Name the tests that only passed on a retry" step
# turns what it writes into annotations and a job summary. A test that still
# fails after its retry is untouched by any of this and stays red.
#
# One retry, not two: a single retry covers the class this exists for, while a
# wider budget starts absorbing tests that are genuinely broken half the time. A
# test named by that step three times over is a flake to FIX (DOR-1007), not a
# budget to widen.
#
# VITEST_RETRY itself is still not set here — this leg's budget is a CLI flag.
# NOT for reach: DOR-1772 wired the env var into all 21 vitest projects, so
# either mechanism would now cover every package, and any argument resting on
# "the flag reaches more of the repo" is dead. The flag is the right spelling
# HERE because it states this leg's budget in the workflow, on the same line as
# the reporter that makes the budget visible: `--retry=1` and
# scripts/vitest-flake-reporter.ts are one decision, and a number spread across
# 21 config files could not be read off the leg that actually spends it.
#
# The lefthook gate spells the same budget the other way, and it has no choice:
# its passthrough is pinned to exactly `-- --run` because turbo hashes
# passthrough args into the task cache key, so a flag there would force a full
# re-run of every suite on every push (see lefthook.yml's CACHE-KEY CONSTRAINT).
# The env var rides globalPassThroughEnv and never forks that key. The queue leg
# already carries --shard and the json reporter, so it has already forked that
# key and pays nothing more — which is why the flag is free here and not there.
# TWO EVENTS, TWO DEPTHS, ONE REQUIRED CONTEXT (2026-08-23/24). The full suite
# runs on `merge_group`, where it is a REQUIRED check of the merge queue — the
# ruleset toggle this file's `merge_group` trigger always anticipated. That
# un-inverts the old shape where the cheapest policy checks gated `main` while
# the most expensive signal was advisory: on 2026-08-23 this suite failed twice
# in a merge group and the entries merged anyway (one of those reds WAS a real
# two-PR clash, and it landed).
#
# On `pull_request` the shards run `--affected` only. This is NOT for
# thoroughness — the queue owns thoroughness — it exists because a required
# check must SUCCEED ON THE PULL REQUEST before GitHub lets the PR into the
# queue at all. That is measured, not assumed: PR #1246 removed the
# pull_request trigger entirely, sat armed and green for 15 hours, and
# `enqueuePullRequest` refused it with "required status checks have not
# succeeded: expected" — a merge_group-only required check deadlocks every PR
# out of the queue. So the PR leg is the cheapest run that is still an honest
# signal: the same `turbo test --affected` the lefthook pre-push gate runs, and
# it reports the `test` context the ruleset requires. The full-monorepo sweep,
# the retry budget, the cache-replay assertion and the union check all stay
# with the queue run, which tests `main` plus everything ahead in the queue
# plus this PR — the #488/#489 class two branches cannot see alone.
#
# ONE REQUIRED CONTEXT, ONE PRODUCER. The ruleset requires a check named
# `test`, and exactly one job below ever produces it: the `test` job, on both
# events, as the shard fan-in (`needs` + `always()`, so a failed or skipped
# shard can never skip it into a false green). Keeping one producer is
# deliberate — an earlier draft had two jobs rendering the same check name
# under mutually exclusive `if`s, and how required-check evaluation resolves
# two same-named runs on one commit is not documented anywhere we could pin.
# Do not rename this job's rendered name without updating the ruleset.
#
# The `test-shard (N/4)` checks the matrix renders are NOT required contexts
# and must not become them — they already existed on `merge_group` and, since
# DOR-1731, appear on pull requests too (where they previously reported as a
# single skipped `test-shard (${{ matrix.shard }}/4)`). Nothing depends on
# their names: a red shard reddens `test` through the fan-in gate, and
# scripts/should-arm-automerge.sh refuses to arm on any failing or cancelled
# check regardless of name.
#
# The old push-to-main trigger stays dropped: the queue already tested the
# byte-identical tree (squash rewrites the SHA, not the content), and the
# post-merge re-run was a third full-price copy per merged PR on a runner pool
# that was 88 runs deep on 2026-08-23. A direct push to main bypasses this,
# but it bypasses the queue and every other gate too.
# THE MAIN CANARY (DOR-2150, plan §4.9): `schedule` and `workflow_dispatch`.
#
# Nothing watched `main`. This workflow and browser-test gate on `merge_group`
# only, so a break that LANDS is invisible until the next PR is ejected by it.
# On 2026-09-17 a fixture pinned the page clock past Today's 04:00 boundary
# (#1916). It was green in every queue build outside 00:00-02:00 UTC, hid for
# three days, then ejected #1930, #1932 and #1933 about nine times in one
# evening before a person diagnosed it. #1934 fixed it. Nothing in the pipeline
# was ever going to find that on its own.
#
# The canary is THIS workflow, unchanged, run against `main` HEAD on a
# schedule. Not a second workflow that re-states the suite: there is exactly
# one definition of `turbo test`, and a canary that could drift from what the
# queue runs would be worse than none. Every step below that used to read
# `github.event_name == 'merge_group'` now reads `!= 'pull_request'`, which is
# the same two-way split it always was — full sweep everywhere but a PR — with
# the canary on the full side where it belongs.
#
# THAT INCLUDES THE QUARANTINE LANE, all six of its steps here: the shard reads
# the lane, runs the sweep and gates it, and the fan-in collects the copies,
# agrees on the lane and proves the union. The canary runs what the queue runs
# or it is not measuring the same thing — a round that failed on a flake the
# queue excuses would report a break that is not there, and one that excused
# more than the queue does would report green on a break that is. With no
# `quarantine.json` on the data branch, `quarantine-list` writes an empty list
# and exits 0, and an empty lane behaves exactly as no lane at all.
#
# IT CAN NEVER TOUCH A PR OR THE QUEUE. A required context is required on the
# `pull_request` and `merge_group` events; a `schedule` run reports on neither,
# is attached to no PR and to no queue build, and opens and arms nothing. The
# worst a red canary can do is print a red run and a line in the daily report.
#
# WHAT FOUR CRONS A DAY ACTUALLY BUY, given GitHub's throttling.
#
# THE EVIDENCE IS `evals.yml`, not merge-tail. merge-tail asks for a run every
# ten minutes and gets about seven a day; the "162-minute median" often quoted
# from it is the GAP BETWEEN DELIVERED RUNS, which is a statement about how
# many requests GitHub drops, not about how late any one of them is. A canary
# cron is low-frequency, and the right comparable is `evals.yml`'s `0 8 * * *`:
# 57 runs, 100% DELIVERED, lateness p50 2.60 h, p90 5.61 h, max 11.88 h.
#
# Two consequences, and they pull in opposite directions:
#
#   * a low-frequency cron is not dropped. All four rounds arrive, so the
#     canary does not quietly stop;
#   * but each arrives hours late, and the delay is SHARED across the day's
#     slots rather than drawn fresh for each, because it tracks how busy the
#     Actions scheduler is. Four slots are therefore four correlated shots at a
#     window, not four independent ones.
#
# So a cron here is a request, not an appointment, and NO cron schedule on this
# repo can promise a run inside a named two-hour window. What these four buy:
#
#   * a break on `main` is found in hours rather than days — nominal 6 h
#     spacing, plus skew, plus the run itself;
#   * the 00:00-02:00 UTC window, where the 09-20 bug lived, is hit on about
#     one day in three. Over a week that is ~86% (empirical, NOT the 95% an
#     independence assumption gives: lag-1 autocorrelation of the daily lateness
#     is 0.754, and the longest measured blind streak is 12 days). Two weeks is
#     the honest near-certainty.
#
# THE SLOTS ARE CHOSEN AGAINST THAT SKEW, not against the clock face. A run
# fired at hour H lands near H+2.6 at the median, so `0` lands in the window
# when close to on time and `21` lands in it at the median; `5` lands near
# 07:36, inside the 07:00-11:00 trough where the queue is quietest, and `10`
# fills the afternoon. Throttling only ever DELAYS a run, never advances it, so
# an earlier slot is also a later one. Two of the four — `21:3x` and `00:3x` —
# are nominally inside the queue's own busiest stretch, 17:00-02:00, and that
# is unavoidable rather than an oversight: they are the pair that BRACKETS the
# dark window, and the dark window sits inside the busy stretch. The other two
# are deliberately outside it, one of them in the 07:00-11:00 trough.
#
# That is the coverage claim, and it is deliberately weaker than "we watch the
# dark window". A real time-of-day bug is caught here by repetition over about
# a fortnight, not by one appointment.
#
# `workflow_dispatch` is the on-demand leg: run this whole suite against `main`
# now, from the Actions tab or `gh workflow run test.yml --ref main`.
#
# IT IS NOT PLAN §4.9'S TARGETED CANARY, and nothing here should be read as
# that. §4.9 wants a dispatch with a `job` INPUT, so one failing job re-runs in
# 5-25 minutes and an incident can tell a manufacturable failure from a real
# one. This leg runs the entire workflow: about 150 job minutes and half an
# hour of wall clock. The `job` input, and the matrix gating it needs, are a
# separate change; until they land the targeted canary does not exist.
#
# A dispatch is also ref-free, so `--ref <a PR's branch>` posts this check run
# on that PR's head. The inline ref guard is the FIRST step of every canary
# job and FAILS such a run rather than letting it skip, because a skipped job
# satisfies a required context and a failed one does not. Inline because it
# runs before `actions/checkout`, where a `bash scripts/…` would exit 127 on
# every event; see the step itself.
#
# TURBO CACHE: this repository has no remote cache, so a canary run cannot
# replay another machine's green `test` task; `assert-tests-executed.sh` is
# measuring a real execution here exactly as it does in the queue. The canary
# also re-warms the `refs/heads/main` Actions caches (pnpm store, Playwright
# browsers), which have had no writer since the push-to-main legs were retired
# on 2026-09-19 and which every PR branch restores from.
on:
  pull_request:
  merge_group:
  schedule:
    # Staggered by minute against its three sibling canaries, so four workflows
    # do not ask GitHub for runners in the same second.
    - cron: '37 0,5,10,21 * * *'
  workflow_dispatch:

# Opt into Node 24 for every JavaScript-based action ahead of GitHub's Sept 2026
# hard cutoff for the Node 20 runtime (matches the other workflows here).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel superseded runs for PR pushes only. Merge-group refs are unique per
# build (gh-readonly-queue/main/pr-<n>-<sha>), so queue runs never share a
# group and are never cancelled by this block — the queue supersedes builds by
# dequeuing them. Deliberately IDENTICAL in form to browser-test.yml (keep
# them in step); the history of why grouping semantics matter is #543
# (DOR-517), where real merges' runs were cancelled before they ever started.
concurrency:
  # EVENT-AWARE, because of the canary. A `schedule` run and a
  # `workflow_dispatch --ref main` run share `github.ref`, so on one group the
  # on-demand leg would queue behind a scheduled round for up to half an hour —
  # and the two are correlated in time, because the reason to dispatch by hand
  # is usually the reason a round is already running. The suffix is constant
  # for `pull_request` and `merge_group`, so neither changes behaviour.
  group: test-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Real Postgres HTTP and browser assertions are a dependency of the existing required
  # `test` check, so a missing database or a skipped suite cannot merge green.
  community-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: community
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: community-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d community"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # A canary run is against `main` or it is nothing.
      #
      # `workflow_dispatch` is ref-free, so `--ref <a PR's branch>` would run
      # this workflow against that branch and post the check run — under the
      # name of a REQUIRED context — on that pull request's head. This refuses
      # that, and refuses it by FAILING: a skipped job posts a skipped check
      # run and GitHub counts skipped as passing, so a skip is how you hand a
      # pull request a green required check that tested a different tree.
      #
      # INLINE, AND FIRST. Inline because this runs BEFORE `actions/checkout`,
      # where the workspace is still empty: a `bash scripts/…` here would exit
      # 127 on every event, reddening this required check on every PR and every
      # queue build (the same 127 that killed a required check on 2026-07-29,
      # which is why "Prove the browser suite actually executed" carries a
      # `[ -f ]` guard). First, so a misdirected dispatch costs seconds rather
      # than 150 job minutes. Byte-identical in all eight canary jobs and
      # pinned that way by packages/ci-steward/src/__tests__/canary-ref-guard.test.ts, which
      # extracts this very block and runs it.
      #
      # No `if:`: the body is a no-op on the gating events, which keeps it out
      # of the census allowlist while gating exactly the same thing.
      - name: A canary run is against main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$EVENT" ] || [ -z "$REF" ]; then
            echo "::error title=The main canary runs against main only::EVENT or REF is empty, so this cannot be shown to be a safe run. Refusing rather than assuming it is not a canary."
            exit 1
          fi
          if [ "$EVENT" != 'schedule' ] && [ "$EVENT" != 'workflow_dispatch' ]; then
            echo "event '$EVENT' is not a canary event; nothing to check."
            exit 0
          fi
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error title=The main canary runs against main only::this $EVENT run is on '$REF', not 'refs/heads/main'. Nothing was tested. Dispatch it with --ref main; a run on a branch would post this check on that branch's head, under the name of a required context."
            exit 1
          fi
          echo "canary $EVENT run against $REF."
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dork-labs/cloud-api build && pnpm --filter @dorkos/shared build
      - name: Assert community HTTP paths against real Postgres
        env:
          COMMUNITY_TEST_DATABASE_URL: postgres://postgres:community-test-only@localhost:5432/community
        run: pnpm --filter @dorkos/community test:pg
      - name: Install Chromium for community browser proof
        run: pnpm --filter @dorkos/community exec playwright install --with-deps chromium
      - name: Assert community browser paths against real Postgres
        env:
          COMMUNITY_TEST_DATABASE_URL: postgres://postgres:community-test-only@localhost:5432/community
        run: pnpm --filter @dorkos/community test:browser
      - name: Preserve community browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-browser-evidence
          path: |
            apps/community/browser-report.json
            apps/community/test-results/
          if-no-files-found: ignore

  # The real packaged local-agent journey runs on the queue's combined tree,
  # and on the main canary's scheduled run against `main` HEAD, always.
  #
  # ON A PULL REQUEST IT RUNS WHEN THE CHANGE CAN REACH IT (DOR-2220). It used
  # to report green there having run nothing, so a change that broke the sealed
  # driver was first seen in the queue, where a red is an ejection (#1987). It
  # is about six runner-minutes, so a PR pays it only when its diff touches the
  # community slice listed in scripts/community-packaged-scope.sh (the header
  # there says what is in, what is out and why); every other PR gets a green
  # that says it did not run. This is a REQUIRED context, so the scope lives in
  # a step, never in `paths:` or a job-level `if:`: the job always runs and
  # always reports.
  community-packaged:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A canary run is against `main` or it is nothing.
      #
      # `workflow_dispatch` is ref-free, so `--ref <a PR's branch>` would run
      # this workflow against that branch and post the check run — under the
      # name of a REQUIRED context — on that pull request's head. This refuses
      # that, and refuses it by FAILING: a skipped job posts a skipped check
      # run and GitHub counts skipped as passing, so a skip is how you hand a
      # pull request a green required check that tested a different tree.
      #
      # INLINE, AND FIRST. Inline because this runs BEFORE `actions/checkout`,
      # where the workspace is still empty: a `bash scripts/…` here would exit
      # 127 on every event, reddening this required check on every PR and every
      # queue build (the same 127 that killed a required check on 2026-07-29,
      # which is why "Prove the browser suite actually executed" carries a
      # `[ -f ]` guard). First, so a misdirected dispatch costs seconds rather
      # than 150 job minutes. Byte-identical in all eight canary jobs and
      # pinned that way by packages/ci-steward/src/__tests__/canary-ref-guard.test.ts, which
      # extracts this very block and runs it.
      #
      # No `if:`: the body is a no-op on the gating events, which keeps it out
      # of the census allowlist while gating exactly the same thing.
      - name: A canary run is against main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$EVENT" ] || [ -z "$REF" ]; then
            echo "::error title=The main canary runs against main only::EVENT or REF is empty, so this cannot be shown to be a safe run. Refusing rather than assuming it is not a canary."
            exit 1
          fi
          if [ "$EVENT" != 'schedule' ] && [ "$EVENT" != 'workflow_dispatch' ]; then
            echo "event '$EVENT' is not a canary event; nothing to check."
            exit 0
          fi
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error title=The main canary runs against main only::this $EVENT run is on '$REF', not 'refs/heads/main'. Nothing was tested. Dispatch it with --ref main; a run on a branch would post this check on that branch's head, under the name of a required context."
            exit 1
          fi
          echo "canary $EVENT run against $REF."
      # Depth 2 so a pull request's test-merge commit has its first parent (the
      # base it was merged onto) locally, which is all the scope step diffs
      # against. The queue and the canary only need the tree, and one extra
      # commit of history costs them nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Decides whether the proof runs, from the one list in
      # scripts/community-packaged-scope.sh. No `if:` of its own, so this
      # required job never skips it; it writes `run=true|false` and the two
      # steps below read that.
      #
      # merge_group and the canary events answer true without looking: the
      # queue and `main` HEAD always get the proof, exactly as before DOR-2220.
      # pull_request diffs the test-merge commit against its first parent, so
      # it sees exactly the PR's change on top of the current base.
      #
      # Every failure on the PR path FAILS OPEN to running the proof, never to a
      # green that tested nothing and never to a red: a base git cannot resolve,
      # a diff that errors, or a tree that predates the scope script all run it.
      # The diff is captured before it is matched, so a git failure is seen as a
      # failure and never as an empty, out-of-scope diff. `--no-renames` for the
      # reason scripts-test.yml gives: with rename detection on, moving a file
      # out of scope reports only its destination.
      - name: Decide whether this change can reach the packaged proof
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != 'pull_request' ]; then
            echo "$EVENT run: the packaged community proof always runs here"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict=true
          if [ ! -f scripts/community-packaged-scope.sh ]; then
            echo "scripts/community-packaged-scope.sh is not in this tree; running the proof"
          elif base=$(git rev-parse --verify --quiet 'HEAD^1') &&
            changed=$(git diff --no-renames --name-only "$base" HEAD); then
            verdict=$(printf '%s\n' "$changed" | bash scripts/community-packaged-scope.sh) || verdict=true
          else
            echo "cannot diff against the base; running the proof"
          fi
          if [ "$verdict" != false ]; then
            verdict=true
          else
            echo "Nothing in this change can reach the packaged community proof, so it did not run here. The merge queue and the main canary run it on every change."
          fi
          echo "run=$verdict" >> "$GITHUB_OUTPUT"
      - name: Build and test without public network access
        if: steps.scope.outputs.run == 'true'
        run: bash apps/community/acceptance/run.sh
      - name: Preserve packaged community reports
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: community-packaged-evidence
          path: |
            .temp/community-acceptance/**/network-proof.json
            .temp/community-acceptance/**/playwright-report.json
            .temp/community-acceptance/**/playwright-artifacts/**/*.png
            .temp/community-acceptance/**/playwright-artifacts/**/*.webm
            .temp/community-acceptance/**/playwright-artifacts/**/*.yml
          include-hidden-files: true
          if-no-files-found: ignore

  # The suite, split four ways at the vitest file level (see the header), on
  # BOTH events: the full monorepo sweep on `merge_group`, the affected-only
  # sweep on `pull_request`. What differs between the two is one `run:` step
  # and the four proof steps that only the queue leg carries; everything above
  # them — checkout, toolchain, install, heap, ceiling — is shared, because
  # nothing about it depends on which sweep runs.
  test-shard:
    strategy:
      # All four shards report even when one is red — the matrix equivalent of
      # `--continue`, and the same reason: one red package must not hide the
      # other seventeen packages' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A quarter of the measured 19-29 minute sweep plus ~5 minutes of
    # checkout/install/build. 30 keeps a hung watch-mode suite from burning
    # the old 45; if a healthy shard ever crosses ~20 minutes, raise the shard
    # count rather than this number. (DOR-1363 is the run a too-tight ceiling
    # cancelled with the work already finished — leave headroom.)
    timeout-minutes: 30
    # Raise the V8 old-space ceiling for every Node process this job spawns —
    # pnpm, turbo, and each `vitest run` worker inherit NODE_OPTIONS. A single
    # vitest process running many suites exhausted the default ~2GB heap and
    # died with "Ineffective mark-compacts near heap limit" (DOR-1576).
    # ubuntu-latest has 16GB, and `--concurrency=1` means only one suite runs
    # at a time, so 8GB for that one process is safe headroom.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # A canary run is against `main` or it is nothing.
      #
      # `workflow_dispatch` is ref-free, so `--ref <a PR's branch>` would run
      # this workflow against that branch and post the check run — under the
      # name of a REQUIRED context — on that pull request's head. This refuses
      # that, and refuses it by FAILING: a skipped job posts a skipped check
      # run and GitHub counts skipped as passing, so a skip is how you hand a
      # pull request a green required check that tested a different tree.
      #
      # INLINE, AND FIRST. Inline because this runs BEFORE `actions/checkout`,
      # where the workspace is still empty: a `bash scripts/…` here would exit
      # 127 on every event, reddening this required check on every PR and every
      # queue build (the same 127 that killed a required check on 2026-07-29,
      # which is why "Prove the browser suite actually executed" carries a
      # `[ -f ]` guard). First, so a misdirected dispatch costs seconds rather
      # than 150 job minutes. Byte-identical in all eight canary jobs and
      # pinned that way by packages/ci-steward/src/__tests__/canary-ref-guard.test.ts, which
      # extracts this very block and runs it.
      #
      # No `if:`: the body is a no-op on the gating events, which keeps it out
      # of the census allowlist while gating exactly the same thing.
      - name: A canary run is against main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$EVENT" ] || [ -z "$REF" ]; then
            echo "::error title=The main canary runs against main only::EVENT or REF is empty, so this cannot be shown to be a safe run. Refusing rather than assuming it is not a canary."
            exit 1
          fi
          if [ "$EVENT" != 'schedule' ] && [ "$EVENT" != 'workflow_dispatch' ]; then
            echo "event '$EVENT' is not a canary event; nothing to check."
            exit 0
          fi
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error title=The main canary runs against main only::this $EVENT run is on '$REF', not 'refs/heads/main'. Nothing was tested. Dispatch it with --ref main; a run on a branch would post this check on that branch's head, under the name of a required context."
            exit 1
          fi
          echo "canary $EVENT run against $REF."
      # fetch-depth: 0 for the tags, not the history. actions/checkout@v7
      # defaults to depth 1 and does NOT fetch tags at that depth, so
      # `git tag -l` in config-manager.test.ts's DOR-339 regression guard
      # ("the newest migration key is strictly newer than every released
      # version") saw zero tags on every push/PR since the v0.57.0 release —
      # its own package.json fallback then collided with the newly-tagged
      # release version and the guard false-failed (DOR-884). Every shard runs
      # the server suite that contains that guard, so every shard needs tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --summarize writes a machine-readable record of the run to
      # .turbo/runs/<id>.json. The assert step is the only reason it is here.
      #
      # --concurrency=1 for the DOR-121 reason the pre-push gate already gives,
      # which applies harder here, not less. Turbo's default is to fan out ten
      # package suites at once, and every `vitest run` then spawns its own
      # ~CPU-count worker pool. That is ~10x oversubscription on a 14-core
      # developer machine; ubuntu-latest has 4 cores, so it is worse. Suites run
      # one at a time and each keeps its internal parallelism, which is the
      # right shape for a small runner. This is not a preference: the first two
      # runs of this workflow at the default concurrency failed on a DIFFERENT
      # pair of timing-sensitive tests each time, on code neither run had
      # changed. Starving a suite of CPU and then reporting its timeouts as
      # failures makes the gate a coin toss, and a gate people cannot trust is
      # a gate people route around.
      #
      # `--shard`, `--retry`, `--passWithNoTests` and the reporter flags are
      # vitest flags, not turbo flags — they ride the same `--` passthrough as
      # `--run`, so every package's suite (including the five bare-`vitest`
      # scripts and obsidian-plugin's chained script, where pnpm appends to the
      # final command) receives them. The json reporter writes each package's
      # collected-file record to <package>/vitest-shard-report.json (cwd of
      # that package's vitest); the default reporter is re-stated because
      # naming any --reporter replaces the default set.
      #
      # The flake reporter is named by a RELATIVE path, and that path is only
      # correct because every workspace package sits exactly two directories
      # deep (`apps/*`, `packages/*` in pnpm-workspace.yaml) — one path
      # therefore resolves from all of them. That assumption is pinned by
      # scripts/__tests__/vitest-flake-reporter.test.ts, which also pins the
      # two flags on this line; a workspace glob at another depth would make
      # vitest fail to load the reporter rather than quietly skip it.
      # THE QUARANTINE LANE, READ BEFORE THE SWEEP (plan §4.9 L1). The list
      # lives on the ci-steward-data branch, so a known flake leaves the
      # blocking path without a PR. This step ALWAYS exits 0: a failed fetch
      # writes an empty list and says so, and an empty list means every test
      # blocks as it always did.
      - name: Read the quarantine lane
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          node packages/ci-steward/src/cli.ts quarantine-list \
            --runner vitest \
            --out "$RUNNER_TEMP/quarantine.json" \
            --lines "$RUNNER_TEMP/quarantine.txt" \
            --title "Quarantine lane — test shard ${{ matrix.shard }}/4"
          # Its own shard identity beside it, so the fan-in can prove it has a
          # COMPLETE set of copies before intersecting them.
          printf '%s/4\n' '${{ matrix.shard }}' > "$RUNNER_TEMP/shard.txt"

      - name: Run every package's test suite (shard ${{ matrix.shard }}/4)
        id: sweep
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set +e
          pnpm exec turbo test --summarize --continue --concurrency=1 -- --run --shard=${{ matrix.shard }}/4 --retry=1 --passWithNoTests --reporter=default --reporter=json --outputFile.json=vitest-shard-report.json --reporter=../../scripts/vitest-flake-reporter.ts
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::notice::the sweep exited $code; the quarantine gate below decides whether that fails this shard."
          fi
          exit 0

      # The gate, immediately after the sweep so that a failure the lane does
      # not cover skips everything below exactly as a failed sweep always did.
      #
      # Quarantine here is per TEST, read out of the shard reports — NOT vitest
      # `exclude`, which can only drop a whole file and would empty a package's
      # suite behind the union check's back. Nothing is excluded: every file is
      # still collected, every test still runs, and the union in the fan-in is
      # the union it would be with an empty lane.
      - name: Refuse any failure the quarantine lane does not cover
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          args=()
          while IFS= read -r report; do args+=(--reports "$report"); done < <(
            find apps packages -mindepth 2 -maxdepth 2 \
              \( -name vitest-shard-report.json -o -name vitest-flake-report.json \) | sort
          )
          if [ ${#args[@]} -eq 0 ]; then
            echo '::error::no vitest-shard-report.json in any package — the json reporter passthrough is broken, so nothing can be read and nothing can be excused.' >&2
            exit 1
          fi
          node packages/ci-steward/src/cli.ts quarantine-gate \
            --runner vitest \
            --suite-exit "${{ steps.sweep.outputs.exit-code }}" \
            --list "$RUNNER_TEMP/quarantine.json" \
            "${args[@]}" \
            --title "Quarantine gate — test shard ${{ matrix.shard }}/4"

      # The PR leg's quarter. Same split, same `--concurrency=1`, narrower
      # scope — and deliberately NOT the queue leg's line with one flag
      # changed, because three of its flags must not ride here:
      #
      #   --summarize   writes the run summary assert-tests-executed.sh reads,
      #                 and that step is gated to `merge_group` — so on this
      #                 line the flag would produce a file nothing opens. It
      #                 could not be ungated either: the assertion demands that
      #                 EVERY package's `test` task ran, which an affected
      #                 subset cannot satisfy by construction.
      #   --retry=1     is half of a bargain whose other half is the naming
      #                 step below, and that step is queue-only. A retry with
      #                 nothing naming what it absorbed is the SILENT retry the
      #                 header refuses. So this leg stays at zero retries.
      #   the reporter  has nothing to report to, for the same reason.
      #
      # `--passWithNoTests` is required by `--shard` and is the one real cost
      # of splitting this leg: before this change, an affected package whose
      # include glob broke exited 1 here ("No test files found"). It now passes
      # this leg silently, and the thing that catches it is the union check in
      # the fan-in — which runs on `merge_group` only, so the report arrives at
      # the queue rather than on the PR. That is the division of labour this
      # workflow already runs on (the PR leg is the cheapest honest signal; the
      # queue owns thoroughness and owns every proof), not a new hole: no
      # broken glob reaches `main` either way.
      #
      # TURBO_SCM_BASE names the comparison base explicitly — the checkout is a
      # detached merge ref with no local `main`, so turbo's default base does
      # not resolve here.
      #
      # It is a SHA and not `origin/<base_ref>`, and that matters more now than
      # it did when one job ran this alone. Four shards check out
      # independently, seconds to minutes apart; a ref is resolved at each
      # checkout, so a merge landing on `main` in that window gives two shards
      # DIFFERENT affected sets. The failure that produces is silent and
      # exactly the kind this workflow exists to prevent: a package present in
      # one shard's set and absent from another's gets a quarter of its files
      # run and nothing notices, because the PR leg has no union check to
      # notice with. `github.event.pull_request.base.sha` is fixed for the
      # whole run, identical across all four shards, and is precisely the base
      # commit of the merge ref actions/checkout materialised — so
      # base.sha...HEAD is the PR's own diff and nobody else's. `fetch-depth:
      # 0` above is what guarantees the commit is present to diff against.
      - name: Run the affected packages' test suites (shard ${{ matrix.shard }}/4)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo test --affected --continue --concurrency=1 -- --run --shard=${{ matrix.shard }}/4 --passWithNoTests

      # THE POINT OF THIS STEP: turbo caches `test`, and a full cache hit prints
      # "Tasks: 31 successful, 31 total" — one per package declaring a `test`
      # script plus the builds they depend on — exits 0, and takes ~280ms without
      # starting a single test process. (Do not trust that number; it moves
      # every time a package gains or loses a suite. assert-tests-executed.sh
      # derives the expected count from the tree for exactly that reason.) A job that reports green off that is worse than no
      # job, because it manufactures a signal. So the run has to PROVE it
      # executed: this reads the summary above and fails if any package's test
      # task was a cache replay, or if fewer packages ran than declare a `test`
      # script. See scripts/assert-tests-executed.sh for why this rather than
      # --force, and scripts/test-assert-tests-executed.sh for its fixtures.
      #
      # Per SHARD, unchanged from the single-job era: every shard runs the full
      # task graph (the split is inside vitest, not across packages), so "every
      # package declaring a `test` script executed, none from cache" holds on
      # each of the four runners independently. What this step CANNOT see is a package whose
      # vitest collected zero files — that is the union check's job, in the
      # fan-in below.
      #
      # QUEUE LEG ONLY, and the `success()` half is unchanged from the day this
      # was written — the added condition narrows WHICH RUNS reach it, never
      # what it asserts when it does. It reads the summary `--summarize` wrote,
      # which only the queue leg produces; pointed at the PR leg it would fail
      # on an absent summary, and "loosen it until the affected sweep passes"
      # is exactly the weakening its header refuses. The PR leg gets no
      # execution proof because it never had one.
      - name: Prove the suite actually executed
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: bash scripts/assert-tests-executed.sh

      # The price of the retry on the suite line above: every test it absorbed
      # is named here, in the log, in the job summary, and as a `::warning`
      # annotation so it is visible without opening either. Same bargain, same
      # shape and same wording as the flaky block in
      # scripts/assert-browser-tests-executed.sh — keep them in step.
      #
      # This step NEVER fails on a flake; a run with retried passes is still a
      # green run. It fails on exactly two things, and both are the same
      # mistake: reporting "nothing flaked" from evidence it never had. Finding
      # no report at all is not a clean run — scripts/vitest-flake-reporter.ts
      # writes the file unconditionally, so an empty list means "nothing flaked"
      # and a missing file means the reporter never loaded. And a report it
      # cannot parse is not a clean run either; see the pipefail note in the
      # script. Without both distinctions a broken passthrough reads exactly
      # like a healthy suite, which is the failure mode this whole mechanism
      # exists to close.
      #
      # The annotations are raised HERE rather than by the reporter itself
      # because turbo prefixes every line a task prints with `<package>:test: `,
      # and a workflow command that does not start its own line is not parsed —
      # `::warning` from inside the suite would render as plain text. The
      # reporter writes a file; this step, whose output turbo never touches,
      # turns it into annotations.
      #
      # Annotations are capped at ten because GitHub stops displaying warning
      # annotations past that per step; the full list is always in the log and
      # the summary.
      # Queue leg only: it names what `--retry=1` absorbed, and only the queue
      # leg spends a retry. On the PR leg there is no retry to name and no
      # reporter loaded, so this step would fail on a missing report — which is
      # correct behaviour for the queue and meaningless noise for a PR.
      - name: Name the tests that only passed on a retry
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # pipefail, because every read below is the LAST stage of a pipe and
          # bash otherwise reports the exit status of that last stage only. A
          # truncated or half-written report made `jq` exit non-zero, `sort`
          # exit 0 over the empty stream it got, and this step print "no test
          # needed a retry to pass" and go green — the exact fail-open shape
          # the whole mechanism exists to close, one layer up from the missing
          # -file case below. (It is also why the ten-annotation cap is a
          # `sed -n` range rather than `head`: a reader that exits early can
          # SIGPIPE the writer feeding it, which under pipefail is a failure.)
          set -o pipefail
          reports=$(find apps packages -mindepth 2 -maxdepth 2 -name vitest-flake-report.json)
          [ -n "$reports" ] || { echo 'no vitest-flake-report.json found in any package — the flake reporter passthrough is broken' >&2; exit 1; }
          if ! named=$(echo "$reports" | xargs jq -r '(.cwd | split("/") | .[-2:] | join("/")) as $pkg | .flaky[] | "\($pkg)/\(.file) › \(.test) (\(.retries) retry)"' | sort); then
            echo 'a vitest-flake-report.json could not be read (jq failed above) — refusing to certify this shard flake-free on a report nothing could parse' >&2
            exit 1
          fi
          if [ -z "$named" ]; then
            echo "shard ${{ matrix.shard }}/4: no test needed a retry to pass."
            exit 0
          fi
          count=$(printf '%s\n' "$named" | wc -l | tr -d ' ')
          printf 'WARNING — %s test(s) only passed on a retry:\n' "$count"
          printf '%s\n' "$named" | sed 's/^/  /'
          {
            printf '### Shard %s/4 — %s test(s) only passed on a retry\n\n' '${{ matrix.shard }}' "$count"
            printf '%s\n' "$named" | sed 's/^/- `/; s/$/`/'
            printf '\nA test named here three times over is a flake to fix (DOR-1007), not a retry budget to widen.\n\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$named" | sed -n '1,10p' | while IFS= read -r test; do
            printf '::warning title=vitest test passed only on a retry::%s\n' "$test"
          done
          if [ "$count" -gt 10 ]; then
            printf '::warning title=vitest tests passed only on a retry::and %s more — see the step log and the job summary for every name.\n' "$((count - 10))"
          fi

      # Gather what this shard's vitest runs actually collected, for the
      # fan-in's union check. One line per collected test file, repo-relative.
      # A report must exist for the gather to mean anything; a suite step that
      # produced none is a broken passthrough, not an empty shard.
      #
      # Queue leg only: the union check this feeds asserts that EVERY package
      # declaring a `test` script contributed a file, which an affected subset
      # cannot satisfy. The json reporter that writes these records is on the
      # queue line alone, so on a PR this would fail on a missing report.
      # The lane this shard read, handed to the fan-in, which has no install and
      # cannot read the data branch itself.
      - name: Hand this shard's quarantine lane to the fan-in
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-lane-shard-${{ matrix.shard }}-vitest
          path: |
            ${{ runner.temp }}/quarantine.txt
            ${{ runner.temp }}/shard.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Record the test files this shard collected
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          reports=$(find apps packages -mindepth 2 -maxdepth 2 -name vitest-shard-report.json)
          [ -n "$reports" ] || { echo 'no vitest-shard-report.json found in any package — the json reporter passthrough is broken' >&2; exit 1; }
          echo "$reports" | xargs jq -r '.testResults[].name' | sed "s|^$PWD/||" | sort -u > shard-files-${{ matrix.shard }}.txt
          wc -l shard-files-${{ matrix.shard }}.txt

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: shard-files-${{ matrix.shard }}
          path: shard-files-${{ matrix.shard }}.txt
          if-no-files-found: error

      # CI Steward (plans/ci-steward-plan.md §4.4, follow-up E): the daily
      # collector samples these reports to measure flaky-test-runs (executions
      # from vitest-shard-report.json, retried passes from
      # vitest-flake-report.json), and phase 2's ratchet will read them in the
      # fan-in. Observability only, so it can never fail the shard:
      # `continue-on-error`, because the artifact service sometimes answers 403
      # at finalize (browser-test.yml's 2026-09-14 note), and a missing report
      # here costs the collector one sample, not a queue build. `overwrite`
      # for the same reason as browser-test.yml's: a re-run replaces its attempt.
      # `!cancelled()` so a red shard uploads too: flaky-test-runs sampled from
      # green shards only would never see a test that failed twice.
      - name: Upload this shard's vitest reports for CI Steward
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vitest-shard-report-${{ matrix.shard }}
          path: |
            apps/*/vitest-shard-report.json
            apps/*/vitest-flake-report.json
            packages/*/vitest-shard-report.json
            packages/*/vitest-flake-report.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  # THE ONE PRODUCER of the required `test` context, on both events (see ONE
  # REQUIRED CONTEXT, ONE PRODUCER in the header).
  #
  # Pure fan-in on both events since DOR-1731: it fails unless every shard
  # succeeded, and on `merge_group` it additionally proves the shards' union
  # covers every package. It used to run the affected sweep itself on
  # `pull_request`; that sweep is a shard job now, and this job runs no tests.
  # `always()` is still what lets it report when a shard is red — without it
  # GitHub skips this job, and a SKIPPED check run satisfies a required check.
  test:
    needs: [test-shard, community-pg, community-packaged]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # This job runs no tests any more, so this is a ceiling on a gate, an
    # artifact download and a jq loop: a minute or two on either event. 10
    # leaves an order of magnitude of headroom and still stops a wedged
    # download firmly. It cannot stall the queue either way — the merge
    # queue's own timeout is 120.
    #
    # The number it replaces was 60, and the history is worth keeping because
    # it is what this job was: until DOR-1731 this job RAN the affected sweep
    # on `pull_request`, unsharded, at `--concurrency=1`, which on any PR
    # touching @dorkos/shared expands to 19-24 packages — effectively the whole
    # monorepo. Measured over every `pull_request` run of it between the
    # four-way queue split (2026-08-30) and 2026-09-03T05:10:41Z — 139 runs,
    # 131 green — green wall clock ran p50 29.0 min, p90 37.5, p95 38.1,
    # SLOWEST 44.5. Run 33711507309 (PR #1486) printed "Tasks: 30 successful /
    # Cached: 0 cached / Time: 37m13.894s" — every suite green — and was killed
    # at 46m26s against the then-45 ceiling, 12 MILLISECONDS after turbo's own
    # summary line. DOR-1726 answered that by raising the ceiling to 60, which
    # bought margin without touching the wall clock: PR-leg runs on 2026-09-06
    # still measured 36m42s, 37m48s and 40m of suite time.
    #
    # DOR-1731 answers it by splitting the work instead, and the cost argument
    # the 60-line carried against exactly that turns out to be measured wrong.
    # It said "every shard pays its own checkout, install and full `^build`, so
    # sharding this leg multiplies per-PR runner minutes by ~4". The step
    # timings say otherwise. Queue shard 1/4 of run 34080120717: checkout 11s,
    # pnpm 9s, node 10s, install 7s — 37 seconds of setup, not minutes — then
    # 11m14s for `^build` plus a quarter of the suite. The PR leg of run
    # 34077563768: 34s of setup, then 36m42s for `^build` plus the whole
    # affected sweep. Solving those two for a shared build B and a full suite
    # T gives B ~= 2.8 min and T ~= 34 min, so a shard's fixed cost is ~3.3
    # min and the wall clock is 3.3 + 34/N:
    #
    #   N=1  37 min wall, 37 runner-min   <- what this job used to be
    #   N=4  12 min wall, 47 runner-min
    #
    # ~27% more runner-minutes, not 4x, for a third of the wall clock. That is
    # the trade this change takes. The pool-saturation worry behind the old
    # paragraph (88 runs queued against 14 running, 2026-08-23) is a
    # slot-MINUTES worry in steady state, and slot-minutes move by a quarter;
    # peak concurrency per PR does go from 1 job to 4, which the
    # `cancel-in-progress` block above bounds on every superseded push.
    #
    # Read that 27% as a MIDDLE, not a ceiling. It is computed off a ~37-minute
    # sweep, which is what a PR touching @dorkos/shared costs; the median PR is
    # cheaper (p50 22.9 min over a 95-run sample), and the cheaper the sweep the
    # worse the ratio, because the ~3.3-minute fixed cost is paid four times
    # against a smaller base. A PR affecting almost nothing approaches the old
    # comment's 4x — on a handful of minutes, which is why it is worth paying.
    # The wall-clock win moves the same way and stays positive throughout.
    #
    # ONE SEMANTIC CHANGE worth knowing before reading a red check. When a push
    # supersedes an in-flight PR run, the `cancel-in-progress` block cancels the
    # shards; `needs.test-shard.result` is then `cancelled`, and the gate step
    # below turns that into a FAILING `test` rather than a cancelled one. That
    # is cosmetic — scripts/should-arm-automerge.sh refuses to arm on `fail` and
    # on `cancel` alike, so nothing downstream behaves differently — but a
    # `test: fail` on a superseded commit now means "superseded", not "broken".
    # Read the shard jobs, which still report as cancelled, to tell them apart.
    #
    # What did NOT change: the PR leg is still affected-only, still carries no
    # execution proof and no union check, and is still there to catch a red the
    # author's own diff causes and to report the required `test` context so the
    # PR can enqueue. Thoroughness, and every proof, stay with the queue leg.
    timeout-minutes: 10
    steps:
      # A canary run is against `main` or it is nothing.
      #
      # `workflow_dispatch` is ref-free, so `--ref <a PR's branch>` would run
      # this workflow against that branch and post the check run — under the
      # name of a REQUIRED context — on that pull request's head. This refuses
      # that, and refuses it by FAILING: a skipped job posts a skipped check
      # run and GitHub counts skipped as passing, so a skip is how you hand a
      # pull request a green required check that tested a different tree.
      #
      # INLINE, AND FIRST. Inline because this runs BEFORE `actions/checkout`,
      # where the workspace is still empty: a `bash scripts/…` here would exit
      # 127 on every event, reddening this required check on every PR and every
      # queue build (the same 127 that killed a required check on 2026-07-29,
      # which is why "Prove the browser suite actually executed" carries a
      # `[ -f ]` guard). First, so a misdirected dispatch costs seconds rather
      # than 150 job minutes. Byte-identical in all eight canary jobs and
      # pinned that way by packages/ci-steward/src/__tests__/canary-ref-guard.test.ts, which
      # extracts this very block and runs it.
      #
      # No `if:`: the body is a no-op on the gating events, which keeps it out
      # of the census allowlist while gating exactly the same thing.
      - name: A canary run is against main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$EVENT" ] || [ -z "$REF" ]; then
            echo "::error title=The main canary runs against main only::EVENT or REF is empty, so this cannot be shown to be a safe run. Refusing rather than assuming it is not a canary."
            exit 1
          fi
          if [ "$EVENT" != 'schedule' ] && [ "$EVENT" != 'workflow_dispatch' ]; then
            echo "event '$EVENT' is not a canary event; nothing to check."
            exit 0
          fi
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error title=The main canary runs against main only::this $EVENT run is on '$REF', not 'refs/heads/main'. Nothing was tested. Dispatch it with --ref main; a run on a branch would post this check on that branch's head, under the name of a required context."
            exit 1
          fi
          echo "canary $EVENT run against $REF."
      # First, before spending a second on anything else: a failed, cancelled
      # or skipped shard fails this job, on BOTH events — the shard matrix is
      # where the tests run now, so this gate is the whole of what `test`
      # means on a pull request. `always()` above is what makes this reachable
      # when a shard is red — without it, GitHub would skip this job and a
      # SKIPPED check run satisfies a required check, which is precisely the
      # false green this workflow exists to prevent.
      - name: Require all four shards green
        run: |
          result="${{ needs.test-shard.result }}"
          echo "shard matrix result: $result"
          [ "$result" = "success" ]

      - name: Require packaged community proof green
        run: |
          result="${{ needs.community-packaged.result }}"
          echo "packaged community result: $result"
          [ "$result" = "success" ]

      - name: Require real community Postgres tests green
        run: |
          result="${{ needs.community-pg.result }}"
          echo "community Postgres result: $result"
          [ "$result" = "success" ]

      # Shallow: this job reads scripts/ and the package manifests, nothing
      # that needs history or tags. (The DOR-884/DOR-339 tag reasoning lives on
      # the shard job's checkout, which is where the suites run.)
      - uses: actions/checkout@v7
        if: ${{ github.event_name != 'pull_request' }}

      # ---- merge_group leg: the union check ----
      - uses: actions/download-artifact@v8
        if: ${{ github.event_name != 'pull_request' }}
        with:
          pattern: shard-files-*
          merge-multiple: true
          path: shard-files

      # Every package that declares a `test` script must have contributed at
      # least one collected test file across the union of the four shards —
      # the zero-collected-files net --passWithNoTests removed, rebuilt at the
      # only level that can tell "empty because sharded" from "empty because
      # broken". Fixtures: scripts/test-assert-shard-union.sh.
      # The fan-in has no `pnpm install` — it is a jq-and-bash job that costs
      # seconds — so it cannot run the engine to read the lane itself. The
      # shards already did, so each hands its copy over as an artifact and this
      # job INTERSECTS them.
      #
      # Intersection, not union, and not "take the first": a list edited while
      # the build was in flight is the only way the copies can differ, and the
      # intersection is the reading that absorbs LESS and blocks MORE. The one
      # thing this must never do is invent a lane entry that no shard actually
      # ran under.
      #
      # THE SET OF COPIES MUST BE COMPLETE, for the same reason
      # assert-browser-tests-executed.sh checks its shard set: intersecting over
      # whatever arrived means one lost artifact WIDENS the lane, which is
      # exactly backwards. Each copy carries its own `i/N`, so a missing,
      # duplicated or stale one is refused by name.
      - name: Collect every shard's quarantine lane
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/download-artifact@v8
        with:
          pattern: quarantine-lane-shard-*-vitest
          path: lane

      - name: Agree on the lane this build ran under
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          shopt -s nullglob
          lanes=(lane/*/quarantine.txt)
          shards=(lane/*/shard.txt)
          if [ ${#lanes[@]} -eq 0 ] || [ ${#shards[@]} -ne ${#lanes[@]} ]; then
            echo "::error::not every shard handed over its quarantine lane, so this job cannot tell a quarantined test's file from a file that stopped being collected. Every shard writes one; a short set means the lane step did not run."
            exit 1
          fi
          total=$(cut -d/ -f2 "${shards[@]}" | sort -u)
          if [ "$(printf '%s\n' "$total" | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "::error::the shards disagree about how many of them there are ($(printf '%s' "$total" | tr '\n' ' ')). These copies are not from one run, so their intersection is not one lane."
            exit 1
          fi
          if [ "${#lanes[@]}" -ne "$total" ]; then
            echo "::error::the run had $total shard(s) but only ${#lanes[@]} handed over a quarantine lane. Intersecting over the ones that arrived would WIDEN the lane, so this refuses instead."
            exit 1
          fi
          seen=$(cut -d/ -f1 "${shards[@]}" | sort -n | tr '\n' ' ')
          wanted=$(seq 1 "$total" | tr '\n' ' ')
          if [ "$seen" != "$wanted" ]; then
            echo "::error::the quarantine lanes are not shards 1..$total exactly: got [ $seen], wanted [ $wanted]. A repeated shard would let one copy vote twice."
            exit 1
          fi
          cat "${lanes[@]}" | grep -v '^[[:space:]]*$' | sort | uniq -c |
            awk -v n="$total" '$1 == n { sub(/^ *[0-9]+ /, ""); print }' \
            > "$RUNNER_TEMP/quarantine.txt"
          count=$(grep -c '' "$RUNNER_TEMP/quarantine.txt" || true)
          {
            printf '### Quarantine lane — this queue build (vitest)\n\n'
            if [ "$count" -eq 0 ]; then
              printf 'Nothing is quarantined. Every test blocks as normal.\n\n'
            else
              printf '%s test(s) all %s shard(s) agreed were quarantined. Each ran and was reported; none could fail this build:\n\n' "$count" "$total"
              while IFS= read -r quarantined; do
                printf -- '- %s\n' "$quarantined"
              done < "$RUNNER_TEMP/quarantine.txt"
              printf '\nEach shard job above prints the same set with its evidence and expiry.\n\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the shards' union covers every package
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          bash scripts/assert-shard-union.sh \
            --quarantined "$RUNNER_TEMP/quarantine.txt" shard-files
